/* ---------- entreprises : le carnet de prospection ---------- */
const STATUTS_PRO = [
  ['prospect', 'À contacter', 'neutre'],
  ['contacte', 'Contacté', 'marque'],
  ['rdv', 'RDV pris', 'marque'],
  ['devis', 'Devis envoyé', 'marque'],
  ['client', 'Client ✓', 'succes'],
  ['perdu', 'Sans suite', 'erreur'],
];
let proEdite = null;   // null, ou le brouillon en cours d'édition
let proJours = 30;     // période du récapitulatif « qui est venu »

async function vueEntreprises(el) {
  el.innerHTML = '<div class="vide"><span class="tourne"></span></div>';
  /* TROIS REQUÊTES EN FILE INDIENNE, C'ÉTAIT LONG (Edwin, 13/08 : « ça prend
     énormément de temps avant d'arriver »). Maintenant :
       · les DEUX requêtes nécessaires à la liste partent EN PARALLÈLE ;
       · elles sont mises en cache (20 s) comme le reste de l'app, donc un
         aller-retour Clients ↔ Entreprises est instantané ;
       · le récapitulatif « Qui est venu » (le plus lourd : 30 jours de
         passages) ne retarde plus rien — il se remplit après coup. */
  let liste, lies = [], parc = [];
  try {
    [liste, lies] = await Promise.all([
      memo('entreprises', () => API.entreprises()),
      memo('clients-lies', async () => {
        const { data } = await sb.from('clients').select('id,nom,entreprise_id').not('entreprise_id', 'is', null);
        return data || [];
      }),
    ]);
  }
  catch (ex) { el.innerHTML = '<div class="ocr-message ocr-message--erreur"><span>⛔</span><div>' + esc(ex.message) + '</div></div>'; return; }
  const employesDe = id => lies.filter(c => c.entreprise_id === id);
  /* « Je veux savoir quel employé est venu et le nombre de motos » (Edwin, 13/08).
     On regroupe par employé : véhicules d'abord, l'argent ensuite. */
  const venusDe = (id) => {
    const g = {};
    parc.filter(r => r.entreprise_id === id).forEach(r => {
      const o = g[r.employe_id] || (g[r.employe_id] = { nom: r.employe, veh: 0, ca: 0, remise: 0, moto: 0, autres: 0 });
      o.veh += r.vehicules || 0; o.ca += r.ca || 0; o.remise += r.remise || 0;
      if (r.gabarit === 'moto') o.moto += r.vehicules || 0; else o.autres += r.vehicules || 0;
    });
    return Object.values(g).sort((a, b) => b.veh - a.veh);
  };

  const nb = s => liste.filter(e => e.statut === s).length;
  const enCours = liste.filter(e => !['client', 'perdu'].includes(e.statut)).length;
  const libelle = s => (STATUTS_PRO.find(x => x[0] === s) || ['', s, 'neutre']);
  const enRetard = e => e.prochaine_le && e.prochaine_le < auj() && !['client', 'perdu'].includes(e.statut);
  // les relances en retard d'abord, puis par prochaine échéance
  const tri = [...liste].sort((a, b) => (enRetard(b) - enRetard(a)) ||
    String(a.prochaine_le || '9999').localeCompare(String(b.prochaine_le || '9999')));

  el.innerHTML = `
    <div class="tuiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="tuile"><div class="lab">En prospection</div><div class="val">${enCours}</div>
        <div class="sub">${nb('devis')} devis en attente</div></div>
      <div class="tuile"><div class="lab">Clients pro</div><div class="val">${nb('client')}</div>
        <div class="sub">objectif : flottes + cliniques</div></div>
      <div class="tuile"><div class="lab">À relancer</div>
        <div class="val" style="${tri.filter(enRetard).length ? 'color:var(--ocr-rouge-texte)' : ''}">${tri.filter(enRetard).length}</div>
        <div class="sub">actions en retard</div></div>
    </div>

    ${proEdite ? formEntreprise() : `
    <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" id="proNouveau" style="margin-bottom:var(--ocr-e4)">＋ Nouvelle entreprise</button>`}

    ${tri.length ? tri.map(e => {
      const [, lab, ton] = libelle(e.statut);
      const wa = numWhatsApp(e.telephone);
      const retard = enRetard(e);
      return `<div class="fiche" ${retard ? 'style="border-color:rgba(232,82,78,.45)"' : ''}>
        <div class="ligne1">
          <strong style="font:600 15px/1.2 var(--ocr-texte)">${esc(e.nom)}</strong>
          <span class="ocr-pastille ocr-pastille--${ton}">${lab}</span>
          ${e.remise_pct > 0 ? `<span class="ocr-pastille ocr-pastille--marque">◆ employés −${e.remise_pct} %</span>` : ''}
          ${e.flotte_estimee ? `<span class="ocr-mini">~${e.flotte_estimee} véhicules</span>` : ''}
        </div>
        ${employesDe(e.id).length ? `<div class="ocr-mini" style="margin-top:4px">
          ${employesDe(e.id).length} employé(s) lié(s) : ${esc(employesDe(e.id).map(c => c.nom).join(', '))}</div>` : ''}
        ${e.remise_pct > 0 && peutCorrigerFiche() ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit"
          data-ajoutemp="${e.id}" style="margin-top:var(--ocr-e3)">＋ Ajouter un employé</button>` : ''}
        ${e.remise_pct > 0 ? `<div data-venus="${e.id}"></div>` : ''}
        ${e.contact_nom ? `<div class="ocr-mini" style="margin-top:4px">${esc(e.contact_nom)}${e.contact_role ? ' · ' + esc(e.contact_role) : ''}${e.telephone ? ' · ' + esc(e.telephone) : ''}</div>` : ''}
        ${e.prochaine_action ? `<div class="ocr-petit" style="margin-top:5px;${retard ? 'color:var(--ocr-erreur)' : ''}">
          ${retard ? '⚠ ' : '→ '}${esc(e.prochaine_action)}${e.prochaine_le ? ' · ' + dateFr(e.prochaine_le) : ''}</div>` : ''}
        ${e.note ? `<div class="ocr-mini" style="margin-top:4px">${esc(e.note)}</div>` : ''}
        <div class="actions">
          ${e.telephone ? `<a class="ocr-btn ocr-btn--secondaire ocr-btn--petit" href="tel:${esc(e.telephone.replace(/\s/g, ''))}">Appeler</a>` : ''}
          ${wa ? `<a class="ocr-btn ocr-btn--secondaire ocr-btn--petit" target="_blank" rel="noopener"
            href="https://wa.me/${wa}?text=${encodeURIComponent('Bonjour' + (e.contact_nom ? ' ' + e.contact_nom : '') +
            ', ici OCR Brillance (Station Oryx Saint Michel). Nous proposons un entretien professionnel des véhicules d’entreprise — lavage soigné, suivi et facturation mensuelle groupée. Quand pourrions-nous en parler ?')}">WhatsApp</a>` : ''}
          ${peutCloturer() ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-premise="${e.id}"
            ${e.remise_pct > 0 ? '' : 'style="color:var(--ocr-argent-2)"'}>Remise employés…</button>` : ''}
          <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-promod="${e.id}" style="margin-left:auto">Modifier</button>
        </div>
      </div>`;
    }).join('') : '<div class="ocr-carte vide">Aucune entreprise pour l’instant.<br>Commence par celles qui ont une flotte : cliniques, hôtels, sociétés de location…</div>'}`;

  /* Le récapitulatif « Qui est venu » arrive quand il arrive : la liste des
     entreprises est déjà là et cliquable. Si l'écran a changé entre-temps,
     on ne peint rien (les emplacements n'existent plus). */
  memo('parc-' + proJours, () => API.parcPartenaire(ilYA(proJours))).then(rows => {
    parc = rows || [];
    el.querySelectorAll('[data-venus]').forEach(z => {
      const e = liste.find(x => x.id === z.dataset.venus);
      const v = venusDe(z.dataset.venus);
      if (!e || !v.length) return;
      const tot = v.reduce((a, x) => ({ veh: a.veh + x.veh, ca: a.ca + x.ca, remise: a.remise + x.remise }),
                           { veh: 0, ca: 0, remise: 0 });
      z.innerHTML = `<div style="margin-top:var(--ocr-e3);padding-top:var(--ocr-e3);border-top:1px solid var(--ocr-sep)">
        <div class="ocr-mini" style="margin-bottom:7px">
          <strong style="color:var(--ocr-blanc)">Qui est venu · ${proJours} derniers jours</strong>
          — ${tot.veh} véhicule(s), ${OCR.fcfa(tot.ca)} encaissable, ${OCR.fcfa(tot.remise)} de remise accordée</div>
        ${v.map(x => `<div style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
          <span style="min-width:0;flex:1;font-weight:600;font-size:13.5px">${esc(x.nom)}</span>
          <span class="ocr-mini">${x.moto ? x.moto + ' moto(s)' : ''}${x.moto && x.autres ? ' · ' : ''}${
            x.autres ? x.autres + ' véhicule(s)' : ''}</span>
          <span style="font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px">${OCR.fcfa(x.ca)}</span>
        </div>`).join('')}
        <p class="ocr-mini" style="margin:7px 0 0">Ces véhicules sont du parc ${esc(e.nom)} : ils comptent
          dans le chiffre d’affaires, pas dans « Quels véhicules dominent ».</p>
      </div>`;
    });
  }).catch(() => {});

  const bn = $('#proNouveau');
  if (bn) bn.addEventListener('click', () => {
    proEdite = { statut: 'prospect' };
    rendre();
  });
  el.querySelectorAll('[data-ajoutemp]').forEach(b => b.addEventListener('click', () =>
    boiteAjoutEmploye(liste.find(x => x.id === b.dataset.ajoutemp))));
  el.querySelectorAll('[data-promod]').forEach(b => b.addEventListener('click', () => {
    proEdite = { ...liste.find(x => x.id === b.dataset.promod) };
    rendre();
  }));

}

/* ══════════════════════════════════════════════════════════════════════════
   AJOUTER UN EMPLOYÉ PARTENAIRE — UN SEUL BOUTON, UN SEUL GESTE (13/08)

   « Pourquoi il y a 2 fois "ajouter un employé" ? » — Edwin. Il y avait en
   effet deux portes pour la même chose : l'une créait une fiche neuve, l'autre
   rattachait une fiche existante. Personne ne devrait avoir à choisir entre
   les deux AVANT de savoir si la personne est déjà cliente.

   Une seule porte maintenant, dans l'ordre où on pense :
     1. on cherche — s'il est déjà venu, il est déjà client, et le rattacher
        évite une deuxième fiche pour la même personne ;
     2. s'il n'y est pas, on le crée ici, nom + téléphone, déjà rattaché.
   La base tient la règle : un numéro déjà connu rattache la fiche existante
   au lieu d'en créer une seconde.
   ══════════════════════════════════════════════════════════════════════════ */
function boiteAjoutEmploye(e) {
  if (!e) return;
  let res = [], q = '', cherche = false;
  const v = modale(`
    <h3 class="ocr-h2">＋ Ajouter un employé — ${esc(e.nom)}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Il aura la remise
      <strong>${e.remise_pct} %</strong> à chaque passage, sur n'importe quel véhicule.</p>

    <div class="ocr-mini" style="letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">
      1 · Est-il déjà client ?</div>
    <label class="ocr-champ"><span class="ocr-label">Chercher par nom ou numéro</span>
      <input class="ocr-saisie" id="aeQ" placeholder="Rodrigue, 01 44 66…" autocomplete="off">
      <span class="ocr-aide">S'il est déjà venu chez nous, rattache sa fiche — ça évite un doublon.</span></label>
    <div id="aeRes" style="margin-bottom:var(--ocr-e4)"></div>

    <div class="ocr-mini" style="letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px">
      2 · Sinon, crée sa fiche</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Nom *</span>
        <input class="ocr-saisie" id="aeNom" autocomplete="off"></label>
      <label class="ocr-champ"><span class="ocr-label">Téléphone</span>
        <input class="ocr-saisie" id="aeTel" inputmode="tel" value="${INDICATIF}">
        <span class="ocr-aide">C'est lui qui le reconnaîtra au comptoir.</span></label>
    </div>
    <p class="ocr-mini" style="margin:0 0 var(--ocr-e3)">Son véhicule s'enregistrera tout seul
      au premier lavage — rien à saisir ici.</p>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Fermer</button>
      <button class="ocr-btn ocr-btn--primaire" id="aeCreer">Créer et rattacher</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  brancherTel(v.querySelector('#aeTel'));

  const fini = (nom, existant) => {
    memoVider();
    fermerModale();
    toast(nom + (existant ? ' — fiche existante rattachée' : ' — employé ' + e.nom) +
          ' ✓ remise ' + e.remise_pct + ' % automatique');
    rendre();
  };
  const peindre = () => {
    const z = v.querySelector('#aeRes');
    const t = q.trim();
    if (t.length < 2) { z.innerHTML = ''; return; }
    if (cherche) { z.innerHTML = '<p class="ocr-mini" style="margin:8px 0">Recherche…</p>'; return; }
    z.innerHTML = res.length
      ? res.map(c => `<button class="presta" data-aecli="${c.id}">
          <span class="coche">${c.entreprise_id === e.id ? '✓' : ''}</span>
          <span style="min-width:0"><span class="nm">${esc(c.nom)}</span>
            <span class="du">${esc(telAffiche(c.telephone) || 'sans numéro')}${
              c.entreprise_id === e.id ? ' · déjà employé ' + esc(e.nom) : ''}</span></span></button>`).join('')
      : '<p class="ocr-mini" style="margin:8px 0">Personne à ce nom — crée sa fiche juste en dessous.</p>';
    z.querySelectorAll('[data-aecli]').forEach(b => b.addEventListener('click', async () => {
      const c = res.find(x => x.id === b.dataset.aecli);
      if (c.entreprise_id === e.id) return toast('Déjà employé ' + e.nom);
      b.disabled = true;
      const { error } = await API.lierEmploye(c.id, e.id);
      if (error) { b.disabled = false; return toast(error.message, true); }
      fini(c.nom, true);
    }));
  };
  let mn;
  v.querySelector('#aeQ').addEventListener('input', ev => {
    q = ev.target.value;
    // ce qu'on tape sert aussi à préremplir la création : on ne le retape pas
    const t = q.trim();
    const estTel = /[0-9]/.test(t) && t.replace(/[^0-9]/g, '').length >= 6;
    if (estTel) v.querySelector('#aeTel').value = t;
    else if (t.length >= 2) v.querySelector('#aeNom').value = t;
    clearTimeout(mn);
    cherche = true; peindre();
    mn = setTimeout(async () => {
      try { res = await API.chercherClients(q); } catch (ex) { res = []; }
      cherche = false; peindre();
    }, 300);
  });

  v.querySelector('#aeCreer').addEventListener('click', async ev => {
    const nom = v.querySelector('#aeNom').value.trim();
    const tel = telPropre(v.querySelector('#aeTel').value);
    if (!nom) return toast('Le nom est obligatoire.', true);
    ev.target.disabled = true;
    const { data, error } = await API.creerClientEntreprise({
      p_entreprise: e.id, p_nom: nom, p_telephone: tel || null,
      p_gabarit: null, p_marque: null, p_modele: null, p_immat: null, p_note: null,
    });
    if (error) { ev.target.disabled = false; return toast(error.message, true); }
    const r = Array.isArray(data) ? data[0] : data;
    fini(nom, !!(r && r.deja_existant));
  });
}

function brancherFormEntreprise(el) {
  if (!proEdite) return;
  const lire = () => ({
    nom: $('#pNom').value.trim(),
    contact_nom: $('#pContact').value.trim() || null,
    contact_role: $('#pRole').value.trim() || null,
    telephone: telPropre($('#pTel').value) || null,
    email: $('#pMail').value.trim() || null,
    statut: proEdite.statut,
    flotte_estimee: Number($('#pFlotte').value) || null,
    prochaine_action: $('#pAction').value.trim() || null,
    prochaine_le: $('#pQuand').value || null,
    note: $('#pNote').value.trim() || null,
  });
  el.querySelectorAll('[data-pstatut]').forEach(b => b.addEventListener('click', () => {
    Object.assign(proEdite, lire(), { statut: b.dataset.pstatut });
    rendre();
  }));
  $('#pFermer').addEventListener('click', () => { proEdite = null; rendre(); });
  $('#pSauver').addEventListener('click', async e => {
    const r = lire();
    if (!r.nom) return toast('Le nom de l’entreprise est obligatoire.', true);
    e.target.disabled = true;
    const { error } = proEdite.id
      ? await API.majEntreprise(proEdite.id, r)
      : await API.creerEntreprise({ ...r, cree_par: moi.id });
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    toast(proEdite.id ? 'Fiche mise à jour' : r.nom + ' ajoutée');
    proEdite = null;
    rendre();
  });
}

   il le remplace), la comptabilité et la direction. Un technicien, non — la

function vueFicheClient() {
  const { client: c, vehicules: vs, passages: tous, fidelite: f } = rech.fiche;
  const ps = tous.filter(p => !p.annule);    // les annulés restent visibles mais ne comptent pas
  const depense = f && f.depense != null ? Number(f.depense) : ps.reduce((s, p) => s + (p.montant_total || 0), 0);
  const seuil = OCR.CONFIG.fideliteSeuil;
  const tampons = f ? Number(f.tampons) : 0;
  const reste = Math.max(0, seuil - tampons);
  const part = Math.min(100, Math.round(tampons / seuil * 100));
  const wa = numWhatsApp(c.telephone);
  const jd = joursDepuis(f ? f.dernier_passage : null);
  /* LE CADEAU EST NOMMÉ (14/08, Edwin : « je veux être sûr que c'est le 10e
     passage qui est gratuit en signature »). Un Signature de SON véhicule :
     une moto gagne un Signature moto, une berline un Signature berline. Le
     cadeau reste ainsi proportionnel à ce que le client a dépensé — ~10 %
     dans les deux cas. On prend la taille de son véhicule le plus récent. */
  const gabCadeau = (vs[0] || {}).gabarit || 'berline';
  const prestaCadeau = gabCadeau === 'moto' ? 'moto-signature' : 'signature';
  const cadeauNom = (OCR.prestation(prestaCadeau) || {}).nom || 'Lavage Signature';

/* ==========================================================================
   BILAN
   L'indicateur qui compte n'est pas le chiffre d'affaires : c'est le franc
   gagné par heure de baie. Deux baies × 12 h = 24 heures-baie par jour,
   c'est la seule ressource qu'on ne peut pas fabriquer.
   ========================================================================== */
let bilanJours = 7;
let bilanMesure = 'passages';   // classement du parc : par nombre, ou par argent

// Charges fixes mensuelles (loyer 150 000 + salaires 202 000 + électricité
// 60 000 + eau 25 000 + internet 15 000 + provision équipement 40 000).
// Volontairement ICI et pas dans le socle : le socle alimente aussi le site
// public, et ces chiffres n'ont rien à faire dans une page publique.
const CHARGES_FIXES = 492000;

function ilYA(n) {
  const d = new Date(); d.setDate(d.getDate() - (n - 1));
  return d.toLocaleDateString('en-CA');
}

async function vueBilan() {
  const du = ilYA(bilanJours), au = auj();
  const [{ jours, mix }, ptsRH, baiesRH, temps, parc, hors, partenaires] = await Promise.all([
    API.periode(du, au), API.pointagesPeriode(du, au), API.baies().catch(() => []),
    API.tempsLavage(du).catch(() => []), API.statsParc(du, au).catch(() => []),
    API.lavagesSansMesure(du).catch(() => []),
    API.parcPartenaire(du).catch(() => []),
  ]);
  // Combien de lavages ne comptent pas dans les moyennes de temps, et pourquoi.
  const ecartes = hors.length;
  // … et combien de véhicules du parc d'un partenaire sont tenus hors des classements.
  const vehParc = partenaires.reduce((sm, r) => sm + (r.vehicules || 0), 0);

  /* QUELS VÉHICULES DOMINENT (13/08) — « savoir quel véhicule domine, quel
     modèle, comme ça c'est facile pour moi de comprendre » (Edwin).
     Une seule mesure à la fois (véhicules OU chiffre d'affaires), une seule
     teinte : ce sont des classements de grandeur, pas des catégories à
     distinguer. La valeur est écrite au bout de chaque barre — pas besoin de
     survoler pour lire un chiffre. */
  const cumul = (cle) => {
    const g = {};
    parc.forEach(r => {
      const k = cle(r);
      if (k == null) return;
      const o = g[k] || (g[k] = { cle: k, passages: 0, ca: 0, minutes: 0 });
      o.passages += Number(r.passages) || 0;
      o.ca += Number(r.ca) || 0;
      o.minutes += Number(r.minutes) || 0;
    });
    return Object.values(g);
  };
  const mesure = bilanMesure;                       // 'passages' | 'ca'
  const trier = (l) => l.sort((a, b) => b[mesure] - a[mesure] || b.ca - a.ca);
  const parMarque = trier(cumul(r => r.marque === '?' ? 'Marque non saisie' : r.marque));
  const parModele = trier(cumul(r => r.marque === '?' ? null
      : r.marque + (r.modele ? ' ' + r.modele : ' (modèle non saisi)')));
  const parTaille = trier(cumul(r => r.gabarit));
  const totalMes = parc.reduce((sm, r) => sm + (Number(r[mesure]) || 0), 0);
  const fmtMes = (v) => mesure === 'ca' ? OCR.fcfa(v) : v + ' véh.';

  /* Une ligne de classement : nom, barre, valeur. Barre d'une seule teinte
     (validée sur les deux fonds), bout arrondi, texte en encre — jamais la
     couleur de la barre pour écrire. */
  const ligneBarre = (nom, val, max, sous) => `
    <div style="padding:8px 0;border-bottom:1px solid var(--ocr-sep)">
      <div style="display:flex;gap:10px;align-items:baseline">

      </div>

        <span style="flex:1;height:6px;border-radius:999px;background:var(--ocr-trace);overflow:hidden">
          <span style="display:block;height:100%;width:${max > 0 ? Math.max(2, Math.round(val / max * 100)) : 0}%;
                       background:var(--lav-rapide);border-radius:999px"></span></span>
        <span class="ocr-mini" style="white-space:nowrap;min-width:74px;text-align:right">${sous || ''}</span>
      </div>
    </div>`;

    o.n += Number(r.nombre) || 0;
    o.somme += (Number(r.minutes_moyennes) || 0) * (Number(r.nombre) || 0);
    o.max = Math.max(o.max, Number(r.minutes_max) || 0);

    const ref = OCR.duree(o.prestation, o.gabarit);

    return { ...o, moy, ref, ecart: ref ? Math.round((moy / ref - 1) * 100) : null };

  const occupation = capacite > 0 ? Math.round(minutes / 60 / capacite * 100) : 0;

  mix.forEach(r => {
    const o = parPresta[r.prestation] || (parPresta[r.prestation] = { nombre: 0, ca: 0, minutes: 0 });
    o.nombre += Number(r.nombre) || 0; o.ca += Number(r.ca) || 0; o.minutes += Number(r.minutes_baie) || 0;
  });
  const lignes = Object.entries(parPresta).map(([code, o]) => {

      <div class="tuile"><div class="lab">Baies occupées</div><div class="val">${occupation} %</div>
        <div class="sub">sur ${nbBaiesActives} active(s)${impaye ? ' · ' + OCR.fcfa(impaye) + ' impayés' : ''}</div></div>
    </div>

    <div class="ocr-carte" style="margin-bottom:var(--ocr-e4)">
      <div class="ocr-surtitre">Ce que rapporte chaque lavage, par heure de baie</div>
      <p class="ocr-mini" style="margin:8px 0 var(--ocr-e4)">Barre pleine = le plus rentable pour le temps qu’il occupe.</p>
      ${lignes.length ? lignes.map(l => `
        <div style="margin-bottom:13px">
          <div style="display:flex;gap:8px;align-items:baseline;margin-bottom:5px">
            <span style="font:600 13.5px/1.2 var(--ocr-texte)">${esc(l.nom)}</span>
            <span class="ocr-mini">${l.nombre} × · ${totalLavages ? Math.round(l.nombre / totalLavages * 100) : 0} %</span>
            <span style="flex:1"></span>
            <span style="font-weight:700;font-variant-numeric:tabular-nums">${OCR.fcfa(l.fh)}<span class="ocr-mini"> /h</span></span>

          <div style="height:8px;border-radius:999px;background:var(--ocr-trace);overflow:hidden">

    </div>

    ${(fhEx && fhSi) ? `<div class="ocr-message ${partSi >= 40 ? 'ocr-message--succes' : 'ocr-message--alerte'}"

      <span>${partSi >= 40 ? '✓' : '⚠'}</span>

    ${blocClassement('Modèles', 'Le détail par modèle : c\'est lui qui dicte les produits et les temps de lavage.',

    ${blocClassement('Par taille de véhicule', 'La taille fait le prix. À droite, ce que chaque taille rapporte par heure de baie — la seule ressource qu\'on ne peut pas fabriquer.',
      parTaille.map(o => ({ ...o, cle: (OCR.gabarit(o.cle) || {}).nom || o.cle })), 5, fhDe)}

      ${/* Une moyenne sans son dénominateur ment. On dit toujours sur combien

/* ==========================================================================
   PAS DE PLAQUE — ET ALORS ? (13/08)
   « Un véhicule est venu faire un lavage express, un gars de passage qui
     partait dans un autre pays, et on a oublié de rentrer sa plaque […]
     il faut juste qu'il mette un motif. Et que Guénolé ou moi valide lors de
     la clôture. Certes l'immatriculation devient importante, mais il faut
     pas que ça limite l'application. » (Edwin)
   Donc : jamais de refus. Une ligne d'explication en un appui, et la
   direction confirme à la clôture. Le motif est écrit au journal.
   ========================================================================== */
const MOTIFS_SANS_PLAQUE = [
  'Client pressé — plaque non relevée',
  'Client de passage, ne reviendra pas',
  'Véhicule sans plaque (neuf, en transit)',
  'Plaque illisible ou absente',
];
/* Rend le motif choisi, ou null s'il préfère aller chercher la plaque.
   Un appui sur une pastille suffit : elle choisit ET enregistre. */
function demanderMotifSansPlaque() {
  return new Promise(resolve => {
    let repondu = false;
    const rendre_ = m => { if (repondu) return; repondu = true; fermerModale(); resolve(m); };
    const v = modale(`
      <h3 class="ocr-h2">Pas de plaque ?</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
        Le lavage sera <strong style="color:var(--ocr-blanc)">enregistré normalement</strong> —
        rien ne s'arrête. Dis simplement pourquoi : ${esc(peutCloturer() ? 'tu confirmeras' : 'la direction confirmera')}
        à la clôture de la journée.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${MOTIFS_SANS_PLAQUE.map((m, i) => `<button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc"
          data-msp="${i}" style="text-align:left;justify-content:flex-start">${esc(m)}</button>`).join('')}
      </div>
      <label class="ocr-champ" style="margin-top:var(--ocr-e4)"><span class="ocr-label">Autre raison</span>
        <input class="ocr-saisie" id="mspTexte" placeholder="En deux mots" enterkeyhint="done"></label>
      <div style="display:flex;gap:9px;margin-top:var(--ocr-e3);align-items:center">
        <button class="ocr-btn ocr-btn--fantome" data-fermer>J'ai la plaque, j'y retourne</button>
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire" data-ok disabled>Enregistrer</button></div>`);
    v.addEventListener('click', e => { if (e.target === v) rendre_(null); });
    v.querySelector('[data-fermer]').addEventListener('click', () => rendre_(null));
    v.querySelectorAll('[data-msp]').forEach(b => b.addEventListener('click', () =>
      rendre_(MOTIFS_SANS_PLAQUE[Number(b.dataset.msp)])));
    v.querySelector('[data-ok]').addEventListener('click', () => {
      const t = v.querySelector('#mspTexte').value.trim();
      if (!t) return toast('Touche une raison, ou écris-la en deux mots.', true);
      rendre_(t);
    });
    /* Le bouton rouge ne s'allume qu'une fois la raison écrite : sinon l'œil
       va sur lui alors que ce sont les quatre choix du dessus qui vont le plus
       vite. Un bouton éteint dit « ce n'est pas par là ». */
    const champ = v.querySelector('#mspTexte');
    champ.addEventListener('input', () => {
      v.querySelector('[data-ok]').disabled = !champ.value.trim();
    });
    champ.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); v.querySelector('[data-ok]').click(); }
    });
  });
}

/* ==========================================================================
   LE PARC D'UN PARTENAIRE, EN TROIS APPUIS (13/08)
   « Pour Ehu Motors il faut que ça soit plus simple car ce sera fréquent. »
   Le chemin normal réclame une plaque et un numéro de téléphone ; ici il n'y
   a ni l'un ni l'autre — seulement QUI est venu et COMBIEN de motos. Cette
   fenêtre ne demande donc que ça, applique la remise du partenaire toute
   seule, et enregistre.
   ========================================================================== */
async function boiteParcPartenaire(P, j) {
  if (!P) return;
  const emps = await API.employesDe(P.id).catch(() => []);
  const motos = OCR.prestationsPour('moto');
  /* PLUSIEURS TYPES DE LAVAGE DANS LA MÊME VENUE (14/08) — « certaines motos
     peuvent venir pour le lavage express et d'autres lavage signature, donc si
     par exemple il y a 3 motos, 2 en express 1 en signature, on doit pouvoir le
     mettre » (Edwin). On compte donc PAR TYPE, pas une quantité globale. */
  const etat = { emp: null, lots: {} };
  motos.forEach(m => { etat.lots[m.id] = 0; });
  if (motos[0]) etat.lots[motos[0].id] = 1;

  const v = modale('<div id="ppCorps"></div>');
  const calc = () => {
    let brut = 0, motosN = 0;
    motos.forEach(m => {
      const q = etat.lots[m.id] || 0;
      brut += (OCR.prix(m.id, 'moto') || 0) * q; motosN += q;
    });
    const remise = Math.round(brut * P.remise_pct / 100);
    return { brut, remise, total: brut - remise, motosN };
  };
  const peindre = () => {
    const T = calc();
    v.querySelector('#ppCorps').innerHTML = `
      <h3 class="ocr-h2">◆ Parc ${esc(P.nom)}</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
        Pas de plaque à saisir : ces motos appartiennent au concessionnaire et peuvent
        partir chez un client. On note qui est venu, combien de motos par type de lavage,
        et la remise de ${P.remise_pct} % s'applique toute seule.</p>

      <div class="ocr-label" style="margin-bottom:8px">1 · Qui est venu</div>
      ${emps.length ? `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:var(--ocr-e4)">
        ${emps.map(e => `<button class="ocr-chip" data-ppe="${e.id}" ${e.telephone ? '' : 'disabled'}
          aria-pressed="${etat.emp && etat.emp.id === e.id}">${esc(e.nom)}${
          e.telephone ? '' : ' · sans numéro'}</button>`).join('')}
      </div>` : `<p class="ocr-mini" style="margin:0 0 var(--ocr-e4);color:var(--ocr-ambre)">
        Aucun employé ${esc(P.nom)} n'est encore enregistré. Ajoute-le dans
        Clients › Entreprises › ＋ Ajouter un employé, puis reviens ici.</p>`}

      <div class="ocr-label" style="margin-bottom:8px">2 · Combien de motos, par lavage</div>
      ${motos.map(m => {
        const q = etat.lots[m.id] || 0;
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ocr-sep)">
          <span style="min-width:0;flex:1">
            <span style="font-weight:600;display:block;${q ? '' : 'color:var(--ocr-argent-2)'}">${esc(m.nom)}</span>
            <span class="ocr-mini">${OCR.fcfa(OCR.prix(m.id, 'moto'))} l'unité${
              q ? ' · ' + q + ' × = ' + OCR.fcfa((OCR.prix(m.id, 'moto') || 0) * q) : ''}</span>
          </span>
          <span style="display:flex;align-items:center;gap:8px">
            <button class="ocr-chip" data-ppmoins="${m.id}" ${q ? '' : 'disabled'}
              aria-label="Une de moins" style="min-width:40px">−</button>
            <span style="min-width:22px;text-align:center;font:700 17px/1 var(--ocr-texte);
              font-variant-numeric:tabular-nums;${q ? '' : 'color:var(--ocr-argent-2)'}">${q}</span>
            <button class="ocr-chip" data-ppplus="${m.id}" aria-label="Une de plus"
              style="min-width:40px">＋</button>
          </span>
        </div>`;
      }).join('')}

      <div class="ocr-carte" style="padding:var(--ocr-e4);margin:var(--ocr-e4) 0">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="ocr-mini">${T.motosN ? pluriel(T.motosN, 'moto') + ' · ' + OCR.fcfa(T.brut) +
            ' − ' + P.remise_pct + ' %' : 'Aucune moto pour l’instant'}</span>
          <span style="font:700 20px/1 var(--ocr-texte);font-variant-numeric:tabular-nums">${OCR.fcfa(T.total)}</span>
        </div>
        ${Object.keys(etat.lots).filter(k => etat.lots[k] > 0).length > 1 ? `
        <p class="ocr-mini" style="margin:9px 0 0">Deux types de lavage = deux lignes dans la Journée,
          chacune avec son chrono. Un seul passage au comptoir.</p>` : ''}
      </div>

      <div style="display:flex;gap:9px;align-items:center">
        <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire" data-ppok ${etat.emp && T.motosN ? '' : 'disabled'}>
          ${!etat.emp ? 'Choisis qui est venu' : !T.motosN ? 'Ajoute au moins une moto'
            : 'Enregistrer · ' + OCR.fcfa(T.total)}</button>
      </div>`;
    lier();
  };
  const lier = () => {
    v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
    v.querySelectorAll('[data-ppe]').forEach(b => b.addEventListener('click', () => {
      etat.emp = emps.find(e => e.id === b.dataset.ppe); peindre();
    }));
    v.querySelectorAll('[data-ppplus]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.ppplus;
      etat.lots[k] = Math.min(50, (etat.lots[k] || 0) + 1); peindre();
    }));
    v.querySelectorAll('[data-ppmoins]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.ppmoins;
      etat.lots[k] = Math.max(0, (etat.lots[k] || 0) - 1); peindre();
    }));
    const ok = v.querySelector('[data-ppok]');
    if (ok) ok.addEventListener('click', () => {
      const lots = motos.filter(m => (etat.lots[m.id] || 0) > 0)
                        .map(m => ({ presta: m.id, q: etat.lots[m.id] }));
      if (!etat.emp || !lots.length) return;
      ok.disabled = true; ok.textContent = 'Enregistrement…';
      enregistrerParc(P, etat.emp, lots, j, ok);
    });
  };
  peindre();
}

/* Une ligne d'enregistrement PAR TYPE de lavage : la base porte une prestation
   et une quantité par passage. Deux types = deux passages, même employé, même
   remise, même journée — et « Qui est venu » les regroupe déjà par prestation.
   Le chemin habituel (form + enregistrer) ne sait faire qu'un lavage à la fois :
   pour un lot, on appelle l'API directement. */
async function enregistrerParc(P, emp, lots, j, bouton) {
  if (enCours) return;
  if (!navigator.onLine) { fermerModale(); return toast('Hors ligne — impossible d’enregistrer.', true); }
  enCours = true;
  const faits = [];
  let total = 0, echec = null;
  try {
    for (const lot of lots) {
      const pr = OCR.prestation(lot.presta);
      const prix = OCR.prix(lot.presta, 'moto') || 0;
      const remise = Math.round(prix * lot.q * P.remise_pct / 100);
      const { data, error } = await API.enregistrer({
        p_client_nom: emp.nom, p_telephone: emp.telephone || null, p_gabarit: 'moto',
        p_lignes: [{ type: 'prestation', code: pr.id, libelle: pr.nom, prix,
                     duree_min: OCR.duree(lot.presta, 'moto') }],
        p_remise: remise, p_motif_remise: null,
        p_marque: null, p_modele: null, p_immat: null,
        p_equipe: [], p_note: null, p_reservation: null,
        p_quantite: lot.q, p_parc: true, p_motif_sans_plaque: null,
        p_journee: form.jour, p_motif_retard: form.jour ? String(form.motifRetard).trim() : null,
      });
      if (error) { echec = error.message; break; }
      const r = Array.isArray(data) ? data[0] : data;
      faits.push(lot.q + ' × ' + pr.nom);
      total += r.montant_total;
    }
  } finally { enCours = false; }
  fermerModale();
  /* Si la deuxième ligne échoue, la première EXISTE. On ne prétend pas le
     contraire : on dit ce qui est passé et ce qui reste à faire. */
  if (faits.length) {
    toast(esc(emp.nom) + ' · ' + faits.join(' + ') + ' · ' + OCR.fcfa(total) +
      (form.jour ? ' — écrit sur le ' + jourBref(form.jour) : ''));
  }
  if (echec) toast(faits.length
    ? 'Le reste n’est pas passé : ' + echec + ' — reprends le parc pour la ligne manquante.'
    : echec, true);
  if (form.jour) jourVu = form.jour;
  onglet = 'journee';
  await rendre();
}

/* ==========================================================================
   REPRENDRE LE CAHIER, UNE JOURNÉE À LA FOIS (14/08)
   « Guénolé va juste rentrer les lavages manuellement directement dans
     l'application en regardant le cahier, ça sera plus simple — car lui, comme
     il a le téléphone d'OCR, il reçoit le SMS de KKiapay avec aussi la
     référence. » (Edwin)

   Trois choses font que c'est rapide, et une quatrième fait que c'est juste :
     · un seul écran — la journée se choisit UNE fois, pas à chaque ligne ;
     · le paiement est dans le même formulaire (le SMS KKiapay est sous ses
       yeux, la référence se tape dans la foulée) ;
     · le montant arrive pré-rempli du tarif, et se corrige quand le cahier
       dit autre chose (remise partenaire, geste commercial) ;
     · le TOTAL COURANT s'affiche en face du total du cahier. C'est le seul
       contrôle qui compte : deux erreurs qui s'annulent passeraient un total
       global, jamais un total par journée.
   ========================================================================== */
let cahier = { jour: null, presta: 'express', gabarit: 'berline', immat: '',
               montant: null, mode: 'kkiapay', ref: '', fiche: '', total: '',
               partenaire: null, qte: 1,   // parc Ehu Motors & co : entreprise + nombre
               saut: null };   // journée regardée hors de la marche, pour corriger

/* La marche : de la première fiche du cahier jusqu'à hier, dans l'ordre.
   Une journée SIGNÉE est une journée finie — c'est le seul marqueur dont on a
   besoin, et il est déjà en base. */
function marcheCahier(depuis, journees) {
  const fin = decaleJour(auj(), -1);
  const jours = [];
  for (let d = depuis; d <= fin; d = decaleJour(d, 1)) jours.push(d);
  const finie = d => {
    const j = journees.find(x => x.date === d);
    return !!j && j.statut !== 'ouverte';
  };
  const reste = jours.filter(d => !finie(d));
  return { jours, reste, faites: jours.length - reste.length, courante: reste[0] || null };
}

async function vueCahier() {
  const depuis = REGLAGES && REGLAGES.cahier_depuis ? String(REGLAGES.cahier_depuis).slice(0, 10) : null;

  /* ── Première fois : on demande où commence le cahier ─────────────────── */
  if (!depuis) {
    $('#vue').innerHTML = `
      ${retourDirection()}
      <div class="ocr-carte">
        <div class="ocr-surtitre">Saisir le cahier papier</div>
        <p class="ocr-petit" style="margin:10px 0 var(--ocr-e4)">
          On va reprendre les fiches <strong style="color:var(--ocr-blanc)">dans l’ordre</strong>,
          de la plus ancienne jusqu’à hier. À chaque journée terminée, l’écran passe tout seul
          à la suivante — tu n’auras jamais à chercher où tu en étais.</p>
        <label class="ocr-champ"><span class="ocr-label">Date de la première fiche du cahier</span>
          <input class="ocr-saisie" id="cjDepuis" type="date" max="${decaleJour(auj(), -1)}"></label>
        <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" id="cjCommencer" disabled>Commencer</button>
      </div>`;
    brancherRetourDirection();
    const c = $('#cjDepuis'), bt = $('#cjCommencer');
    /* Sur iPhone, le sélecteur de date n'émet parfois que « change » : on
       écoute les deux, sinon le bouton reste éteint alors qu'une date est là. */
    ['input', 'change'].forEach(ev => c.addEventListener(ev, () => { bt.disabled = !c.value; }));
    bt.addEventListener('click', async () => {
      bt.disabled = true; bt.textContent = 'Enregistrement…';
      const { error } = await API.majReglages({ cahier_depuis: c.value });
      if (error) { bt.disabled = false; bt.textContent = 'Réessayer'; return toast(error.message, true); }
      REGLAGES = await API.reglages().catch(() => REGLAGES);
      cahier.jour = null; memoVider(); vueCahier();
    });
    return;
  }

  const journees = await API.journees(depuis, decaleJour(auj(), -1)).catch(() => []);
  const M = marcheCahier(depuis, journees);
  const jour = cahier.saut || M.courante;

  /* ── Tout est repris ──────────────────────────────────────────────────── */
  if (!jour) {
    $('#vue').innerHTML = `
      ${retourDirection()}
      <div class="ocr-message ocr-message--succes"><span>✓</span><div>
        <strong>Le cahier est repris en entier.</strong><br>
        ${pluriel(M.jours.length, 'journée')} depuis le ${jourBref(depuis)}, toutes signées.</div></div>
      <div class="ocr-carte" style="margin-top:var(--ocr-e4)">
        <p class="ocr-petit" style="margin:0 0 var(--ocr-e3)">Besoin de revenir sur une journée ?
          Choisis-la — si elle est signée, tu pourras la réouvrir.</p>
        <label class="ocr-champ" style="margin-bottom:0"><span class="ocr-label">Revoir une journée</span>
          <input class="ocr-saisie" id="cjSaut" type="date" min="${depuis}" max="${decaleJour(auj(), -1)}"></label>
      </div>`;
    brancherRetourDirection();
    $('#cjSaut').addEventListener('change', e => {
      if (e.target.value) { cahier.saut = e.target.value; cahier.total = ''; vueCahier(); }
    });
    return;
  }

  const [lignes, j] = await Promise.all([
    API.cahierJour(jour).catch(() => []),
    API.journee(jour).catch(() => null),
  ]);
  const signee = j && j.statut !== 'ouverte';
  const cumul = lignes.reduce((s, x) => s + (x.montant_total || 0), 0);
  const attendu = Number(String(cahier.total).replace(/[^0-9]/g, '')) || 0;
  const ecart = attendu ? cumul - attendu : null;
  const tarif = OCR.prix(cahier.presta, cahier.gabarit);
  const montant = cahier.montant != null ? cahier.montant : (tarif == null ? '' : tarif);
  const rang = M.jours.indexOf(jour) + 1;
  const suivante = M.reste.find(d => d > jour) || null;
  const partenaireCahier = cahier.partenaire
    ? PARTENAIRES.find(e => e.id === cahier.partenaire) || null : null;
  /* Une prestation de voiture n'existe pas pour une moto, et inversement.
     Passer le type de véhicule à « moto » en gardant « Express » laissait une
     prestation sans tarif : le montant restait vide et « Ajouter » refusait
     avec « mets le montant du cahier », sans dire pourquoi. On remet toujours
     la sélection dans le domaine du possible. (Défaut d'origine, trouvé le
     14/08 en branchant le parc Ehu, qui bascule sur moto tout seul.) */
  if (!OCR.prestationsPour(cahier.gabarit).some(x => x.id === cahier.presta)) {
    cahier.presta = (OCR.prestationsPour(cahier.gabarit)[0] || {}).id || cahier.presta;
    cahier.montant = null;
  }
  /* Ce que Guénolé doit retrouver sur le papier : le TOTAL du lot, remise
     déduite. Le même calcul qu'en base (brut × nombre, puis remise), pour
     qu'aucun des deux ne dise autre chose que l'autre. */
  const brutParc = (Number(montant) || 0) * (Number(cahier.qte) || 1);
  const totalParc = partenaireCahier
    ? brutParc - Math.round(brutParc * partenaireCahier.remise_pct / 100) : brutParc;

  $('#vue').innerHTML = `
    ${retourDirection()}
    <div class="ocr-carte">
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">

  brancherRetourDirection();
  const maj = () => vueCahier();
  $('#vue').querySelectorAll('[data-cp]').forEach(b => b.addEventListener('click', () => {

  $('#vue').querySelectorAll('[data-cm]').forEach(b => b.addEventListener('click', () => {

  $('#vue').querySelectorAll('[data-cpart]').forEach(b => b.addEventListener('click', () => {

    /* Le parc d'Ehu Motors, ce sont des motos : on épargne un appui à Guénolé,
       sans l'empêcher de changer si une voiture de société passait. */
    if (cahier.partenaire && cahier.gabarit !== 'moto') { cahier.gabarit = 'moto'; cahier.montant = null; }
    maj();
  }));
  $('#vue').querySelectorAll('[data-cqte]').forEach(b => b.addEventListener('click', () => {
    cahier.qte = Math.max(1, Math.min(50, (Number(cahier.qte) || 1) + Number(b.dataset.cqte)));

  }));
  const lier = (id, k, propre) => { const el = $('#' + id);
    if (el) el.addEventListener('input', e => { cahier[k] = propre ? propre(e.target.value) : e.target.value; }); };
  lier('cjImmat', 'immat', v => v.toUpperCase().replace(/[^A-Z0-9]/g, ''));
  lier('cjRef', 'ref'); lier('cjFiche', 'fiche');
  const cm = $('#cjMontant');
  if (cm) cm.addEventListener('input', e => { cahier.montant = e.target.value === '' ? null : Number(e.target.value); });
  const ct = $('#cjTotal');
  if (ct) ct.addEventListener('change', e => { cahier.total = e.target.value; maj(); });
  const cr = $('#cjReouvrir');
  if (cr) cr.addEventListener('click', () => boiteReouvrir(jour));
  const crp = $('#cjReprendre');
  if (crp) crp.addEventListener('click', () => { cahier.saut = null; cahier.total = ''; maj(); });

  const ca = $('#cjAjouter');
  if (ca) ca.addEventListener('click', async () => {
    const pr = OCR.prestation(cahier.presta);
    const prix = cahier.montant != null ? Number(cahier.montant) : OCR.prix(cahier.presta, cahier.gabarit);
    if (prix == null || isNaN(prix) || prix < 0) return toast('Mets le montant écrit sur le cahier.', true);
    if (cahier.mode === 'kkiapay' && !String(cahier.ref || '').trim())
      return toast('La référence du SMS KKiapay — c’est elle qui rendra le recoupement possible.', true);

      p_journee: jour, p_gabarit: cahier.gabarit,
      p_lignes: [{ type: 'prestation', code: pr.id, libelle: pr.nom, prix: Number(prix),

      p_entreprise: cahier.partenaire || null,

      (partenaireCahier ? ' (' + cahier.qte + ' × ' + esc(partenaireCahier.nom) + ')' : '') +
      ' ajouté au ' + jourBref(jour));
    cahier.immat = ''; cahier.ref = ''; cahier.montant = null; cahier.qte = 1;
    memoVider(); maj();
  });

  /* Signer la journée et avancer. Un écart ne bloque pas — une fiche papier
     peut être mal additionnée, et bloquer quelqu'un qui recopie trente
     journées le ferait sortir de l'application. Mais l'écart est ÉCRIT sur la
     journée : on le retrouvera. */
  const signer = async (note, bouton) => {
    bouton.disabled = true; bouton.textContent = 'Signature…';
    const { error } = await API.cloturer({ p_date: jour, p_note: note });
    if (error) { bouton.disabled = false; bouton.textContent = 'Réessayer'; return toast(error.message, true); }

    memoVider();
    toast(jourBref(jour) + ' signé' + (suivante ? ' — au tour du ' + jourBref(suivante) : ' — cahier terminé ✓'));

  if (cf) cf.addEventListener('click', () => {

      <div style="display:flex;gap:9px;align-items:center">
        <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
        <div style="flex:1"></div>

    v.querySelector('[data-ok]').addEventListener('click', () => {

/* ==========================================================================
   RATTRAPER UN JOUR PASSÉ (14/08)
   « Hier on a eu des lavages qu'il n'a pas encore eu le temps de mettre car
     j'étais en train de mettre l'application à jour. Donc il doit pouvoir les
     mettre aujourd'hui pour hier, et Guénolé devra donc clôturer vu qu'il y a
     des modifications, et Samuel doit justifier toujours. » (Edwin)
   Trois refus tenus par la base : rien dans le futur, rien au-delà d'un mois,
   rien sur une journée déjà signée — celle-là, seule la direction la réouvre.
   ========================================================================== */
const MOTIFS_RETARD = [
  ['Mise à jour de l’app', 'Application en cours de mise à jour ce jour-là'],
  ['Atelier débordé',      'Atelier débordé — pas eu le temps de saisir'],
  ['Panne de réseau',      'Pas de réseau au moment du lavage'],
  ['Oubli de saisie',      'Lavage fait, saisie oubliée'],
];

/* Une porte fermée doit toujours montrer la sonnette. Quand la journée est
   signée, on ne laisse pas Samuel devant un refus : on lui donne le geste
   suivant, et la direction voit la demande dès son prochain écran. */
function boiteDemanderReouverture(jour, message) {
  const v = modale(`
    <h3 class="ocr-h2">Journée déjà signée</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
      ${esc(String(message || '').replace('JOURNEE_SIGNEE : ', ''))}<br><br>
      Tu peux <strong style="color:var(--ocr-blanc)">demander sa réouverture</strong> : la demande
      apparaît tout de suite sur l'écran de la direction, avec ton nom et ce que tu veux ajouter.</p>
    <label class="ocr-champ"><span class="ocr-label" style="color:var(--ocr-rouge-texte)">Ce qu’il faut ajouter — obligatoire</span>
      <input class="ocr-saisie" id="drMotif" placeholder="2 lavages Express oubliés le 12/08"></label>
    <div style="display:flex;gap:9px;align-items:center">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Plus tard</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok disabled>Envoyer la demande</button></div>`);
  const c = v.querySelector('#drMotif');
  c.addEventListener('input', () => { v.querySelector('[data-ok]').disabled = !c.value.trim(); });
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = 'Envoi…';
    const { data, error } = await API.demanderReouverture(jour, c.value.trim());
    if (error) { e.target.disabled = false; e.target.textContent = 'Réessayer'; return toast(error.message, true); }
    const r = Array.isArray(data) ? data[0] : data;
    fermerModale();
    toast(r && r.deja ? 'Une demande était déjà en attente pour ce jour — la direction l’a.'
                      : 'Demande envoyée — la direction la voit sur son écran.');
  });
}

function boiteJourPasse(j) {
  const propositions = [1, 2, 3].map(k => decaleJour(auj(), -k));
  const v = modale(`
    <h3 class="ocr-h2">Un lavage d’un autre jour</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
      Le lavage sera écrit sur <strong style="color:var(--ocr-blanc)">la journée où il a eu
      lieu</strong> — c’est le seul moyen que le chiffre d’affaires de ce jour-là soit juste.
      Il entrera terminé, sans chrono, et Guénolé devra clôturer cette journée à nouveau.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${propositions.map((d, i) => `<button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc"
        data-jp="${d}" style="text-align:left;justify-content:flex-start">${
        i === 0 ? 'Hier — ' : ''}${jourLong(d)}</button>`).join('')}
    </div>
    <label class="ocr-champ" style="margin-top:var(--ocr-e4)"><span class="ocr-label">Une autre date</span>
      <input class="ocr-saisie" id="jpDate" type="date" max="${decaleJour(auj(), -1)}"
             min="${decaleJour(auj(), -31)}"></label>

  const d = auj();

  const demandes = await API.demandesEnAttente().catch(() => []);

  const actifs = ps.filter(p => !p.annule);

/* ══════════════════════════════════════════════════════════════════════════
   LE RAPPORT RH DU MOIS (14/08)

   Edwin : « Dès demain déjà je pense qu'on pourra compter ses heures, et en
   fin de mois on pourra Guénolé et moi voir le récapitulatif de tout le monde,
   un genre de rapport RH. »

   CE QU'IL A DEMANDÉ D'Y VOIR : heures et jours travaillés, ponctualité,
   absences et jours de repos. Les pauses non prises n'y sont pas — elles
   restent là où elles servent, sur l'écran du jour, au moment où on peut
   encore en parler à la personne. Un reproche vieux de trois semaines ne
   corrige rien.

   LA RÈGLE DES HEURES, CHOISIE AVEC LUI : une journée sans sortie pointée ne
   compte AUCUNE heure, et elle se voit en ambre. On n'invente pas une heure de
   départ, même « raisonnable » : un total qu'on n'a pas mesuré est un total
   sur lequel on ne peut pas discuter avec quelqu'un. La journée reste à
   corriger à la main, et le total se refait tout seul.

   Le mois en cours s'arrête à AUJOURD'HUI : compter des jours de repos qui ne
   sont pas encore arrivés donnerait un rapport faux dès le 2 du mois.
   ══════════════════════════════════════════════════════════════════════════ */
let rhMois = auj().slice(0, 7);

const finDeMois = ym => {
  const [a, m] = ym.split('-').map(Number);
  return new Date(a, m, 0).toLocaleDateString('en-CA');
};
const moisLong = ym => new Date(ym + '-15T12:00:00')
  .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
const moisDecale = (ym, n) => {
  const [a, m] = ym.split('-').map(Number);
  const d = new Date(a, m - 1 + n, 15);
  return d.toLocaleDateString('en-CA').slice(0, 7);
};

/* Combien de jours de la période une absence recouvre. Une absence encore
   ouverte (sans date de fin) court jusqu'au bout de la période demandée. */
function joursAbsents(absences, du, au) {
  const jours = new Set();
  absences.forEach(a => {
    let j = a.du > du ? a.du : du;
    const f = (a.au && a.au < au) ? a.au : au;
    while (j <= f) { jours.add(j); j = decaleJour(j, 1); }
  });
  return jours.size;
}
function joursDeRepos(jourSemaine, du, au) {
  if (jourSemaine == null || jourSemaine === '') return 0;
  let n = 0, j = du;
  while (j <= au) { if (jourSemaineDe(j) === Number(jourSemaine)) n++; j = decaleJour(j, 1); }
  return n;
}

function lignesRH(pts, abs, du, au) {
  /* Tout le monde qui pointe, plus quiconque a pointé au moins une fois dans
     le mois — un remplaçant de passage ne doit pas disparaître du rapport. */
  const pointeurs = equipePointage();
  const gens = equipe.filter(e => pointeurs.some(x => x.id === e.id) ||
                                  pts.some(p => p.employe_id === e.id));
  return gens.map(e => {
    const p = pts.filter(x => x.employe_id === e.id && x.arrivee);
    const complets = p.filter(x => x.depart);
    const heures = complets.reduce((somme, x) => somme + (minutesPointage(x) || 0), 0);
    return {
      e,
      presents: p.length,
      heures,
      moyenne: complets.length ? Math.round(heures / complets.length) : 0,
      /* La journée EN COURS n'est pas une sortie oubliée : à 15 h, personne
         n'a « oublié » de pointer son départ. Elle est simplement en cours, et
         elle ne compte pas encore d'heures. Ne pas faire cette différence
         affichait « 3 sorties jamais pointées » tous les après-midi. */
      enCours: p.some(x => !x.depart && x.jour === auj()),
      sansSortie: p.filter(x => !x.depart && x.jour < auj()).map(x => x.jour),
      retards: p.filter(x => ecartsPointage(x).some(y => y.cle === 'retard')).map(x => x.jour),
      absents: joursAbsents(abs.filter(a => a.employe_id === e.id), du, au),
      repos: joursDeRepos(e.repos_jour, du, au),
    };
  }).sort((a, b) => b.heures - a.heures);
}

function boiteRapportRH() {
  rhMois = auj().slice(0, 7);
  const v = modale('<div id="zoneRH"><div class="vide">Calcul en cours…</div></div>');
  peindreRH(v);
}

async function peindreRH(v) {
  const z = v.querySelector('#zoneRH'); if (!z) return;
  const du = rhMois + '-01';
  const finMois = finDeMois(rhMois);

  const enCours = finMois > auj();
  z.innerHTML = '<div class="vide">Calcul en cours…</div>';
  let pts = [], abs = [];
  try {
    [pts, abs] = await Promise.all([
      API.pointagesPeriode(du, au),
      API.absencesPeriode(du, au).catch(() => []),
    ]);
  } catch (ex) {
    z.innerHTML = '<div class="vide">Lecture impossible : ' + esc(ex.message || '') + '</div>';
    return;
  }
  if (!v.isConnected) return;                      // la fenêtre a été fermée entre-temps

  const R = REGLE();
  const lignes = lignesRH(pts, abs, du, au);
  const totalH = lignes.reduce((s, l) => s + l.heures, 0);
  const totalJ = lignes.reduce((s, l) => s + l.presents, 0);
  const aCorriger = lignes.reduce((s, l) => s + l.sansSortie.length, 0);

  z.innerHTML = `
    <h3 class="ocr-h2">📋 Rapport RH</h3>
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0 var(--ocr-e3)">

             style="flex:1;text-align:center;min-width:0">

    </div>
    <p class="ocr-mini" style="margin:0 0 var(--ocr-e4)">${esc(moisLong(rhMois))}${
      enCours ? ' — arrêté au ' + dateFr(au) + ' (mois en cours)' : ''}.
      Les heures sont la présence moins les pauses.</p>

    <div class="tuiles" style="margin-bottom:var(--ocr-e4)">
      <div class="tuile"><div class="lab">Heures de l’équipe</div><div class="val">${fmtDuree(totalH)}</div>
        <div class="sub">${pluriel(totalJ, 'journée')} pointée${totalJ > 1 ? 's' : ''}</div></div>
      <div class="tuile"><div class="lab">À corriger</div><div class="val"
        style="${aCorriger ? 'color:var(--ocr-ambre)' : ''}">${aCorriger}</div>
        <div class="sub">${aCorriger ? 'sortie(s) jamais pointée(s)' : 'toutes les journées sont complètes'}</div></div>
    </div>

    ${lignes.length ? lignes.map(l => `
      <div class="ocr-carte" style="margin-bottom:9px">
        <div style="display:flex;gap:10px;align-items:center">
          ${avatar(l.e, 38)}
          <span style="min-width:0;flex:1">
            <span style="font:600 15px/1.2 var(--ocr-texte);color:var(--ocr-blanc);display:block">${esc(l.e.nom)}</span>
            <span class="ocr-mini">${esc(metier(l.e))}</span>
          </span>
          <span style="text-align:right;flex:none">
            <span style="font:700 17px/1 var(--ocr-texte);color:var(--ocr-blanc);
              font-variant-numeric:tabular-nums;display:block">${fmtDuree(l.heures)}</span>
            <span class="ocr-mini">${pluriel(l.presents, 'jour')} présent${l.presents > 1 ? 's' : ''}</span>
          </span>
        </div>
        <div class="ocr-mini" style="margin-top:9px;display:flex;flex-wrap:wrap;gap:4px 14px">
          <span>Moyenne ${fmtDuree(l.moyenne)} par jour</span>
          ${l.enCours ? '<span style="color:var(--ocr-vert)">journée en cours</span>' : ''}
          ${l.absents ? '<span>' + pluriel(l.absents, 'jour') + ' d’absence</span>' : ''}
          ${l.repos ? '<span>' + pluriel(l.repos, 'jour') + ' de repos</span>' : ''}
        </div>
        ${l.sansSortie.length ? `<div class="ocr-mini" style="margin-top:6px;color:var(--ocr-erreur)">
          ⚠ ${pluriel(l.sansSortie.length, 'sortie')} jamais pointée${l.sansSortie.length > 1 ? 's' : ''}
          (${l.sansSortie.map(j => dateFr(j)).join(', ')}) — ${

        ${l.retards.length ? `<div class="ocr-mini" style="margin-top:6px;color:var(--ocr-ambre)">

      </div>`).join('')
    : '<div class="ocr-carte vide">Personne n’a pointé ce mois-là.</div>'}

    <button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" id="rhCsv"
      style="margin-top:var(--ocr-e3)">⬇ Tableau pour Guénolé (CSV)</button>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:9px">Fermer</button>`;

  z.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  z.querySelectorAll('[data-rhmois]').forEach(b => b.addEventListener('click', () => {
    const suivant = moisDecale(rhMois, Number(b.dataset.rhmois));
    if (suivant > auj().slice(0, 7)) return;       // jamais dans le futur

  }));

  ['input', 'change'].forEach(ev => z.querySelector('#rhChoix').addEventListener(ev, e => {

  }));
  z.querySelector('#rhCsv').addEventListener('click', () => {

    ];
    const lig = lignes.map(l => [
      l.e.nom, metier(l.e), l.presents, fmtDuree(l.heures), l.heures, fmtDuree(l.moyenne),

    // BOM UTF-8 + point-virgule : Excel francophone ouvre le fichier tel quel.

/* ══════════════════════════════════════════════════════════════════════════
   ACCÈS DE L'ÉQUIPE — le numéro de téléphone comme identifiant (14/08)

   Edwin : « Pour Abel, et pour Cabo quand il aura son téléphone, j'aurais aimé
   que leur identifiant soit leur numéro de téléphone. Pas besoin qu'ils
   reçoivent un code. Juste leur numéro et un mot de passe. S'ils doivent
   réinitialiser je peux le faire pour eux. Même pour Samuel, au lieu de lui
   donner une adresse mail fictive. Car les 2 seuls vrais e-mails pour
   l'instant, c'est moi et Guénolé. »

   AUCUN SMS N'EST JAMAIS ENVOYÉ. Le numéro sert d'identifiant, pas de canal :
   la page « Phone » de Supabase (code par SMS, ~180 F le message vers le Bénin)
   n'est pas activée et n'a pas à l'être.

   Cet écran n'écrit rien lui-même. Il appelle la fonction serveur equipe-acces,
   seule à détenir la clé qui permet de toucher au compte d'un autre.
   ══════════════════════════════════════════════════════════════════════════ */

/* Un mot de passe qui se dicte au téléphone sans épeler : trois lettres qu'on
   connaît par cœur et cinq chiffres. Huit caractères, le minimum exigé. */
const motDePasseFacile = () => 'ocr' + Math.floor(10000 + Math.random() * 90000);

/* Guénolé tient les RH, donc il gère les accès — mais pas celui d'Edwin. La
   base et la fonction serveur disent la même chose ; ici on évite seulement de
   montrer un bouton qui serait refusé. */
const accesGerables = () => equipe.filter(e =>
  !(moi.role === 'comptable' && e.role === 'direction'));

function boiteAccesEquipe() {
  const v = modale('<div id="zoneAcces"></div>');
  peindreListeAcces(v);
}

function peindreListeAcces(v) {
  const z = v.querySelector('#zoneAcces'); if (!z) return;
  z.innerHTML = `
    <h3 class="ocr-h2">🔑 Accès de l’équipe</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Un numéro de téléphone permet
      d’entrer <strong>en plus</strong> de l’adresse e-mail, jamais à sa place : ceux qui ont
      une adresse gardent les deux portes. Aucun code n’est envoyé, rien n’arrive par SMS.
      Si quelqu’un oublie son mot de passe, tu lui en donnes un nouveau ici et tu le lui dis.</p>
    ${accesGerables().map(e => {
      const pose = cleTel8(e.telephone).length === 8;
      const parMail = ['direction', 'comptable'].includes(e.role);
      return `<button class="fiche" data-acc="${e.id}"
        style="width:100%;display:block;text-align:left;cursor:pointer;margin-bottom:9px">
        <span class="ligne1">
          <strong style="font:600 15px/1.2 var(--ocr-texte);color:var(--ocr-blanc)">${esc(e.nom)}</strong>
          <span class="ocr-mini">${esc(metier(e))}</span>
        </span>
        <span class="ocr-petit" style="display:block;margin-top:4px">${
          !e.user_id ? '<span style="color:var(--ocr-ambre)">⚠ pas encore de compte — à créer</span>'
        : pose        ? '✓ entre avec ' + esc(e.telephone) + (parMail ? ' ou son adresse' : '')
        : parMail     ? 'entre avec son adresse e-mail'
        : '<span style="color:var(--ocr-ambre)">⚠ pas encore de numéro de connexion</span>'}</span>
      </button>`;
    }).join('')}
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer
      style="margin-top:var(--ocr-e3)">Fermer</button>`;
  z.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  z.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () =>
    peindreFicheAcces(v, equipe.find(e => e.id === b.dataset.acc))));
}

function peindreFicheAcces(v, e) {
  const z = v.querySelector('#zoneAcces'); if (!z || !e) return;
  const propose = motDePasseFacile();
  z.innerHTML = `
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-retour
      style="margin-bottom:var(--ocr-e3)">‹ L’équipe</button>
    <h3 class="ocr-h2">${esc(e.nom)}</h3>
    <p class="ocr-mini" style="margin:2px 0 var(--ocr-e4)">${esc(metier(e))}</p>

    <label class="ocr-champ"><span class="ocr-label">Numéro de connexion</span>
      <input class="ocr-saisie" id="acTel" type="tel" inputmode="tel"
             value="${esc(e.telephone || '')}" placeholder="01 97 45 48 12">
      <span class="ocr-aide">Tape-le comme au Bénin, en commençant par 01 — l’indicatif
        se met tout seul. C’est ce qu’il tapera à la connexion.</span></label>

    <label class="ocr-champ"><span class="ocr-label">Nouveau mot de passe</span>
      <input class="ocr-saisie" id="acMdp" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="laisse vide pour n’y pas toucher">
      <span class="ocr-aide">8 caractères minimum. Vide = seul le numéro change.</span></label>
    <button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" id="acProposer">Proposer « ${propose} »</button>

    <div id="acResume"></div>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e4)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Fermer</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" id="acSauver">Enregistrer</button>
    </div>`;
  /* PAS de brancherTel ici (Edwin, 14/08) : sur une fiche client, voir
     « +229 » apparaître au premier appui rassure et fait gagner du temps. Sur
     un identifiant de connexion, c'est l'inverse — le champ s'ouvre sur un
     indicatif dont personne n'a besoin, et il faut poser le curseur après. On
     laisse taper « 0169293143 » ; telPropre remet l'indicatif à la sortie du
     champ, pour que la base garde partout la même forme. */
  z.querySelector('#acTel').addEventListener('blur', e => {
    e.target.value = telPropre(e.target.value);
  });
  z.querySelector('[data-retour]').addEventListener('click', () => peindreListeAcces(v));
  z.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  z.querySelector('#acProposer').addEventListener('click', () => {
    z.querySelector('#acMdp').value = propose;
  });
  z.querySelector('#acSauver').addEventListener('click', async ev => {
    const tel = telPropre(z.querySelector('#acTel').value);
    const mdp = z.querySelector('#acMdp').value.trim();
    const nouveau = !e.user_id;              // personne qui n'a pas encore de compte
    const telChange = cleTel8(tel) !== cleTel8(e.telephone);
    /* Créer un compte demande TOUJOURS le numéro, même s'il était déjà dans la
       fiche : le serveur en a besoin pour fabriquer l'adresse interne. Ne pas
       l'envoyer donnait « pas encore de compte : donne son numéro ET un mot de
       passe » alors que le numéro était sous les yeux (vu le 14/08 en créant
       le compte d'Agathe). */
    const envoyerTel = telChange || nouveau;
    if (nouveau && !mdp)
      return toast(e.nom + ' n’a pas encore de compte : donne-lui un premier mot de passe.', true);
    if (!envoyerTel && !mdp) return toast('Rien à changer : donne un numéro ou un mot de passe.', true);
    if (mdp && mdp.length < 8) return toast('Mot de passe : 8 caractères minimum.', true);
    ev.target.disabled = true;
    try {
      const r = await API.equipeAcces(e.id, envoyerTel ? tel : null, mdp || null);
      if (envoyerTel) e.telephone = tel;     // la liste en mémoire suit, sans recharger
      if (r && r.cree) e.user_id = 'nouveau';
      toast((r && r.message) || 'Enregistré ✓');
      consigneAcces(z, e, mdp);
    } catch (ex) { toast(ex.message, true); ev.target.disabled = false; }
  });
}

/* Ce qu'il reste à faire une fois enregistré : le DIRE à la personne. L'écran
   prépare le message tout fait — c'est là que ça se perdait, sinon. */
function consigneAcces(z, e, mdp) {
  const texte = 'OCR Brillance — ton accès à l’application atelier :\n'
    + 'Identifiant : ' + (e.telephone || '') + '\n'
    + (mdp ? 'Mot de passe : ' + mdp + '\n' : '')
    + 'Adresse : https://atelier.ocrbrillance.com';
  const c = z.querySelector('#acResume'); if (!c) return;
  c.innerHTML = `<div class="ocr-carte" style="border-color:rgba(46,160,67,.45);margin-top:var(--ocr-e4)">
    <div class="ocr-surtitre" style="color:var(--ocr-vert)">À transmettre à ${esc(e.nom)}</div>
    <div style="white-space:pre-wrap;font:var(--ocr-t-petit);margin:8px 0 0">${esc(texte)}</div>
    <button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" id="acCopier" style="margin-top:10px">Copier</button>
    <div class="ocr-mini" style="margin-top:7px">Dis-le-lui de vive voix si tu peux : un mot de passe
      qui traîne dans une conversation y reste.</div></div>`;
  c.querySelector('#acCopier').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(texte); toast('Copié ✓'); }
    catch (ex) { toast('Copie impossible sur cet appareil — lis-le à voix haute.', true); }
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MARQUES & MODÈLES — le catalogue, modifiable par l'atelier (13/08)
   « Des fois il y a des nouvelles marques chinoises. Il faut que le parc
     apprenne et qu'on puisse modifier s'il y a des erreurs. »
   Une seule règle tenue par la base : zéro doublon (index unique sur la forme
   normalisée). Corriger une taille ici change le prix proposé partout, dans
   les deux applications.
   ══════════════════════════════════════════════════════════════════════════ */
let cataQ = '', cataFiltre = 'tout';
async function vueCatalogue() {
  const lignes = await API.catalogue();
  const q = OCR.clefTexte(cataQ);
  const filtrees = lignes.filter(l =>
    (cataFiltre === 'tout' || (cataFiltre === 'atelier' ? l.origine === 'atelier' : l.gabarit === cataFiltre)) &&
    (!q || OCR.clefTexte(l.marque + l.modele).includes(q)));
  /* 388 modèles d'un coup, c'est 60 000 pixels de page et un téléphone qui
     rame pour rien. On en dessine une tranche et on le DIT — jamais de liste
     coupée en silence : la recherche et les filtres sont juste au-dessus. */
  const PLAFOND = 60;
  const coupees = Math.max(0, filtrees.length - PLAFOND);
  // triées d'abord : la tranche affichée doit être prévisible (de A à Z),
  // pas dépendante de l'ordre où la base a répondu.
  filtrees.sort((a, b) => a.marque.localeCompare(b.marque, 'fr') ||
                          (a.modele || '').localeCompare(b.modele || '', 'fr'));
  const visibles = filtrees.slice(0, PLAFOND);
  // regroupé par marque : c'est comme ça qu'on cherche une voiture
  const parMarque = {};
  visibles.forEach(l => (parMarque[l.marque] || (parMarque[l.marque] = [])).push(l));
  const marques = Object.keys(parMarque).sort((a, b) => a.localeCompare(b, 'fr'));
  const nbAtelier = lignes.filter(l => l.origine === 'atelier').length;

  $('#vue').innerHTML = `
    ${retourDirection()}
    <div class="ocr-carte">
      <div class="ocr-surtitre">Marques & modèles</div>
      <p class="ocr-mini" style="margin:8px 0 var(--ocr-e4)">
        ${lignes.length} modèles au catalogue, dont ${nbAtelier} ajoutés par l'atelier.
        La <strong style="color:var(--ocr-blanc)">taille</strong> d'un modèle fait son prix :
        la corriger ici la corrige partout, y compris dans l'application des clients.</p>
      <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" id="cataAjout">＋ Ajouter une marque ou un modèle</button>
      <label class="ocr-champ" style="margin:var(--ocr-e4) 0 0"><span class="ocr-label">Chercher</span>
        <input class="ocr-saisie" id="cataQ" value="${esc(cataQ)}" placeholder="Toyota, Hilux, Changan…" autocomplete="off"></label>
      <div class="rangee-filtres">
        ${[['tout', 'Tout'], ['atelier', 'Ajoutés ici'], ...OCR.GABARITS.map(g => [g.id, g.court])]
          .map(([id, lab]) => `<button class="ocr-chip" data-catafiltre="${id}"
            aria-pressed="${cataFiltre === id}">${esc(lab)}</button>`).join('')}
      </div>
    </div>

    ${marques.length ? marques.map(ma => `
      <div class="ocr-carte" style="margin-top:var(--ocr-e4)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font:700 15px/1.2 var(--ocr-titre)">${esc(ma)}</div>
          <span class="ocr-mini">${parMarque[ma].length} modèle(s)</span>
        </div>
        ${parMarque[ma].sort((a, b) => a.modele.localeCompare(b.modele, 'fr')).map(l => `
          <div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ocr-sep)">
            <span style="min-width:0;flex:1">
              <span style="font-weight:600;display:block">${esc(l.modele || '(marque seule)')}</span>
              <span class="ocr-mini">${esc((OCR.gabarit(l.gabarit) || {}).nom || l.gabarit)}${
                l.origine === 'atelier' ? ' · ajouté ici' : ''}</span>
            </span>
            <span class="actions-veh">
              <button data-cataedit="${l.id}" title="Changer la taille" aria-label="Changer la taille">✎</button>
              <button data-catasup="${l.id}" class="dgr" title="Retirer du catalogue" aria-label="Retirer">✕</button>
            </span>
          </div>`).join('')}
      </div>`).join('')
    : '<div class="ocr-carte vide" style="margin-top:var(--ocr-e4)">Aucun modèle ne correspond.</div>'}
    ${coupees ? `<p class="ocr-mini" style="text-align:center;margin:var(--ocr-e4) 0 0">
      ${filtrees.length} modèles correspondent — les ${PLAFOND} premiers sont affichés.
      Écris le nom de la marque ou du modèle plus haut pour trouver le tien.</p>` : ''}`;

  brancherRetourDirection();
  $('#cataAjout').addEventListener('click', () => boiteCatalogue());
  let mn;
  $('#cataQ').addEventListener('input', e => {
    cataQ = e.target.value;
    clearTimeout(mn);
    mn = setTimeout(() => { if (onglet === 'catalogue') vueCatalogue(); }, 280);
  });
  $('#vue').querySelectorAll('[data-catafiltre]').forEach(b => b.addEventListener('click', () => {
    cataFiltre = b.dataset.catafiltre; vueCatalogue();
  }));
  $('#vue').querySelectorAll('[data-cataedit]').forEach(b => b.addEventListener('click', () =>
    boiteCatalogue(lignes.find(l => l.id === b.dataset.cataedit))));
  $('#vue').querySelectorAll('[data-catasup]').forEach(b => b.addEventListener('click', () =>
    boiteCatalogueRetrait(lignes.find(l => l.id === b.dataset.catasup))));
}

function boiteCatalogue(ligne) {
  let gab = ligne ? ligne.gabarit : 'berline';
  const v = modale(`
    <h3 class="ocr-h2">${ligne ? 'Corriger' : 'Ajouter au catalogue'}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">La taille choisie ici sera proposée
      automatiquement dès qu'on saisira ce modèle — c'est elle qui fait le prix.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Marque</span>
        <input class="ocr-saisie" id="caMa" value="${esc(ligne ? ligne.marque : '')}" ${ligne ? 'readonly' : ''}></label>
      <label class="ocr-champ"><span class="ocr-label">Modèle</span>
        <input class="ocr-saisie" id="caMo" value="${esc(ligne ? ligne.modele : '')}" ${ligne ? 'readonly' : ''}
               placeholder="Laisse vide pour la marque seule"></label>
    </div>
    <div class="ocr-label" style="margin-bottom:8px">Taille de facturation</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:var(--ocr-e4)">
      ${OCR.GABARITS.map(g => `<button class="ocr-chip" data-cagab="${g.id}" aria-pressed="${gab === g.id}">${esc(g.court)}</button>`).join('')}
    </div>
    <p class="ocr-mini" id="caEx" style="margin:0 0 var(--ocr-e4)"></p>
    <div style="display:flex;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>${ligne ? 'Enregistrer' : 'Ajouter'}</button></div>`);
  const majEx = () => {
    const g = OCR.gabarit(gab) || {};
    const pr = OCR.prix('signature', gab);
    v.querySelector('#caEx').innerHTML = esc(g.ex || '') +
      (pr != null ? ' · Lavage Signature à ' + OCR.fcfa(pr) : ' · sur devis');
  };
  majEx();
  v.querySelectorAll('[data-cagab]').forEach(b => b.addEventListener('click', () => {
    gab = b.dataset.cagab;
    v.querySelectorAll('[data-cagab]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cagab === gab)));
    majEx();
  }));
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    const ma = v.querySelector('#caMa').value.trim();
    if (!ma) return toast('La marque est obligatoire.', true);
    e.target.disabled = true;
    try {
      const r = await API.catalogueposer(ma, v.querySelector('#caMo').value.trim(), gab);
      await chargerCatalogue();
      fermerModale();
      toast(r.cree ? ma + ' ajouté au catalogue ✓' : 'Taille corrigée ✓');
      vueCatalogue();
    } catch (ex) { toast(ex.message, true); e.target.disabled = false; }
  });
}

function boiteCatalogueRetrait(ligne) {
  if (!ligne) return;
  const v = modale(`
    <h3 class="ocr-h2">Retirer du catalogue ?</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
      <strong style="color:var(--ocr-blanc)">${esc(ligne.marque)} ${esc(ligne.modele)}</strong>
      ne sera plus proposé à la saisie. Les véhicules déjà enregistrés ne changent pas —
      c'est juste une suggestion en moins.</p>
    <div style="display:flex;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Garder</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Retirer</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    e.target.disabled = true;
    try {
      await API.catalogueRetirer(ligne.id);
      await chargerCatalogue();
      fermerModale(); toast('Retiré du catalogue');
      vueCatalogue();
    } catch (ex) { toast(ex.message, true); e.target.disabled = false; }
  });
}

async function vueJournal() {
  const lignes = await API.journal(60);
  $('#vue').innerHTML = `
    ${retourDirection()}
    <div class="ocr-carte">
      <div class="ocr-surtitre">Journal d’activité</div>
      <p class="ocr-mini" style="margin:8px 0 var(--ocr-e4)">Les 60 dernières actions — encaissements, annulations,
        pointages, corrections, baies, absences. Rien ne s’efface.</p>
      ${lignes.length ? lignes.map(r => `
        <div style="padding:9px 0;border-bottom:1px solid var(--ocr-sep)">
          <span class="ocr-petit" style="display:block">${esc(r.quoi)}</span>
          <span class="ocr-mini">${esc(r.qui_nom || 'Système')}${(r.quand || r.cree_le) ? ' · ' +
            new Date(r.quand || r.cree_le).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</span>
        </div>`).join('')
      : '<div class="vide">Journal vide.</div>'}
    </div>`;
  brancherRetourDirection();
}

/* ---------- démarrage ---------- */
(async function () {
  bandeau();
  try {
    sb = MODE_DEMO ? creerClientDemo()
                   : window.supabase.createClient(CONFIG_SUPABASE.url, CONFIG_SUPABASE.cle,
                       { auth: { experimental: { passkey: true } } });
    // toute écriture videra la mémoire courte des lectures (voir plus haut)
    surveillerEcritures();
  } catch (ex) {
    document.body.innerHTML = '<div class="ocr-message ocr-message--erreur" style="margin:40px auto;max-width:420px">' +
      '<span>⛔</span><div><strong>Connexion impossible</strong><br>La bibliothèque Supabase n’a pas pu être chargée. ' +
      'Vérifiez votre connexion internet.</div></div>';
    return;
  }
  brancherRecuperation();
  leverLeRideau();
  const { data } = await sb.auth.getSession();
  if (data && data.session) {
    if (sessionPerimee()) {
      await sb.auth.signOut();
      try { localStorage.removeItem(CLE_ACTIVITE); } catch (ex) { /* rien à nettoyer */ }
      toast('Reconnecte-toi : l’application est restée fermée un moment.');
    } else await demarrer();
  }
})();
</script>
