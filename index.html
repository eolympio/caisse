               sans_plaque_valide_le: p.sans_plaque_valide_le || null,
               valide_par: ve.nom || '', saisi_par_nom: se.nom || '',
               client: c.nom || null, prestation_nom: l.libelle || null };
    });

  /* Qui est venu du parc partenaire, avec combien de véhicules (13/08). */
  const parcPartenaire = () => {
    const g = {};
    D.passages.filter(p => !p.annule && p.parc_partenaire).forEach(p => {
      const c = D.clients.find(x => x.id === p.client_id); if (!c) return;
      const e = D.entreprises.find(x => x.id === c.entreprise_id); if (!e) return;
      const l = D.passage_lignes.find(x => x.passage_id === p.id && x.type === 'prestation') || {};
      const k = [p.journee, e.id, c.id, p.gabarit, l.code].join('|');
      const o = g[k] || (g[k] = { journee: p.journee, entreprise_id: e.id, entreprise: e.nom,
        remise_pct: e.remise_pct, employe_id: c.id, employe: c.nom, telephone: c.telephone,
        gabarit: p.gabarit, prestation: l.code || null, prestation_nom: l.libelle || null,
        vehicules: 0, passages: 0, ca: 0, remise: 0 });
      o.vehicules += p.quantite || 1; o.passages++;
      o.ca += p.montant_total || 0; o.remise += p.remise || 0;
    });
    return Object.values(g);
  };

  let session = null;

  // Comparaison : numérique si possible, texte sinon (les dates AAAA-MM-JJ trient bien en texte).
  const cmp = (a, b) => {
    const x = Number(a), y = Number(b);
    return !isNaN(x) && !isNaN(y) && String(a).trim() !== '' ? x - y : String(a).localeCompare(String(b));
  };

  function requete(table) {
    const f = [];              // prédicats
    let borne = null, tri = null;
    const motif = m => new RegExp('^' + String(m).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
                                    .replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i');
    const src = () => {
      if (table === 'v_journee_totaux')
        return [...new Set(D.passages.map(p => p.journee))].sort().map(totaux).filter(Boolean);
      if (table === 'v_mix_prestations') return mixPrestations();
      if (table === 'v_temps_lavage')    return tempsLavage();
      if (table === 'v_fidelite')        return fidelite();
      if (table === 'v_clients_stats')   return clientsStats();
      if (table === 'v_stats_parc')      return statsParc();
      if (table === 'v_lavages_sans_mesure')  return lavagesSansMesure();
      if (table === 'v_lavages_chronometres') return lavagesChronometres();
      if (table === 'v_parc_partenaire')      return parcPartenaire();
      if (table === 'v_sans_plaque')          return sansPlaque();
      if (table === 'v_cahier_jour')          return D.passages
        .filter(x => !x.annule && x.retard_motif)
        .map(x => {
          const l = D.passage_lignes.find(y => y.passage_id === x.id && y.type === 'prestation') || {};
          const v = D.vehicules.find(y => y.id === x.vehicule_id) || {};
          const e = D.employes.find(y => y.id === x.saisi_par) || {};
          return { id: x.id, journee: x.journee, reference: x.reference, gabarit: x.gabarit,
                   montant_total: x.montant_total, mode_paiement: x.mode_paiement,
                   statut_paiement: x.statut_paiement, note: x.note, cree_le: x.cree_le,
                   prestation_nom: l.libelle || null, prestation: l.code || null,
                   immatriculation: v.immatriculation || null, saisi_par_nom: e.nom || '' };
        });
      if (table === 'v_demandes')             return D.demandes.map(d => ({
        ...d,
        demande_par_nom: (D.employes.find(e => e.id === d.demande_par) || {}).nom || '',
        traite_par_nom: (D.employes.find(e => e.id === d.traite_par) || {}).nom || '',
      }));
      if (table === 'passages')          return D.passages.map(lier);
      if (table === 'vehicules')         return D.vehicules.map(v =>
        ({ ...v, clients: D.clients.find(c => c.id === v.client_id) || null }));
      if (table === 'clients')           return D.clients.map(c =>
        ({ ...c, entreprises: D.entreprises.find(e => e.id === c.entreprise_id) || null }));
      // Comme en base : reservations.vehicule_id pointe vers vehicules, la marque/
      // modèle/plaque ne sont pas dupliqués sur la réservation elle-même.
      if (table === 'reservations')      return D.reservations.map(r =>
        ({ ...r, vehicules: D.vehicules.find(v => v.id === r.vehicule_id) || null }));
      return D[table] || [];
    };
    const filtrer = () => {
      let r = src().filter(x => f.every(p => p(x)));
      if (tri) {
        const [k, asc, nullsFin] = tri;
        r = [...r].sort((a, b) => {
          const va = a[k], vb = b[k];
          if (nullsFin) {   // absents toujours en dernier, quel que soit le sens
            const na = va == null || va === '', nb = vb == null || vb === '';
            if (na !== nb) return na ? 1 : -1;
          }
          return (asc ? 1 : -1) * cmp(va, vb);
        });
      }
      return borne == null ? r : r.slice(0, borne);
    };
    const api = {
      select() { return api; },
      // nullsFirst:false → les valeurs absentes vont à la FIN, comme en base
      // (« vus récemment » ne doit pas commencer par les fiches sans passage).
      order(k, o) { tri = [k, !o || o.ascending !== false, o && o.nullsFirst === false]; return api; },
      limit(n) { borne = n; return api; },
      eq(k, v) { f.push(r => String(r[k]) === String(v)); return api; },
      is(k, v) { if (v === null) f.push(r => r[k] == null); else f.push(r => r[k] === v); return api; },
      not(k, op, v) { if (op === 'is' && v === null) f.push(r => r[k] != null); return api; },
      gte(k, v) { f.push(r => String(r[k]) >= String(v)); return api; },
      lte(k, v) { f.push(r => String(r[k]) <= String(v)); return api; },
      lt(k, v) { f.push(r => r[k] != null && cmp(r[k], v) < 0); return api; },
      gt(k, v) { f.push(r => r[k] != null && cmp(r[k], v) > 0); return api; },
      in(k, arr) { const s = (arr || []).map(String); f.push(r => s.includes(String(r[k]))); return api; },
      insert(rows) {
        const arr = (Array.isArray(rows) ? rows : [rows]).map(r => {
          const base = { id: uid(), cree_le: new Date().toISOString() };
          if (table === 'journal') base.quand = base.cree_le;
          if (table === 'reservations' || table === 'carnets') base.reference = ref();
          if (table === 'entreprises') base.maj_le = base.cree_le;
          return { ...base, ...r };
        });
        arr.forEach(r => (D[table] || (D[table] = [])).push(r));
        return {
          select() {
            return {
              single: () => Promise.resolve({ data: arr[0], error: null }),
              maybeSingle: () => Promise.resolve({ data: arr[0], error: null }),
              then: res => Promise.resolve({ data: arr, error: null }).then(res),
            };
          },
          then(res) { return Promise.resolve({ data: null, error: null }).then(res); },
        };
      },
      ilike(k, m) { const re = motif(m); f.push(r => re.test(String(r[k] == null ? '' : r[k]))); return api; },
      or(expr) {
        const tests = String(expr).split(/,(?=[a-z_]+\.)/).map(part => {
          const [k, op, ...reste] = part.split('.');
          const val = reste.join('.').replace(/^"|"$/g, '');
          if (op === 'ilike') { const re = motif(val); return r => re.test(String(r[k] == null ? '' : r[k])); }
          return r => String(r[k]) === val;
        });
        f.push(r => tests.some(t => t(r)));
        return api;
      },
      maybeSingle() { return Promise.resolve({ data: filtrer()[0] || null, error: null }); },
      single()      { return Promise.resolve({ data: filtrer()[0] || null, error: null }); },
      update(patch) {
        return { eq(k, v) {
          (D[table] || []).filter(r => String(r[k]) === String(v)).forEach(r => Object.assign(r, patch));
          return Promise.resolve({ data: null, error: null });
        } };
      },
      delete() {
        return { eq(k, v) {
          const t = D[table] || [];
          for (let i = t.length - 1; i >= 0; i--) if (String(t[i][k]) === String(v)) t.splice(i, 1);
          return Promise.resolve({ data: null, error: null });
        } };
      },
      upsert(rows) {
        rows.forEach(r => {
          const ex = D[table].find(x => x.journee === r.journee && x.cle === r.cle);
          if (ex) Object.assign(ex, r); else D[table].push({ id: uid(), traitee: false, ...r });
        });
        return Promise.resolve({ data: null, error: null });
      },
      then(res) { return Promise.resolve({ data: filtrer(), error: null }).then(res); },
    };
    return api;
  }

  // Qui a le droit de corriger : manager, comptable, direction — jamais un
  // technicien. Même phrase de refus que la base, au mot près.
  const quiCorrige = (verbe) => {
    const emp = D.employes.find(e => e.user_id === (session && session.user.id));
    if (!emp) throw new Error('Accès réservé au personnel');
    if (!['manager', 'comptable', 'direction'].includes(emp.role))
      throw new Error('Seuls le manager et la direction ' + verbe);
    return emp;
  };
  const telCle = t => String(t || '').replace(/[^0-9]/g, '').slice(-8);

  const RPC = {
    ocr_reinitialiser_code_client(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!['direction', 'comptable', 'manager'].includes(emp.role))
        throw new Error('Seuls le manager, le comptable et la direction réinitialisent un code client');
      const c = D.clients.find(x => x.id === a.p_client);
      if (!c) throw new Error('Client introuvable');
      c.pin_pose_le = null;
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Code de l’espace client réinitialisé — ' + c.nom, entite: 'client' });
      return [];
    },
    ocr_creer_client_entreprise(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      // Samuel enrôle au comptoir (Edwin, 13/08)
      if (!['direction', 'comptable', 'manager'].includes(emp.role))
        throw new Error('Accès réservé au manager et à la direction');
      const ent = D.entreprises.find(x => x.id === a.p_entreprise);
      if (!ent) throw new Error('Entreprise introuvable');
      if (!String(a.p_nom || '').trim()) throw new Error('Le nom est obligatoire');
      const tel = String(a.p_telephone || '').trim();
      let cl = tel ? D.clients.find(c => c.telephone === tel) : null;
      const existant = !!cl;
      if (cl) cl.entreprise_id = ent.id;
      else {
        cl = { id: uid(), nom: String(a.p_nom).trim(), telephone: tel || null,
               entreprise_id: ent.id, note: String(a.p_note || '').trim() || null };
        D.clients.push(cl);
      }
      const plaque = OCR.plaque(a.p_immat);
      if (a.p_gabarit || plaque || String(a.p_marque || '').trim()) {
        const doublon = plaque && D.vehicules.some(v => v.client_id === cl.id && OCR.plaque(v.immatriculation) === plaque);
        if (!doublon) D.vehicules.push({ id: uid(), client_id: cl.id, gabarit: a.p_gabarit || 'berline',
          marque: String(a.p_marque || '').trim() || null, modele: String(a.p_modele || '').trim() || null,
          immatriculation: plaque || null });
      }
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: String(a.p_nom).trim() + (existant ? ' (fiche existante) rattaché à ' : ' créé et rattaché à ') +
              ent.nom + ' — remise ' + (ent.remise_pct || 0) + ' %', entite: 'client' });
      return [{ client_id: cl.id, deja_existant: existant }];
    },
    /* ── corrections d'erreurs de comptoir (13/08) ──
       Mêmes règles et mêmes phrases que la base, pour que la démo ne mente pas
       sur ce qui est permis à qui. */
    ocr_catalogue_poser(a) {
      const emp = quiCorrige('complètent le catalogue');
      const ma = String(a.p_marque || '').trim();
      const mo = String(a.p_modele || '').trim();
      if (!ma) throw new Error('La marque est obligatoire');
      if (!OCR.GABARITS.some(g => g.id === a.p_gabarit)) throw new Error('Taille inconnue');
      const k = OCR.clefTexte(ma) + '|' + OCR.clefTexte(mo);
      const dejala = D.modeles_vehicules.find(x => OCR.clefTexte(x.marque) + '|' + OCR.clefTexte(x.modele) === k);
      let id, cree = false;
      if (dejala) { dejala.marque = ma; dejala.modele = mo; dejala.gabarit = a.p_gabarit; id = dejala.id; }
      else {
        id = uid();
        D.modeles_vehicules.push({ id, marque: ma, modele: mo, gabarit: a.p_gabarit, origine: 'atelier' });
        cree = true;
      }
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Catalogue véhicules : ' + (cree ? 'ajout de ' : 'correction de ') + ma +
              (mo ? ' ' + mo : '') + ' → ' + a.p_gabarit, entite: 'catalogue', entite_id: id });
      return [{ id, cree }];
    },
    ocr_catalogue_retirer(a) {
      const emp = quiCorrige('modifient le catalogue');
      const l = D.modeles_vehicules.find(x => x.id === a.p_id);
      if (!l) throw new Error('Entrée introuvable');
      D.modeles_vehicules = D.modeles_vehicules.filter(x => x.id !== a.p_id);
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Catalogue véhicules : retrait de ' + l.marque + (l.modele ? ' ' + l.modele : ''),
        entite: 'catalogue', entite_id: l.id });
      return [];
    },
    ocr_rattacher_vehicule(a) {
      const emp = quiCorrige('rattachent un véhicule');
      const ve = D.vehicules.find(x => x.id === a.p_vehicule);
      if (!ve) throw new Error('Véhicule introuvable');
      const cible = D.clients.find(c => c.id === a.p_client);
      if (!cible) throw new Error('Client introuvable');
      if (ve.client_id === cible.id) return [];
      const src = D.clients.find(c => c.id === ve.client_id);
      if (src && !src.a_completer && emp.role === 'manager')
        throw new Error('Ce véhicule est déjà sur la fiche de ' + src.nom +
          ' — seule la direction peut le déplacer.');
      ve.client_id = cible.id;
      let n = 0;
      if ((src && src.a_completer) || a.p_historique !== false) {
        D.passages.forEach(p => { if (p.vehicule_id === ve.id) { p.client_id = cible.id; n++; } });
        D.reservations.forEach(r => { if (r.vehicule_id === ve.id) r.client_id = cible.id; });
      }
      if (src && src.a_completer && !D.vehicules.some(v => v.client_id === src.id))
        D.clients = D.clients.filter(c => c.id !== src.id);
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Véhicule ' + (ve.immatriculation || 'sans plaque') + ' rattaché à ' + cible.nom +
              ' (depuis « ' + ((src && src.nom) || '?') + ' »' + (n ? ', ' + n + ' passage(s) suivis' : '') + ')',
        entite: 'vehicule', entite_id: ve.id });
      return [];
    },
    /* Créer une fiche avec CE QU'ON A, sans jamais de doublon — copie fidèle
       de ocr_creer_client en base. */
    ocr_creer_client(a) {
      const emp = quiCorrige('créent une fiche client');
      const tel = String(a.p_telephone || '').trim() || null;
      const nom = String(a.p_nom || '').trim() || null;
      const plaque = OCR.plaque(a.p_immat) || null;
      if (!tel && !nom && !plaque) throw new Error('Donne au moins un nom, un numéro ou une plaque');
      let cl = null, existant = false, rattache = false;
      if (tel) {
        cl = D.clients.find(c => c.telephone === tel) ||
             D.clients.find(c => telCle(c.telephone) && telCle(c.telephone) === telCle(tel)) || null;
        if (cl) existant = true;
      }
      let ve = plaque ? D.vehicules.find(v => OCR.plaque(v.immatriculation) === plaque) : null;
      if (ve) {
        const prop = D.clients.find(c => c.id === ve.client_id) || {};
        if (!cl && prop.a_completer) {
          cl = prop; existant = true; rattache = true;
          if (nom) cl.nom = nom;
          if (tel) { cl.telephone = tel; cl.a_completer = false; }
          if (nom && !tel) cl.a_completer = false;
          if (a.p_email) cl.email = cl.email || String(a.p_email).trim();
        } else if (cl && ve.client_id !== cl.id && !prop.a_completer) {
          throw new Error('La plaque ' + plaque + ' est déjà sur la fiche de ' + prop.nom +
            ' — ouvre sa fiche pour la déplacer.');
        } else if (!cl && !prop.a_completer) {
          throw new Error('La plaque ' + plaque + ' appartient déjà à ' + prop.nom +
            ' — ouvre sa fiche plutôt que d’en créer une deuxième.');
        }
      }
      if (!cl) {
        cl = { id: uid(), nom: nom || (plaque ? 'Véhicule ' + plaque : 'Client de passage'),
               telephone: tel, email: String(a.p_email || '').trim() || null,
               note: String(a.p_note || '').trim() || null, a_completer: !tel && !nom };
        D.clients.push(cl);
      }
      if (ve) {
        if (ve.client_id !== cl.id) { RPC.ocr_rattacher_vehicule({ p_vehicule: ve.id, p_client: cl.id, p_historique: true }); rattache = true; }
        ve.marque = ve.marque || (String(a.p_marque || '').trim() || null);
        ve.modele = ve.modele || (String(a.p_modele || '').trim() || null);
      } else if (plaque || a.p_gabarit || String(a.p_marque || '').trim()) {
        D.vehicules.push({ id: uid(), client_id: cl.id, gabarit: a.p_gabarit || 'berline',
          marque: String(a.p_marque || '').trim() || null,
          modele: String(a.p_modele || '').trim() || null, immatriculation: plaque });
      }
      if (!existant || rattache)
        D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
          quoi: (existant ? 'Fiche client retrouvée : ' : 'Fiche client créée : ') + cl.nom +
                (tel ? ' · ' + tel : '') + (plaque ? ' · ' + plaque : '') +
                (rattache ? ' (véhicule et historique rattachés)' : ''),
          entite: 'client', entite_id: cl.id });
      return [{ client_id: cl.id, deja_existant: existant, vehicule_rattache: rattache }];
    },
    ocr_completer_fiche(a) {
      const emp = quiCorrige('complètent une fiche');
      const src = D.clients.find(x => x.id === a.p_client);
      if (!src) throw new Error('Client introuvable');
      const nom = String(a.p_nom || '').trim() || null;
      const tel = String(a.p_telephone || '').trim() || null;
      if (!nom && !tel) throw new Error('Donne au moins un nom ou un numéro');
      const cible = tel ? D.clients.find(c => c.id !== src.id &&
        (c.telephone === tel || (telCle(c.telephone) && telCle(c.telephone) === telCle(tel)))) : null;
      if (cible) {
        if (!src.a_completer)
          throw new Error('Ce numéro est celui de ' + cible.nom +
            ' — fusionner deux fiches réelles n’est pas possible ici : corrige la bonne fiche.');
        D.vehicules.forEach(v => { if (v.client_id === src.id) v.client_id = cible.id; });
        D.passages.forEach(p => { if (p.client_id === src.id) p.client_id = cible.id; });
        D.reservations.forEach(r => { if (r.client_id === src.id) r.client_id = cible.id; });
        D.clients = D.clients.filter(c => c.id !== src.id);
        D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
          quoi: 'Fiche provisoire « ' + src.nom + ' » rattachée à ' + cible.nom, entite: 'client', entite_id: cible.id });
        return cible.id;
      }
      if (nom) src.nom = nom;
      if (tel) { src.telephone = tel; src.a_completer = false; }
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Fiche complétée : ' + src.nom + (tel ? ' · ' + tel : ''), entite: 'client', entite_id: src.id });
      return src.id;
    },
    ocr_modifier_client(a) {
      const emp = quiCorrige('corrigent une fiche client');
      const c = D.clients.find(x => x.id === a.p_client);
      if (!c) throw new Error('Client introuvable');
      if (!String(a.p_nom || '').trim()) throw new Error('Le nom ne peut pas être vide');
      const tel = String(a.p_telephone || '').trim() || null;
      if (tel) {
        const autre = D.clients.find(x => x.id !== c.id && telCle(x.telephone) === telCle(tel));
        if (autre) throw new Error('Ce numéro est déjà sur la fiche de ' + autre.nom +
          ' — corrige la bonne fiche plutôt que d’en créer une deuxième');
      }
      const avant = { nom: c.nom, tel: c.telephone };
      c.nom = String(a.p_nom).trim();
      c.telephone = tel;
      if (tel) c.a_completer = false;
      c.email = String(a.p_email || '').trim() || null;
      c.note = String(a.p_note || '').trim() || null;
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Fiche client corrigée : ' + avant.nom + (avant.nom !== c.nom ? ' → ' + c.nom : '') +
              (String(avant.tel || '') !== String(c.telephone || '')
                ? ' · téléphone ' + (avant.tel || '(vide)') + ' → ' + (c.telephone || '(vide)') : ''),
        entite: 'client', entite_id: c.id });
      return [];
    },
    ocr_archiver_client(a) {
      const emp = quiCorrige('archivent une fiche client');
      const c = D.clients.find(x => x.id === a.p_client);
      if (!c) throw new Error('Client introuvable');
      const motif = String(a.p_motif || '').trim() || null;
      if (a.p_archive === false) { c.archive_le = null; c.archive_par = null; c.archive_motif = null; }

    /* La remise après coup — mêmes refus qu'en base, mot pour mot. */
    ocr_remise_passage(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp || !emp.actif) throw new Error('Accès réservé au personnel');
      if (!['manager', 'comptable', 'direction'].includes(emp.role))
        throw new Error('Seuls le manager, la comptabilité et la direction posent une remise');
      const p = D.passages.find(x => x.id === a.p_passage);
      if (!p) throw new Error('Lavage introuvable');
      if (p.annule) throw new Error('Ce lavage est annulé — rien à remiser');
      if (p.statut_paiement === 'paye')
        throw new Error('Ce lavage est déjà encaissé : une remise se pose AVANT le paiement, jamais après');
      const r = Number(a.p_remise);
      if (!(r >= 0)) throw new Error('Remise invalide');
      if (r > p.montant_brut)
        throw new Error('La remise ne peut pas dépasser le montant du lavage (' + p.montant_brut + ' F)');
      const motif = String(a.p_motif || '').trim();
      if (r > 0 && !motif) throw new Error('Une remise doit être justifiée — indique le motif');
      const avant = p.remise || 0;
      p.remise = r; p.montant_total = p.montant_brut - r;
      p.note = [r > 0 ? 'Remise ' + r + ' F : ' + motif : null,
                String(p.note || '').replace(/^Remise \d+ F : [^·]*(· )?/, '') || null]
               .filter(Boolean).join(' · ') || null;

          ? 'Remise retirée sur ' + p.reference + ' — le lavage revient à ' + p.montant_brut + ' F'
          : 'Remise de ' + r + ' F sur ' + p.reference + ' (' + p.montant_brut + ' F → ' +
            p.montant_total + ' F) — ' + motif + (avant > 0 ? ' [remplace une remise de ' + avant + ' F]' : ''),
        entite: 'passage', entite_id: p.id });
      return [{ reference: p.reference, montant_brut: p.montant_brut, remise: r, montant_total: p.montant_total }];

    ocr_enregistrer_passage(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      /* RATTRAPAGE (14/08) — copie fidèle de la base : rien dans le futur, rien
         au-delà d'un mois, rien sur une journée signée, motif obligatoire. */
      const jour = a.p_journee || jourCourant;
      let retard = null;
      if (jour !== jourCourant) {
        if (jour > jourCourant) throw new Error('On n\'enregistre pas un lavage à venir');
        // la direction et la comptabilité remontent plus loin que le manager
        const limite = ['comptable', 'direction'].includes(emp && emp.role) ? 92 : 31;
        if (jour < jourMoins(limite))
          throw new Error('Trop ancien (' + jour + ') — au-delà de ' + limite +
            ' jours, passe par « Reprendre d\'anciens lavages »');
        if (!String(a.p_motif_retard || '').trim())
          throw new Error('Dis pourquoi ce lavage est saisi en retard — c\'est inscrit au journal');
        const jc = D.journees.find(x => x.date === jour);
        if (jc && ['validee', 'fermee'].includes(jc.statut))
          throw new Error('JOURNEE_SIGNEE : la journée du ' + jour +
            ' est clôturée et signée — la direction doit la réouvrir');
        retard = String(a.p_motif_retard).trim();
      }
      const j = D.journees.find(x => x.date === jour);
      if (j && j.statut !== 'ouverte') throw new Error('Journée ' + jour + ' clôturée : modification impossible');
      const lignes = a.p_lignes || [];
      if (!lignes.length) throw new Error('Aucune prestation sélectionnée');
      /* LA PLAQUE D'ABORD — copie fidèle de la base (13/08) :
         1. la plaque est cherchée dans TOUS les véhicules (une plaque = un véhicule) ;
         2. le client = le téléphone s'il est donné, sinon le propriétaire de la
            plaque, sinon une fiche provisoire « Véhicule CB5916 » ;
         3. si la plaque était sur une fiche provisoire et qu'on connaît enfin
            le client, tout lui est transféré et la provisoire disparaît. */
      const plaque = OCR.plaque(a.p_immat);
      let ve = plaque ? D.vehicules.find(v => OCR.plaque(v.immatriculation) === plaque) : null;
      const vePropr = ve ? ve.client_id : null;
      const tel = String(a.p_telephone || '').trim();
      const nomDonne = String(a.p_client_nom || '').trim();
      let cl = null;
      if (tel) {
        cl = D.clients.find(c => c.telephone === tel) ||
             D.clients.find(c => telCle(c.telephone) && telCle(c.telephone) === telCle(tel));
        if (!cl) { cl = { id: uid(), nom: nomDonne || 'Client de passage', telephone: tel }; D.clients.push(cl); }
        else if (nomDonne && (cl.a_completer || ['Client de passage', 'Client'].includes(cl.nom))) {
          cl.nom = nomDonne; cl.a_completer = false;
        }
      } else if (vePropr) {
        cl = D.clients.find(c => c.id === vePropr);
      }
      /* Comme en base : un parc partenaire sans plaque ni téléphone ne fabrique
         AUCUNE fiche client. Le lavage appartient à l'entreprise, pas à
         quelqu'un. Sans ça, reprendre cinquante jours de motos Ehu poserait
         cinquante fiches « Client de passage » à compléter. */
      if (!cl && !(a.p_parc && !plaque)) {
        cl = { id: uid(), nom: plaque ? 'Véhicule ' + plaque : (nomDonne || 'Client de passage'),
               telephone: null, a_completer: true };
        D.clients.push(cl);
      }
      // liaison automatique d'une fiche provisoire vers la vraie fiche
      if (ve && vePropr && vePropr !== cl.id) {
        const prov = D.clients.find(c => c.id === vePropr);
        if (prov && prov.a_completer) {
          ve.client_id = cl.id;
          D.passages.forEach(p => { if (p.client_id === vePropr) p.client_id = cl.id; });
          D.reservations.forEach(r => { if (r.client_id === vePropr) r.client_id = cl.id; });
          if (!D.vehicules.some(v => v.client_id === vePropr))
            D.clients = D.clients.filter(c => c.id !== vePropr);
          D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: 'e3', qui_nom: 'Samuel',
            quoi: 'Fiche provisoire « ' + prov.nom + ' » rattachée à ' + cl.nom + ' (plaque ' + plaque + ')',
            entite: 'client', entite_id: cl.id });
        }
      }
      /* Parc d'un partenaire SANS plaque : ces véhicules sont au concessionnaire
         et seront vendus — on ne leur fabrique AUCUNE fiche au nom de l'employé. */
      const parc = !!a.p_parc && !plaque;
      if (!ve && !plaque && !parc) {
        // pas de plaque : on réutilise le véhicule sans plaque du même gabarit
        ve = D.vehicules.find(v => v.client_id === cl.id && !v.immatriculation && v.gabarit === a.p_gabarit);
      }
      if (!ve && !parc) {
        ve = { id: uid(), client_id: cl.id, gabarit: a.p_gabarit,
               marque: String(a.p_marque || '').trim() || null,
               modele: String(a.p_modele || '').trim() || null,
               immatriculation: plaque || null };
        D.vehicules.push(ve);
      } else if (ve) {
        // on remplit les trous, jamais on n'écrase — et la taille se corrige
        // seulement sur un véhicule encore anonyme (créé sur la seule plaque)

        ve.marque = ve.marque || (String(a.p_marque || '').trim() || null);
        ve.modele = ve.modele || (String(a.p_modele || '').trim() || null);
        if (anonyme && ve.marque) ve.gabarit = a.p_gabarit || ve.gabarit;
      }
      // les lignes portent le prix D'UN véhicule ; le brut suit la quantité

      const remise = Math.min(Math.max(0, a.p_remise || 0), brut);

      if (remise > 0) {
        const ent = cl && cl.entreprise_id ? D.entreprises.find(e => e.id === cl.entreprise_id) : null;
        const attendu = ent && ent.remise_pct > 0 ? Math.round(brut * ent.remise_pct / 100) : null;
        if (remise !== attendu && !String(a.p_motif_remise || '').trim())
          throw new Error('Une remise doit être justifiée — indique le motif');
      }
      const id = uid(), r = ref();
      D.passages.push({ id, reference: r, journee: jour, client_id: cl ? cl.id : null,
        vehicule_id: parc || !ve ? null : ve.id,
        gabarit: a.p_gabarit, heure_arrivee: new Date().toTimeString().slice(0, 8),
        heure_debut: null, heure_fin: null,
        montant_brut: brut, remise, montant_total: brut - remise,
        /* Un lavage rattrapé entre TERMINÉ : il n'a jamais eu de chrono, et le

        retard_motif: retard,

        sans_chrono_motif: retard ? 'Lavage saisi en retard : ' + retard : null,
        statut_paiement: 'impaye', mode_paiement: null,
        // La base stocke la note du passage ; la démonstration l'oubliait,
        // donc « Parc Ehu Motors · 3 véhicules » ne se relisait nulle part.
        note: String(a.p_note || '').trim() || null,
        equipe: a.p_equipe || [], saisi_par: emp ? emp.id : null,
        quantite: q, parc_partenaire: parc,
        /* Sans plaque et hors parc partenaire : on garde POURQUOI. La base met
           « Non précisé » plutôt que rien — un trou se perd, une phrase se lit. */
        sans_plaque_motif: !plaque && !parc && !retard
          ? (String(a.p_motif_sans_plaque || '').trim() || 'Non précisé') : null,
        sans_plaque_valide_par: null, sans_plaque_valide_le: null });
      if (!D.journees.some(x => x.date === jour))
        D.journees.push({ date: jour, statut: 'ouverte', valide_par: null, valide_le: null, totaux: null });
      lignes.forEach(l => D.passage_lignes.push({ id: uid(), passage_id: id, ...l }));
      if (a.p_reservation) {
        const resa = D.reservations.find(x => x.reference === String(a.p_reservation).toUpperCase().trim());
        if (resa) resa.statut = 'honoree';
      }
      return [{ reference: r, id, montant_total: brut - remise }];
    },

    ocr_pause(a) {

    ocr_annuler_passage(a) {

                         annule_par: emp.id, annule_le: new Date().toISOString() });

    /* Une ligne du cahier : le lavage ET son encaissement, d'un seul geste. */
    ocr_saisir_cahier(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!['comptable', 'direction'].includes(emp.role))
        throw new Error('La reprise du cahier est réservée à la comptabilité et à la direction');
      if (a.p_mode && !['kkiapay', 'especes'].includes(a.p_mode))
        throw new Error('Mode de paiement inconnu');
      /* Le parc partenaire repris du cahier : on nomme l'ENTREPRISE, jamais
         l'employé. La remise vient de la fiche de l'entreprise, comme en base. */
      const q = Math.max(1, Math.min(50, Number(a.p_quantite) || 1));
      const ent = a.p_entreprise ? D.entreprises.find(x => x.id === a.p_entreprise) : null;
      if (a.p_entreprise && !ent) throw new Error('Entreprise introuvable');
      const brut = (a.p_lignes || []).reduce((t, l) => t + (Number(l.prix) || 0), 0) * q;
      const remise = ent ? Math.round(brut * (ent.remise_pct || 0) / 100) : 0;
      const r = RPC.ocr_enregistrer_passage({
        p_client_nom: null, p_telephone: null, p_gabarit: a.p_gabarit, p_lignes: a.p_lignes,
        p_remise: remise, p_marque: null, p_modele: null, p_immat: a.p_immat,
        p_equipe: null, p_note: [a.p_fiche,
          ent ? 'Parc ' + ent.nom + (q > 1 ? ' · ' + q + ' véhicules' : '') : null,
          a.p_note].filter(Boolean).join(' · ') || null,
        p_reservation: null,
        p_motif_remise: ent ? 'Parc ' + ent.nom + ' — ' + (ent.remise_pct || 0) + ' %' : null,
        p_quantite: q, p_parc: !!ent,
        p_motif_sans_plaque: null,
        p_journee: a.p_journee, p_motif_retard: 'Repris du cahier papier',
      })[0];
      if (ent) {
        const pass = D.passages.find(x => x.id === r.id);
        if (pass) pass.entreprise_id = ent.id;

      if (a.p_mode) RPC.ocr_encaisser({ p_passage: r.id, p_mode: a.p_mode,

        p_motif: a.p_mode === 'especes' ? 'Encaissement d\'origine, repris du cahier' : null });
      return [r];

      if (!D.journees.includes(j)) D.journees.push(j);

    },
  };

  /* La même clé que l'app et qu'ocr_tel_cle() en base : les 8 derniers
     chiffres. Trois endroits, une seule règle. */
  const cle8m = t => String(t || '').replace(/[^0-9]/g, '').slice(-8);

  /* ocr_compte_par_numero : l'app la consulte AVANT la connexion pour savoir
     quelle adresse porte le compte de ce numéro. En vrai elle est ouverte à
     anon — c'est ce qui permet d'entrer avec un numéro sans envoyer de SMS. */
  RPC.ocr_compte_par_numero = a => {
    const cle = cle8m(a.p_tel);
    if (cle.length !== 8) return null;
    const e = D.employes.find(x => x.actif && x.user_id && cle8m(x.telephone) === cle);
    return e ? e.email : null;
  };

  /* La fonction serveur equipe-acces, rejouée ici avec EXACTEMENT les mêmes
     refus — sinon la démonstration passerait au vert là où la vraie s'arrête.
     Ce qu'elle ne peut pas rejouer : les droits Postgres et la clé de service.
     Ceux-là se vérifient au catalogue (voir audit-droits.sql). */
  const FONCTIONS = {
    'equipe-acces'(b) {
      const moiE = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!moiE || !moiE.actif) throw new Error('Accès réservé au personnel.');
      if (!['direction', 'comptable'].includes(moiE.role))
        throw new Error('Seules la direction et la comptabilité gèrent les accès de l’équipe.');
      const c = D.employes.find(x => x.id === b.employe);
      if (!c) throw new Error('Employé introuvable.');
      if (moiE.role === 'comptable' && c.role === 'direction')
        throw new Error('La comptabilité ne touche pas au compte de la direction.');

      const veutTel = b.telephone != null && String(b.telephone).trim() !== '';
      const veutMdp = b.mot_de_passe != null && String(b.mot_de_passe) !== '';
      if (!veutTel && !veutMdp) throw new Error('Rien à changer.');

      let cle = '';
      if (veutTel) {
        cle = cle8m(b.telephone);
        if (cle.length !== 8) throw new Error('Numéro incomplet : 8 chiffres attendus (ex. 01 97 45 48 12).');
        const autre = D.employes.find(x => x.id !== c.id && x.actif && cle8m(x.telephone) === cle);
        if (autre) throw new Error('Ce numéro est déjà celui de ' + autre.nom + '.');
      }
      if (veutMdp && String(b.mot_de_passe).length < 8)
        throw new Error('Mot de passe : 8 caractères minimum.');

      const tracer = quoi => D.journal.unshift({ id: uid(), quand: new Date().toISOString(),
        qui: moiE.id, qui_nom: moiE.nom, quoi, entite: 'employe', entite_id: c.id });

      /* PAS ENCORE DE COMPTE — on le crée. L'adresse posée n'est qu'un
         porte-nom interne : personne ne la tape, on entre par le numéro. */
      if (!c.user_id) {
        if (!veutTel || !veutMdp)
          throw new Error(c.nom + ' n’a pas encore de compte : donne son numéro ET un premier mot de passe.');
        c.user_id = 'u' + uid().slice(0, 6);
        c.email = 't' + cle + '@ocrbrillance.com';
        c.telephone = String(b.telephone).trim();
        tracer('Compte créé pour ' + c.nom + ' — elle entre avec son numéro');
        return { ok: true, cree: true, identifiant: cle,
          message: 'Compte créé. ' + c.nom + ' entre avec son numéro.' };
      }

      /* COMPTE EXISTANT — depuis la v2, l'adresse n'est JAMAIS réécrite :
         le numéro est une deuxième porte, pas un remplacement. */
      if (veutMdp) tracer('Mot de passe de ' + c.nom + ' réinitialisé');
      if (veutTel) {
        c.telephone = String(b.telephone).trim();
        tracer(c.nom + ' peut désormais entrer avec son numéro');
      }
      return { ok: true, cree: false, identifiant: veutTel ? cle : null,
        message: veutTel && veutMdp ? 'Numéro et mot de passe enregistrés pour ' + c.nom + '.'
               : veutTel            ? c.nom + ' peut désormais entrer avec son numéro.'
               :                      'Nouveau mot de passe enregistré pour ' + c.nom + '.' };
    },
  };

  return {
    auth: {
      getSession: () => Promise.resolve({ data: { session }, error: null }),
      /* La vraie base ne connaît que des adresses : c'est l'app qui a déjà
         traduit le numéro en adresse (ocr_compte_par_numero) avant d'arriver
         ici. On accepte quand même l'adresse interne « t…@ », celle des
         comptes créés depuis l'app, pour que le repli hors ligne marche
         aussi en démonstration. */
      signInWithPassword({ email, password }) {
        const v = String(email).trim().toLowerCase();
        const e = D.employes.find(x => x.user_id && (x.email === v ||
          (cle8m(x.telephone).length === 8 && 't' + cle8m(x.telephone) + '@ocrbrillance.com' === v)));
        if (!e || password !== 'demo')
          return Promise.resolve({ data: null, error: { message: 'Invalid login credentials' } });
        session = { user: { id: e.user_id, email: e.email } };
        return Promise.resolve({ data: { session }, error: null });
      },
      signOut() { session = null; return Promise.resolve({ error: null }); },
      updateUser() { return Promise.resolve({ data: {}, error: null }); },
    },
    from: requete,
    // les données de la démonstration, pour que les tests puissent vérifier
    // ce qui a VRAIMENT été écrit (jamais utilisé par l'application elle-même)
    __D: D,
    rpc(nom, args) {
      try { return Promise.resolve({ data: RPC[nom](args || {}), error: null }); }
      catch (ex) { return Promise.resolve({ data: null, error: { message: ex.message } }); }
    },
    /* supabase-js ne met PAS le message d'une fonction serveur dans
       error.message (il n'y écrit que « non-2xx status code ») : il faut aller
       le lire dans error.context. La démonstration imite ce détail, sinon
       l'app afficherait le bon texte en démo et un texte creux en vrai. */
    functions: {
      invoke(nom, opts) {
        const corps = (opts && opts.body) || {};
        try {
          if (!FONCTIONS[nom]) throw new Error('Fonction ' + nom + ' inconnue.');
          return Promise.resolve({ data: FONCTIONS[nom](corps), error: null });
        } catch (ex) {
          const err = new Error('Edge Function returned a non-2xx status code');
          err.context = { json: () => Promise.resolve({ erreur: ex.message }) };
          return Promise.resolve({ data: null, error: err });
        }
      },
    },
  };
}

/* ---------- téléphone : le +229 est déjà tapé ----------
   Tous les numéros du Bénin commencent pareil : le champ arrive pré-rempli
   avec « +229 » et un numéro saisi sans indicatif le reçoit tout seul.
   Un champ resté à « +229 » seul compte comme vide. */
const INDICATIF = '+229 ';

  let t = String(v || '').trim();

  if (!chiffres || chiffres === '229') return '';
  t = t.replace(/^(\+?229[\s.]*)+(?=\+?229)/, '');   // « +229 +229 01… » (collage) → un seul indicatif
  if (/^229[\s.]/.test(t)) t = '+' + t;                 // « 229 01… » → « +229 01… »

     Sinon un « +229 +229 01 96… » (indicatif déjà posé, puis numéro collé
     avec le sien) restait affiché alors que la base, elle, avait bien nettoyé
     — l'écran et la vérité ne disaient plus la même chose. Vu le 14/08 sur
     l'écran des accès de l'équipe. */
  el.addEventListener('blur', () => { el.value = telPropre(el.value); });

/* ---------- l'identifiant de connexion (14/08) ----------
   Edwin : « J'aurais aimé que leur identifiant soit leur numéro de téléphone.
   Pas besoin qu'ils reçoivent un code. Juste leur numéro et un mot de passe. »

   usages, aucun réglage à choisir. */
const DOMAINE_INTERNE = '@ocrbrillance.com';
const cleTel8 = v => String(v || '').replace(/[^0-9]/g, '').slice(-8);

/* CE QUI A CHANGÉ LE 14/08 AU SOIR (v55) : Edwin a donné le numéro de Guénolé,
   qui a une VRAIE adresse. Le numéro ne remplace donc plus l'adresse — il
   ouvre une DEUXIÈME porte vers le même compte. Samuel, Abel et Agathe entrent
   par leur numéro ; Edwin et Guénolé par l'un ou l'autre.
   Conséquence heureuse : corriger un numéro ne touche plus jamais au compte,
   donc une faute de frappe n'enferme plus personne dehors.
   C'est la base qui fait la correspondance (ocr_compte_par_numero) : elle seule
   sait quelle adresse porte quel compte. Si elle ne répond pas (réseau coupé),
   on retombe sur l'adresse interne — celle des comptes créés depuis l'app. */
async function adresseDeConnexion(saisie) {
  const t = String(saisie || '').trim();
  if (t.includes('@')) return t;
  const cle = cleTel8(t);
  if (cle.length !== 8) return t;
  try {
    const { data } = await sb.rpc('ocr_compte_par_numero', { p_tel: t });
    if (data) return data;
  } catch (ex) { /* hors ligne : on tente quand même l'adresse interne */ }
  return 't' + cle + DOMAINE_INTERNE;
}
/* Le clavier du bon type dès la deuxième fois. Abel n'a que des chiffres à
   taper : après sa première entrée, son téléphone lui ouvre le pavé numérique
   tout seul. Edwin, qui tape une adresse, garde le clavier normal. */
const CLE_MODE_ID = 'ocr-identifiant-tel';
function memoriserModeIdentifiant(saisi) {
  try { localStorage.setItem(CLE_MODE_ID, String(saisi).includes('@') ? '0' : '1'); } catch (ex) { /* navigation privée */ }
}
function appliquerModeIdentifiant() {
  const c = $('#email'); if (!c) return;
  let m = null;
  try { m = localStorage.getItem(CLE_MODE_ID); } catch (ex) { /* navigation privée */ }
  if (m === '1') { c.inputMode = 'tel'; }
  else if (m === '0') { c.placeholder = 'ton adresse e-mail'; }
}

/* Branche un champ d'immatriculation : mise en forme pendant la frappe
   (majuscules, sans espace ni tiret) en gardant le curseur là où il est.
   Une plaque doit toujours être stockée sous la MÊME forme — sinon « cb 5916 »
   et « CB5916 » créent deux véhicules, et la fidélité du client se disperse. */
function brancherPlaque(el, apres) {
  if (!el) return;
  el.classList.add('plaque');
  el.setAttribute('autocapitalize', 'characters');
  el.setAttribute('autocomplete', 'off');
  el.setAttribute('spellcheck', 'false');
  el.setAttribute('maxlength', '10');
  el.addEventListener('input', () => {
    const utilesAvant = OCR.plaque(el.value.slice(0, el.selectionStart || 0)).length;
    const propre = OCR.plaque(el.value);
    if (el.value !== propre) { el.value = propre; el.setSelectionRange(utilesAvant, utilesAvant); }
    if (apres) apres(propre);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   AIDE À LA FRAPPE — MARQUES ET MODÈLES (13/08)
   « J'aimerais que les marques et modèles les plus fréquents au Bénin soient
     déjà enregistrés, ça facilite quand on enregistre. »

   Choix technique : une liste de suggestions native (datalist), pas un menu
   déroulant. Trois raisons — on tape la première lettre et la liste se filtre
   toute seule ; une marque absente s'écrit quand même (jamais de blocage) ;
   et ça reste le clavier du téléphone, sans fenêtre qui s'ouvre par-dessus.

   La liste = le parc béninois (socle partagé) + ce que l'atelier a DÉJÀ
   enregistré, pour qu'elle s'améliore d'elle-même. Et l'orthographe se remet
   au propre à la sortie du champ : « toyota » devient « Toyota », sinon on se
   retrouve avec trois marques pour une seule.
   ══════════════════════════════════════════════════════════════════════════ */
/* Le catalogue de la base est versé dans le socle : à partir de là, les
   suggestions, l'orthographe et la taille déduite en tiennent compte partout
   (Saisie, fiches, app client). Appelé au démarrage et après chaque ajout. */
async function chargerCatalogue() {
  try { OCR.poserCatalogue(await API.catalogue()); } catch (e) {}
}

let PARC = null;   // ce qui roule déjà chez nous, rangé par type de véhicule
async function chargerParc() {
  if (PARC) return PARC;
  const p = { moto: { marques: [], modeles: {} }, auto: { marques: [], modeles: {} } };
  try {
    const { data } = await sb.from('vehicules').select('marque,modele,gabarit').limit(2000);
    (data || []).forEach(v => {
      // rangé par type : les marques de motos n'ont rien à faire dans la liste
      // d'une berline, même quand elles viennent de notre propre parc.
      const c = v.gabarit === 'moto' ? p.moto : p.auto;
      const ma = String(v.marque || '').trim();
      if (!ma) return;
      if (!c.marques.includes(ma)) c.marques.push(ma);
      const mo = String(v.modele || '').trim();
      if (!mo) return;
      const l = c.modeles[ma] || (c.modeles[ma] = []);
      if (!l.includes(mo)) l.push(mo);
    });
  } catch (e) {}
  PARC = p;
  return PARC;
}
const parcDe = (gabarit) => (PARC ? (gabarit === 'moto' ? PARC.moto : PARC.auto)
                                  : { marques: [], modeles: {} });

/* ══════════════════════════════════════════════════════════════════════════
   LES SUGGESTIONS SONT DES PASTILLES, PLUS UNE <datalist> (13/08)

   « Quand je vais dans Modèle après avoir mis Toyota, je ne vois pas de
     modèle. Mais si je n'ai pas mis Toyota, je vois des modèles. » — Edwin,
   sur iPhone. Les listes natives <datalist> sont invisibles ou capricieuses
   selon le téléphone : sur iOS elles apparaissent dans une barre minuscule
   au-dessus du clavier, et elles ne se rafraîchissent pas toujours quand on
   remplace leurs options. On ne peut pas construire une caisse dessus.

   Et elles coûtaient cher : 160 <option> réécrites à CHAQUE frappe.
   Désormais : huit pastilles au maximum, qu'on dessine nous-mêmes, toujours
   visibles, tapables au doigt. La saisie libre reste possible — une marque
   absente s'écrit quand même.
   ══════════════════════════════════════════════════════════════════════════ */
const SUGG_MAX = 8;
function zoneSuggestions(el) {
  if (!el) return null;
  const label = el.closest('label') || el;
  const hote = label.parentNode;
  // une zone PAR champ : marque et modèle ne doivent pas s'écraser l'une l'autre
  let z = hote.querySelector(':scope > .sugg-mm[data-pour="' + el.id + '"]');
  if (!z) {
    z = document.createElement('div');
    z.className = 'sugg-mm';
    z.dataset.pour = el.id;
    z.style.cssText = 'grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 0';
    hote.insertBefore(z, label.nextSibling);
  }
  return z;
}

/* Branche un couple de champs marque/modèle. `gabarit()` est une fonction :
   changer de gabarit change les suggestions sans reconstruire l'écran. */
/* `poserGabarit(g, source)` est fourni par l'appelant : c'est lui qui sait
   comment changer la taille dans SON formulaire (et l'annoncer). */
/* La ligne « ce modèle est nouveau — je l'ajoute au catalogue ? ». Elle
   s'affiche sous les champs marque/modèle, dans le formulaire où on est. */
function zoneApprentissage(elModele) {
  if (!elModele) return null;
  // Hors du <label> : un bouton posé DANS un label reçoit mal le doigt (le
  // navigateur renvoie le clic vers le champ). Vu au test du 13/08.
  const label = elModele.closest('label') || elModele;
  const hote = label.parentNode;
  let z = hote.querySelector(':scope > .appr-cata');
  if (!z) {
    z = document.createElement('p');
    z.className = 'ocr-mini appr-cata';
    z.style.margin = '6px 0 0';
    z.style.gridColumn = '1 / -1';   // pleine largeur même dans une grille
    hote.insertBefore(z, label.nextSibling);
  }
  return z;
}

function brancherMarqueModele(elMarque, elModele, gabarit, apres, poserGabarit) {
  if (!elMarque && !elModele) return;
  // Une seule paire de listes par couple de champs, réutilisée : l'écran de
  // Saisie se redessine à chaque frappe, on ne veut pas empiler des listes.
  if (elMarque) { elMarque.removeAttribute('list'); elMarque.setAttribute('autocomplete', 'off'); }
  if (elModele) { elModele.removeAttribute('list'); elModele.setAttribute('autocomplete', 'off'); }
  const zoneM = zoneSuggestions(elMarque), zoneD = zoneSuggestions(elModele);

  const gab = () => (typeof gabarit === 'function' ? gabarit() : gabarit);

  const majApprentissage = (ma, mo, g, inconnu) => {
    const z = zoneApprentissage(elModele);
    if (!z) return;
    /* On ne réécrit la zone QUE si son état change. Sinon, un simple clic de
       souris sur le bouton la reconstruisait avant le relâchement (le blur du
       champ Modèle déclenche un « change » de plus) et le clic était perdu :
       il fallait cliquer deux fois. Bug attrapé au test du 13/08 — invisible
       au doigt, systématique à la souris (l'ordinateur de Guénolé). */
    const etat = [ma, mo, g, inconnu ? '1' : '0'].join('|');
    if (z.dataset.etat === etat) return;
    z.dataset.etat = etat;
    if (!inconnu || !ma || !mo || !peutCorrigerFiche()) { z.innerHTML = ''; return; }
    const nomG = (OCR.gabarit(g) || {}).nom || g;
    z.innerHTML = '<span style="color:var(--ocr-ambre)">« ' + esc(ma + ' ' + mo) +
      ' » n’est pas encore au catalogue.</span> ' +
      '<button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" data-appr style="margin-top:6px">' +
      '＋ L’ajouter comme ' + esc(nomG) + '</button>';
    const b = z.querySelector('[data-appr]');
    if (b) b.addEventListener('click', async () => {
      b.disabled = true;
      try {
        await API.catalogueposer(ma, mo, g);
        await chargerCatalogue();
        z.dataset.etat = 'ajoute';
        z.innerHTML = '<span style="color:var(--ocr-vert)">✓ ' + esc(ma + ' ' + mo) +
          ' ajouté au catalogue en ' + esc(nomG) + ' — il sera proposé la prochaine fois.</span>';
        peindre();
      } catch (ex) { toast(ex.message, true); b.disabled = false; }
    });
  };

  /* Filtre « commence par », puis « contient » : on tape « toy » et Toyota
     arrive en premier, on tape « cruis » et Land Cruiser sort quand même. */
  const filtrer = (liste, saisi) => {
    const k = OCR.clefTexte(saisi || '');
    const u = [...new Set(liste.filter(Boolean))];
    if (!k) return u.slice(0, SUGG_MAX);
    const debut = u.filter(x => OCR.clefTexte(x).startsWith(k));
    const dedans = u.filter(x => !OCR.clefTexte(x).startsWith(k) && OCR.clefTexte(x).includes(k));
    return [...debut, ...dedans].slice(0, SUGG_MAX);
  };
  const pastilles = (zone, liste, choisir) => {
    if (!zone) return;
    // exactement la même valeur déjà écrite : rien à proposer
    const html = liste.map(v => `<button type="button" class="ocr-chip sugg-v"
      style="padding:7px 12px;font-size:13px">${esc(v)}</button>`).join('');
    if (zone.dataset.h === html) return;      // on ne réécrit que si ça change
    zone.dataset.h = html;
    zone.innerHTML = html;
    zone.querySelectorAll('.sugg-v').forEach((b, i) => b.addEventListener('click', () => choisir(liste[i])));
  };
  /* UNE SEULE zone visible à la fois : celle du champ qu'on est en train de
     remplir. Deux listes de pastilles côte à côte, on ne saurait plus laquelle
     on touche. */
  const vide = z => { if (z && z.dataset.h !== '') { z.dataset.h = ''; z.innerHTML = ''; } };
  const exact = (l, v) => l.length === 1 && OCR.clefTexte(l[0]) === OCR.clefTexte(v);
  const listeM = () => {
    const parc = parcDe(gab());
    return filtrer([...OCR.marques(gab()), ...parc.marques], elMarque.value.trim());
  };
  const listeD = () => {
    const parc = parcDe(gab());
    const ma = elMarque ? elMarque.value : '';
    return filtrer([...OCR.modeles(ma, gab()), ...(parc.modeles[OCR.marqueCanon(ma, gab())] || [])],
                   elModele.value.trim());
  };
  const peindreM = () => {
    if (!elMarque) return;
    const l = listeM();
    pastilles(zoneM, exact(l, elMarque.value.trim()) ? [] : l, x => {
      elMarque.value = x;
      vide(zoneM); deduire();
      if (elModele) { elModele.focus(); peindreD(); }
      if (apres) apres();
    });
    vide(zoneD);
  };
  const peindreD = () => {
    if (!elModele) return;
    const l = listeD();
    pastilles(zoneD, exact(l, elModele.value.trim()) ? [] : l, x => {
      elModele.value = x;
      vide(zoneD); deduire();
      if (apres) apres();
    });
    vide(zoneM);
  };
  // au repos : on propose là où il reste quelque chose à remplir
  const peindre = () => {
    if (elMarque && !elMarque.value.trim()) peindreM();
    else if (elModele && !elModele.value.trim()) peindreD();
    else { vide(zoneM); vide(zoneD); }
  };
  peindre();
  chargerParc().then(peindre);

  /* LA TAILLE SE DÉDUIT DU MODÈLE (13/08) : « ça éviterait les questions au
     niveau du prix, donc c'est sans surprise ». Un Land Cruiser est un grand
     SUV, un Picanto une petite — le tarif suit tout seul. Si le modèle est
     inconnu, on ne devine rien : mieux vaut laisser choisir que se tromper. */
  const deduire = () => {
    const ma = elMarque ? elMarque.value.trim() : '';
    const mo = elModele ? elModele.value.trim() : '';
    const g = OCR.gabaritDe(ma, mo);
    if (g && poserGabarit && g !== gab()) poserGabarit(g, [ma, mo].filter(Boolean).join(' '));
    // Modèle que le catalogue ne connaît pas : c'est LE moment de l'apprendre.
    // (« des fois il y a des nouvelles marques chinoises » — Edwin, 13/08)
    majApprentissage(ma, mo, gab(), !g);
  };
  if (elMarque) {
    // à la frappe on ne redessine QUE les pastilles — jamais tout l'écran
    elMarque.addEventListener('focus', peindreM);
    elMarque.addEventListener('input', peindreM);
    elMarque.addEventListener('change', () => {
      elMarque.value = OCR.marqueCanon(elMarque.value, gab());
      peindre(); deduire();
      if (apres) apres();
    });
  }
  if (elModele) {
    elModele.addEventListener('focus', peindreD);
    elModele.addEventListener('input', peindreD);
    elModele.addEventListener('change', () => {
      elModele.value = OCR.modeleCanon(elMarque ? elMarque.value : '', elModele.value, gab());
      peindreD(); deduire();
      if (apres) apres();
    });
  }
  return peindre;   // à rappeler quand le gabarit change
}

function bandeau() {
  let h = '';
  if (MODE_DEMO) h += '<div class="bandeau bandeau--demo">✦ Mode démonstration — aucune donnée réelle n’est enregistrée.</div>';
  // Le pointage, lui, marche sans réseau : le dire ici évite de contredire
  // l'écran Pointage, qui invite justement à pointer quand même.
  if (!navigator.onLine) h += '<div class="bandeau bandeau--hors">⛔ Hors ligne — encaissements et saisie attendent la connexion. Le pointage, lui, fonctionne : il partira tout seul.</div>';
  // Nouvelle version déjà téléchargée : on laisse le choix du moment.
  if (nouvelleVersion) h += '<div class="bandeau bandeau--maj">✦ Nouvelle version ' + esc(nouvelleVersion) +
    ' prête <button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" id="btnAppliquerMaj" style="margin-left:10px">Recharger</button></div>';
  $('#bandeau').innerHTML = h;
  const bm = $('#btnAppliquerMaj');
  if (bm) bm.addEventListener('click', () => location.reload());
}
window.addEventListener('online', bandeau);
window.addEventListener('offline', bandeau);

/* ══════════════════════════════════════════════════════════════════════════
   MÉMOIRE COURTE (13/08) — pourquoi l'app « tournait lentement »

   Chaque appui rappelait la base pour des choses qui n'avaient pas changé
   depuis trois secondes : l'état de la journée, les absences du jour, les
   baies, les totaux… Depuis Cotonou, chaque aller-retour coûte 200 à 400 ms,
   et ils s'enchaînaient AVANT que le nouvel écran ne s'affiche. Résultat :
   une seconde de rien après chaque tap.

   Ces lectures sont désormais gardées 20 secondes en mémoire. Et pour qu'on
   ne puisse JAMAIS travailler sur un chiffre périmé, la mémoire est vidée
   d'un coup dès qu'une écriture part (n'importe quel rpc, insert, update ou
   delete — voir surveillerEcritures), ainsi que par le bouton ↻ et par le
   rafraîchissement automatique.
   ══════════════════════════════════════════════════════════════════════════ */
const MEMO = new Map();
const MEMO_MS = 20000;
function memo(cle, fn) {
  const e = MEMO.get(cle);
  if (e && Date.now() - e.t < MEMO_MS) return e.p;
  // on garde la PROMESSE, pas seulement le résultat : deux écrans qui
  // demandent la même chose en même temps ne font qu'un seul appel.
  const p = Promise.resolve().then(fn).catch(ex => { MEMO.delete(cle); throw ex; });
  MEMO.set(cle, { t: Date.now(), p });
  return p;
}
const memoVider = () => { MEMO.clear(); PARC = null; };   // le parc des véhicules aussi

/* Toute écriture vide la mémoire, où qu'elle soit écrite dans l'app : on
   emballe une fois pour toutes rpc() et les mutations de table. Impossible
   d'oublier un cas en ajoutant une fonction plus tard. */
function surveillerEcritures() {
  if (!sb || sb.__ocrSurveille) return;
  sb.__ocrSurveille = true;
  const rpc = sb.rpc.bind(sb);
  sb.rpc = (...a) => { memoVider(); return rpc(...a); };
  const from = sb.from.bind(sb);
  sb.from = (t) => {
    const q = from(t);
    ['insert', 'update', 'upsert', 'delete'].forEach(m => {
      if (typeof q[m] !== 'function') return;
      const f = q[m].bind(q);
      q[m] = (...a) => { memoVider(); return f(...a); };
    });
    return q;
  };
}

/* ---------- accès aux données ---------- */
const API = {
  async monEmploye() {
    const { data: s } = await sb.auth.getSession();
    if (!s || !s.session) return null;
    const { data, error } = await sb.from('employes')
      .select('id,nom,role,poste,email,remplacant,photo').eq('user_id', s.session.user.id).maybeSingle();
    if (error) throw error;
    return data;
  },
  async equipe() {
    const { data, error } = await sb.from('employes')
      .select('id,nom,role,poste,repos_jour,remplacant,photo,telephone,user_id').eq('actif', true).order('nom');
    if (error) throw error;
    return data || [];
  },
  // « entreprises!clients_entreprise_id_fkey » : il existe DEUX liens entre
  // clients et entreprises (la prospection pointe vers une fiche client, le
  // partenariat Ehu pointe vers une entreprise). Sans préciser lequel suivre,
  // l'API refuse tout — c'était le « Client introuvable » du 12/08, et la
  // reconnaissance par téléphone échouait en silence.
  async clientParTelephone(tel) {
    const { data } = await sb.from('clients')
      .select('id,nom,telephone,entreprise_id,entreprises!clients_entreprise_id_fkey(nom,remise_pct)')
      .eq('telephone', tel).maybeSingle();
    return data || null;
  },
  reinitialiserCodeClient: id => sb.rpc('ocr_reinitialiser_code_client', { p_client: id }),
  lierEmploye: (clientId, entrepriseId) =>
    sb.rpc('ocr_lier_employe', { p_client: clientId, p_entreprise: entrepriseId }),
  reglerRemisePartenaire: (entrepriseId, pct) =>
    sb.rpc('ocr_regler_remise_entreprise', { p_entreprise: entrepriseId, p_pct: pct }),
  async employesDe(entrepriseId) {
    const { data } = await sb.from('clients').select('id,nom,telephone').eq('entreprise_id', entrepriseId).order('nom');
    return data || [];
  },
  async vehiculesDe(clientId) {
    const { data } = await sb.from('vehicules').select('*').eq('client_id', clientId);
    return data || [];
  },
  // Retrouve un véhicule par sa plaque CANONIQUE (majuscules, sans espace) —
  // c'est ce qui permet de rattacher tout seul un habitué à l'arrivée.
  async vehiculeParPlaque(cle) {
    if (!cle) return null;
    const { data } = await sb.from('vehicules')
      .select('id,gabarit,marque,modele,immatriculation,client_id,clients(id,nom,telephone)')
      .eq('immatriculation', cle).limit(1);
    return (data && data[0]) || null;
  },
  ajouterVehicule: v => sb.from('vehicules').insert(v),

  /* --- corrections (erreurs de comptoir) ---
     Corriger ou retirer une fiche passe TOUJOURS par ces fonctions : elles
     vérifient le rôle, refusent ce qui toucherait à de l'argent (passage non
     soldé, rendez-vous à venir) et écrivent au journal. Depuis le 13/08, la
     base n'accepte plus aucune modification ni suppression directe de client
     ou de véhicule — même en bricolant la console du navigateur. */
  async modifierClient(id, d) {
    const { error } = await sb.rpc('ocr_modifier_client', {
      p_client: id, p_nom: d.nom, p_telephone: d.tel || null,
      p_email: d.email || null, p_note: d.note || null });
    if (error) throw new Error(error.message);
  },
  async archiverClient(id, archive, motif) {
    const { error } = await sb.rpc('ocr_archiver_client', {
      p_client: id, p_archive: archive, p_motif: motif || null });
    if (error) throw new Error(error.message);
  },
  /* LE VÉHICULE COMME IDENTITÉ (13/08) — « la plaque, la marque et le modèle
     sont les vraies identifications du véhicule ». Son historique lui
     appartient : tous ses lavages, quel que soit celui qui a payé. */
  /* CATALOGUE DES VÉHICULES — la liste vivante des marques et modèles, avec
     leur taille de facturation. Lecture gardée 20 s en mémoire ; toute écriture
     la périme (voir surveillerEcritures). */
  catalogue() { return memo('catalogue', async () => {
    const { data, error } = await sb.from('modeles_vehicules')
      .select('id,marque,modele,gabarit,origine').order('marque').order('modele');
    if (error) throw error;
    return data || [];
  }); },
  async catalogueposer(marque, modele, gabarit) {
    const { data, error } = await sb.rpc('ocr_catalogue_poser',
      { p_marque: marque, p_modele: modele || '', p_gabarit: gabarit });
    if (error) throw new Error(error.message);
    const r = Array.isArray(data) ? data[0] : data;
    return r || {};
  },

  /* --- fichier client --- */
  // Cherche sur le nom, le téléphone et la plaque d'un seul geste.
  async chercherClients(q) {
    const t = String(q || '').trim();
    if (t.length < 2) return [];
    // Trois recherches séparées plutôt qu'un « ou » : un numéro contient des
    // points, des espaces et un « + », que la syntaxe du « ou » interpréterait
    // comme des séparateurs. Ici chaque valeur est encodée proprement.
    const m = '%' + t.replace(/[%_]/g, ' ').trim() + '%';
    const [n, tel, v] = await Promise.all([
      sb.from('clients').select('id,nom,telephone').ilike('nom', m).limit(20),
      sb.from('clients').select('id,nom,telephone').ilike('telephone', m).limit(20),
      sb.from('vehicules').select('id,immatriculation,marque,modele,gabarit,clients(id,nom,telephone,a_completer)')
        .ilike('immatriculation', m).limit(20),
    ]);
    if (n.error) throw n.error;
    if (tel.error) throw tel.error;
    const vus = new Map();
    [...(n.data || []), ...(tel.data || [])].forEach(x => vus.set(x.id, x));
    (v.data || []).forEach(x => { if (x.clients && !vus.has(x.clients.id)) vus.set(x.clients.id, x.clients); });
    // les véhicules trouvés sont gardés à part : l'écran propose leur fiche
    // (« cette voiture, on l'a déjà lavée ? ») avant la liste des clients.
    rech.vehTrouve = (v.data || []).slice(0, 4);
    return [...vus.values()].sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr'));
  },
  async ficheClient(id) {
    const [cl, veh, pass, fid] = await Promise.all([
      // colonnes explicites : l'empreinte du code client n'a rien à faire ici
      sb.from('clients')
        .select('id,nom,telephone,email,est_pro,societe,note,cree_le,entreprise_id,pin_pose_le,archive_le,archive_motif,entreprises!clients_entreprise_id_fkey(nom,remise_pct)')
        .eq('id', id).maybeSingle(),
      sb.from('vehicules').select('*').eq('client_id', id),
      sb.from('passages').select('*, passage_lignes(*), vehicules(marque,modele,immatriculation)')
        .eq('client_id', id).order('journee', { ascending: false }).limit(40),
      sb.from('v_clients_stats').select('*').eq('client_id', id).maybeSingle(),
    ]);
    if (!cl.data) throw new Error('Client introuvable');
    return { client: cl.data, vehicules: veh.data || [], passages: pass.data || [], fidelite: fid.data || null };
  },
  // Les listes de l'écran Clients. « recents » est celle qu'on voit en
  // arrivant : personne ne devrait avoir à taper un nom pour voir ses clients.
  async listeClients(mode) {
    let q = sb.from('v_clients_stats').select('*');
    const d30 = decaleJour(auj(), -30);
    // Une fiche archivée disparaît de toutes les listes sauf la sienne : c'est
    // tout l'intérêt de l'archivage (elle ne pollue plus, rien n'est perdu).
    q = mode === 'archives' ? q.not('archive_le', 'is', null) : q.is('archive_le', null);
    if (mode === 'archives') {
      q = q.order('archive_le', { ascending: false }).limit(60);
      const { data, error } = await q;
      if (error) throw error;
      return data || [];
    }
    if (mode === 'acompleter') {
      // Les fiches nées d'une plaque, sans client : la liste des choses à finir.
      q = q.eq('a_completer', true).order('dernier_passage', { ascending: false, nullsFirst: false }).limit(60);
      const { data, error } = await q;
      if (error) throw error;
      return data || [];
    }
    if (mode === 'relance') {
      q = q.gt('passages', 0).lt('dernier_passage', d30).order('depense', { ascending: false }).limit(40);
    } else if (mode === 'meilleurs') {
      q = q.gt('passages', 0).order('depense', { ascending: false }).limit(40);
    } else if (mode === 'espace') {
      q = q.eq('espace_actif', true).order('dernier_passage', { ascending: false, nullsFirst: false }).limit(60);
    } else if (mode === 'partenaires') {
      q = q.not('entreprise_id', 'is', null).order('nom').limit(60);
    } else if (mode === 'sansvisite') {
      q = q.eq('passages', 0).order('nom').limit(60);
    } else {
      // « Vus récemment » — les derniers passages d'abord, les fiches sans
      // passage à la fin plutôt que perdues au milieu.
      q = q.order('dernier_passage', { ascending: false, nullsFirst: false }).limit(60);
    }
    const { data, error } = await q;
    if (error) throw error;
    return data || [];
  },

  /* La SEULE écriture qui ne passe ni par une table ni par une RPC. Changer le
     mot de passe de QUELQU'UN D'AUTRE exige la clé de service de Supabase —
     celle qui ouvre tout. Elle ne peut pas descendre dans l'application : le
     code d'une page se lit. Elle vit donc dans la fonction serveur
     equipe-acces (fichier equipe-acces.ts), qui refait tous les contrôles de
     rôle de son côté — l'écran caché n'est jamais la sécurité.
     À noter : sur un refus, supabase-js met le message dans error.context et
     non dans error.message (qui dit seulement « non-2xx status code »). */
  async equipeAcces(employe, telephone, motDePasse) {
    const { data, error } = await sb.functions.invoke('equipe-acces', {
      body: { employe, telephone: telephone || undefined, mot_de_passe: motDePasse || undefined },
    });
    if (!error) return data;
    let msg = (error && error.message) || 'Serveur injoignable.';
    try { const j = await error.context.json(); if (j && j.erreur) msg = j.erreur; } catch (ex) { /* réponse non JSON */ }
    throw new Error(msg);
  },

   Il ne RETARDE rien : il est retiré dès que l'application est prête. Mais on

/* Le rideau apparaît au PREMIER PIXEL peint, pas quand ce script est lu — il
   y a 700 Ko entre les deux. On compte donc à partir de là, sinon on ajoute
   son propre temps de lecture à l'attente qu'on prétend occuper. */
function debutRideau() {
  try {
    const e = performance.getEntriesByType('paint').find(x => x.name === 'first-contentful-paint');
    if (e) return e.startTime;
  } catch (ex) { /* navigateur sans Paint Timing (Safari ancien) */ }
  return 0;
}
/* LA CÉRÉMONIE SE MÉRITE. Mesuré sur processeur bridé, le rideau complet
   ajoute environ 850 ms à CHAQUE ouverture. Pour la première du matin, c'est
   la marque. Pour la vingtième, c'est un péage — et Samuel ouvre l'application
   des dizaines de fois par jour.
   Donc : geste complet si l'app n'a pas été ouverte depuis plus de trois
   heures (le matin, après la pause, sur un téléphone neuf) ; sinon l'emblème
   et un fondu, le temps d'un battement de cil. */
const RIDEAU_CEREMONIE = (() => {
  if (!anime()) return false;
  try {
    const v = JSON.parse(localStorage.getItem(CLE_ACTIVITE) || 'null');
    if (!v || !v.t) return true;                          // premier lancement
    return (Date.now() - v.t) > 3 * 3600 * 1000;
  } catch (ex) { return true; }
})();
if (!RIDEAU_CEREMONIE) {
  const r0 = document.getElementById('rideau');
  if (r0) r0.classList.add('rid-bref');
}
const RIDEAU_GESTE = !RIDEAU_CEREMONIE ? 240 : (MOUVEMENT === 'sobre' ? 340 : 540);
function leverLeRideau() {
  const r = document.getElementById('rideau');
  if (!r) return;
  const maintenant = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const reste = Math.max(0, debutRideau() + RIDEAU_GESTE - maintenant);
  setTimeout(() => {
    r.classList.add('parti');
    // retiré du document : plus un pixel, plus une couche graphique
    setTimeout(() => { if (r.parentNode) r.parentNode.removeChild(r); },
      r.classList.contains('rid-bref') ? 180 : 320);
  }, reste);
}

/* ---------- connexion ---------- */
$('#formConnexion').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btnConnexion'), err = $('#errConnexion');
  b.disabled = true; b.textContent = 'Connexion…'; err.classList.add('masque');
  try {
    const saisi = $('#email').value;
    const { error } = await sb.auth.signInWithPassword({
      email: await adresseDeConnexion(saisi), password: $('#mdp').value });
    if (error) throw error;
    memoriserModeIdentifiant(saisi);
    if (!MODE_DEMO && !(await exigerMFA())) return;   // code 2FA refusé → retour connexion
    await demarrer();
  } catch (ex) {
    err.textContent = '⛔ ' + (/Invalid login/i.test(ex.message)
      ? 'Numéro (ou adresse) et mot de passe : l’un des deux ne correspond pas.' : ex.message);
    err.classList.remove('masque');
  } finally { b.disabled = false; b.textContent = 'Se connecter'; }
});

/* ---------- passkey : entrer avec Face ID ou l'empreinte ----------
   Le bouton n'apparaît que hors démo, sur un appareil compatible.
   La passkey remplace la saisie de l'adresse et du mot de passe ; si le
   compte a la double sécurité, le code à 6 chiffres reste demandé. */
appliquerModeIdentifiant();
const PASSKEY_DISPO = !MODE_DEMO && typeof window.PublicKeyCredential !== 'undefined';
if (PASSKEY_DISPO) $('#btnPasskey').classList.remove('masque');
$('#btnPasskey').addEventListener('click', async () => {
  const b = $('#btnPasskey'), err = $('#errConnexion');
  b.disabled = true; err.classList.add('masque');
  try {
    const { error } = await sb.auth.signInWithPasskey();
    if (error) throw error;
    if (!MODE_DEMO && !(await exigerMFA())) return;
    await demarrer();
  } catch (ex) {
    if (!/abort|cancel|timed?.?out|NotAllowed/i.test(String(ex && (ex.message || ex.name)))) {
      err.textContent = '⛔ ' + (/passkey_disabled|not enabled/i.test(ex.message || '')
        ? 'La connexion par passkey n’est pas encore activée.' : (ex.message || 'Connexion refusée.'));
      err.classList.remove('masque');
    }
  } finally { b.disabled = false; }
});

/* ---------- mot de passe oublié ----------
   Un e-mail de réinitialisation part vers l'adresse du compte ; le lien
   ramène ici et l'app propose d'en choisir un nouveau. Ne fonctionne que
   pour les adresses qui reçoivent vraiment du courrier. */
$('#btnOubli').addEventListener('click', async () => {
  const saisi = $('#email').value.trim();
  if (!saisi) return toast('Écris d’abord ton numéro ou ton adresse dans le champ du haut.', true);
  /* Abel et Cabo entrent avec leur numéro : il n'y a aucune boîte aux lettres
     derrière, donc aucun e-mail à envoyer. On ne les laisse pas attendre un
     courrier qui n'arrivera jamais — on leur dit à qui s'adresser. Ce test
     passe AVANT celui de la démonstration : c'est le cas le plus fréquent de
     l'atelier, il doit se voir aussi quand on montre l'app.  */
  if (!saisi.includes('@')) return toast(
    'Ton compte marche avec ton numéro, pas avec une adresse. Demande à Edwin ou à Guénolé de te redonner un mot de passe.', true);
  if (MODE_DEMO) return toast('En démonstration, le mot de passe est « demo ».');
  const email = saisi;
  const b = $('#btnOubli'); b.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  b.disabled = false;
  if (error) return toast(error.message, true);
  toast('E-mail envoyé à ' + email + ' — ouvre le lien qu’il contient.');
});

/* Retour depuis le lien de réinitialisation : on force un nouveau mot de passe. */
function brancherRecuperation() {
  if (!sb.auth.onAuthStateChange) return;
  sb.auth.onAuthStateChange((evenement) => {
    if (evenement !== 'PASSWORD_RECOVERY') return;
    const v = modale(`
      <h3 class="ocr-h2">Nouveau mot de passe</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Tu arrives depuis l’e-mail de réinitialisation — choisis ton nouveau mot de passe.</p>
      <label class="ocr-champ"><span class="ocr-label">Nouveau mot de passe</span>
        <input class="ocr-saisie" type="password" id="recNouveau" autocomplete="new-password"></label>
      <label class="ocr-champ"><span class="ocr-label">Confirme-le</span>
        <input class="ocr-saisie" type="password" id="recConfirme" autocomplete="new-password"></label>
      <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" data-ok>Enregistrer et entrer</button>
      <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:8px">Plus tard</button>`);
    v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
    v.querySelector('[data-ok]').addEventListener('click', async e => {
      const m1 = v.querySelector('#recNouveau').value, m2 = v.querySelector('#recConfirme').value;
      if (m1.length < 8) return toast('8 caractères minimum.', true);
      if (m1 !== m2) return toast('Les deux mots de passe ne sont pas identiques.', true);
      e.target.disabled = true;
      const { error } = await sb.auth.updateUser({ password: m1 });
      if (error) { toast(error.message, true); e.target.disabled = false; return; }
      fermerModale(); toast('Mot de passe enregistré ✓');
      await demarrer();
    });
  });
}
