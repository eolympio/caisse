<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCR Brillance — Atelier</title>
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OCR Atelier">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================================
   OCR BRILLANCE — SOCLE COMMUN · ocr-tokens.css
   ----------------------------------------------------------------------------
   Charte de marque 2026 traduite en variables et composants.
   Le site vitrine, l'application client et l'application interne importent
   CE fichier. Une couleur ne se modifie qu'ici.

   Corrections intégrées d'office (revue du 11 août 2026) :
   · --ocr-rouge-texte pour le petit texte (le rouge de marque plafonne à 3,85:1)
   · surfaces surélevées + filet, pour que les cartes tiennent en plein soleil
   · :focus-visible sur tous les éléments interactifs
   · plancher typographique à 12 px
   · quatre rayons au lieu de cinq

   Version 1.0.0 — 11 août 2026
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Manrope:wght@400;600;800&display=swap');

:root {
  /* ── Couleurs de marque ─────────────────────────────────── */
  --ocr-noir:          #0A0A0B;   /* Noir laqué — fond dominant           */
  --ocr-noir-2:        #101012;   /* Fond de section alterné               */
  --ocr-surface:       #16161A;   /* Cartes                                */
  --ocr-surface-haute: #1E1E22;   /* Élevé : champs, survol, feuilles      */
  --ocr-filet:         #232327;   /* Bordures et séparateurs               */

  --ocr-blanc:         #F4F4F5;   /* Blanc pur — 18,0:1                    */
  --ocr-argent:        #9A9CA0;   /* Argent mat — 7,2:1                    */
  --ocr-argent-2:      #6E7075;   /* Légendes — 4,0:1, jamais sous 12 px   */

  --ocr-rouge:         #D6201E;   /* Rouge OCR — aplats, gros titres, UI   */
  --ocr-rouge-clair:   #E5342F;   /* Survol                                */
  --ocr-rouge-texte:   #E8524E;   /* 5,4:1 — le SEUL rouge pour du texte   */
  --ocr-rouge-profond: #7E1113;   /* Fin de dégradé uniquement             */

  --ocr-vert:          #37C26B;   /* Succès — 8,6:1                        */
  --ocr-ambre:         #F5A623;   /* Avertissement — 9,8:1                 */
  --ocr-erreur:        #E8524E;   /* Erreur = rouge texte + icône + libellé*/

  --ocr-grad-rouge:  linear-gradient(180deg, #E5342F 0%, #D6201E 45%, #7E1113 100%);
  --ocr-grad-chrome: linear-gradient(180deg, #FFFFFF 0%, #E3E4E6 38%, #9FA1A4 64%, #C9CACD 100%);
  --ocr-lueur-rouge: radial-gradient(130% 90% at 80% -10%, rgba(214,32,30,.35), transparent 55%);

  /* ── Typographie ────────────────────────────────────────── */
  --ocr-titre: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ocr-texte: 'Manrope',    system-ui, -apple-system, 'Segoe UI', sans-serif;

  --ocr-t-display: 300 clamp(28px, 6vw, 46px)/1.15 var(--ocr-titre);
  --ocr-t-h1:      300 clamp(24px, 5vw, 34px)/1.2  var(--ocr-titre);
  --ocr-t-h2:      500 clamp(18px, 3vw, 22px)/1.3  var(--ocr-titre);
  --ocr-t-h3:      500 16px/1.35 var(--ocr-titre);
  --ocr-t-corps:   400 15px/1.6  var(--ocr-texte);
  --ocr-t-petit:   400 13px/1.5  var(--ocr-texte);
  --ocr-t-mini:    400 12px/1.45 var(--ocr-texte);   /* plancher absolu */

  --ocr-suivi-titre:  .02em;
  --ocr-suivi-label:  .16em;
  --ocr-suivi-signature: .34em;

  /* ── Espacement ─────────────────────────────────────────── */
  --ocr-e1: 4px;  --ocr-e2: 8px;  --ocr-e3: 12px; --ocr-e4: 16px;
  --ocr-e5: 24px; --ocr-e6: 32px; --ocr-e7: 48px; --ocr-e8: 64px; --ocr-e9: 96px;

  /* ── Rayons — quatre valeurs, pas cinq ──────────────────── */
  --ocr-r-s:  4px;    /* boutons          */
  --ocr-r-m:  8px;    /* toutes les cartes*/
  --ocr-r-l:  16px;   /* grands panneaux  */
  --ocr-r-p:  999px;  /* pilules          */

  /* ── Ombres — une seule, sous le bouton primaire ────────── */
  --ocr-ombre-btn: 0 14px 30px -12px rgba(214,32,30,.55);
  --ocr-ombre-feuille: 0 -30px 60px -20px rgba(0,0,0,.7);

  --ocr-transition: .16s cubic-bezier(.4,0,.2,1);

  /* ── Détails d'interface pilotés par le thème ───────────── */
  --ocr-sep:   rgba(244,244,245,.06);   /* filets internes des cartes     */
  --ocr-trace: rgba(244,244,245,.08);   /* piste des barres de progression*/
  --ocr-jauge: rgba(244,244,245,.28);   /* remplissage neutre d'une barre */
}

/* ─────────────────────────────────────────────────────────────
   BASE
   ───────────────────────────────────────────────────────────── */
.ocr, .ocr *, .ocr *::before, .ocr *::after { box-sizing: border-box; }
.ocr {
  background: var(--ocr-noir);
  color: var(--ocr-blanc);
  font: var(--ocr-t-corps);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Accessibilité : un anneau de focus visible partout. */
.ocr :focus-visible {
  outline: 2px solid var(--ocr-rouge-texte);
  outline-offset: 3px;
  border-radius: inherit;
}

@media (prefers-reduced-motion: reduce) {
  .ocr *, .ocr *::before, .ocr *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

/* ─────────────────────────────────────────────────────────────
   TYPOGRAPHIE
   ───────────────────────────────────────────────────────────── */
.ocr-display { font: var(--ocr-t-display); letter-spacing: var(--ocr-suivi-titre); text-transform: uppercase; margin: 0; }
.ocr-h1 { font: var(--ocr-t-h1); letter-spacing: var(--ocr-suivi-titre); text-transform: uppercase; margin: 0; }
.ocr-h2 { font: var(--ocr-t-h2); letter-spacing: var(--ocr-suivi-titre); margin: 0; }
.ocr-h3 { font: var(--ocr-t-h3); margin: 0; }
.ocr-corps  { font: var(--ocr-t-corps); color: var(--ocr-argent); }
.ocr-petit  { font: var(--ocr-t-petit); color: var(--ocr-argent); }
.ocr-mini   { font: var(--ocr-t-mini);  color: var(--ocr-argent-2); }
.ocr-chiffre{ font-variant-numeric: tabular-nums; }
.ocr-chrome {
  background: var(--ocr-grad-chrome); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--ocr-blanc); /* repli si non supporté */
}
/* Casse normale pour les noms longs : les capitales sont réservées
   aux titres courts, aux labels et à la signature. */
.ocr-nom { font-family: var(--ocr-texte); font-weight: 600; text-transform: none; letter-spacing: 0; }

/* Sur-titre rouge avec filet — le motif « Eyebrow » de la charte. */
.ocr-surtitre {
  display: inline-flex; align-items: center; gap: var(--ocr-e3);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase;
  color: var(--ocr-rouge-texte);
}
.ocr-surtitre::before { content: ''; width: 22px; height: 1px; background: var(--ocr-rouge); }

.ocr-signature {
  font-family: var(--ocr-titre); font-weight: 300; font-size: 12px;
  letter-spacing: var(--ocr-suivi-signature); text-transform: uppercase; color: var(--ocr-argent-2);
}
.ocr-etincelle { color: var(--ocr-rouge); }

/* ─────────────────────────────────────────────────────────────
   BOUTONS
   ───────────────────────────────────────────────────────────── */
.ocr-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ocr-e2);
  min-height: 48px;                       /* cible tactile Android */
  padding: 13px 22px; border-radius: var(--ocr-r-s); border: 1px solid transparent;
  font-family: var(--ocr-titre); font-weight: 500; font-size: 14px;
  letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: transform var(--ocr-transition), background var(--ocr-transition), filter var(--ocr-transition);
}
.ocr-btn:hover:not(:disabled) { transform: translateY(-2px); }
.ocr-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.ocr-btn--primaire { background: var(--ocr-grad-rouge); color: #fff; box-shadow: var(--ocr-ombre-btn); }
.ocr-btn--primaire:hover:not(:disabled) { filter: brightness(1.08); }
.ocr-btn--secondaire { background: rgba(244,244,245,.05); color: var(--ocr-blanc); border-color: var(--ocr-filet); }
.ocr-btn--secondaire:hover:not(:disabled) { background: rgba(244,244,245,.09); border-color: rgba(214,32,30,.5); }
.ocr-btn--fantome { background: none; color: var(--ocr-argent); }
.ocr-btn--fantome:hover:not(:disabled) { color: var(--ocr-blanc); }
.ocr-btn--wa { background: #25D366; color: #06351B; }
.ocr-btn--wa:hover:not(:disabled) { filter: brightness(1.06); }
.ocr-btn--bloc { width: 100%; }
.ocr-btn--petit { min-height: 40px; padding: 9px 15px; font-size: 12.5px; }

/* ─────────────────────────────────────────────────────────────
   SURFACES
   Fond surélevé + filet : ni l'un ni l'autre ne suffit sur du noir
   en plein soleil ; ensemble, la lisière se lit sans effort.
   ───────────────────────────────────────────────────────────── */
.ocr-carte {
  background: var(--ocr-surface); border: 1px solid var(--ocr-filet);
  border-radius: var(--ocr-r-m); padding: var(--ocr-e5);
  transition: border-color var(--ocr-transition), transform var(--ocr-transition);
}
.ocr-carte--cliquable { cursor: pointer; }
.ocr-carte--cliquable:hover { transform: translateY(-3px); border-color: rgba(214,32,30,.5); }
.ocr-carte--vedette { border-color: rgba(214,32,30,.55); background:
  linear-gradient(180deg, rgba(214,32,30,.07), transparent 45%), var(--ocr-surface); }
.ocr-carte--panneau { border-radius: var(--ocr-r-l); padding: var(--ocr-e6); }
.ocr-carte--lueur { background: var(--ocr-lueur-rouge), var(--ocr-surface); }

.ocr-separateur { height: 1px; background: var(--ocr-filet); border: 0; margin: var(--ocr-e6) 0; }

/* ─────────────────────────────────────────────────────────────
   CHIPS, PASTILLES, BADGES
   ───────────────────────────────────────────────────────────── */
.ocr-chip {
  display: inline-flex; align-items: center; gap: var(--ocr-e2);
  min-height: 40px; padding: 8px 16px; border-radius: var(--ocr-r-p);
  background: var(--ocr-surface); border: 1px solid var(--ocr-filet);
  color: var(--ocr-argent); font: var(--ocr-t-petit); font-weight: 600;
  cursor: pointer; transition: var(--ocr-transition);
}
.ocr-chip:hover { color: var(--ocr-blanc); border-color: rgba(214,32,30,.45); }
.ocr-chip[aria-pressed="true"], .ocr-chip.est-actif {
  background: var(--ocr-rouge); border-color: var(--ocr-rouge); color: #fff;
}

.ocr-pastille {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 4px 10px; border-radius: var(--ocr-r-p);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase;
}
.ocr-pastille--neutre  { background: var(--ocr-surface-haute); color: var(--ocr-argent); }
.ocr-pastille--marque  { background: rgba(214,32,30,.14); color: var(--ocr-rouge-texte); }
.ocr-pastille--succes  { background: rgba(55,194,107,.14); color: var(--ocr-vert); }
.ocr-pastille--alerte  { background: rgba(245,166,35,.14); color: var(--ocr-ambre); }
.ocr-pastille--erreur  { background: rgba(232,82,78,.14); color: var(--ocr-erreur); }
.ocr-badge-vedette {
  position: absolute; top: 12px; left: 12px;
  background: var(--ocr-rouge); color: #fff; padding: 5px 11px; border-radius: var(--ocr-r-p);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase;
}

/* ─────────────────────────────────────────────────────────────
   CHAMPS
   ───────────────────────────────────────────────────────────── */
.ocr-champ { display: block; margin-bottom: var(--ocr-e4); }
.ocr-label {
  display: block; margin-bottom: var(--ocr-e2);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase; color: var(--ocr-argent);
}
.ocr-saisie {
  width: 100%; min-height: 48px; padding: 13px 15px;
  background: var(--ocr-surface-haute); border: 1px solid var(--ocr-filet);
  border-radius: var(--ocr-r-m); color: var(--ocr-blanc);
  font: var(--ocr-t-corps); outline: none; transition: var(--ocr-transition);
}
.ocr-saisie::placeholder { color: var(--ocr-argent-2); }
.ocr-saisie:focus { border-color: var(--ocr-rouge); }
.ocr-saisie:disabled { opacity: .45; cursor: not-allowed; }
.ocr-saisie[aria-invalid="true"] { border-color: var(--ocr-erreur); }
.ocr-aide  { margin-top: 6px; font: var(--ocr-t-mini); color: var(--ocr-argent-2); }
.ocr-erreur-champ { margin-top: 6px; font: var(--ocr-t-mini); color: var(--ocr-erreur);
  display: flex; align-items: center; gap: 6px; }

/* ─────────────────────────────────────────────────────────────
   MESSAGES D'ÉTAT — couleur + icône + libellé, jamais la couleur seule
   ───────────────────────────────────────────────────────────── */
.ocr-message {
  display: flex; gap: var(--ocr-e3); align-items: flex-start;
  padding: var(--ocr-e3) var(--ocr-e4); border-radius: var(--ocr-r-m);
  border: 1px solid var(--ocr-filet); background: var(--ocr-surface);
  font: var(--ocr-t-petit); color: var(--ocr-argent);
}
.ocr-message--succes { border-color: rgba(55,194,107,.42); background: rgba(55,194,107,.07); }
.ocr-message--alerte { border-color: rgba(245,166,35,.42); background: rgba(245,166,35,.07); }
.ocr-message--erreur { border-color: rgba(232,82,78,.45);  background: rgba(232,82,78,.07); }
.ocr-message strong  { color: var(--ocr-blanc); font-family: var(--ocr-titre); font-weight: 500; }

/* ─────────────────────────────────────────────────────────────
   TABLEAUX
   ───────────────────────────────────────────────────────────── */
.ocr-tableau { width: 100%; border-collapse: collapse; font: var(--ocr-t-petit); }
.ocr-tableau th {
  text-align: left; padding: 0 var(--ocr-e3) var(--ocr-e3);
  border-bottom: 1px solid var(--ocr-filet); white-space: nowrap;
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase; color: var(--ocr-argent);
}
.ocr-tableau td { padding: var(--ocr-e3); border-bottom: 1px solid rgba(244,244,245,.06); }
.ocr-tableau tr:last-child td { border-bottom: 0; }
.ocr-tableau .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ocr-tableau-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ocr-tableau-defile > .ocr-tableau { min-width: 680px; }
.ocr-tableau .fort { color: var(--ocr-blanc); font-weight: 600; }

/* ─────────────────────────────────────────────────────────────
   MARQUE
   ───────────────────────────────────────────────────────────── */
.ocr-embleme {
  width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(120% 120% at 50% 0%, #1d1d20, #0a0a0b);
  border: 1px solid rgba(244,244,245,.14);
}
.ocr-embleme img { width: 74%; height: auto; display: block; }
.ocr-marque { display: flex; align-items: center; gap: var(--ocr-e3); }
.ocr-marque-nom {
  font-family: var(--ocr-titre); font-weight: 500; font-size: 15px;
  letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--ocr-blanc);
}
.ocr-marque-baseline {
  font-family: var(--ocr-titre); font-weight: 300; font-size: 12px;
  letter-spacing: .22em; text-transform: uppercase; color: var(--ocr-rouge-texte); margin-top: 3px;
}

/* Lignes de vitesse — motif 2 de la charte */
.ocr-vitesse { display: flex; flex-direction: column; gap: 5px; }
.ocr-vitesse span {
  height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--ocr-rouge));
}
.ocr-vitesse span:nth-child(1) { width: 100%; }
.ocr-vitesse span:nth-child(2) { width: 72%; }
.ocr-vitesse span:nth-child(3) { width: 44%; }

/* ─────────────────────────────────────────────────────────────
   MISE EN PAGE
   ───────────────────────────────────────────────────────────── */
.ocr-contenu { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 var(--ocr-e5); }
.ocr-section { padding: var(--ocr-e9) 0; }
.ocr-grille { display: grid; gap: var(--ocr-e4); }
.ocr-grille--2 { grid-template-columns: repeat(2, 1fr); }
.ocr-grille--3 { grid-template-columns: repeat(3, 1fr); }
.ocr-grille--4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .ocr-grille--3, .ocr-grille--4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .ocr-grille--2, .ocr-grille--3, .ocr-grille--4 { grid-template-columns: 1fr; }
  .ocr-section { padding: var(--ocr-e7) 0; }
  .ocr-contenu { padding: 0 var(--ocr-e4); }
}

/* ─────────────────────────────────────────────────────────────
   MOUVEMENT & RELIEF — partagé par toutes les surfaces
   Discret, rapide, et respecte prefers-reduced-motion.
   ───────────────────────────────────────────────────────────── */
.ocr-btn--primaire {
  background: linear-gradient(180deg, #E5342F, #C21A18);
  box-shadow: 0 6px 18px rgba(214,32,30,.26), inset 0 1px 0 rgba(255,255,255,.14);
}
.ocr-btn--primaire:hover { background: linear-gradient(180deg, #EC4540, #D6201E); }
.ocr-btn:active { transform: scale(.97); }
.ocr-chip[aria-pressed="true"] { box-shadow: 0 4px 14px rgba(214,32,30,.3); }

.voile { animation: ocrVoile .16s ease-out; }
.boite { animation: ocrBoite .22s cubic-bezier(.2,.9,.3,1.15); }
.toast { animation: ocrToast .28s cubic-bezier(.2,.9,.3,1.3); }
@keyframes ocrVoile { from { opacity: 0; } }
@keyframes ocrBoite { from { opacity: 0; transform: scale(.94) translateY(10px); } }
@keyframes ocrToast { from { opacity: 0; transform: translateY(12px); } }

@media (hover: hover) {
  .ocr-carte { transition: border-color .2s ease, transform .2s ease; }
  .fiche:hover, .presta:hover { transform: translateY(-1px); }
}
* { scrollbar-width: thin; scrollbar-color: #2A2A2F transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: #2A2A2F; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) {
  .voile, .boite, .toast { animation: none; }
  .ocr-btn:active { transform: none; }
  .fiche:hover, .presta:hover { transform: none; }
}

/* ─────────────────────────────────────────────────────────────
   MODE CLAIR — appliqué avec la classe .theme-clair sur .ocr.
   Les noms de variables ne changent pas : --ocr-noir reste
   « le fond » et --ocr-blanc « le texte », quel que soit le thème.
   Contrastes vérifiés : texte principal 16,9:1, secondaire 7,3:1,
   rouge texte 5,9:1 sur fond clair.
   ───────────────────────────────────────────────────────────── */
.ocr.theme-clair {
  --ocr-noir:          #F5F5F6;
  --ocr-noir-2:        #ECECEE;
  --ocr-surface:       #FFFFFF;
  --ocr-surface-haute: #EFEFF1;
  --ocr-filet:         #DCDCE0;

  --ocr-blanc:         #141417;
  --ocr-argent:        #505257;
  --ocr-argent-2:      #6E7075;

  --ocr-rouge-texte:   #BB1F1D;
  --ocr-vert:          #157A40;
  --ocr-ambre:         #9C6200;
  --ocr-erreur:        #BB1F1D;

  --ocr-grad-chrome: linear-gradient(180deg, #3E3F43 0%, #6E7075 42%, #2E2F33 68%, #55575C 100%);
  --ocr-lueur-rouge: radial-gradient(130% 90% at 80% -10%, rgba(214,32,30,.12), transparent 55%);
  --ocr-ombre-feuille: 0 -30px 60px -20px rgba(0,0,0,.16);

  --ocr-sep:   rgba(10,10,11,.08);
  --ocr-trace: rgba(10,10,11,.09);
  --ocr-jauge: rgba(10,10,11,.30);
}


/* ---- propre à la caisse ---- */
html,body{margin:0;padding:0;min-height:100dvh}
body{padding-bottom:env(safe-area-inset-bottom)}
.masque{display:none!important}

#connexion{min-height:100dvh;display:grid;place-items:center;padding:var(--ocr-e5)}
.conn-carte{width:100%;max-width:380px}
.conn-logo{width:100%;max-width:260px;display:block;margin:0 auto var(--ocr-e5)}

.appli{min-height:100dvh;display:flex;flex-direction:column}
.barre{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ocr-filet);
  padding:var(--ocr-e3) calc(var(--ocr-e4) + env(safe-area-inset-right)) var(--ocr-e3) calc(var(--ocr-e4) + env(safe-area-inset-left));
  padding-top:calc(var(--ocr-e3) + env(safe-area-inset-top));
  display:flex;align-items:center;gap:var(--ocr-e3)}
/* Épinglée sur l'écran d'accueil, l'app passe SOUS l'heure et la batterie de
   l'iPhone (plein écran). La barre s'écarte de cette zone, sinon les boutons
   du haut sont inatteignables. En plein écran (classe plein-ecran posée par
   JS), on garantit un minimum de 54px même si l'iPhone ne fournit pas la
   taille de son encoche. */
#bandeau .bandeau:first-child{padding-top:calc(10px + env(safe-area-inset-top))}

   On inverse donc le sens : le client paie d'avance, une seule fois.
   Aucune relance possible — l'argent est déjà encaissé.
   Adossés au Signature, jamais à l'Express.
   ───────────────────────────────────────────────────────────── */
const CARNETS = [
  { id:'carnet3',  nom:'Carnet 3 lavages',  lavages:3,  validiteMois:2, populaire:false,
    prix:{ petite:16000, berline:21000, grandsuv:26000, camionnette:null, moto:null } },
  { id:'carnet6',  nom:'Carnet 6 lavages',  lavages:6,  validiteMois:4, populaire:true,
    prix:{ petite:30000, berline:40000, grandsuv:50000, camionnette:null, moto:null } },
  { id:'carnet12', nom:'Carnet 12 lavages', lavages:12, validiteMois:8, populaire:false,
    prix:{ petite:57000, berline:76000, grandsuv:95000, camionnette:null, moto:null } },
];

const CARNET_CONFIG = {
  prestation:'signature',
  accroche:'Payez une fois. Roulez propre toute l’année.',
  graceMois: 1,               // mois de tolérance après expiration — on ne pénalise jamais un client
  alerteSolde: 1,             // relance WhatsApp quand il reste ce nombre de lavages
  remiseGrossesPrestations: 0.10,
  avantages: [
    'Créneau prioritaire — réservé la veille, aucune attente',
    'Carnet d’entretien du véhicule, photos avant/après à chaque passage',
    '−10 % sur le Deep Cleaning, le polissage et la protection céramique',
    'Transmissible — le carnet peut servir à un proche ou être offert',
  ],
};

const carnet = id => CARNETS.find(c => c.id === id) || null;

/** Prix du carnet pour un gabarit. null = non proposé. */
function prixCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId);
  if (!c || !gabaritId) return null;
  const v = c.prix[gabaritId];
  return v == null ? null : v;
}
/** Les mêmes lavages payés à l'unité. */
function prixCarnetUnite(carnetId, gabaritId) {
  const c = carnet(carnetId);
  const p = prix(CARNET_CONFIG.prestation, gabaritId);
  return (!c || p == null) ? null : p * c.lavages;
}
/** Économie en FCFA et en %. */
function economieCarnet(carnetId, gabaritId) {
  const u = prixCarnetUnite(carnetId, gabaritId), c = prixCarnet(carnetId, gabaritId);
  if (u == null || c == null) return null;
  return { montant: u - c, pct: Math.round((1 - c / u) * 100), parLavage: Math.round(c / carnet(carnetId).lavages) };
}
/** Recette mensuelle reconnue par carnet actif (prix étalé sur sa validité). */
function recetteMensuelleCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId), p = prixCarnet(carnetId, gabaritId);
  return p == null ? null : p / c.validiteMois;
}
/** Heures-baie consommées par mois par un porteur de carnet. */
function heuresCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId);
  const d = duree(CARNET_CONFIG.prestation, gabaritId);
  return d == null ? null : (c.lavages / c.validiteMois) * (d + CONFIG.battementMin) / 60;
}
/** Combien de porteurs actifs pour couvrir un montant de charges fixes. */
function porteursPourCouvrir(chargesFixes, carnetId, gabaritId) {
  const r = recetteMensuelleCarnet(carnetId, gabaritId);
  return r ? Math.ceil(chargesFixes / r) : null;
}

/* ─────────────────────────────────────────────────────────────
   5 · EXPLOITATION
   ───────────────────────────────────────────────────────────── */
const CONFIG = {
  ouvertureMin:  9 * 60,   // 09:00
  fermetureMin: 21 * 60,   // 21:00 — le dernier lavage doit FINIR à 21 h
  pasCreneau:   30,        // grille de réservation, en minutes
  battementMin: 15,        // sortie/entrée véhicule entre deux prestations
  baies:        2,         // 2 véhicules lavés en simultané
  acomptePct:   0.20,      // 20 % à la réservation
  acompteArrondi: 100,     // arrondi de l'acompte, en FCFA
  fideliteSeuil: 10,       // 10 passages = le 10ᵉ offert (niveau Signature)
  fideliteValiditeMois: 12,
  seuilRemiseAlerte: 0.10, // au-delà, la clôture de caisse lève une alerte
};

/* ─────────────────────────────────────────────────────────────
   6 · OUTILS
   ───────────────────────────────────────────────────────────── */
const gabarit    = id => GABARITS.find(g => g.id === id) || null;
const prestation = id => PRESTATIONS.find(p => p.id === id) || null;
const option     = id => OPTIONS.find(o => o.id === id) || null;
const service    = id => SERVICES.find(s => s.id === id) || null;

/** Montant en FCFA, format « 12 500 F ». */
function fcfa(n) {
  if (n == null) return 'Sur devis';
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F';
}

/** Prix exact d'une prestation pour un gabarit. null = sur devis. */
function prix(prestationId, gabaritId) {
  const p = prestation(prestationId);
  if (!p || !gabaritId) return null;
  const v = p.prix[gabaritId];
  return v == null ? null : v;
}
const prixTexte = (pid, gid) => fcfa(prix(pid, gid));

/** Prix d'appel « dès X » — le plus bas publié. null si tout est sur devis. */
function prixDes(prestationId) {
  const p = prestation(prestationId);
  if (!p) return null;
  const vals = Object.values(p.prix).filter(v => v != null);
  return vals.length ? Math.min.apply(null, vals) : null;
}

/** Durée en minutes pour un gabarit. */
function duree(prestationId, gabaritId) {
  const p = prestation(prestationId);
  if (!p) return null;
  const v = p.durees[gabaritId];
  return v == null ? null : v;
}

/** « 1 h 30 », « 45 min ». */
function dureeTexte(min) {
  if (min == null) return '';
  if (min >= 1440) return Math.round(min / 1440) + ' j';
  if (min >= 60) { const h = Math.floor(min / 60), m = min % 60; return m ? h + ' h ' + m : h + ' h'; }
  return min + ' min';
}

/** Fourchette de durée affichée avant le choix du gabarit. */
function dureeFourchette(prestationId) {
  const p = prestation(prestationId);
  if (!p) return '';
  if (p.dureeEstimee) return p.dureeEstimee;
  const d = Object.values(p.durees).filter(v => v != null);
  if (!d.length) return '';
  const lo = Math.min.apply(null, d), hi = Math.max.apply(null, d);
  return lo === hi ? dureeTexte(lo) : dureeTexte(lo) + '–' + dureeTexte(hi);
}

const min2hm = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const hm2min = s => { const a = s.split(':').map(Number); return a[0] * 60 + a[1]; };

/**
 * Heures de DÉBUT possibles : le lavage doit être TERMINÉ à la fermeture.
 * Le battement est appliqué à l'occupation de la baie, pas au dernier créneau
 * (le rangement peut déborder après 21 h).
 */
function creneaux(prestationId, gabaritId) {
  const d = duree(prestationId, gabaritId);
  if (d == null) return [];
  const out = [];
  for (let m = CONFIG.ouvertureMin; m + d <= CONFIG.fermetureMin; m += CONFIG.pasCreneau) out.push(min2hm(m));
  return out;
}

/** Occupation réelle d'une baie : fin du lavage + battement. */
function occupation(debutHm, prestationId, gabaritId) {
  const d = duree(prestationId, gabaritId);
  if (d == null) return null;
  const debut = hm2min(debutHm);
  return { debut: debutHm, fin: min2hm(debut + d), baieLibre: min2hm(debut + d + CONFIG.battementMin) };
}

/** Options proposables : ni déjà comprises, ni réservées à une autre prestation. */
function optionsPour(prestationId) {
  const p = prestation(prestationId);
  if (!p) return [];
  return OPTIONS
    .filter(o => !o.reservee || o.reservee.indexOf(prestationId) !== -1)
    .map(o => ({ ...o, comprise: p.inclus.indexOf(o.id) !== -1 }));
}

/** Total d'une commande. devis>0 ⇒ un montant manuel est requis. */
function total(prestationId, gabaritId, optionIds, avecValet, montantManuel) {
  const p = prestation(prestationId);
  const base = prix(prestationId, gabaritId);
  let sousTotal = base == null ? 0 : base;
  let devis = base == null ? 1 : 0;

  (optionIds || []).forEach(id => {
    const o = option(id);
    if (!o) return;
    if (p && p.inclus.indexOf(id) !== -1) return;      // déjà comprise : jamais refacturée
    sousTotal += o.prix;
  });

  if (avecValet) sousTotal += service('valet').prix;
  sousTotal += Math.max(0, Number(montantManuel) || 0);

  return { total: sousTotal, devis: devis, base: base };
}

/** Acompte : 20 % arrondi, ou 100 % si Pickup & Retour. */
function acompte(montantTotal, avecValet) {
  if (montantTotal == null || montantTotal <= 0) return 0;
  if (avecValet) return montantTotal;
  const a = montantTotal * CONFIG.acomptePct;
  return Math.round(a / CONFIG.acompteArrondi) * CONFIG.acompteArrondi;
}

/**
 * Référence unique — OCR-2608-0042.
 * Année/mois + numéro séquentiel du mois, fourni par la base de données.
 * Lisible, triable, dictable au téléphone. C'est ELLE qui relie la
 * réservation, le paiement KKiapay, le véhicule à l'atelier et la clôture.
 */
function reference(annee, mois, sequence) {
  const aa = String(annee).slice(-2);
  const mm = String(mois).padStart(2, '0');
  const nn = String(sequence).padStart(4, '0');
  return 'OCR-' + aa + mm + '-' + nn;
}
function lireReference(ref) {
  const m = /^OCR-(\d{2})(\d{2})-(\d{4})$/.exec(String(ref || '').trim().toUpperCase());
  return m ? { annee: 2000 + +m[1], mois: +m[2], sequence: +m[3] } : null;
}

/* ─────────────────────────────────────────────────────────────
   IMMATRICULATION (Bénin)
   Voiture : 2 lettres + 4 chiffres              — CB5916
   Moto    : 1 chiffre + 2 lettres + 4 chiffres  — 2FB9408

   Le champ n'est JAMAIS obligatoire : on peut compléter à l'atelier,
   véhicule devant nous. Mais dès qu'une plaque est saisie, elle est
   ramenée à sa forme canonique (majuscules, sans espace ni tiret) :
   c'est ce qui permet de rattacher tout seul un véhicule à son client
   au passage suivant. « cb 5916 », « CB-5916 » et « CB5916 » doivent
   désigner le MÊME véhicule, sinon on crée des doublons et la fidélité
   se disperse.

   Les formats sont VÉRIFIÉS mais pas IMPOSÉS : une plaque étrangère,
   diplomatique ou ancienne reste acceptée, simplement signalée. Refuser
   un vrai véhicule coûterait plus cher qu'une saisie inhabituelle.
   ───────────────────────────────────────────────────────────── */
const PLAQUE_VOITURE = /^[A-Z]{2}[0-9]{4}$/;
const PLAQUE_MOTO    = /^[0-9][A-Z]{2}[0-9]{4}$/;
const PLAQUE_EXEMPLES = { voiture: 'CB5916', moto: '2FB9408' };

/** Forme canonique d'une plaque : majuscules, sans espace ni ponctuation. */
function plaque(v) {
  return String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, '');
}

/**
 * État d'une plaque saisie : forme propre, type reconnu, format connu ou non.
 * `gabarit` est facultatif — s'il est fourni, on signale une plaque moto sur
 * un gabarit voiture (et l'inverse), qui est presque toujours une erreur.
 */
function plaqueEtat(v, gabarit) {
  const cle = plaque(v);
  if (!cle) return { cle: '', vide: true, type: null, ok: true, accord: true, aide: '' };
  const type = PLAQUE_VOITURE.test(cle) ? 'voiture' : PLAQUE_MOTO.test(cle) ? 'moto' : null;
  if (!type) return { cle, vide: false, type: null, ok: false, accord: true,
    aide: 'Format inhabituel — voiture : ' + PLAQUE_EXEMPLES.voiture + ' · moto : ' + PLAQUE_EXEMPLES.moto };
  // Cohérence avec le gabarit choisi, quand on le connaît.
  const accord = gabarit ? (gabarit === 'moto' ? type === 'moto' : type === 'voiture') : true;
  return { cle, vide: false, type, ok: true, accord,
    aide: accord ? (type === 'moto' ? '✓ Plaque moto' : '✓ Plaque voiture')
                 : (type === 'moto' ? 'Plaque au format moto — vérifie le type de véhicule'
                                    : 'Plaque au format voiture — vérifie le type de véhicule') };
}

/** Lien WhatsApp pré-rempli. */
function lienWhatsApp(message) {
  return 'https://wa.me/' + MARQUE.whatsapp + (message ? '?text=' + encodeURIComponent(message) : '');
}

/* ─────────────────────────────────────────────────────────────
   7 · EXPORT
   ───────────────────────────────────────────────────────────── */
const API = {
  VERSION, MAJ,
  MARQUE, GABARITS, PRESTATIONS, OPTIONS, SERVICES, CARNETS, CARNET_CONFIG, CONFIG,
  gabarit, prestation, option, service,
  fcfa, prix, prixTexte, prixDes,
  duree, dureeTexte, dureeFourchette,
  min2hm, hm2min, creneaux, occupation,
  optionsPour, total, acompte,
  carnet, prixCarnet, prixCarnetUnite, economieCarnet,
  recetteMensuelleCarnet, heuresCarnet, porteursPourCouvrir,
  reference, lireReference, lienWhatsApp,
  plaque, plaqueEtat, PLAQUE_EXEMPLES,
};

if (typeof module !== 'undefined' && module.exports) module.exports = API;
root.OCR = API;

})(typeof window !== 'undefined' ? window : globalThis);

      if (!p || p.annule) return;

      const o = g[k] || (g[k] = { journee: p.journee, prestation: l.code, nombre: 0, ca: 0, minutes_baie: 0 });
      o.nombre++; o.ca += l.prix; o.minutes_baie += (l.duree_min || 0) + 15;
    });
    return Object.values(g).map(o => ({ ...o,

  const tempsLavage = () => {
    const g = {};
    const m = t => { const [h, mi] = String(t).split(':').map(Number); return h * 60 + mi; };
    D.passages.filter(p => !p.annule && p.heure_debut && p.heure_fin).forEach(p => {
      const l = D.passage_lignes.find(x => x.passage_id === p.id && x.type === 'prestation');
      if (!l) return;
      const min = m(p.heure_fin) - m(p.heure_debut);
      if (min <= 0) return;
      const k = p.journee + '|' + l.code + '|' + p.gabarit;
      const o = g[k] || (g[k] = { journee: p.journee, prestation: l.code, gabarit: p.gabarit, nombre: 0, somme: 0, minutes_max: 0 });
      o.nombre++; o.somme += min; o.minutes_max = Math.max(o.minutes_max, min);
    });
    return Object.values(g).map(o => ({ journee: o.journee, prestation: o.prestation, gabarit: o.gabarit,

      const o = g[c.id] || (g[c.id] = { client_id: c.id, nom: c.nom, telephone: c.telephone,

  // Comparaison : numérique si possible, texte sinon (les dates AAAA-MM-JJ trient bien en texte).
  const cmp = (a, b) => {
    const x = Number(a), y = Number(b);
    return !isNaN(x) && !isNaN(y) && String(a).trim() !== '' ? x - y : String(a).localeCompare(String(b));
  };

  function requete(table) {
    const f = [];              // prédicats
    let borne = null, tri = null;
    const motif = m => new RegExp('^' + String(m).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
                                    .replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i');
    const src = () => {
      if (table === 'v_journee_totaux')
        return [...new Set(D.passages.map(p => p.journee))].sort().map(totaux).filter(Boolean);
      if (table === 'v_mix_prestations') return mixPrestations();
      if (table === 'v_temps_lavage')    return tempsLavage();
      if (table === 'v_fidelite')        return fidelite();
      if (table === 'v_clients_stats')   return clientsStats();
      if (table === 'passages')          return D.passages.map(lier);
      if (table === 'vehicules')         return D.vehicules.map(v =>
        ({ ...v, clients: D.clients.find(c => c.id === v.client_id) || null }));
      if (table === 'clients')           return D.clients.map(c =>
        ({ ...c, entreprises: D.entreprises.find(e => e.id === c.entreprise_id) || null }));
      // Comme en base : reservations.vehicule_id pointe vers vehicules, la marque/
      // modèle/plaque ne sont pas dupliqués sur la réservation elle-même.
      if (table === 'reservations')      return D.reservations.map(r =>
        ({ ...r, vehicules: D.vehicules.find(v => v.id === r.vehicule_id) || null }));
      return D[table] || [];
    };
    const filtrer = () => {
      let r = src().filter(x => f.every(p => p(x)));
      if (tri) r = [...r].sort((a, b) => (tri[1] ? 1 : -1) * cmp(a[tri[0]], b[tri[0]]));
      return borne == null ? r : r.slice(0, borne);
    };
    const api = {
      select() { return api; },
      order(k, o) { tri = [k, !o || o.ascending !== false]; return api; },
      limit(n) { borne = n; return api; },
      eq(k, v) { f.push(r => String(r[k]) === String(v)); return api; },
      not(k, op, v) { if (op === 'is' && v === null) f.push(r => r[k] != null); return api; },
      gte(k, v) { f.push(r => String(r[k]) >= String(v)); return api; },
      lte(k, v) { f.push(r => String(r[k]) <= String(v)); return api; },
      lt(k, v) { f.push(r => r[k] != null && cmp(r[k], v) < 0); return api; },
      gt(k, v) { f.push(r => r[k] != null && cmp(r[k], v) > 0); return api; },
      in(k, arr) { const s = (arr || []).map(String); f.push(r => s.includes(String(r[k]))); return api; },
      insert(rows) {
        const arr = (Array.isArray(rows) ? rows : [rows]).map(r => {
          const base = { id: uid(), cree_le: new Date().toISOString() };
          if (table === 'journal') base.quand = base.cree_le;
          if (table === 'reservations' || table === 'carnets') base.reference = ref();
          if (table === 'entreprises') base.maj_le = base.cree_le;
          return { ...base, ...r };
        });
        arr.forEach(r => (D[table] || (D[table] = [])).push(r));
        return {
          select() {
            return {
              single: () => Promise.resolve({ data: arr[0], error: null }),
              maybeSingle: () => Promise.resolve({ data: arr[0], error: null }),
              then: res => Promise.resolve({ data: arr, error: null }).then(res),
            };
          },
          then(res) { return Promise.resolve({ data: null, error: null }).then(res); },
        };
      },
      ilike(k, m) { const re = motif(m); f.push(r => re.test(String(r[k] == null ? '' : r[k]))); return api; },
      or(expr) {
        const tests = String(expr).split(/,(?=[a-z_]+\.)/).map(part => {
          const [k, op, ...reste] = part.split('.');
          const val = reste.join('.').replace(/^"|"$/g, '');
          if (op === 'ilike') { const re = motif(val); return r => re.test(String(r[k] == null ? '' : r[k])); }
          return r => String(r[k]) === val;
        });
        f.push(r => tests.some(t => t(r)));
        return api;
      },
      maybeSingle() { return Promise.resolve({ data: filtrer()[0] || null, error: null }); },
      single()      { return Promise.resolve({ data: filtrer()[0] || null, error: null }); },
      update(patch) {
        return { eq(k, v) {
          (D[table] || []).filter(r => String(r[k]) === String(v)).forEach(r => Object.assign(r, patch));
          return Promise.resolve({ data: null, error: null });
        } };
      },
      delete() {
        return { eq(k, v) {
          const t = D[table] || [];
          for (let i = t.length - 1; i >= 0; i--) if (String(t[i][k]) === String(v)) t.splice(i, 1);
          return Promise.resolve({ data: null, error: null });
        } };
      },
      upsert(rows) {
        rows.forEach(r => {
          const ex = D[table].find(x => x.journee === r.journee && x.cle === r.cle);
          if (ex) Object.assign(ex, r); else D[table].push({ id: uid(), traitee: false, ...r });
        });
        return Promise.resolve({ data: null, error: null });
      },
      then(res) { return Promise.resolve({ data: filtrer(), error: null }).then(res); },
    };
    return api;
  }

  const RPC = {
    ocr_reinitialiser_code_client(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');

    ocr_lier_employe(a) {

    ocr_regler_remise_entreprise(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!['direction', 'comptable'].includes(emp.role))
        throw new Error('Seuls la direction et le comptable fixent une remise partenaire');
      const e = D.entreprises.find(x => x.id === a.p_entreprise);
      if (!e) throw new Error('Entreprise introuvable');
      if (!(a.p_pct >= 0 && a.p_pct <= 100)) throw new Error('Le pourcentage doit être entre 0 et 100');
      e.remise_pct = a.p_pct;
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Remise partenaire ' + e.nom + ' fixée à ' + a.p_pct + ' %', entite: 'entreprise' });
      return [];
    },
    ocr_avancer_passage(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      const p = D.passages.find(x => x.id === a.p_passage);
      if (!p) throw new Error('Véhicule introuvable');
      if (p.annule) throw new Error('Ce passage est annulé');
      const j = D.journees.find(x => x.date === p.journee);
      if (j && j.statut !== 'ouverte') throw new Error('Journée clôturée : modification impossible');
      const h = new Date().toTimeString().slice(0, 8);
      if (a.p_vers === 'en_cours' && p.statut_atelier === 'attente') {
        p.statut_atelier = 'en_cours'; p.heure_debut = p.heure_debut || h;
      } else if (a.p_vers === 'pret' && p.statut_atelier === 'en_cours') {
        p.statut_atelier = 'pret'; p.heure_fin = p.heure_fin || h;
      } else if (a.p_vers === 'livre' && ['pret', 'en_cours'].includes(p.statut_atelier)) {
        p.statut_atelier = 'livre'; p.heure_fin = p.heure_fin || h; p.heure_livraison = h;
      } else throw new Error('Enchaînement impossible : ' + p.statut_atelier + ' → ' + a.p_vers);
      return [];
    },
    ocr_changer_photo(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      const cible = a.p_employe ? D.employes.find(e => e.id === a.p_employe) : emp;
      if (!cible) throw new Error('Employé inconnu');
      if (cible.id !== emp.id && !['direction', 'comptable'].includes(emp.role))
        throw new Error('Seuls la direction et le comptable peuvent changer la photo d’un autre employé');
      cible.photo = a.p_photo || null;
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: 'Photo de profil mise à jour', entite: 'employe' });
      return [];
    },
    ocr_enregistrer_passage(a) {
      const j = D.journees.find(x => x.date === jourCourant);
      if (j && j.statut !== 'ouverte') throw new Error('Journée ' + jourCourant + ' clôturée : modification impossible');
      const lignes = a.p_lignes || [];
      if (!lignes.length) throw new Error('Aucune prestation sélectionnée');
      let cl = D.clients.find(c => c.telephone && c.telephone === (a.p_telephone || '').trim());
      if (!cl) { cl = { id: uid(), nom: a.p_client_nom || 'Client de passage', telephone: (a.p_telephone || '').trim() || null }; D.clients.push(cl); }
      // Plaque : même règle qu'en base (ocr_plaque_cle) — on compare et on
      // stocke la forme canonique, sinon « cb 5916 » créerait un doublon.
      const plaque = OCR.plaque(a.p_immat);
      let ve = plaque ? D.vehicules.find(v => v.client_id === cl.id && OCR.plaque(v.immatriculation) === plaque) : null;
      if (!ve) { ve = { id: uid(), client_id: cl.id, gabarit: a.p_gabarit, marque: a.p_marque, modele: a.p_modele, immatriculation: plaque || null }; D.vehicules.push(ve); }
      const brut = lignes.reduce((s, l) => s + l.prix, 0);
      const remise = Math.min(Math.max(0, a.p_remise || 0), brut);
      const id = uid(), r = ref();
      D.passages.push({ id, reference: r, journee: jourCourant, client_id: cl.id, vehicule_id: ve.id,
        gabarit: a.p_gabarit, heure_arrivee: new Date().toTimeString().slice(0, 8),
        heure_debut: null, heure_fin: null,
        montant_brut: brut, remise, montant_total: brut - remise,
        statut_atelier: 'attente', statut_paiement: 'impaye', mode_paiement: null, equipe: a.p_equipe || [] });
      lignes.forEach(l => D.passage_lignes.push({ id: uid(), passage_id: id, ...l }));
      if (a.p_reservation) {
        const resa = D.reservations.find(x => x.reference === String(a.p_reservation).toUpperCase().trim());
        if (resa) resa.statut = 'honoree';
      }
      return [{ reference: r, id, montant_total: brut - remise }];
    },
    ocr_encaisser(a) {
      const p = D.passages.find(x => x.id === a.p_passage);
      if (!p) throw new Error('Véhicule introuvable');
      const motif = String(a.p_motif || '').trim();
      if (a.p_mode === 'especes' && !motif)
        throw new Error('Les espèces sont exceptionnelles : le motif est obligatoire');
      p.statut_paiement = 'paye'; p.mode_paiement = a.p_mode;
      D.paiements.push({ id: uid(), reference: p.reference, montant: p.montant_total, mode: a.p_mode,
        transaction_id: a.p_transaction || null, journee: p.journee, passage_id: p.id });
      if (a.p_mode === 'especes') {
        D.anomalies.push({ id: uid(), journee: p.journee, cle: 'depot-' + p.id, gravite: 'serieux',
          titre: 'Espèces à déposer sur le compte MTN',
          detail: p.reference + ' · ' + p.montant_total + ' F en espèces — motif : ' + motif +
                  '. Dépôt à faire sur le 01 69 40 85 84 (compte KKiapay), puis justifier ici.',
          passage_id: p.id, traitee: false });
      }
      return [{ montant: p.montant_total, mode: a.p_mode }];
    },
    ocr_basculer_baie(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!['manager', 'comptable', 'direction'].includes(emp.role))
        throw new Error('Seuls le manager, le comptable et la direction gèrent les baies');
      if (!String(a.p_motif || '').trim()) throw new Error('Le motif est obligatoire');
      const b = D.baies.find(x => x.id === String(a.p_baie || '').toUpperCase().trim());
      if (!b) throw new Error('Baie inconnue');
      b.active = !!a.p_active; b.motif = String(a.p_motif).trim();
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: b.nom + (b.active ? ' réactivée' : ' mise en pause') + ' — ' + b.motif, entite: 'baie' });
      return [{ baie: b.id, active: b.active }];
    },
    ocr_pointer(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!['arrivee', 'depart'].includes(a.p_sens)) throw new Error('Sens inconnu');
      const cible = a.p_employe ? D.employes.find(e => e.id === a.p_employe) : emp;
      if (!cible) throw new Error('Employé inconnu');
      if (cible.id !== emp.id && !['manager', 'comptable', 'direction'].includes(emp.role))
        throw new Error('Seuls le manager, le comptable et la direction pointent pour un employé');
      const jour = a.p_jour || jourCourant;
      const heure = a.p_heure ? String(a.p_heure).slice(0, 8) : new Date().toTimeString().slice(0, 8);
      let pt = D.pointages.find(x => x.employe_id === cible.id && x.jour === jour);
      if (!pt) { pt = { id: uid(), employe_id: cible.id, jour, arrivee: null, depart: null }; D.pointages.push(pt); }
      if (a.p_sens === 'arrivee') {
        if (!pt.arrivee) { pt.arrivee = heure; pt.arrivee_hors_ligne = !!a.p_hors_ligne; }
        pt.arrivee_par = emp.id;
      } else {
        pt.depart = heure; pt.depart_par = emp.id; pt.depart_hors_ligne = !!a.p_hors_ligne;
      }
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: cible.nom + (a.p_sens === 'arrivee' ? ' est arrivé à ' : ' est parti à ') + heure.slice(0, 5) +
              (cible.id !== emp.id ? ' — pointé par ' + emp.nom : '') +
              (a.p_hors_ligne ? ' (hors ligne)' : ''), entite: 'pointage' });
      return [{ jour_pointe: pt.jour, heure_arrivee: pt.arrivee, heure_depart: pt.depart }];
    },
    ocr_pause(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!['debut', 'fin'].includes(a.p_sens)) throw new Error('Sens inconnu');
      const cible = a.p_employe ? D.employes.find(e => e.id === a.p_employe) : emp;
      if (!cible) throw new Error('Employé inconnu');
      if (cible.id !== emp.id && !['manager', 'comptable', 'direction'].includes(emp.role))
        throw new Error('Seuls le manager, le comptable et la direction pointent pour un employé');
      const jour = a.p_jour || jourCourant;
      const heure = a.p_heure ? String(a.p_heure).slice(0, 8) : new Date().toTimeString().slice(0, 8);
      const pt = D.pointages.find(x => x.employe_id === cible.id && x.jour === jour);
      if (!pt || !pt.arrivee) throw new Error('Il faut d’abord pointer l’arrivée');
      pt.pointage_pauses = pt.pointage_pauses || [];
      const ouverte = pt.pointage_pauses.filter(x => !x.fin).pop() || null;
      if (a.p_sens === 'debut') {
        if (ouverte) return [{ pause_id: ouverte.id, debut: ouverte.debut, fin: null }];
        if (a.p_cle && pt.pointage_pauses.some(x => x.cle_client === a.p_cle)) {
          const d = pt.pointage_pauses.find(x => x.cle_client === a.p_cle);
          return [{ pause_id: d.id, debut: d.debut, fin: d.fin }];
        }
        const p = { id: uid(), debut: heure, fin: null, cle_client: a.p_cle || null, hors_ligne: !!a.p_hors_ligne };
        pt.pointage_pauses.push(p);
        D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
          quoi: cible.nom + ' en pause à ' + heure.slice(0, 5) +
                (cible.id !== emp.id ? ' — pointé par ' + emp.nom : ''), entite: 'pointage' });
        return [{ pause_id: p.id, debut: p.debut, fin: null }];
      }
      if (!ouverte) throw new Error('Aucune pause en cours');
      ouverte.fin = heure;
      D.journal.push({ id: uid(), quand: new Date().toISOString(), qui: emp.id, qui_nom: emp.nom,
        quoi: cible.nom + ' a reprise à ' + heure.slice(0, 5) +
              (cible.id !== emp.id ? ' — pointé par ' + emp.nom : ''), entite: 'pointage' });
      return [{ pause_id: ouverte.id, debut: ouverte.debut, fin: ouverte.fin }];
    },
    ocr_annuler_passage(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp) throw new Error('Accès réservé au personnel');
      if (!String(a.p_motif || '').trim()) throw new Error('Le motif est obligatoire');
      const p = D.passages.find(x => x.id === a.p_passage);
      if (!p) throw new Error('Véhicule introuvable');
      if (p.annule) throw new Error(p.reference + ' est déjà annulé');
      const j = D.journees.find(x => x.date === p.journee);
      if (j && j.statut !== 'ouverte') throw new Error('Journée ' + p.journee + ' clôturée : annulation impossible');
      if (p.statut_paiement !== 'impaye' && !['comptable', 'direction'].includes(emp.role))
        throw new Error('Déjà encaissé : seuls le comptable et la direction peuvent annuler');
      Object.assign(p, { annule: true, annule_motif: String(a.p_motif).trim(),
                         annule_par: emp.id, annule_le: new Date().toISOString() });
      D.paiements.filter(x => x.passage_id === p.id).forEach(x => { x.statut = 'annule'; });
      D.anomalies.filter(x => x.passage_id === p.id && !x.traitee).forEach(x =>
        Object.assign(x, { traitee: true, justification: 'Véhicule annulé — ' + String(a.p_motif).trim(),
                           traitee_par: emp.id, traitee_le: new Date().toISOString() }));
      return [{ reference: p.reference }];
    },
    ocr_cloturer_journee(a) {
      const emp = D.employes.find(e => e.user_id === (session && session.user.id));
      if (!emp || !['comptable', 'direction'].includes(emp.role))
        throw new Error('Seuls le comptable et la direction peuvent clôturer');
      const bloq = D.anomalies.filter(x => x.journee === a.p_date && x.gravite === 'critique' && !x.traitee).length;
      if (bloq) throw new Error(bloq + ' anomalie(s) critique(s) non traitée(s)');
      const j = D.journees.find(x => x.date === a.p_date) || { date: a.p_date };
      Object.assign(j, { statut: 'validee', valide_par: emp.id, valide_le: new Date().toISOString(), totaux: totaux(a.p_date) });
      if (!D.journees.includes(j)) D.journees.push(j);
      return [{ jour: j.date, etat: 'validee', signe_par: emp.nom, signe_le: j.valide_le }];
    },
  };

  return {
    auth: {
      getSession: () => Promise.resolve({ data: { session }, error: null }),
      signInWithPassword({ email, password }) {
        const e = D.employes.find(x => x.email === String(email).trim().toLowerCase() && x.user_id);
        if (!e || password !== 'demo')
          return Promise.resolve({ data: null, error: { message: 'Invalid login credentials' } });
        session = { user: { id: e.user_id, email: e.email } };
        return Promise.resolve({ data: { session }, error: null });
      },
      signOut() { session = null; return Promise.resolve({ error: null }); },
      updateUser() { return Promise.resolve({ data: {}, error: null }); },
    },
    from: requete,
    rpc(nom, args) {
      try { return Promise.resolve({ data: RPC[nom](args || {}), error: null }); }
      catch (ex) { return Promise.resolve({ data: null, error: { message: ex.message } }); }
    },
  };
}

function toast(msg, erreur) {

function modale(html) {

/* Branche un champ d'immatriculation : mise en forme pendant la frappe
   (majuscules, sans espace ni tiret) en gardant le curseur là où il est.
   Une plaque doit toujours être stockée sous la MÊME forme — sinon « cb 5916 »
   et « CB5916 » créent deux véhicules, et la fidélité du client se disperse. */
function brancherPlaque(el, apres) {
  if (!el) return;
  el.classList.add('plaque');
  el.setAttribute('autocapitalize', 'characters');
  el.setAttribute('autocomplete', 'off');
  el.setAttribute('spellcheck', 'false');
  el.setAttribute('maxlength', '10');
  el.addEventListener('input', () => {
    const utilesAvant = OCR.plaque(el.value.slice(0, el.selectionStart || 0)).length;
    const propre = OCR.plaque(el.value);
    if (el.value !== propre) { el.value = propre; el.setSelectionRange(utilesAvant, utilesAvant); }
    if (apres) apres(propre);
  });
}

/* ---------- accès aux données ---------- */
const API = {
  async monEmploye() {

      .eq('journee', d).order('heure_arrivee');
    if (error) throw error;
    return data || [];
  },
  async anomalies(d) {
    const { data } = await sb.from('anomalies').select('*').eq('journee', d);
    return data || [];
  },

  /* --- fichier client --- */
  // Cherche sur le nom, le téléphone et la plaque d'un seul geste.
  async chercherClients(q) {
    const t = String(q || '').trim();
    if (t.length < 2) return [];
    // Trois recherches séparées plutôt qu'un « ou » : un numéro contient des
    // points, des espaces et un « + », que la syntaxe du « ou » interpréterait

    const m = '%' + t.replace(/[%_]/g, ' ').trim() + '%';
    const [n, tel, v] = await Promise.all([
      sb.from('clients').select('id,nom,telephone').ilike('nom', m).limit(20),
      sb.from('clients').select('id,nom,telephone').ilike('telephone', m).limit(20),
      sb.from('vehicules').select('immatriculation,clients(id,nom,telephone)').ilike('immatriculation', m).limit(20),
    ]);
    if (n.error) throw n.error;
    if (tel.error) throw tel.error;
    const vus = new Map();
    [...(n.data || []), ...(tel.data || [])].forEach(x => vus.set(x.id, x));
    (v.data || []).forEach(x => { if (x.clients && !vus.has(x.clients.id)) vus.set(x.clients.id, x.clients); });
    return [...vus.values()].sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || ''), 'fr'));

  async ficheClient(id) {

      sb.from('clients')

        .eq('id', id).maybeSingle(),
      sb.from('vehicules').select('*').eq('client_id', id),

        .eq('client_id', id).order('journee', { ascending: false }).limit(40),
      sb.from('v_clients_stats').select('*').eq('client_id', id).maybeSingle(),
    ]);
    if (!cl.data) throw new Error('Client introuvable');

$('#formConnexion').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#btnConnexion'), err = $('#errConnexion');
  b.disabled = true; b.textContent = 'Connexion…'; err.classList.add('masque');
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#mdp').value });
    if (error) throw error;
    if (!MODE_DEMO && !(await exigerMFA())) return;   // code 2FA refusé → retour connexion
    await demarrer();

    err.textContent = '⛔ ' + (/Invalid login/i.test(ex.message) ? 'Adresse ou mot de passe incorrect.' : ex.message);
    err.classList.remove('masque');

});

   Le bouton n'apparaît que hors démo, sur un appareil compatible.
   La passkey remplace la saisie de l'adresse et du mot de passe ; si le
   compte a la double sécurité, le code à 6 chiffres reste demandé. */

function brancherRecuperation() {
  if (!sb.auth.onAuthStateChange) return;
  sb.auth.onAuthStateChange((evenement) => {
    if (evenement !== 'PASSWORD_RECOVERY') return;
    const v = modale(`
      <h3 class="ocr-h2">Nouveau mot de passe</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Tu arrives depuis l’e-mail de réinitialisation — choisis ton nouveau mot de passe.</p>
      <label class="ocr-champ"><span class="ocr-label">Nouveau mot de passe</span>
        <input class="ocr-saisie" type="password" id="recNouveau" autocomplete="new-password"></label>
      <label class="ocr-champ"><span class="ocr-label">Confirme-le</span>
        <input class="ocr-saisie" type="password" id="recConfirme" autocomplete="new-password"></label>
      <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" data-ok>Enregistrer et entrer</button>`);
    v.querySelector('[data-ok]').addEventListener('click', async e => {
      const m1 = v.querySelector('#recNouveau').value, m2 = v.querySelector('#recConfirme').value;

      fermerModale(); toast('Mot de passe enregistré ✓');

/* ==========================================================================
   DOUBLE AUTHENTIFICATION (TOTP — Google Authenticator ou équivalent)
   Si un facteur est activé sur le compte, le code est exigé à chaque
   connexion. L'activation se fait depuis le bouclier 🛡 en haut.
   En cas d'indisponibilité du service MFA, la connexion simple passe :
   on ne bloque jamais la caisse un samedi à 18 h pour un service tiers.
   ========================================================================== */
async function exigerMFA() {
  try {
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (!aal || aal.currentLevel === aal.nextLevel) return true;   // pas de facteur actif
    const { data: fl } = await sb.auth.mfa.listFactors();
    const f = fl && fl.totp && fl.totp.find(x => x.status === 'verified');
    if (!f) return true;
    return await demanderCodeMFA(f.id);
  } catch (e) { return true; }
}

function demanderCodeMFA(factorId) {
  return new Promise(resoudre => {
    const v = modale(`
      <h3 class="ocr-h2">Code de sécurité</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Ouvre ton application d'authentification
        et saisis le code à 6 chiffres.</p>
      <input class="ocr-saisie" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
             style="text-align:center;font:700 24px/1.2 var(--ocr-texte);letter-spacing:.35em">
      <div style="display:flex;gap:9px;margin-top:var(--ocr-e4)">
        <button class="ocr-btn ocr-btn--fantome" data-non>Annuler</button>
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire" data-oui>Vérifier</button></div>`);
    const champ = v.querySelector('#mfaCode'); champ.focus();
    const valider = async () => {
      const code = champ.value.trim();
      if (code.length !== 6) return toast('Le code fait 6 chiffres.', true);
      try {
        const ch = await sb.auth.mfa.challenge({ factorId });
        if (ch.error) throw ch.error;
        const ve = await sb.auth.mfa.verify({ factorId, challengeId: ch.data.id, code });
        if (ve.error) throw ve.error;
        fermerModale(); resoudre(true);
      } catch (ex) { toast('Code incorrect — réessaie.', true); champ.value = ''; champ.focus(); }
    };
    v.querySelector('[data-oui]').addEventListener('click', valider);
    champ.addEventListener('keydown', e => { if (e.key === 'Enter') valider(); });
    v.querySelector('[data-non]').addEventListener('click', async () => {
      await sb.auth.signOut(); fermerModale(); resoudre(false);
    });
  });
}

/* Le QR de Supabase peut arriver sous trois formes ; on le convertit en SVG
   propre, injecté à part — jamais collé dans un attribut (les guillemets du
   SVG cassaient l'affichage). */
function qrEnHtml(qr) {
  if (!qr) return '';
  if (qr.startsWith('<svg')) return qr;
  const i = qr.indexOf(',');
  if (qr.startsWith('data:image/svg+xml') && !/;base64/.test(qr) && i !== -1) {
    const brut = qr.slice(i + 1);
    try { return decodeURIComponent(brut); } catch (e) { return brut; }
  }
  if (/^data:[^,]*;base64,/.test(qr)) {
    const img = document.createElement('img');
    img.src = qr; img.alt = 'Code à scanner';
    img.style.cssText = 'width:190px;height:190px;display:block';
    return img.outerHTML;
  }
  return '';
}

/* ---------- réglages d'affichage : propres à CET appareil ---------- */
const PREFS_CLE = MODE_DEMO ? 'ocr-prefs-demo' : 'ocr-prefs';
const prefs = { theme: 'sombre', taille: 'normal' };   // 'sombre'|'clair'|'auto' · 'normal'|'grand'|'tresgrand'
function appliquerPrefs() {
  const clair = prefs.theme === 'clair' ||
    (prefs.theme === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.body.classList.toggle('theme-clair', clair);
  document.body.classList.toggle('texte-grand', prefs.taille === 'grand');
  document.body.classList.toggle('texte-tresgrand', prefs.taille === 'tresgrand');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = clair ? '#F5F5F6' : '#0A0A0B';
}
function chargerPrefs() {
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_CLE) || '{}')); } catch (e) {}
  appliquerPrefs();
}
function sauverPrefs() {
  try { localStorage.setItem(PREFS_CLE, JSON.stringify(prefs)); } catch (e) {}
  appliquerPrefs();
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (prefs.theme === 'auto') appliquerPrefs();
});

    catch (ex) { toast('Impossible de rafraîchir — vérifie la connexion.', true); e.target.disabled = false; }
  });
  v.querySelector('[data-compte]').addEventListener('click', () => { fermerModale(); boiteCompte(); });
  v.querySelector('[data-deconnexion]').addEventListener('click', () => { fermerModale(); seDeconnecter(); });
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
}

async function boiteActiverMFA() {
  const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'OCR Caisse' });
  if (error) return toast(error.message, true);
  const secret = data.totp && data.totp.secret || '';
  const v = modale(`
    <h3 class="ocr-h2">Activer la double sécurité</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">1 · Installe <strong>Google Authenticator</strong>
      (ou FreeOTP). 2 · Scanne ce code. 3 · Saisis le code à 6 chiffres affiché.</p>
    <div style="display:grid;place-items:center;margin-bottom:var(--ocr-e4)">
      <div id="zoneQR" style="width:206px;height:206px;background:#fff;border-radius:12px;padding:8px;box-sizing:border-box;display:grid;place-items:center"></div>
    </div>
    ${secret ? `<p class="ocr-mini" style="text-align:center;margin:0 0 var(--ocr-e4);word-break:break-all">Si tu ne peux pas scanner — code à saisir : ${esc(secret)}</p>` : ''}
    <input class="ocr-saisie" id="mfaPremier" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
           placeholder="000000" style="text-align:center;font:700 24px/1.2 var(--ocr-texte);letter-spacing:.35em">
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e4)">
      <button class="ocr-btn ocr-btn--fantome" data-non>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-oui>Activer</button></div>`);
  const zone = v.querySelector('#zoneQR');
  const svg = qrEnHtml(data.totp && data.totp.qr_code || '');
  if (svg) { zone.innerHTML = svg; const s = zone.firstElementChild; if (s) { s.style.width = '100%'; s.style.height = '100%'; } }
  else zone.innerHTML = '<span style="color:#333;font:600 12px/1.4 sans-serif;text-align:center;padding:10px">Scan indisponible —<br>utilise le code à saisir ci-dessous</span>';

  v.querySelector('[data-non]').addEventListener('click', async () => {
    try { await sb.auth.mfa.unenroll({ factorId: data.id }); } catch (e) {}
    fermerModale();
  });
  v.querySelector('[data-oui]').addEventListener('click', async e => {
    const code = v.querySelector('#mfaPremier').value.trim();

      if (ch.error) throw ch.error;
      const ve = await sb.auth.mfa.verify({ factorId: data.id, challengeId: ch.data.id, code });
      if (ve.error) throw ve.error;
      fermerModale(); toast('Double sécurité activée ✓'); majBoucler();
    } catch (ex) { toast('Code incorrect — réessaie.', true); e.target.disabled = false; }
  });
}

/* ---------- fraîcheur : l'écran se met à jour tout seul ----------
   Toutes les 5 min (et au retour sur l'app, avec un léger garde-fou pour ne
   pas doubler un rafraîchissement tout juste fait), la vue se recharge
   depuis la base — sauf si quelqu'un est en train de taper ou qu'une fenêtre
   est ouverte : on ne coupe jamais une saisie en cours. Avant c'était toutes
   les 60 s avec un plein remplacement de l'écran (spinner + saut de défilement) —
   trop fréquent et « désagréable » (retour du 12/08). Le rafraîchissement
   automatique est maintenant discret (pas de spinner, position de défilement
   conservée) ; le bouton ↻ reste là pour un besoin immédiat. */
let dernierRafraichissement = 0;
function rafraichirSansDeranger() {
  if (!moi || document.hidden || enCours) return;
  const a = document.activeElement;
  if (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return;
  if ($('#modales').children.length) return;
  if (rdvOuvert || proEdite || cliNouveau) return;
  if (Date.now() - dernierRafraichissement < 20000) return;   // pas deux fois de suite
  dernierRafraichissement = Date.now();
  rendre(true);
}
window.__ocrRafraichir = rafraichirSansDeranger;   // testable
setInterval(rafraichirSansDeranger, 300000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) rafraichirSansDeranger(); });

/* ---------- geste retour (Android) : ne ferme jamais l'app par surprise ----------
   Priorité 1 : une fenêtre ouverte (modale) — le retour la referme.
   Priorité 2 : un onglet secondaire — le retour ramène à l'onglet de départ.
   Sinon, le geste agit normalement (l'app passe en arrière-plan). */
window.addEventListener('popstate', () => {
  if (retourInterne) { retourInterne = false; return; }   // c'était nous, pas un vrai geste retour
  const m = $('#modales .voile:last-child');
  if (m) { m.remove(); return; }
  if (moi && onglet !== ongletParDefaut()) { onglet = ongletParDefaut(); rendre(); }
});

/* ---------- navigation ---------- */
async function rendre(discret) {
  // discret = rafraîchissement automatique en arrière-plan : pas de spinner
  // plein-écran, position de défilement conservée — pour ne plus « sauter »
  // sous les yeux de quelqu'un en train de lire l'écran (retour du 12/08).
  const yAvant = discret ? window.scrollY : 0;
  try { ABSENCES = await API.absencesJour(auj()); } catch (e) { ABSENCES = []; }
  const jAuj = await API.journee(auj());
  const jVu = jourVu === auj() ? jAuj : await API.journee(jourVu);
  // La pastille du haut suit le jour affiché sur Journée et Clôture,
  // et reste sur aujourd'hui partout ailleurs.
  const jPast = (onglet === 'journee' || onglet === 'cloture') ? jVu : jAuj;
  const verrou = jPast.statut !== 'ouverte';
  $('#etatJour').textContent = verrou ? 'Journée clôturée' : 'Journée ouverte';
  $('#etatJour').className = 'ocr-pastille ' + (verrou ? 'ocr-pastille--succes' : 'ocr-pastille--marque');

  // Un technicien n'a que son pointage — sauf le remplaçant, le jour de
  // repos du manager : il voit alors les écrans du manager.
  const items = roleEffectif() === 'technicien'
    ? [{ id: 'pointage', ic: '◉', l: 'Pointage' }]
    : [
        { id: 'saisie',  ic: '＋', l: 'Saisie' },
        { id: 'journee', ic: '▤',  l: 'Journée' },
        { id: 'agenda',  ic: '◷',  l: 'Agenda' },
        { id: 'clients', ic: '☺',  l: 'Clients' },
      ];
  // Le manager pointe pour lui ET pour ceux qui ont oublié : son onglet
  // Pointage est le même que celui des techniciens, avec l'équipe en dessous.
  if (roleEffectif() === 'manager') items.push({ id: 'pointage', ic: '◉', l: 'Pointage' });
  // Toi et Guénolé : un seul onglet Direction qui regroupe tout
  // (Bilan, Clôture, objectifs, baies, absences, journal, pointage…).
  if (peutCloturer()) items.push({ id: 'direction', ic: '◆', l: 'Direction' });
  const sousDirection = ['direction', 'bilan', 'cloture', 'journal', 'pointage'];
  if (!items.some(i => i.id === onglet) && !(peutCloturer() && sousDirection.includes(onglet)))
    onglet = items[0].id;

  // badge : réservations en attente d'acompte (une action est attendue)
  let badgeRdv = 0;
  if (items.some(i => i.id === 'agenda')) {
    try { badgeRdv = await API.rdvEnAttente(); } catch (e) {}
  }

  $('#onglets').innerHTML = items.map(i => {
    const actif = i.id === onglet || (i.id === 'direction' && sousDirection.includes(onglet) && onglet !== 'pointage');
    // Les pointages qui attendent le réseau : un chiffre sur l'onglet, pour
    // qu'on n'ait jamais à se demander si c'est bien parti.
    const enAttente = i.id === 'pointage' ? filePointage.length : 0;
    return '<button class="onglet" ' + (actif ? 'aria-current="page"' : '') +
    ' data-onglet="' + i.id + '"><span class="ic">' + i.ic +
    (i.id === 'agenda' && badgeRdv ? '<span class="pastille-nb">' + badgeRdv + '</span>' : '') +
    (enAttente ? '<span class="pastille-nb">' + enAttente + '</span>' : '') +
    '</span>' + i.l + '</button>';
  }).join('');
  $('#onglets').querySelectorAll('[data-onglet]').forEach(b =>
    b.addEventListener('click', () => {
      // Un seul cran d'historique quand on quitte l'onglet de départ : le
      // geste retour d'Android y ramène plutôt que de fermer l'app.
      if (b.dataset.onglet !== onglet && onglet === ongletParDefaut()) history.pushState({ ocrOnglet: true }, '');
      onglet = b.dataset.onglet; rendre();
    }));

  if (!discret) $('#vue').innerHTML = '<div class="vide"><span class="tourne"></span></div>';
  try {
    if (onglet === 'saisie')    await vueSaisie(jAuj);
    if (onglet === 'journee')   await vueJournee(jVu);
    if (onglet === 'agenda')    await vueAgenda();
    if (onglet === 'clients')   await vueClients();
    if (onglet === 'direction') await vueDirection();
    if (onglet === 'bilan')     await vueBilan();
    if (onglet === 'cloture')   await vueCloture(jVu);
    if (onglet === 'journal')   await vueJournal();
    if (onglet === 'pointage')  await vuePointage();
  } catch (ex) {
    $('#vue').innerHTML = '<div class="ocr-message ocr-message--erreur"><span>⛔</span><div>' +
      '<strong>Impossible de charger</strong><br>' + esc(ex.message) + '</div></div>';
  }
  if (discret) window.scrollTo(0, yAvant);
}

   SAISIE
   ========================================================================== */
const form = { tel: '', nom: '', clientTrouve: null, gabarit: 'berline', marque: '', modele: '', immat: '',
               vehTrouve: null,   // véhicule retrouvé par sa plaque, pour rattacher le client
               prestation: null, options: [], equipe: [], remise: 0, manuel: 0, note: '', reservation: null };

function totalForm() {
  let cat = 0, devis = 0;
  if (form.prestation) {
    const p = OCR.prix(form.prestation, form.gabarit);
    if (p == null) devis++; else cat += p;
    form.options.forEach(o => { const op = OCR.option(o); if (op) cat += op.prix; });
  }
  const brut = cat + Math.max(0, Number(form.manuel) || 0);
  // Employé d'une entreprise partenaire (Ehu Motors…) : la remise suit la
  // PERSONNE, quel que soit le véhicule. Le champ Remise peut la remplacer.
  const ent = form.clientTrouve && form.clientTrouve.entreprises;
  const auto = ent && ent.remise_pct > 0 ? Math.round(brut * ent.remise_pct / 100) : 0;
  const remise = Math.min(Number(form.remise) > 0 ? Number(form.remise) : auto, brut);
  return { brut, remise, total: brut - remise, devis,
           partenaire: auto > 0 && !(Number(form.remise) > 0) ? ent : null };
}

/* L'aide sous le champ Immatriculation — jamais bloquante, toujours parlante.
   Elle dit, selon le cas : le format attendu, la plaque reconnue, ou le
   véhicule déjà connu et à qui il appartient. */
function aideImmat() {
  const et = OCR.plaqueEtat(form.immat, form.gabarit);
  if (et.vide)
    return 'Pas obligatoire — mais saisie une fois, le véhicule se rattache tout seul au client ensuite. ' +
           'Voiture : ' + OCR.PLAQUE_EXEMPLES.voiture + ' · Moto : ' + OCR.PLAQUE_EXEMPLES.moto;
  const v = form.vehTrouve;
  if (v && v.immatriculation === et.cle && v.clients) {
    // La plaque appartient à quelqu'un d'autre que le client saisi : on le dit,
    // on ne corrige rien tout seul (il arrive qu'on lave la voiture d'un proche).
    if (form.clientTrouve && form.clientTrouve.id !== v.clients.id)
      return '<span style="color:var(--ocr-ambre)">⚠ Cette plaque est au nom de ' + esc(v.clients.nom) +
             ', pas de ' + esc(form.clientTrouve.nom) + ' — à vérifier.</span>';
    return '<span style="color:var(--ocr-vert)">✓ Véhicule connu — ' + esc(v.clients.nom) + '</span>';
  }
  if (!et.ok || !et.accord)
    return '<span style="color:var(--ocr-ambre)">' + esc(et.aide) + '</span>';
  return '<span style="color:var(--ocr-vert)">' + esc(et.aide) + '</span>';
}

        ${form.clientTrouve && form.clientTrouve.entreprises && form.clientTrouve.entreprises.remise_pct > 0 ? `

        if (v.clients && !form.tel) {
          form.tel = v.clients.telephone || '';
          form.nom = v.clients.nom || '';
          if (form.tel) {
            form.clientTrouve = await API.clientParTelephone(form.tel).catch(() => null);

    const id = b.dataset.opt, i = form.options.indexOf(id);
    i === -1 ? form.options.push(id) : form.options.splice(i, 1);
    vueSaisie(j);
  }));
  $('#btnEnregistrer').addEventListener('click', enregistrer);
}

async function enregistrer() {
  if (enCours) return;
  const T = totalForm();
  if (!form.prestation) return toast('Choisissez une prestation.', true);
  if (T.total <= 0) return toast('Le montant doit être supérieur à zéro.', true);
  if (!navigator.onLine) return toast('Hors ligne — impossible d’enregistrer.', true);

  const p = OCR.prestation(form.prestation);
  const lignes = [];
  const prixBase = OCR.prix(form.prestation, form.gabarit);
  lignes.push({ type: 'prestation', code: p.id, libelle: p.nom,
                prix: prixBase == null ? Math.max(0, Number(form.manuel) || 0) : prixBase,
                duree_min: OCR.duree(form.prestation, form.gabarit) });
  form.options.forEach(o => {
    const op = OCR.option(o);
    if (op) lignes.push({ type: 'option', code: op.id, libelle: op.nom, prix: op.prix, duree_min: op.duree });
  });

  enCours = true;
  const b = $('#btnEnregistrer'); if (b) { b.disabled = true; b.textContent = 'Enregistrement…'; }
  try {
    const { data, error } = await API.enregistrer({
      p_client_nom: form.nom || 'Client de passage',
      p_telephone: form.tel,
      p_gabarit: form.gabarit,
      p_lignes: lignes,
      p_remise: T.remise,
      p_marque: form.marque, p_modele: form.modele, p_immat: OCR.plaque(form.immat) || null,
      p_equipe: form.equipe, p_note: form.note,
      p_reservation: form.reservation,
    });
    if (error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    toast(r.reference + ' enregistré · ' + OCR.fcfa(r.montant_total));
    Object.assign(form, { tel: '', nom: '', clientTrouve: null, marque: '', modele: '', immat: '',
                          vehTrouve: null,
                          prestation: null, options: [], remise: 0, manuel: 0, note: '', reservation: null });
    onglet = 'journee';
    await rendre();
  } catch (ex) {
    toast(ex.message || 'Enregistrement impossible', true);
  } finally {
    enCours = false;
    const bb = $('#btnEnregistrer'); if (bb) { bb.disabled = false; bb.textContent = 'Enregistrer'; }
  }
}

/* ==========================================================================
