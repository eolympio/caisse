const ETAT_ATELIER = { attente: ['À démarrer', 'neutre'], en_cours: ['En cours', 'marque'],
                       pret: ['Prêt', 'neutre'], livre: ['Livré', 'succes'] };

/* Minutes entre deux heures 'HH:MM:SS' — le chrono des lavages. */
function minutesEntre(a, b) {
  if (!a || !b) return null;
  const m = t => { const [h, mi, s] = String(t).split(':').map(Number); return h * 60 + mi + (s || 0) / 60; };
  const d = m(b) - m(a);
  return d >= 0 ? Math.round(d) : null;
}
const heureMaintenant = () => new Date().toTimeString().slice(0, 8);

/* La ligne chrono d'une fiche : démarré à…, ou temps réel vs référence. */
function ligneChrono(p) {
  const codeP = ((p.passage_lignes || []).find(l => l.type === 'prestation') || {}).code;
  const ref = codeP ? OCR.duree(codeP, p.gabarit) : null;
  if (p.statut_atelier === 'en_cours' && p.heure_debut) {
    const depuis = minutesEntre(p.heure_debut, heureMaintenant());
    const retard = ref != null && depuis != null && depuis > ref * 1.25;
    return `<span class="ocr-mini" style="${retard ? 'color:var(--ocr-ambre)' : ''}">⏱ démarré à ${heureCourte(p.heure_debut)}${
      depuis != null ? ' · ' + depuis + ' min' : ''}${ref != null ? ' (prévu ' + ref + ')' : ''}${retard ? ' ⚠' : ''}</span>`;
  }
  const reel = minutesEntre(p.heure_debut, p.heure_fin);
  if (reel == null) return '';
  const ton = ref == null ? '' : reel <= ref ? 'color:var(--ocr-vert)' : reel > ref * 1.25 ? 'color:var(--ocr-ambre)' : '';
  return `<span class="ocr-mini" style="${ton}">⏱ ${reel} min de lavage${ref != null ? ' · prévu ' + ref : ''}${
    ref != null && reel <= ref ? ' ✓' : ref != null && reel > ref * 1.25 ? ' ⚠' : ''}</span>`;
}

/* Barre de navigation par jour, partagée entre Journée et Clôture. */
function barreJour(j) {
  const estAuj = jourVu === auj();
  const etat = estAuj ? 'Aujourd’hui'
             : j.statut === 'ouverte' ? '⚠ jamais clôturée' : 'clôturée et signée';
  return `<div class="barre-jour">
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-jnav="-1" aria-label="Jour précédent">‹</button>
    <div class="bj-centre">
      <div class="bj-date">${jourLong(jourVu)}</div>
      <div class="ocr-mini" style="margin-top:2px">${etat}${estAuj ? '' :
        ' · <button class="bj-lien" data-jnav="0">revenir à aujourd’hui</button>'}</div>
    </div>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-jnav="1"
            aria-label="Jour suivant" ${estAuj ? 'disabled' : ''}>›</button>
  </div>`;
}
function brancherJour() {
  $('#vue').querySelectorAll('[data-jnav]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.jnav);
    jourVu = n === 0 ? auj() : decaleJour(jourVu, n);
    rendre();
  }));
}

async function vueJournee(j) {
  const d = jourVu;
  const estAuj = d === auj();
  const [T, ps, pts, obj, moisRows, sigRows] = await Promise.all([
    API.totaux(d), API.passages(d), API.pointagesJour(d),

  const verrou = j.statut !== 'ouverte';

  $('#vue').innerHTML = `
    ${barreJour(j)}
    ${verrou ? `<div class="ocr-message ocr-message--succes" style="margin-bottom:var(--ocr-e4)"><span>🔒</span><div>
      <strong>Journée clôturée et signée</strong><br>Lecture seule.</div></div>` : ''}

      <div class="tuile"><div class="lab">Chiffre d’affaires</div><div class="val">${OCR.fcfa(T.ca || 0)}</div>
        <div class="sub">${T.vehicules || 0} véhicule(s)</div></div>

        <div class="val" style="${T.especes ? 'color:var(--ocr-ambre)' : ''}">${OCR.fcfa(T.especes || 0)}</div>
        <div class="sub">${T.especes ? '⚠ à déposer sur le ' + COMPTE_MTN : 'aucune — c’est la règle'}</div></div>
    </div>

    b.addEventListener('click', () => boiteAnnulation(b.dataset.annuler, b.dataset.ref, b.dataset.paye === '1')));

function ficheePassage(p, verrou) {

    return `<div class="fiche fiche--annule">

  return `<div class="fiche">
    <div class="ligne1">

      <span class="ocr-pastille ocr-pastille--${paye ? 'succes' : 'erreur'}">${
        p.statut_paiement === 'carnet' ? 'Carnet' : paye ? 'Payé · ' + (p.mode_paiement === 'kkiapay' ? 'KKiapay' : 'Espèces') : 'Non payé'}</span>
      <span style="margin-left:auto;font:700 16px/1 var(--ocr-texte);font-variant-numeric:tabular-nums">${OCR.fcfa(p.montant_total)}</span>
    </div>
    <div class="ocr-mini" style="margin-top:4px">${heureCourte(p.heure_arrivee)} · ${esc(p.reference)}${
      v.marque ? ' · ' + esc(v.marque + ' ' + (v.modele || '')) : ''}${v.immatriculation ? ' · ' + esc(v.immatriculation) : ''}</div>

        data-avance="${p.id}" data-vers="pret">✓ Lavage terminé</button>` : ''}
      ${p.statut_atelier === 'pret' ? `<button class="ocr-btn ocr-btn--secondaire ocr-btn--petit"
        data-avance="${p.id}" data-vers="livre">Marquer livré</button>` : ''}
      ${!paye ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit"

      ${(!paye || peutCloturer()) ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit"

function boiteAnnulation(id, ref, paye) {

function calculerAnomalies(ps) {
  const out = [];
  ps.forEach(p => {
    if (p.annule) return;                    // un véhicule annulé ne compte plus
    const c = p.clients || {};
    if (p.statut_atelier === 'livre' && p.statut_paiement === 'impaye')
      out.push({ cle: 'impaye-' + p.id, gravite: 'critique', titre: 'Véhicule livré sans encaissement',
        detail: p.reference + ' · ' + (c.nom || 'client') + ' · ' + OCR.fcfa(p.montant_total) + ' non encaissés.',
        passage_id: p.id });
    if (p.remise > 0 && p.montant_brut > 0 && p.remise / p.montant_brut > OCR.CONFIG.seuilRemiseAlerte
        && !(p.clients && p.clients.entreprise_id))   // remise partenaire = légitime, pas d'alerte
      out.push({ cle: 'remise-' + p.id, gravite: 'alerte',
        titre: 'Remise de ' + Math.round(p.remise / p.montant_brut * 100) + ' %',
        detail: p.reference + ' · ' + OCR.fcfa(p.remise) + ' sur ' + OCR.fcfa(p.montant_brut) +
                '. Seuil interne : ' + Math.round(OCR.CONFIG.seuilRemiseAlerte * 100) + ' %.',
        passage_id: p.id });
    if (!c.telephone)
      out.push({ cle: 'tel-' + p.id, gravite: 'alerte', titre: 'Client sans numéro de téléphone',
        detail: p.reference + ' · ' + (c.nom || 'client') + ' — impossible de le fidéliser.', passage_id: p.id });
  });
  return out;
}

/* ==========================================================================
   POINTAGE
   L'heure vient toujours du serveur (fuseau de Cotonou) : le téléphone
   ne peut pas mentir. L'arrivée ne s'écrase jamais, le départ garde la
   dernière valeur. Corrections réservées au manager, comptable, direction.
   ========================================================================== */
const peutCorriger = () => ['manager', 'comptable', 'direction'].includes(roleEffectif());

let REGLAGES = null;   // position de l'atelier, chargée à la connexion

/* Position du téléphone. Rejette avec un message clair si refusée. */
const maPosition = () => new Promise((res, rej) => {
  if (!navigator.geolocation) return rej(new Error('Localisation non disponible sur cet appareil'));
  navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) }),
    e => rej(new Error(e.code === 1
      ? 'Autorise la localisation pour pointer (Réglages → Safari → Position)'
      : 'Position introuvable — réessaie à ciel ouvert')),
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
});

/* ══════════════════════════════════════════════════════════════════════════
   POINTAGE HORS LIGNE
   Le réseau tombe souvent ; une arrivée ratée, c'est une heure de travail
   perdue pour quelqu'un. Alors on n'échoue jamais : le pointage part tout de
   suite s'il y a du réseau, sinon il attend dans le téléphone et s'envoie dès
   que ça revient — avec l'HEURE RÉELLE du geste, pas celle de l'envoi.

   Le GPS d'un téléphone fonctionne sans réseau : on joint donc la position
   même hors ligne, et c'est le SERVEUR qui vérifie les 150 m à l'arrivée du
   message. Le garde-fou reste entier. Faute de position, le pointage passe
   quand même mais reste marqué « hors ligne » — perdre l'heure d'un employé
   de bonne foi serait pire que devoir lui poser la question.
   ══════════════════════════════════════════════════════════════════════════ */
const CLE_FILE = MODE_DEMO ? 'ocr-file-demo' : 'ocr-file-pointage';
let filePointage = [];
try { filePointage = JSON.parse(localStorage.getItem(CLE_FILE) || '[]') || []; } catch (e) {}
const sauverFile = () => { try { localStorage.setItem(CLE_FILE, JSON.stringify(filePointage)); } catch (e) {} };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

const heureLocale = () => new Date().toTimeString().slice(0, 8);

/* Position du téléphone, sans jamais faire échouer le pointage : si elle est
   refusée ou introuvable, on part sans — le serveur tranchera. */
async function positionSiPossible() {
  if (!(REGLAGES && REGLAGES.lat != null && REGLAGES.lng != null)) return null;
  try { return await maPosition(); } catch (e) { return null; }
}

/* Envoie un geste de pointage, ou le met en file s'il ne passe pas. */
async function envoyerGeste(g, silencieux) {
  const args = g.type === 'pause'
    ? { p_sens: g.sens, p_employe: g.employe || null, p_heure: g.heure, p_jour: g.jour,
        p_hors_ligne: g.horsLigne, p_cle: g.cle }
    : { p_sens: g.sens, p_employe: g.employe || null, p_heure: g.heure, p_jour: g.jour,
        p_hors_ligne: g.horsLigne, p_lat: g.lat, p_lng: g.lng, p_precision: g.precision };
  const { data, error } = g.type === 'pause' ? await API.pause(args) : await API.pointer(args);
  if (!error) return { ok: true, data };
  // Le serveur a répondu et refuse : réessayer éternellement n'y changera
  // rien. On le sort de la file et on le dit — sauf hors ligne, où l'échec
  // vient du réseau, pas du serveur.
  if (!navigator.onLine) return { ok: false, reseau: true };
  return { ok: false, message: error.message };
}

/* Vide la file. Appelée au démarrage, au retour du réseau, et après chaque
   pointage réussi. Silencieuse quand il n'y a rien à faire. */
let envoiEnCours = false;
async function viderFile() {
  if (envoiEnCours || !filePointage.length || !moi || !navigator.onLine) return;
  envoiEnCours = true;
  const restants = [], refuses = [];
  let envoyes = 0;
  for (const g of filePointage) {
    const r = await envoyerGeste(g, true);
    if (r.ok) envoyes++;
    else if (r.reseau) restants.push(g);
    else refuses.push({ g, message: r.message });
  }
  filePointage = restants; sauverFile();
  envoiEnCours = false;
  if (envoyes) toast(envoyes + ' pointage' + (envoyes > 1 ? 's' : '') + ' en attente envoyé' + (envoyes > 1 ? 's' : '') + ' ✓');
  refuses.forEach(r => toast('Pointage refusé : ' + r.message, true));
  if (envoyes || refuses.length) rendre(true);
}
window.addEventListener('online', () => { toast('Connexion revenue'); viderFile(); });
window.__ocrViderFile = viderFile;   // testable

/* LE point d'entrée de tout pointage, en ligne comme hors ligne.
   Renvoie { enFile: true } quand le geste a été mis de côté. */
async function pointerMaintenant(type, sens, employe) {
  const pourMoi = !employe || employe === moi.id;
  const g = {
    type, sens, employe: employe || null,
    heure: heureLocale(), jour: auj(),
    horsLigne: false, cle: uuid(),
  };
  if (type === 'pointage' && pourMoi) {
    const pos = await positionSiPossible();
    if (pos) { g.lat = pos.lat; g.lng = pos.lng; g.precision = pos.precision; }
  }
  // En ligne : on laisse le serveur mettre SON heure (plus fiable que celle
  // du téléphone) en n'envoyant pas d'heure déclarée.
  if (navigator.onLine) {
    const direct = { ...g, heure: null, jour: null };
    const r = await envoyerGeste(direct);
    if (r.ok) { await viderFile(); return { ok: true, data: r.data }; }
    if (!r.reseau) throw new Error(r.message);
  }
  // Hors ligne : on garde l'heure du geste et on attend le réseau.
  g.horsLigne = true;
  filePointage.push(g); sauverFile();
  return { enFile: true };
}

/* Aperçu local de la file, pour que l'écran montre tout de suite ce qui a été
   pointé hors ligne au lieu d'avoir l'air de n'avoir rien enregistré. */
function fileDe(empId, jour) {
  return filePointage.filter(g => (g.employe || moi.id) === empId && g.jour === jour);
}

const debutSemaine = () => {
  const d = new Date(auj() + 'T12:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // lundi
  return d.toLocaleDateString('en-CA');
};
const debutMois = () => auj().slice(0, 8) + '01';

function barreObjectif(fait, cible) {
  if (!cible) return '<span class="ocr-mini">à définir</span>';
  const pct = Math.min(100, Math.round(fait / cible * 100));
  return `<div style="display:flex;align-items:center;gap:10px">
    <div style="flex:1;height:8px;border-radius:999px;background:var(--ocr-trace);overflow:hidden">
      <div style="height:100%;width:${pct}%;border-radius:999px;background:${pct >= 100 ? 'var(--ocr-succes)' : 'var(--ocr-rouge)'}"></div>
    </div>
    <span style="font:600 12px/1 var(--ocr-texte);font-variant-numeric:tabular-nums;flex:none">${pct} %</span>
  </div>`;
}

const fmtDuree = min => {
  if (min == null || min <= 0) return '—';
  return Math.floor(min / 60) + ' h ' + String(Math.round(min % 60)).padStart(2, '0');
};
const pausesDe = p => (p && p.pointage_pauses) || [];
/* Minutes de pause d'une journée. Une pause encore ouverte compte jusqu'à
   maintenant si on est aujourd'hui — sinon elle s'arrête à l'heure de départ,
   pour ne pas gonfler indéfiniment une pause que personne n'a fermée. */
function minutesPauses(p) {
  const fin = p && p.depart ? OCR.hm2min(heureCourte(p.depart))
            : (p && p.jour === auj() ? OCR.hm2min(heureCourte(heureLocale())) : null);
  return pausesDe(p).reduce((s, x) => {
    const d = OCR.hm2min(heureCourte(x.debut));
    const f = x.fin ? OCR.hm2min(heureCourte(x.fin)) : fin;
    return f != null && f > d ? s + (f - d) : s;
  }, 0);
}
const pauseEnCours = p => pausesDe(p).find(x => !x.fin) || null;
/* Heures travaillées = présence − pauses. C'est ce chiffre qui compte. */
const minutesPointage = p => (p && p.arrivee && p.depart)
  ? Math.max(0, OCR.hm2min(heureCourte(p.depart)) - OCR.hm2min(heureCourte(p.arrivee)) - minutesPauses(p))
  : null;

/* Objectifs d'équipe : CA et lavages Signature — jour, semaine, mois. */
function carteObjectifs(obj, moisRows, sigRows) {
  const dSem = debutSemaine();
  const sCA = rows => rows.reduce((s, r) => s + (Number(r.ca) || 0), 0);
  const sSig = rows => rows.reduce((s, r) => s + (Number(r.nombre) || 0), 0);
  const periodes = [
    ['Aujourd’hui', r => r === auj(), 'jour'],
    ['Cette semaine', r => r >= dSem, 'semaine'],
    ['Ce mois', () => true, 'mois'],
  ];
  const rienDefini = !periodes.some(([, , k]) => obj[k].ca || obj[k].signatures);
  return `<div class="ocr-carte" style="margin-bottom:var(--ocr-e4)">
    <div style="display:flex;align-items:center;gap:10px">

/* La photo est recadrée en carré et réduite à 256 px avant l'envoi :
   quelques dizaines de Ko, jamais la photo brute de 5 Mo du téléphone. */
async function redimensionnerPhoto(fichier, cote) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Image illisible'));
    i.src = URL.createObjectURL(fichier);
  });
  const c = document.createElement('canvas');
  c.width = c.height = cote;
  const s = Math.min(img.width, img.height);
  c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, cote, cote);
  URL.revokeObjectURL(img.src);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}

async function envoyerPhoto(fichier) {
  const blob = await redimensionnerPhoto(fichier, 256);
  if (!blob) throw new Error('Image illisible');
  let url;
  if (MODE_DEMO) {
    url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  } else {
    const chemin = moi.id + '.jpg';
    const { error } = await sb.storage.from('avatars').upload(chemin, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) throw error;
    url = sb.storage.from('avatars').getPublicUrl(chemin).data.publicUrl + '?v=' + Date.now();
  }
  const r = await sb.rpc('ocr_changer_photo', { p_photo: url });
  if (r.error) throw r.error;
  moi.photo = url;
  const em = equipe.find(x => x.id === moi.id); if (em) em.photo = url;
  return url;
}

/* La carte du manager : toute l'équipe, chacun avec ses boutons. Pointer pour
   quelqu'un est inscrit au journal au nom de celui qui appuie. */
function carteEquipePointage(pts) {
  const js = jourSemaineDe(auj());

    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="ocr-surtitre">L’équipe aujourd’hui</div>
      <span style="flex:1"></span>
      <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" id="btnAbsences">Absences</button>
    </div>
    <p class="ocr-mini" style="margin:8px 0 var(--ocr-e3)">Quelqu’un a oublié de pointer ? Fais-le pour lui —
      c’est enregistré à ton nom.</p>
    ${equipePointage().map(e => {
      const enRepos = e.repos_jour != null && e.repos_jour === js;
      const abs = absenceDe(e.id);
      const p = pts.find(x => x.employe_id === e.id);
      const pz = minutesPauses(p);
      const pause = pauseEnCours(p);
      const enFile = fileDe(e.id, auj());
      const etat = abs ? (MOTIFS_ABSENCE[abs.motif] || ['absent'])[0]
        : !p || !p.arrivee ? (enFile.length ? '⏳ ' + heureCourte(enFile[0].heure) + ' — en attente d’envoi'
                              : enRepos ? 'repos' : 'pas encore arrivé')
        : heureCourte(p.arrivee) + (p.depart ? ' → ' + heureCourte(p.depart) + ' · ' + fmtDuree(minutesPointage(p))
                                            : pause ? ' · ☕ en pause' : ' · présent')
          + (pz > 0 && !pause ? ' · ☕ ' + fmtDuree(pz) : '');
      const marque = p && (p.arrivee_hors_ligne || p.depart_hors_ligne);
      return `<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ocr-sep);flex-wrap:wrap${enRepos || abs ? ';opacity:.65' : ''}">
        ${avatar(e, 38)}
        <span style="min-width:0;flex:1 1 45%">
          <span style="font-weight:600;display:block">${esc(e.nom)}${e.id === moi.id ? ' <span class="ocr-mini">(moi)</span>' : ''}
            ${marque ? '<span class="ocr-pastille ocr-pastille--alerte" style="margin-left:6px">hors ligne</span>' : ''}</span>
          <span class="ocr-mini">${esc(etat)}</span>
        </span>
        <span style="display:flex;gap:6px;flex-wrap:wrap;margin-left:auto">
          ${abs ? '' : !p || !p.arrivee
            ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit" data-pointer="arrivee" data-emp="${e.id}">Arrivé</button>`
            : `${!p.depart ? (pause
                 ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit" data-pause="fin" data-emp="${e.id}">Reprend</button>`
                 : `<button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" data-pause="debut" data-emp="${e.id}">☕ Pause</button>`) : ''}
               <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-pointer="depart" data-emp="${e.id}">${p.depart ? 'Repart' : 'Part'}</button>`}
          <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-corriger="${e.id}">Corriger</button>
        </span>
      </div>`;
    }).join('')}
  </div>`;
}

/* Un seul câblage pour tous les boutons de pointage de l'écran — le mien comme
   ceux de l'équipe. Le geste ne peut pas échouer : hors ligne, il est mis de côté. */
function brancherGestesPointage() {
  const be = $('#vue').querySelector('[data-envoyer]');
  if (be) be.addEventListener('click', async () => { be.disabled = true; await viderFile(); rendre(); });
  const ba = $('#btnAbsences');
  if (ba) ba.addEventListener('click', boiteAbsences);

  const agir = async (b, type, sens, emp) => {
    b.disabled = true;
    const txt = b.innerHTML;
    b.textContent = navigator.onLine ? '…' : '📶 …';
    try {
      const r = await pointerMaintenant(type, sens, emp || null);
      const qui = emp && emp !== moi.id ? ((equipe.find(x => x.id === emp) || {}).nom || '') + ' — ' : '';
      if (r.enFile) toast(qui + 'Gardé hors ligne, partira tout seul 📶');
      else if (type === 'pause') toast(qui + (sens === 'debut' ? 'Pause commencée ☕' : 'Reprise du travail ✓'));
      else {
        const d = Array.isArray(r.data) ? r.data[0] : r.data;
        toast(qui + (sens === 'arrivee'
          ? 'Arrivée : ' + heureCourte(d && d.heure_arrivee)
          : 'Départ : ' + heureCourte(d && d.heure_depart)));
      }
      rendre();
    } catch (ex) { toast(ex.message, true); b.disabled = false; b.innerHTML = txt; }
  };
  $('#vue').querySelectorAll('[data-pointer]').forEach(b =>
    b.addEventListener('click', () => agir(b, 'pointage', b.dataset.pointer, b.dataset.emp)));
  $('#vue').querySelectorAll('[data-pause]').forEach(b =>
    b.addEventListener('click', () => agir(b, 'pause', b.dataset.pause, b.dataset.emp)));
  $('#vue').querySelectorAll('[data-corriger]').forEach(b => b.addEventListener('click', async () => {
    const emp = equipePointage().find(e => e.id === b.dataset.corriger);
    const pts = await API.pointagesJour(auj()).catch(() => []);
    boiteCorrectionPointage(emp, pts.find(x => x.employe_id === emp.id), auj());
  }));
}

/* ==========================================================================
   AGENDA
   Les créneaux proposés tiennent compte des 2 baies : un horaire n'est
   offert que si, à chaque minute du lavage (battement compris), moins de
   2 rendez-vous sont déjà en cours.
   ========================================================================== */
let jourAgenda = auj();
let rdvOuvert = false;
const rdvForm = { tel: '', nom: '', gabarit: 'berline', prestation: 'signature', heure: '', note: '' };

const ETAT_RDV = {
  en_attente_paiement: ['Attente d’acompte', 'neutre'],
  confirmee: ['Confirmé', 'marque'],
  honoree: ['Honoré ✓', 'succes'],
  absente: ['Absent', 'erreur'],
};

function creneauxLibres(resas, prestationId, gabaritId, d, nbBaies) {
  const duree = OCR.duree(prestationId, gabaritId);
  if (duree == null || !nbBaies) return [];
  const buf = OCR.CONFIG.battementMin;
  const occ = resas
    .filter(r => r.statut === 'confirmee' || r.statut === 'en_attente_paiement')
    .map(r => { const a = OCR.hm2min(heureCourte(r.heure_prevue)); return [a, a + (r.duree_min || 60) + buf]; });
  const mnt = new Date();
  const minMin = d === auj() ? mnt.getHours() * 60 + mnt.getMinutes() + 15 : 0;
  return OCR.creneaux(prestationId, gabaritId).filter(hm => {
    const a = OCR.hm2min(hm), b = a + duree + buf;
    if (a < minMin) return false;
    for (let t = a; t < b; t += 5)
      if (occ.filter(([x, y]) => t >= x && t < y).length >= nbBaies) return false;
    return true;
  });
}

/* Carte d'état des baies : pause et réactivation, motif obligatoire, audité. */
function carteBaies(baies) {
  return `<div class="ocr-carte" style="margin-bottom:var(--ocr-e4)">
    <div class="ocr-surtitre">Les baies</div>
    ${baies.map(b => `

        <span style="min-width:0">
          <span style="font-weight:600">${esc(b.nom)}</span>
          <span class="ocr-pastille ocr-pastille--${b.active ? 'succes' : 'erreur'}" style="margin-left:8px">${b.active ? 'Active' : 'En pause'}</span>
          ${!b.active && b.motif ? `<span class="ocr-mini" style="display:block;margin-top:4px">${esc(b.motif)}</span>` : ''}
        </span>
        <span style="flex:1"></span>
        ${peutCorriger() ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-baie="${b.id}" data-vers="${b.active ? 0 : 1}">
          ${b.active ? 'Mettre en pause' : 'Réactiver'}</button>` : ''}
      </div>`).join('')}
  </div>`;
}

function boiteBaie(b, activer) {
  const v = modale(`
    <h3 class="ocr-h2">${activer ? 'Réactiver' : 'Mettre en pause'} — ${esc(b.nom)}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">${activer
      ? 'La baie redevient réservable immédiatement, à la caisse comme en ligne.'
      : 'Plus aucun créneau ne sera proposé sur cette baie, à la caisse comme en ligne. Les rendez-vous déjà pris restent valables.'}
      Le changement est inscrit au journal à ton nom.</p>
    <label class="ocr-champ"><span class="ocr-label">Motif (obligatoire)</span>
      <input class="ocr-saisie" id="motifBaie" placeholder="${activer ? 'Travaux terminés' : 'Travaux en cours'}"></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>${activer ? 'Réactiver' : 'Mettre en pause'}</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    const motif = v.querySelector('#motifBaie').value.trim();
    if (!motif) return toast('Le motif est obligatoire.', true);
    e.target.disabled = true;
    const { error } = await API.basculerBaie({ p_baie: b.id, p_active: activer, p_motif: motif });
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    fermerModale(); toast(b.nom + (activer ? ' réactivée' : ' mise en pause')); rendre();
  });
}

async function vueAgenda() {

  const minutesPrises = actifs.reduce((s, r) => s + (r.duree_min || 60) + OCR.CONFIG.battementMin, 0);
  const tauxOcc = Math.min(100, Math.round(minutesPrises / minutesJour * 100));
  const estAuj = d === auj();
  const libres = rdvOuvert ? creneauxLibres(resas, rdvForm.prestation, rdvForm.gabarit, d, nbActives) : [];

        <div class="sub">${nbActives} baie(s) active(s) · ${OCR.min2hm(OCR.CONFIG.ouvertureMin)} – ${OCR.min2hm(OCR.CONFIG.fermetureMin)}</div></div>
    </div>

    ${carteBaies(baies)}

    }).join('') : '<div class="ocr-carte vide">Aucun rendez-vous ce jour.</div>'}`;

  // navigation
  $('#vue').querySelectorAll('[data-anav]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.anav);
    jourAgenda = n === 0 ? auj() : decaleJour(jourAgenda, n);

    rendre();
  }));

  // gestion des baies
  $('#vue').querySelectorAll('[data-baie]').forEach(b => b.addEventListener('click', () => {

  // formulaire
  const o = $('#rOuvrir'); if (o) o.addEventListener('click', () => { rdvOuvert = true; rendre(); });
  const fEl = $('#rFermer'); if (fEl) fEl.addEventListener('click', () => { rdvOuvert = false; rendre(); });
  ['rTel:tel', 'rNom:nom', 'rNote:note'].forEach(pair => {
    const [id, k] = pair.split(':');
    const el = $('#' + id); if (el) el.addEventListener('input', e => { rdvForm[k] = e.target.value; });
  });
  $('#vue').querySelectorAll('[data-rgab]').forEach(b => b.addEventListener('click', () => {
    rdvForm.gabarit = b.dataset.rgab; rdvForm.heure = ''; rendre();
  }));
  $('#vue').querySelectorAll('[data-rpresta]').forEach(b => b.addEventListener('click', () => {
    rdvForm.prestation = b.dataset.rpresta; rdvForm.heure = ''; rendre();
  }));
  $('#vue').querySelectorAll('[data-rheure]').forEach(b => b.addEventListener('click', () => {
    rdvForm.heure = b.dataset.rheure; rendre();
  }));
  const cr = $('#rCreer');
  if (cr) cr.addEventListener('click', async () => {
    cr.disabled = true;
    try {
      const clientId = await API.clientParTelOuCreation(rdvForm.tel, rdvForm.nom);
      const { error } = await API.creerRdv({
        client_id: clientId,
        prestation: rdvForm.prestation,
        gabarit: rdvForm.gabarit,
        date_prevue: d,
        heure_prevue: rdvForm.heure,
        duree_min: OCR.duree(rdvForm.prestation, rdvForm.gabarit),
        montant_total: OCR.prix(rdvForm.prestation, rdvForm.gabarit),
        statut: 'confirmee',
        canal: 'comptoir',
        note: rdvForm.note.trim() || null,
      });
      if (error) throw error;
      toast('Rendez-vous réservé à ' + rdvForm.heure);
      Object.assign(rdvForm, { tel: '', nom: '', heure: '', note: '' });
      rdvOuvert = false;
      rendre();
    } catch (ex) { toast(ex.message, true); cr.disabled = false; }
  });

  // actions sur les rendez-vous
  $('#vue').querySelectorAll('[data-arrive]').forEach(b => b.addEventListener('click', async () => {
    const r = resas.find(x => x.id === b.dataset.arrive);
    let nom = '', tel = '';
    if (r.client_id) {
      const { data } = await sb.from('clients').select('nom,telephone').eq('id', r.client_id).maybeSingle();
      if (data) { nom = data.nom || ''; tel = data.telephone || ''; }
    }
    // Le véhicule saisi par le client à la réservation (marque/modèle/plaque) —
    // avant, ces champs étaient vidés et il fallait tout retaper (remonté le 12/08).
    const veh = r.vehicules || {};
    Object.assign(form, { tel, nom, clientTrouve: null, gabarit: r.gabarit,
      marque: veh.marque || '', modele: veh.modele || '', immat: OCR.plaque(veh.immatriculation),
      vehTrouve: null,
      prestation: r.prestation, options: (r.options || []).slice(), remise: 0, manuel: 0,
      note: r.note || '', reservation: r.reference });
    onglet = 'saisie';
    rendre();
  }));
  $('#vue').querySelectorAll('[data-confirmer]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const { error } = await API.majRdv(b.dataset.confirmer, { statut: 'confirmee' });
    if (error) toast(error.message, true); else toast('Rendez-vous confirmé');
    rendre();
  }));
  $('#vue').querySelectorAll('[data-absent]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const { error } = await API.majRdv(b.dataset.absent, { statut: 'absente' });
    if (error) toast(error.message, true); else toast('Marqué absent');
    rendre();
  }));
  $('#vue').querySelectorAll('[data-annulrdv]').forEach(b => b.addEventListener('click', () => {
    const v = modale(`<h3 class="ocr-h2">Annuler ce rendez-vous ?</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Le créneau redevient disponible immédiatement.</p>
      <div style="display:flex;gap:9px">
        <button class="ocr-btn ocr-btn--fantome" data-fermer>Garder</button>
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire" data-ok>Annuler le rendez-vous</button></div>`);
    v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
    v.querySelector('[data-ok]').addEventListener('click', async () => {
      const { error } = await API.majRdv(b.dataset.annulrdv, { statut: 'annulee' });
      if (error) return toast(error.message, true);
      fermerModale(); toast('Rendez-vous annulé'); rendre();
    });
  }));
}

/* ==========================================================================
   CLIENTS
   Le fichier client remplace le carnet : on retrouve quelqu'un par son nom,
   son numéro ou sa plaque, on voit tout son historique, et on relance la
   saisie pré-remplie sans rien retaper.
   ========================================================================== */
const rech = { q: '', liste: null, cherche: false, fiche: null, vue: 'part', rapide: null };
let cliNouveau = null;   // brouillon de fiche client en cours de création

const dateFr = d => { const [a, m, j] = String(d || '').split('-'); return j ? j + '/' + m : (d || '—'); };
const numWhatsApp = t => String(t || '').replace(/\D/g, '').replace(/^0+/, '');
const joursDepuis = d => d ? Math.round((new Date(auj() + 'T12:00') - new Date(d + 'T12:00')) / 86400000) : null;

function ligneClientStats(c) {
  const jd = joursDepuis(c.dernier_passage);
  return `
    <button class="fiche" data-cli="${c.client_id || c.id}" style="display:block;width:100%;text-align:left;cursor:pointer">
      <div class="ligne1">
        <strong style="font:600 15px/1.2 var(--ocr-texte)">${esc(c.nom || 'Sans nom')}</strong>
        <span style="flex:1"></span>
        <span class="ocr-mini">${esc(c.telephone || 'Pas de numéro')}</span>
      </div>
      ${c.depense != null ? `<div class="ocr-mini" style="margin-top:5px">
        ${c.passages || 0} passage(s) · ${OCR.fcfa(c.depense)}${jd != null ? ' · il y a ' + jd + ' j' : ''}</div>` : ''}
    </button>`;
}

async function vueClients() {
  if (rech.fiche) return vueFicheClient();

  $('#vue').innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:var(--ocr-e4)">
      <button class="ocr-chip" data-cvue="part" aria-pressed="${rech.vue === 'part'}">Particuliers</button>
      <button class="ocr-chip" data-cvue="pro" aria-pressed="${rech.vue === 'pro'}">Entreprises</button>
    </div>
    <div id="zoneCli"></div>`;

  $('#vue').querySelectorAll('[data-cvue]').forEach(b => b.addEventListener('click', () => {
    rech.vue = b.dataset.cvue; rendre();
  }));

  if (rech.vue === 'pro') return vueEntreprises($('#zoneCli'));

  $('#zoneCli').innerHTML = `
    <div class="ocr-carte">
      <div class="ocr-surtitre">Rechercher un client</div>
      <label class="ocr-champ" style="margin:var(--ocr-e4) 0 var(--ocr-e3)">
        <span class="ocr-label">Nom, téléphone ou plaque</span>
        <input class="ocr-saisie" id="qCli" value="${esc(rech.q)}" placeholder="Koffi, 97 45 12 30, 1234 AB…"
               autocomplete="off" enterkeyhint="search">
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ocr-chip" data-rapide="relance" aria-pressed="${rech.rapide === 'relance'}">📣 À relancer (30 j+)</button>
        <button class="ocr-chip" data-rapide="meilleurs" aria-pressed="${rech.rapide === 'meilleurs'}">★ Meilleurs clients</button>
      </div>
    </div>
    ${cliNouveau ? formNouveauClient() : `
    <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" id="cliOuvrir" style="margin-top:var(--ocr-e4)">＋ Nouveau client</button>`}
    <div id="resCli" style="margin-top:var(--ocr-e4)"></div>`;

  const bo = $('#cliOuvrir');
  if (bo) bo.addEventListener('click', () => { cliNouveau = { gabarit: 'berline' }; rendre(); });
  brancherNouveauClient();

  const zone = $('#resCli');
  const brancherFiches = () => zone.querySelectorAll('[data-cli]').forEach(b => b.addEventListener('click', async () => {
    zone.innerHTML = '<div class="vide"><span class="tourne"></span></div>';
    try { rech.fiche = await API.ficheClient(b.dataset.cli); vueClients(); }
    catch (ex) { toast(ex.message, true); peindre(); }
  }));
  const peindre = () => {
    if (rech.cherche) { zone.innerHTML = '<div class="vide"><span class="tourne"></span></div>'; return; }
    if (rech.liste === null) { zone.innerHTML = '<div class="vide">Tape un nom, un numéro, une plaque — ou choisis une liste.</div>'; return; }
    if (!rech.liste.length) {
      zone.innerHTML = '<div class="vide">' + (rech.rapide === 'relance'
        ? 'Personne à relancer — tous tes clients sont venus dans les 30 derniers jours. 👍'
        : 'Aucun client trouvé.<br>Il sera créé automatiquement à la première saisie.') + '</div>';
      return;
    }
    zone.innerHTML = (rech.rapide === 'relance'
      ? '<p class="ocr-mini" style="margin:0 0 10px">Classés du plus gros client au plus petit — commence par le haut.</p>' : '')
      + rech.liste.map(ligneClientStats).join('');
    brancherFiches();
  };
  peindre();

  const chercherRapide = async mode => {
    rech.rapide = rech.rapide === mode ? null : mode;
    rech.q = '';
    if (!rech.rapide) { rech.liste = null; vueClients(); return; }
    rech.cherche = true; vueClients();
    try { rech.liste = await API.listeClients(rech.rapide); }
    catch (ex) { toast(ex.message, true); rech.liste = []; }
    rech.cherche = false; vueClients();
  };
  $('#zoneCli').querySelectorAll('[data-rapide]').forEach(b =>
    b.addEventListener('click', () => chercherRapide(b.dataset.rapide)));

  let minuteur;
  $('#qCli').addEventListener('input', e => {
    rech.q = e.target.value;
    rech.rapide = null;
    clearTimeout(minuteur);
    minuteur = setTimeout(async () => {
      if (rech.q.trim().length < 2) { rech.liste = null; peindre(); return; }
      rech.cherche = true; peindre();
      try { rech.liste = await API.chercherClients(rech.q); }
      catch (ex) { toast(ex.message, true); rech.liste = []; }
      rech.cherche = false; peindre();
    }, 320);
  });
}

/* ---------- nouveau client : la fiche se crée en 30 secondes ----------
   Même un client de passage mérite son numéro et sa voiture en base :
   s'il revient dans six mois, tout se relie tout seul par le téléphone. */
function formNouveauClient() {
  const d = cliNouveau;
  return `<div class="ocr-carte" style="margin-top:var(--ocr-e4);border-color:rgba(214,32,30,.35)">

      <label class="ocr-champ"><span class="ocr-label">Modèle</span>
        <input class="ocr-saisie" id="ncModele" value="${esc(d.modele || '')}" placeholder="RAV4"></label>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Immatriculation</span>
        <input class="ocr-saisie" id="ncImmat" value="${esc(d.immat || '')}" placeholder="${OCR.PLAQUE_EXEMPLES.voiture}"></label>
      <label class="ocr-champ"><span class="ocr-label">Note</span>
        <input class="ocr-saisie" id="ncNote" value="${esc(d.note || '')}" placeholder="De passage, en vacances…"></label>
    </div>
    <div style="display:flex;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" id="ncFermer">Fermer</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" id="ncCreer">Créer la fiche</button>
    </div>
  </div>`;
}

function brancherNouveauClient() {
  if (!cliNouveau) return;
  const lire = () => Object.assign(cliNouveau, {
    nom: $('#ncNom').value, tel: $('#ncTel').value, marque: $('#ncMarque').value,
    modele: $('#ncModele').value, immat: $('#ncImmat').value, note: $('#ncNote').value,
  });
  $('#zoneCli').querySelectorAll('[data-ncgab]').forEach(b => b.addEventListener('click', () => {
    lire(); cliNouveau.gabarit = b.dataset.ncgab; rendre();
  }));
  brancherPlaque($('#ncImmat'), propre => { cliNouveau.immat = propre; });
  $('#ncFermer').addEventListener('click', () => { cliNouveau = null; rendre(); });
  $('#ncCreer').addEventListener('click', async e => {
    lire();
    if (!String(cliNouveau.nom || '').trim()) return toast('Le nom est obligatoire.', true);
    if (!String(cliNouveau.tel || '').trim()) return toast('Le téléphone est obligatoire — c’est lui qui relie tout.', true);
    e.target.disabled = true;
    try {
      const r = await API.creerClient(cliNouveau);
      if (r.existant) {
        toast('Ce numéro existe déjà : fiche de ' + r.existant.nom);
        rech.fiche = await API.ficheClient(r.existant.id);
      } else {
        toast('Fiche créée ✓');
        rech.fiche = await API.ficheClient(r.id);
      }
      cliNouveau = null;
      rendre();
    } catch (ex) { toast(ex.message, true); e.target.disabled = false; }
  });
}

/* Le client a oublié le code de son espace : on le remet à zéro, il en
   choisit un nouveau depuis son téléphone (avec sa plaque comme preuve).
   À ne faire qu'en le voyant — c'est l'accès à son historique. */
function boiteResetCodeClient(client) {
  const v = modale(`
    <h3 class="ocr-h2">Code oublié — ${esc(client.nom || 'ce client')}</h3>
    <p class="ocr-petit" style="margin:10px 0 var(--ocr-e4)">Son code sera effacé et il pourra en choisir
      un nouveau depuis son téléphone, en donnant sa plaque. Ses véhicules, son historique
      et sa fidélité ne bougent pas.</p>
    <div class="ocr-message ocr-message--alerte" style="margin-bottom:var(--ocr-e4)"><span>⚠</span><div>
      <strong>Vérifie que c'est bien lui.</strong><br>Ce code protège son historique et ses reçus.
      À faire seulement en face à face. L'action est tracée à ton nom.</div></div>
    <div style="display:flex;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Remettre son code à zéro</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);

    fermerModale();

    rendre();

}

/* Lier un client à une entreprise partenaire (Ehu Motors…) : ses lavages
   auront la remise automatiquement, quel que soit le véhicule.
   Réservé à la direction et au comptable — c'est de l'argent. */
async function boiteLierEntreprise(client) {
  let liste = [];
  try { liste = await API.entreprises(); } catch (ex) { return toast(ex.message, true); }
  const partenaires = liste.filter(e => e.remise_pct > 0 || e.id === client.entreprise_id);
  const v = modale(`

      sa propre voiture, peu importe. Tout est tracé au journal.</p>
    ${partenaires.length ? partenaires.map(e => `
      <button class="presta" data-lier="${e.id}" aria-pressed="${client.entreprise_id === e.id}">
        <span class="coche">${client.entreprise_id === e.id ? '✓' : ''}</span>

          <span class="du">remise employés ${e.remise_pct} %</span></span>

        style="margin-top:var(--ocr-e3);color:var(--ocr-argent-2)">Délier — plus aucune remise automatique</button>` : ''}
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:var(--ocr-e4)">Fermer</button>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);

/* ---------- entreprises : le carnet de prospection ---------- */
const STATUTS_PRO = [

  ['rdv', 'RDV pris', 'marque'],

let proEdite = null;   // null, ou le brouillon en cours d'édition

async function vueEntreprises(el) {
  el.innerHTML = '<div class="vide"><span class="tourne"></span></div>';

  try {
    liste = await API.entreprises();

function boiteRemisePartenaire(e) {

      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Enregistrer</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async ev => {
    const pct = Number(v.querySelector('#rpPct').value);
    if (!(pct >= 0 && pct <= 100)) return toast('Entre 0 et 100.', true);

/* ==========================================================================
   BILAN
   L'indicateur qui compte n'est pas le chiffre d'affaires : c'est le franc
   gagné par heure de baie. Deux baies × 12 h = 24 heures-baie par jour,
   c'est la seule ressource qu'on ne peut pas fabriquer.
   ========================================================================== */
let bilanJours = 7;

// Charges fixes mensuelles (loyer 150 000 + salaires 202 000 + électricité
// 60 000 + eau 25 000 + internet 15 000 + provision équipement 40 000).
// Volontairement ICI et pas dans le socle : le socle alimente aussi le site
// public, et ces chiffres n'ont rien à faire dans une page publique.
const CHARGES_FIXES = 492000;

function ilYA(n) {
  const d = new Date(); d.setDate(d.getDate() - (n - 1));
  return d.toLocaleDateString('en-CA');
}

async function vueBilan() {
  const du = ilYA(bilanJours), au = auj();
  const [{ jours, mix }, ptsRH, baiesRH, temps] = await Promise.all([
    API.periode(du, au), API.pointagesPeriode(du, au), API.baies().catch(() => []),
    API.tempsLavage(du).catch(() => []),
  ]);

  // temps réels chronométrés, regroupés par prestation + gabarit
  const parChrono = {};
  temps.forEach(r => {
    const k = r.prestation + '|' + r.gabarit;
    const o = parChrono[k] || (parChrono[k] = { prestation: r.prestation, gabarit: r.gabarit, n: 0, somme: 0, max: 0 });
    o.n += Number(r.nombre) || 0;
    o.somme += (Number(r.minutes_moyennes) || 0) * (Number(r.nombre) || 0);
    o.max = Math.max(o.max, Number(r.minutes_max) || 0);
  });
  const lignesChrono = Object.values(parChrono).filter(o => o.n > 0).map(o => {
    const ref = OCR.duree(o.prestation, o.gabarit);
    const moy = Math.round(o.somme / o.n);
    return { ...o, moy, ref, ecart: ref ? Math.round((moy / ref - 1) * 100) : null };
  }).sort((a, b) => b.n - a.n);
  const nbBaiesActives = Math.max(1, baiesRH.filter(b => b.active).length);

  const S = (a, k) => a.reduce((s, x) => s + (Number(x[k]) || 0), 0);

  const bo = $('#btnObjectifs');
  if (bo) bo.addEventListener('click', () => boiteObjectifs(obj));
  $('#vue').querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.dir;
    if (id === 'bilan' || id === 'cloture' || id === 'journal' || id === 'pointage') {
      onglet = id; rendre(); window.scrollTo(0, 0); return; }
    if (id === 'objectifs') { const obj = await API.objectifs().catch(() => null); if (obj) boiteObjectifs(obj); return; }
    if (id === 'baies') { onglet = 'agenda'; rendre(); window.scrollTo(0, 0); return; }
    if (id === 'absences') return boiteAbsences();
    if (id === 'repos') return boitePlanning();
    if (id === 'compte') return boiteCompte();
  }));
}

async function vueJournal() {
  const lignes = await API.journal(60);
  $('#vue').innerHTML = `
    ${retourDirection()}
    <div class="ocr-carte">
      <div class="ocr-surtitre">Journal d’activité</div>
      <p class="ocr-mini" style="margin:8px 0 var(--ocr-e4)">Les 60 dernières actions — encaissements, annulations,
        pointages, corrections, baies, absences. Rien ne s’efface.</p>
      ${lignes.length ? lignes.map(r => `
        <div style="padding:9px 0;border-bottom:1px solid var(--ocr-sep)">
          <span class="ocr-petit" style="display:block">${esc(r.quoi)}</span>
          <span class="ocr-mini">${esc(r.qui_nom || 'Système')}${(r.quand || r.cree_le) ? ' · ' +
            new Date(r.quand || r.cree_le).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</span>
        </div>`).join('')
      : '<div class="vide">Journal vide.</div>'}
    </div>`;
  brancherRetourDirection();
}

/* ---------- démarrage ---------- */
(async function () {
  bandeau();
  try {
    sb = MODE_DEMO ? creerClientDemo()
                   : window.supabase.createClient(CONFIG_SUPABASE.url, CONFIG_SUPABASE.cle,
                       { auth: { experimental: { passkey: true } } });
  } catch (ex) {
    document.body.innerHTML = '<div class="ocr-message ocr-message--erreur" style="margin:40px auto;max-width:420px">' +
      '<span>⛔</span><div><strong>Connexion impossible</strong><br>La bibliothèque Supabase n’a pas pu être chargée. ' +
      'Vérifiez votre connexion internet.</div></div>';
    return;
  }
  brancherRecuperation();
  const { data } = await sb.auth.getSession();
  if (data && data.session) await demarrer();
})();
</script>
