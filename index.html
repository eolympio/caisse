/* ==========================================================================
   POINTAGE
   L'heure vient toujours du serveur (fuseau de Cotonou) : le téléphone
   ne peut pas mentir. L'arrivée ne s'écrase jamais, le départ garde la
   dernière valeur. Corrections réservées au manager, comptable, direction.
   ========================================================================== */
const peutCorriger = () => ['manager', 'comptable', 'direction'].includes(roleEffectif());

let REGLAGES = null;   // position de l'atelier, chargée à la connexion

/* Position du téléphone. Rejette avec un message clair si refusée. */
const maPosition = () => new Promise((res, rej) => {
  if (!navigator.geolocation) return rej(new Error('Localisation non disponible sur cet appareil'));
  navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) }),
    e => rej(new Error(e.code === 1
      ? 'Autorise la localisation pour pointer (Réglages → Safari → Position)'
      : 'Position introuvable — réessaie à ciel ouvert')),
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
});

/* ══════════════════════════════════════════════════════════════════════════
   POINTAGE HORS LIGNE
   Le réseau tombe souvent ; une arrivée ratée, c'est une heure de travail
   perdue pour quelqu'un. Alors on n'échoue jamais : le pointage part tout de
   suite s'il y a du réseau, sinon il attend dans le téléphone et s'envoie dès
   que ça revient — avec l'HEURE RÉELLE du geste, pas celle de l'envoi.

   Le GPS d'un téléphone fonctionne sans réseau : on joint donc la position
   même hors ligne, et c'est le SERVEUR qui vérifie les 150 m à l'arrivée du
   message. Le garde-fou reste entier. Faute de position, le pointage passe
   quand même mais reste marqué « hors ligne » — perdre l'heure d'un employé
   de bonne foi serait pire que devoir lui poser la question.
   ══════════════════════════════════════════════════════════════════════════ */
const CLE_FILE = MODE_DEMO ? 'ocr-file-demo' : 'ocr-file-pointage';
let filePointage = [];
try { filePointage = JSON.parse(localStorage.getItem(CLE_FILE) || '[]') || []; } catch (e) {}
const sauverFile = () => { try { localStorage.setItem(CLE_FILE, JSON.stringify(filePointage)); } catch (e) {} };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

const heureLocale = () => new Date().toTimeString().slice(0, 8);

/* Position du téléphone, sans jamais faire échouer le pointage : si elle est
   refusée ou introuvable, on part sans — le serveur tranchera. */
async function positionSiPossible() {
  if (!(REGLAGES && REGLAGES.lat != null && REGLAGES.lng != null)) return null;
  try { return await maPosition(); } catch (e) { return null; }
}

/* Envoie un geste de pointage, ou le met en file s'il ne passe pas. */
async function envoyerGeste(g, silencieux) {
  const args = g.type === 'pause'
    ? { p_sens: g.sens, p_employe: g.employe || null, p_heure: g.heure, p_jour: g.jour,
        p_hors_ligne: g.horsLigne, p_cle: g.cle }
    : { p_sens: g.sens, p_employe: g.employe || null, p_heure: g.heure, p_jour: g.jour,
        p_hors_ligne: g.horsLigne, p_lat: g.lat, p_lng: g.lng, p_precision: g.precision };
  const { data, error } = g.type === 'pause' ? await API.pause(args) : await API.pointer(args);
  if (!error) return { ok: true, data };
  // Le serveur a répondu et refuse : réessayer éternellement n'y changera
  // rien. On le sort de la file et on le dit — sauf hors ligne, où l'échec
  // vient du réseau, pas du serveur.
  if (!navigator.onLine) return { ok: false, reseau: true };
  return { ok: false, message: error.message };
}

/* Vide la file. Appelée au démarrage, au retour du réseau, et après chaque
   pointage réussi. Silencieuse quand il n'y a rien à faire. */
let envoiEnCours = false;
async function viderFile() {
  if (envoiEnCours || !filePointage.length || !moi || !navigator.onLine) return;
  envoiEnCours = true;
  const restants = [], refuses = [];
  let envoyes = 0;
  for (const g of filePointage) {
    const r = await envoyerGeste(g, true);
    if (r.ok) envoyes++;
    else if (r.reseau) restants.push(g);
    else refuses.push({ g, message: r.message });
  }
  filePointage = restants; sauverFile();
  envoiEnCours = false;
  if (envoyes) toast(envoyes + ' pointage' + (envoyes > 1 ? 's' : '') + ' en attente envoyé' + (envoyes > 1 ? 's' : '') + ' ✓');
  refuses.forEach(r => toast('Pointage refusé : ' + r.message, true));
  if (envoyes || refuses.length) rendre(true);
}
window.addEventListener('online', () => { toast('Connexion revenue'); viderFile(); });
window.__ocrViderFile = viderFile;   // testable

/* LE point d'entrée de tout pointage, en ligne comme hors ligne.
   Renvoie { enFile: true } quand le geste a été mis de côté. */
async function pointerMaintenant(type, sens, employe) {
  const pourMoi = !employe || employe === moi.id;
  const g = {
    type, sens, employe: employe || null,
    heure: heureLocale(), jour: auj(),
    horsLigne: false, cle: uuid(),
  };
  if (type === 'pointage' && pourMoi) {
    const pos = await positionSiPossible();
    if (pos) { g.lat = pos.lat; g.lng = pos.lng; g.precision = pos.precision; }
  }
  // En ligne : on laisse le serveur mettre SON heure (plus fiable que celle
  // du téléphone) en n'envoyant pas d'heure déclarée.
  if (navigator.onLine) {
    const direct = { ...g, heure: null, jour: null };
    const r = await envoyerGeste(direct);
    if (r.ok) { await viderFile(); return { ok: true, data: r.data }; }
    if (!r.reseau) throw new Error(r.message);
  }
  // Hors ligne : on garde l'heure du geste et on attend le réseau.
  g.horsLigne = true;
  filePointage.push(g); sauverFile();
  return { enFile: true };
}

/* Aperçu local de la file, pour que l'écran montre tout de suite ce qui a été
   pointé hors ligne au lieu d'avoir l'air de n'avoir rien enregistré. */
function fileDe(empId, jour) {
  return filePointage.filter(g => (g.employe || moi.id) === empId && g.jour === jour);
}

const debutSemaine = () => {
  const d = new Date(auj() + 'T12:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // lundi

const debutMois = () => auj().slice(0, 8) + '01';

function barreObjectif(fait, cible) {
  if (!cible) return '<span class="ocr-mini">à définir</span>';
  const pct = Math.min(100, Math.round(fait / cible * 100));
  return `<div style="display:flex;align-items:center;gap:10px">
    <div style="flex:1;height:8px;border-radius:999px;background:var(--ocr-trace);overflow:hidden">
      <div style="height:100%;width:${pct}%;border-radius:999px;background:${pct >= 100 ? 'var(--ocr-succes)' : 'var(--ocr-rouge)'}"></div>
    </div>
    <span style="font:600 12px/1 var(--ocr-texte);font-variant-numeric:tabular-nums;flex:none">${pct} %</span>

/* Poser un fichier dans les téléchargements du téléphone. Déjà écrit dans la
   sauvegarde ; sorti ici pour que le rapport RH s'en serve aussi. */
function telechargerFichier(nom, contenu, type) {
  const a = document.createElement('a');

const fmtDuree = min => {
  if (min == null || min <= 0) return '—';
  return Math.floor(min / 60) + ' h ' + String(Math.round(min % 60)).padStart(2, '0');
};
const pausesDe = p => (p && p.pointage_pauses) || [];
/* Minutes de pause d'une journée. Une pause encore ouverte compte jusqu'à
   maintenant si on est aujourd'hui — sinon elle s'arrête à l'heure de départ,
   pour ne pas gonfler indéfiniment une pause que personne n'a fermée. */
function minutesPauses(p) {
  const fin = p && p.depart ? OCR.hm2min(heureCourte(p.depart))
            : (p && p.jour === auj() ? OCR.hm2min(heureCourte(heureLocale())) : null);
  return pausesDe(p).reduce((s, x) => {
    const d = OCR.hm2min(heureCourte(x.debut));
    const f = x.fin ? OCR.hm2min(heureCourte(x.fin)) : fin;
    return f != null && f > d ? s + (f - d) : s;
  }, 0);
}
const pauseEnCours = p => pausesDe(p).find(x => !x.fin) || null;

/* ── LES RÈGLES DE LA JOURNÉE (14/08) ──────────────────────────────────────
   « Les horaires d'ouverture c'est 9 h – 19 h. Les employés doivent être là
     entre 8 h 30 et 9 h pour débuter la journée. Et après ils finissent après
     avoir fait le nettoyage. » — « Une pause par jour est obligatoire 45 min.
     Si ils ne la prennent pas c'est pas grave mon niveau, mais on doit voir
     quelque part qu'ils n'ont pas pris de pause. » (Edwin)
   Donc : rien ne bloque jamais un pointage. Tout se VOIT.
   Les valeurs viennent des réglages en base — modifiables sans republier. */
const REGLE = () => ({
  arriveeFin: (REGLAGES && REGLAGES.arrivee_fin) ? OCR.hm2min(String(REGLAGES.arrivee_fin).slice(0, 5))
                                                 : OCR.CONFIG.arriveeFin,
  arriveeDebut: (REGLAGES && REGLAGES.arrivee_debut) ? OCR.hm2min(String(REGLAGES.arrivee_debut).slice(0, 5))
                                                     : OCR.CONFIG.arriveeDebut,
  pause: (REGLAGES && REGLAGES.pause_min != null) ? Number(REGLAGES.pause_min) : OCR.CONFIG.pauseMin,
  ouverture: (REGLAGES && REGLAGES.ouverture) ? String(REGLAGES.ouverture).slice(0, 5) : '09:00',
  fermeture: (REGLAGES && REGLAGES.fermeture) ? String(REGLAGES.fermeture).slice(0, 5) : '19:00',
});

/* Ce qui cloche dans une journée pointée — chaque anomalie porte son mot.
   Le jour EN COURS ne reproche rien : la pause n'est pas « non prise »
   à 10 h du matin, elle est simplement « pas encore prise ». */
function ecartsPointage(pt) {
  const R = REGLE(), out = [];
  if (!pt || !pt.arrivee) return out;
  const enCours = pt.jour === auj() && !pt.depart;
  const arr = OCR.hm2min(heureCourte(pt.arrivee));
  if (arr != null && arr > R.arriveeFin)
    out.push({ cle: 'retard', mot: 'arrivé à ' + heureCourte(pt.arrivee) +
      ' (attendu avant ' + OCR.min2hm(R.arriveeFin) + ')', ton: 'ambre' });
  const pz = minutesPauses(pt);
  if (!enCours) {
    if (pz === 0) out.push({ cle: 'sans-pause', mot: 'aucune pause prise', ton: 'ambre' });
    else if (pz < R.pause) out.push({ cle: 'pause-courte',
      mot: 'pause de ' + fmtDuree(pz) + ' (' + R.pause + ' min attendues)', ton: 'ambre' });
  }
  if (!pt.depart && pt.jour < auj())
    out.push({ cle: 'sans-depart', mot: 'départ jamais pointé', ton: 'rouge' });
  return out;
}
const pastilleEcart = e => '<span class="ocr-mini" style="color:var(--ocr-' +

/* Heures travaillées = présence − pauses. C'est ce chiffre qui compte. */
const minutesPointage = p => (p && p.arrivee && p.depart)
  ? Math.max(0, OCR.hm2min(heureCourte(p.depart)) - OCR.hm2min(heureCourte(p.arrivee)) - minutesPauses(p))
  : null;

              <span class="ocr-mini">${OCR.fcfa(caFait)} / ${OCR.fcfa(o.ca)}</span></div>${barreObjectif(caFait, o.ca)}` : ''}
          ${o.signatures ? `<div style="display:flex;gap:8px;align-items:baseline;margin:${o.ca ? '8px' : '0'} 0 4px">

function boiteObjectifs(obj) {
  const v = modale(`
    <h3 class="ocr-h2">Objectifs de l’équipe</h3>

/* La photo est recadrée en carré et réduite à 256 px avant l'envoi :
   quelques dizaines de Ko, jamais la photo brute de 5 Mo du téléphone. */
async function redimensionnerPhoto(fichier, cote) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('Image illisible'));
    i.src = URL.createObjectURL(fichier);
  });
  const c = document.createElement('canvas');
  c.width = c.height = cote;
  const s = Math.min(img.width, img.height);
  c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, cote, cote);
  URL.revokeObjectURL(img.src);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}

async function envoyerPhoto(fichier) {
  const blob = await redimensionnerPhoto(fichier, 256);
  if (!blob) throw new Error('Image illisible');
  let url;
  if (MODE_DEMO) {
    url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  } else {
    const chemin = moi.id + '.jpg';
    const { error } = await sb.storage.from('avatars').upload(chemin, blob, { upsert: true, contentType: 'image/jpeg' });
    if (error) throw error;
    url = sb.storage.from('avatars').getPublicUrl(chemin).data.publicUrl + '?v=' + Date.now();
  }
  const r = await sb.rpc('ocr_changer_photo', { p_photo: url });
  if (r.error) throw r.error;
  moi.photo = url;
  const em = equipe.find(x => x.id === moi.id); if (em) em.photo = url;
  return url;
}

/* ── LA FIN DE LA JOURNÉE DE TRAVAIL (14/08) ───────────────────────────────
   Edwin : « J'aimerais que l'atelier ne ferme pas vraiment à 19h car des fois
   ils vont vouloir faire des extras. Donc l'atelier doit fermer quand il n'y a
   plus d'employés. Et Samuel doit mettre quelque part qu'ils ont fermé le car
   wash pour la journée. Avant que Guénolé valide. »

   DEUX HEURES QUI N'ONT RIEN À VOIR, et qu'il ne faut pas confondre :
     · 09:00 – 19:00 reste l'OUVERTURE AU PUBLIC. C'est jusque-là qu'un client
       peut réserver un créneau, et c'est cette amplitude qui sert à mesurer la

     · La FIN DE LA JOURNÉE DE TRAVAIL n'a plus d'heure fixe. Un extra peut
       tenir l'équipe jusqu'à 21 h ; c'est normal, et ça doit se voir.
   Elle ne s'invente donc pas à partir d'une horloge : elle se DÉCLARE.

   Ne bloque pas la clôture — choix d'Edwin, et c'est la règle de la maison :
   rien ne bloque, tout se voit. Un Guénolé arrêté à 21 h parce que Samuel a
   oublié un bouton, c'est un coup de téléphone pour rien. */
const peutFermer = () => moi && ['manager', 'comptable', 'direction'].includes(roleEffectif());

/* L'OUVERTURE NE SE DÉCLARE PAS — ELLE SE CONSTATE (14/08, v57)
   Edwin, à ma question sur un bouton « ouvrir » : « automatique, au premier
   pointage ». Il a raison, et c'est la bonne asymétrie :
     · la FERMETURE répond à une question que Guénolé se pose vraiment
       (« la journée est-elle finie, puis-je signer ? ») — elle mérite un geste ;
     · l'OUVERTURE ne répond à aucune question : quelqu'un est là, l'atelier
       est ouvert. Un bouton de plus n'aurait rien appris à personne, et se
       serait fait oublier — or un avertissement qu'on oublie affaiblit tous
       les autres.
   Donc : aucune colonne, aucun bouton, aucune migration. L'heure d'ouverture
   EST la première arrivée pointée du jour. Elle vaut aussi pour le passé, sans
   rien reconstituer. */
function ouvertureDuJour(pts) {
  const arr = (pts || []).filter(x => x.arrivee)
    .sort((a, b) => (heureCourte(a.arrivee) < heureCourte(b.arrivee) ? -1 : 1));
  if (!arr.length) return null;
  return { heure: heureCourte(arr[0].arrivee),
           qui: (equipe.find(e => e.id === arr[0].employe_id) || {}).nom || '' };
}

    if (au && au < du) return toast('La fin est avant le début.', true);
    e.target.disabled = true;
    const { error } = await API.declarerAbsence({ employe_id: choixEmp, du, au,
      motif: choixMotif, note: v.querySelector('#aNote').value.trim() || null, declare_par: moi.id });
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    const emp = equipe.find(x => x.id === choixEmp) || {};
    await API.tracer('Absence déclarée : ' + (emp.nom || '?') + ' (' + MOTIFS_ABSENCE[choixMotif][0] + ')' +
      (au ? ' du ' + du + ' au ' + au : ' à partir du ' + du));
    fermerModale(); toast('Absence déclarée'); rendre();
  });
}

function brancherEquipe(pts, d) {
  const ba = $('#btnAbsences');
  if (ba) ba.addEventListener('click', boiteAbsences);
  const bp = $('#btnPlanning');
  if (bp) bp.addEventListener('click', boitePlanning);
  // Même chemin que l'écran Pointage : hors ligne, le geste est mis de côté.
  $('#vue').querySelectorAll('[data-pointer]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      const r = await pointerMaintenant('pointage', b.dataset.pointer, b.dataset.emp || null);
      if (r.enFile) toast('Gardé hors ligne, partira tout seul 📶');
      else {
        const d = Array.isArray(r.data) ? r.data[0] : r.data;
        toast(b.dataset.pointer === 'arrivee'
          ? 'Arrivée pointée à ' + heureCourte(d && d.heure_arrivee)
          : 'Départ pointé à ' + heureCourte(d && d.heure_depart));
      }
      rendre();
    } catch (ex) { toast(ex.message, true); b.disabled = false; }
  }));
  $('#vue').querySelectorAll('[data-corriger]').forEach(b => b.addEventListener('click', () => {
    const emp = equipePointage().find(e => e.id === b.dataset.corriger);
    const p = pts.find(x => x.employe_id === emp.id);
    boiteCorrectionPointage(emp, p, d);
  }));
}

function boiteCorrectionPointage(emp, p, d) {
  const v = modale(`
    <h3 class="ocr-h2">Corriger — ${esc(emp.nom)}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">${jourLong(d)}. La correction est inscrite au journal à ton nom.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Arrivée</span>
        <input class="ocr-saisie" id="cArr" type="time" value="${p && p.arrivee ? heureCourte(p.arrivee) : ''}"></label>
      <label class="ocr-champ"><span class="ocr-label">Départ</span>
        <input class="ocr-saisie" id="cDep" type="time" value="${p && p.depart ? heureCourte(p.depart) : ''}"></label>
    </div>
    <label class="ocr-champ"><span class="ocr-label">Motif</span>
      <input class="ocr-saisie" id="cMotif" placeholder="Téléphone déchargé, pointage oublié…"></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Enregistrer</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    const arr = v.querySelector('#cArr').value, dep = v.querySelector('#cDep').value;
    const motif = v.querySelector('#cMotif').value.trim();
    if (!arr && !dep) return toast('Renseigne au moins une heure.', true);
    if (arr && dep && OCR.hm2min(dep) < OCR.hm2min(arr)) return toast('Le départ est avant l’arrivée.', true);
    e.target.disabled = true;
    const patch = { arrivee: arr || null, depart: dep || null, note: motif || null,
                    arrivee_par: moi.id, depart_par: moi.id };
    const { error } = await API.corrigerPointage(p ? p.id : null, emp.id, d, patch);
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    await API.tracer('Pointage de ' + emp.nom + ' corrigé (' + d + (motif ? ' — ' + motif : '') + ')');
    fermerModale(); toast('Pointage corrigé'); rendre();
  });
}

/* Écran de pointage. Le technicien y pointe pour lui ; le manager (et la

async function vuePointage() {
  const jePointe = equipePointage().some(e => e.id === moi.id);

  const oublis = mes.filter(x => x.arrivee && !x.depart && x.jour < auj()).length;
  const mesEnFile = fileDe(moi.id, auj());

  // Direction et comptabilité arrivent ici par une tuile du panneau Direction :
  // Pointage n'est PAS un de leurs onglets du bas, il leur faut donc un retour
  // explicite (sinon plus rien n'indique où l'on est — retour du 12/08).
  const retour = peutCloturer() && roleEffectif() !== 'manager';

      <strong>${filePointage.length} pointage${filePointage.length > 1 ? 's' : ''} en attente de réseau</strong><br>
      Ils sont enregistrés dans ce téléphone avec leur heure exacte et partiront tout seuls
      dès que la connexion revient. Rien n'est perdu.
      ${navigator.onLine ? '<br><button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" data-envoyer style="margin-top:8px">Envoyer maintenant</button>' : ''}

        ${!auJour || !auJour.arrivee ? (mesEnFile.length ? 'Pointé hors ligne' : 'Pas encore pointé')

/* ── L'ÉQUIPE SUR LE MOIS (14/08) ──────────────────────────────────────────
   Guénolé est directeur financier ET ressources humaines : il lui faut le mois
   entier en un écran, pas une ligne par jour à recomposer de tête. Jours
   travaillés, heures, retards, journées sans pause — et les départs jamais
   pointés, qui rendent les heures fausses. */
function carteEquipeMois(pts) {
  const R = REGLE();
  const lignes = equipePointage().map(e => {
    const p = pts.filter(x => x.employe_id === e.id && x.arrivee);
    const heures = p.reduce((s, x) => s + (minutesPointage(x) || 0), 0);
    const compte = cle => p.filter(x => ecartsPointage(x).some(y => y.cle === cle)).length;
    return { e, jours: p.length, heures,
             retards: compte('retard'),
             sansPause: compte('sans-pause') + compte('pause-courte'),
             sansDepart: compte('sans-depart') };
  }).filter(l => l.jours || l.sansDepart);
  if (!lignes.length) return '';
  return `<div class="ocr-carte" style="margin-top:var(--ocr-e4)">
    <div class="ocr-surtitre">L’équipe ce mois</div>
    <p class="ocr-mini" style="margin:8px 0 var(--ocr-e3)">Depuis le 1er du mois. Les heures excluent
      les pauses. Une journée sans départ pointé ne compte aucune heure — c’est ce qu’il faut corriger
      en premier.</p>
    ${lignes.map(l => `
      <div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ocr-sep)">
        ${avatar(l.e, 34)}
        <span style="min-width:0;flex:1">
          <span style="font-weight:600;display:block">${esc(l.e.nom)}</span>
          <span class="ocr-mini">${pluriel(l.jours, 'jour')} · ${fmtDuree(l.heures)}</span>
          ${l.sansDepart ? '<span class="ocr-mini" style="display:block;color:var(--ocr-erreur)">⚠ ' +
            pluriel(l.sansDepart, 'départ') + ' jamais pointé' + (l.sansDepart > 1 ? 's' : '') + '</span>' : ''}
          ${l.retards ? '<span class="ocr-mini" style="display:block;color:var(--ocr-ambre)">' +
            pluriel(l.retards, 'arrivée') + ' après ' + OCR.min2hm(R.arriveeFin) + '</span>' : ''}
          ${l.sansPause ? '<span class="ocr-mini" style="display:block;color:var(--ocr-ambre)">' +
            pluriel(l.sansPause, 'journée') + ' sans les ' + R.pause + ' min de pause</span>' : ''}
        </span>
      </div>`).join('')}
  </div>`;
}

                 ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit" data-pause="fin" data-emp="${e.id}">Reprend</button>`

/* Un seul câblage pour tous les boutons de pointage de l'écran — le mien comme
   ceux de l'équipe. Le geste ne peut pas échouer : hors ligne, il est mis de côté. */
function brancherGestesPointage() {
  const be = $('#vue').querySelector('[data-envoyer]');
  if (be) be.addEventListener('click', async () => { be.disabled = true; await viderFile(); rendre(); });
  const ba = $('#btnAbsences');
  if (ba) ba.addEventListener('click', boiteAbsences);

  const agir = async (b, type, sens, emp) => {
    b.disabled = true;
    const txt = b.innerHTML;
    b.textContent = navigator.onLine ? '…' : '📶 …';
    try {
      const r = await pointerMaintenant(type, sens, emp || null);
      const qui = emp && emp !== moi.id ? ((equipe.find(x => x.id === emp) || {}).nom || '') + ' — ' : '';
      if (r.enFile) toast(qui + 'Gardé hors ligne, partira tout seul 📶');
      else if (type === 'pause') toast(qui + (sens === 'debut' ? 'Pause commencée ☕' : 'Reprise du travail ✓'));
      else {
        const d = Array.isArray(r.data) ? r.data[0] : r.data;
        toast(qui + (sens === 'arrivee'
          ? 'Arrivée : ' + heureCourte(d && d.heure_arrivee)
          : 'Départ : ' + heureCourte(d && d.heure_depart)));
      }
      rendre();
    } catch (ex) { toast(ex.message, true); b.disabled = false; b.innerHTML = txt; }
  };
  $('#vue').querySelectorAll('[data-pointer]').forEach(b =>
    b.addEventListener('click', () => agir(b, 'pointage', b.dataset.pointer, b.dataset.emp)));
  $('#vue').querySelectorAll('[data-pause]').forEach(b =>
    b.addEventListener('click', () => agir(b, 'pause', b.dataset.pause, b.dataset.emp)));
  $('#vue').querySelectorAll('[data-corriger]').forEach(b => b.addEventListener('click', async () => {
    const emp = equipePointage().find(e => e.id === b.dataset.corriger);
    const pts = await API.pointagesJour(auj()).catch(() => []);
    boiteCorrectionPointage(emp, pts.find(x => x.employe_id === emp.id), auj());
  }));
}

/* ==========================================================================
   AGENDA
   Les créneaux proposés tiennent compte des 2 baies : un horaire n'est
   offert que si, à chaque minute du lavage (battement compris), moins de
   2 rendez-vous sont déjà en cours.
   ========================================================================== */
let jourAgenda = auj();
let rdvOuvert = false;
const rdvForm = { tel: '', nom: '', gabarit: 'berline', prestation: 'signature', heure: '', note: '' };

const ETAT_RDV = {
  en_attente_paiement: ['Attente d’acompte', 'neutre'],
  confirmee: ['Confirmé', 'marque'],
  honoree: ['Honoré ✓', 'succes'],
  absente: ['Absent', 'erreur'],
};

function creneauxLibres(resas, prestationId, gabaritId, d, nbBaies) {
  const duree = OCR.duree(prestationId, gabaritId);
  if (duree == null || !nbBaies) return [];
  const buf = OCR.CONFIG.battementMin;
  const occ = resas
    .filter(r => r.statut === 'confirmee' || r.statut === 'en_attente_paiement')
    .map(r => { const a = OCR.hm2min(heureCourte(r.heure_prevue)); return [a, a + (r.duree_min || 60) + buf]; });
  const mnt = new Date();
  const minMin = d === auj() ? mnt.getHours() * 60 + mnt.getMinutes() + 15 : 0;
  return OCR.creneaux(prestationId, gabaritId).filter(hm => {
    const a = OCR.hm2min(hm), b = a + duree + buf;
    if (a < minMin) return false;
    for (let t = a; t < b; t += 5)
      if (occ.filter(([x, y]) => t >= x && t < y).length >= nbBaies) return false;
    return true;
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   LA FRISE DE LA JOURNÉE
   Une liste ne montre pas les trous. Ici la journée est à l'échelle : la
   hauteur d'un bloc EST sa durée, les creux se voient, et l'équipe lit sa
   journée d'un coup d'œil depuis l'iPad de l'atelier.
   La couleur situe le type de lavage, le texte l'identifie — on ne demande
   jamais à la couleur de porter seule une information.
   ══════════════════════════════════════════════════════════════════════════ */
const PX_MIN = 0.95;   // pixels par minute — 12 h tiennent en ~684 px

/* Place les rendez-vous en colonnes quand ils se chevauchent, comme un agenda :
   chacun prend la première colonne libre à son heure de début. */
function colonnesRdv(list) {
  const tri = [...list].sort((a, b) => OCR.hm2min(heureCourte(a.heure_prevue)) - OCR.hm2min(heureCourte(b.heure_prevue)));
  const finDe = [];   // heure de fin de la dernière réservation de chaque colonne
  const pose = tri.map(r => {
    const deb = OCR.hm2min(heureCourte(r.heure_prevue));
    const fin = deb + (r.duree_min || 60);
    let col = finDe.findIndex(f => f <= deb);
    if (col === -1) { col = finDe.length; finDe.push(fin); } else finDe[col] = fin;
    return { r, deb, fin, col };
  });
  return { pose, nb: Math.max(1, finDe.length) };
}

function friseAgenda(resas, d, estAuj, nbBaies) {
  const h0 = OCR.CONFIG.ouvertureMin, h1 = OCR.CONFIG.fermetureMin;
  const hauteur = (h1 - h0) * PX_MIN;
  const vivants = resas.filter(r => r.statut !== 'annulee');
  const { pose, nb } = colonnesRdv(vivants);
  // Autant de colonnes que de baies actives, même s'il n'y a qu'un rendez-vous :
  // un bloc pleine largeur donnerait l'impression d'un atelier saturé alors
  // qu'une baie est libre. La place vide à droite, c'est la capacité restante.
  const cols = Math.max(nb, Math.max(1, nbBaies || 1));
  const heures = [];
  for (let m = h0; m <= h1; m += 60) heures.push(m);

  const maintenant = new Date();
  const minNow = maintenant.getHours() * 60 + maintenant.getMinutes();
  const traitMaintenant = estAuj && minNow >= h0 && minNow <= h1;

  return `
    <div class="ocr-carte" style="padding:var(--ocr-e4) var(--ocr-e3) var(--ocr-e4) 0">
      <div class="legende-lav">
        ${Object.entries(OCR.GROUPES_LAVAGE).map(([k, g]) =>
          `<span><i style="background:var(--lav-${k})"></i>${g.nom}</span>`).join('')}
      </div>
      <div class="frise-boite" id="friseBoite" data-depart="${
        // on cadre sur le premier rendez-vous, sinon sur l'heure courante
        Math.max(0, ((pose.length ? pose[0].deb : (traitMaintenant ? minNow : h0)) - h0) * PX_MIN - 60)}">
      <div class="frise" style="height:${hauteur}px">
        ${heures.map(m => `<div class="fh" style="top:${(m - h0) * PX_MIN}px">
            <span class="fh-lab">${OCR.min2hm(m)}</span><span class="fh-trait"></span></div>`).join('')}
        ${traitMaintenant ? `<div class="fh-now" style="top:${(minNow - h0) * PX_MIN}px"><span></span></div>` : ''}
        <div class="fz">
          ${pose.length ? pose.map(({ r, deb, fin, col }) => {
            const g = OCR.groupeLavage(r.prestation);
            const p = OCR.prestation(r.prestation);
            const et = ETAT_RDV[r.statut] || ['—', 'neutre'];
            const passe = ['honoree', 'absente'].includes(r.statut);
            const attente = r.statut === 'en_attente_paiement';
            const min = fin - deb;
            const veh = r.vehicules || {};
            const nomVeh = [veh.marque, veh.modele].filter(Boolean).join(' ') || veh.immatriculation || '';
            const nomLav = esc((p ? p.nom : r.prestation).replace('Lavage ', ''));
            // Un lavage court n'a pas la hauteur pour empiler l'heure et le nom :
            // on met tout sur une ligne plutôt que de masquer lequel c'est.
            const courte = min < 40;
            return `<button class="bloc grp-${g}${passe ? ' passe' : ''}${attente ? ' attente' : ''}${courte ? ' plate' : ''}"
              data-bloc="${r.id}"
              style="top:${(deb - h0) * PX_MIN}px;height:${Math.max(26, min * PX_MIN - 2)}px;
                     left:calc(${col * (100 / cols)}% + 1px);width:calc(${100 / cols}% - 3px)">
              <span class="bl-h">${heureCourte(r.heure_prevue)}${courte
                ? `<span class="bl-n">${nomLav}</span>` : ''}<span class="bl-d">${min} min</span></span>
              ${courte ? '' : `<span class="bl-n">${nomLav}</span>`}
              ${min >= 45 ? `<span class="bl-s">${esc((OCR.gabarit(r.gabarit) || {}).court || '')}${
                nomVeh ? ' · ' + esc(nomVeh) : ''}</span>` : ''}
              ${attente ? '<span class="bl-p">⏳ avance à recevoir</span>'
                : passe ? '<span class="bl-p">' + et[0] + '</span>' : ''}
            </button>`;
          }).join('') : `<div class="frise-vide">Aucun rendez-vous ce jour —
            la journée est entièrement libre.</div>`}
        </div>
      </div>
      </div>
    </div>`;
}

/* Carte d'état des baies : pause et réactivation, motif obligatoire, audité. */
function carteBaies(baies) {
  return `<div class="ocr-carte" style="margin-bottom:var(--ocr-e4)">
    <div class="ocr-surtitre">Les baies</div>
    ${baies.map(b => `
      <div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ocr-sep);flex-wrap:wrap">
        <span style="min-width:0">
          <span style="font-weight:600">${esc(b.nom)}</span>
          <span class="ocr-pastille ocr-pastille--${b.active ? 'succes' : 'erreur'}" style="margin-left:8px">${b.active ? 'Active' : 'En pause'}</span>
          ${!b.active && b.motif ? `<span class="ocr-mini" style="display:block;margin-top:4px">${esc(b.motif)}</span>` : ''}
        </span>
        <span style="flex:1"></span>
        ${peutCorriger() ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-baie="${b.id}" data-vers="${b.active ? 0 : 1}">
          ${b.active ? 'Mettre en pause' : 'Réactiver'}</button>` : ''}
      </div>`).join('')}
  </div>`;
}

function boiteBaie(b, activer) {
  const v = modale(`
    <h3 class="ocr-h2">${activer ? 'Réactiver' : 'Mettre en pause'} — ${esc(b.nom)}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">${activer
      ? 'La baie redevient réservable immédiatement, à la caisse comme en ligne.'
      : 'Plus aucun créneau ne sera proposé sur cette baie, à la caisse comme en ligne. Les rendez-vous déjà pris restent valables.'}
      Le changement est inscrit au journal à ton nom.</p>
    <label class="ocr-champ"><span class="ocr-label">Motif (obligatoire)</span>
      <input class="ocr-saisie" id="motifBaie" placeholder="${activer ? 'Travaux terminés' : 'Travaux en cours'}"></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>${activer ? 'Réactiver' : 'Mettre en pause'}</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    const motif = v.querySelector('#motifBaie').value.trim();
    if (!motif) return toast('Le motif est obligatoire.', true);
    e.target.disabled = true;
    const { error } = await API.basculerBaie({ p_baie: b.id, p_active: activer, p_motif: motif });
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    fermerModale(); toast(b.nom + (activer ? ' réactivée' : ' mise en pause')); rendre();
  });
}

/* La semaine en une bande : on voit quel jour est chargé et on y va d'un doigt,
   sans faire « suivant, suivant, suivant ». */
function bandeSemaine(d, parJour) {
  const lundi = decaleJour(d, -((new Date(d + 'T12:00').getDay() + 6) % 7));
  const jours = Array.from({ length: 7 }, (_, i) => decaleJour(lundi, i));
  return `<div class="bande-sem">
    ${jours.map(j => {
      const n = parJour[j] || 0;
      const estAuj = j === auj();
      return `<button class="js${j === d ? ' sel' : ''}${estAuj ? ' auj' : ''}" data-ajour="${j}">
        <span class="js-l">${JOURS_COURTS[new Date(j + 'T12:00').getDay()]}</span>
        <span class="js-n">${Number(j.slice(-2))}</span>
        <span class="js-p">${n ? n : ''}</span>
      </button>`;
    }).join('')}
  </div>`;
}

}

/* ---------- les quatre gestes sur un rendez-vous, partagés ---------- */
async function rdvArrive(r) {
  if (!r) return;
  let nom = '', tel = '';
  if (r.client_id) {
    const { data } = await sb.from('clients').select('nom,telephone').eq('id', r.client_id).maybeSingle();
    if (data) { nom = data.nom || ''; tel = data.telephone || ''; }
  }
  // Le véhicule saisi par le client à la réservation (marque/modèle/plaque) —
  // avant, ces champs étaient vidés et il fallait tout retaper (remonté le 12/08).
  const veh = r.vehicules || {};
  Object.assign(form, { tel, nom, clientTrouve: null, gabarit: r.gabarit,
    marque: veh.marque || '', modele: veh.modele || '', immat: OCR.plaque(veh.immatriculation),
    vehTrouve: null,
    prestation: r.prestation, options: (r.options || []).slice(), remise: 0, motifRemise: '', manuel: 0,
    note: r.note || '', reservation: r.reference });
  fermerModale();
  onglet = 'saisie';
  rendre();
}
async function rdvStatut(id, statut, message) {
  const { error } = await API.majRdv(id, { statut });
  if (error) toast(error.message, true); else toast(message);
  fermerModale();
  rendre();
}
function rdvAnnuler(id) {
  const v = modale(`<h3 class="ocr-h2">Annuler ce rendez-vous ?</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Le créneau redevient disponible immédiatement.</p>
    <div style="display:flex;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Garder</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Annuler le rendez-vous</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async () => {
    const { error } = await API.majRdv(id, { statut: 'annulee' });
    if (error) return toast(error.message, true);
    fermerModale(); toast('Rendez-vous annulé'); rendre();
  });
}

/* La fiche d'un rendez-vous, ouverte en touchant son bloc dans la frise.
   Les blocs sont trop petits pour porter quatre boutons ; ici tout tient. */
function boiteRdv(r, estAuj) {
  if (!r) return;
  const p = OCR.prestation(r.prestation);
  const et = ETAT_RDV[r.statut] || ['—', 'neutre'];
  const deb = heureCourte(r.heure_prevue);
  const fin = OCR.min2hm(OCR.hm2min(deb) + (r.duree_min || 60));
  const g = OCR.groupeLavage(r.prestation);
  const passe = ['honoree', 'absente'].includes(r.statut);
  const veh = r.vehicules || {};
  const nomVeh = [veh.marque, veh.modele].filter(Boolean).join(' ') || veh.immatriculation || '';
  const v = modale(`
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:var(--ocr-e3)">
      <span style="width:12px;height:12px;border-radius:3px;background:var(--lav-${g});flex:none"></span>
      <h3 class="ocr-h2" style="margin:0">${deb} → ${fin}</h3>
      <span class="ocr-pastille ocr-pastille--${et[1]}">${et[0]}</span>
    </div>
    <p class="ocr-petit" style="margin:0 0 var(--ocr-e4)">
      <strong style="color:var(--ocr-blanc)">${esc(p ? p.nom : r.prestation)}</strong> ·
      ${esc((OCR.gabarit(r.gabarit) || {}).nom || r.gabarit)}${nomVeh ? ' · ' + esc(nomVeh) : ''}<br>
      <span class="ocr-mini">${esc(r.reference)}${r.note ? ' · ' + esc(r.note) : ''}</span></p>
    ${r.montant_total ? `<div class="ocr-carte" style="padding:12px;margin-bottom:var(--ocr-e4)">
      <div style="display:flex;justify-content:space-between"><span class="ocr-petit">Total</span>
        <strong style="font-variant-numeric:tabular-nums">${OCR.fcfa(r.montant_total)}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-top:4px"><span class="ocr-petit">Avance reçue</span>
        <span style="font-variant-numeric:tabular-nums">${OCR.fcfa(r.acompte_attendu || 0)}</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;padding-top:6px;border-top:1px solid var(--ocr-sep)">
        <span class="ocr-petit">${r.acompte_attendu >= r.montant_total ? 'Rien à encaisser' : 'Reste sur place'}</span>
        <strong style="font-variant-numeric:tabular-nums;color:${r.acompte_attendu >= r.montant_total ? 'var(--ocr-vert)' : 'var(--ocr-blanc)'}">
          ${OCR.fcfa(Math.max(0, (r.montant_total || 0) - (r.acompte_attendu || 0)))}</strong></div>
    </div>` : ''}
    ${passe ? '' : `
    ${estAuj && r.statut !== 'en_attente_paiement'
      ? '<button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" data-a>Arrivé → saisie</button>' : ''}
    ${r.statut === 'en_attente_paiement'
      ? '<button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" data-c style="margin-top:8px">Confirmer (avance reçue)</button>' : ''}
    ${estAuj ? '<button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-ab style="margin-top:8px">Marquer absent</button>' : ''}
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-an style="margin-top:8px;color:var(--ocr-argent-2)">Annuler le rendez-vous</button>`}
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:${passe ? 'var(--ocr-e4)' : '8px'}">Fermer</button>`);
  const b = s => v.querySelector(s);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  if (b('[data-a]'))  b('[data-a]').addEventListener('click', () => rdvArrive(r));
  if (b('[data-c]'))  b('[data-c]').addEventListener('click', e => {
    e.target.disabled = true; rdvStatut(r.id, 'confirmee', 'Rendez-vous confirmé'); });
  if (b('[data-ab]')) b('[data-ab]').addEventListener('click', e => {
    e.target.disabled = true; rdvStatut(r.id, 'absente', 'Marqué absent'); });
  if (b('[data-an]')) b('[data-an]').addEventListener('click', () => { fermerModale(); rdvAnnuler(r.id); });
}

/* ==========================================================================
   CLIENTS
   Le fichier client remplace le carnet : on retrouve quelqu'un par son nom,
   son numéro ou sa plaque, on voit tout son historique, et on relance la
   saisie pré-remplie sans rien retaper.
   ========================================================================== */
/* La liste s'affiche d'entrée — obliger à taper un nom pour voir ses propres
   clients n'a aucun sens quand on en a quelques centaines. Par défaut : les
   derniers venus en premier. Les filtres remplacent la recherche à l'aveugle. */
/* Pas d'émojis sur l'écran Clients (demande d'Edwin, 13/08) : des signes
   typographiques, dans la même famille que les icônes des onglets. Un émoji
   change de dessin sur chaque téléphone et fait « application grand public » ;
   la marque, elle, doit rester sobre. */
const FILTRES_CLI = [
  ['recents',     '◷ Vus récemment',   'Les derniers passages en premier'],
  ['acompleter',  '✎ À compléter',     'Lavages enregistrés sur une plaque, sans client — à rattacher'],
  ['relance',     '↻ À relancer',      'Plus de 30 jours sans venir, les plus gros d’abord'],
  ['meilleurs',   '★ Meilleurs',       'Ceux qui dépensent le plus'],
  ['espace',      '✦ Espace actif',    'Ceux qui ont l’app avec leur code'],
  ['partenaires', '◆ Partenaires',     'Employés Ehu Motors et autres entreprises liées'],
  ['sansvisite',  '◌ Jamais venus',    'Fiches créées mais aucun passage'],
  ['archives',    '⊘ Archivés',        'Fiches retirées des listes — rien n’est perdu'],
];
const rech = { q: '', liste: null, cherche: false, fiche: null, veh: null,
               vehTrouve: null,   // véhicule trouvé par la recherche (plaque tapée)
               vue: 'part', rapide: 'recents' };
let cliNouveau = null;   // brouillon de fiche client en cours de création

const dateFr = d => { const [a, m, j] = String(d || '').split('-'); return j ? j + '/' + m : (d || '—'); };
/* LE NUMÉRO TEL QUE WHATSAPP L'ATTEND : indicatif pays + numéro national,
   sans « + » ni espaces.
   Au Bénin, depuis le 30 novembre 2024 (réforme ARCEP, notifiée à l'UIT), le
   « 01 » FAIT PARTIE du numéro et se compose AUSSI depuis l'étranger :
       +229 01 97 45 48 12  →  2290197454812
   Deux pièges corrigés le 14/08, tous deux silencieux — le lien s'ouvrait,
   WhatsApp répondait « numéro invalide », et personne ne savait pourquoi :
     · l'ancien code retirait les zéros de tête. C'est l'habitude des pays qui
       ont un préfixe interurbain à jeter (le 0 français). Le Bénin n'en a pas :
       ce 0 fait partie du numéro. Un numéro saisi sans indicatif était donc
       amputé.
     · les numéros enregistrés AVANT la réforme n'ont que 8 chiffres après 229.
       On leur remet le 01 à la volée, sinon le contact reste introuvable. */
function numWhatsApp(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);         // 00229… → 229…
  if (!d) return '';
  if (d.startsWith('229')) {                      // indicatif béninois donné
    const n = d.slice(3);
    return '229' + (n.length === 8 ? '01' + n : n);
  }
  if (/^01\d{8}$/.test(d)) return '229' + d;      // 01 97 45 48 12, sans indicatif
  if (/^\d{8}$/.test(d))   return '22901' + d;    // ancien format à 8 chiffres
  return d;                                       // étranger, déjà complet
}
const joursDepuis = d => d ? Math.round((new Date(auj() + 'T12:00') - new Date(d + 'T12:00')) / 86400000) : null;
/* Tous les numéros sont béninois : afficher « +229 » sur chaque ligne mange la
   place du véhicule pour une information que personne ne lit. On l'enlève à
   l'affichage seulement — la base garde le numéro complet. */
const telCourt = t => String(t || '').replace(/^\+?229[\s.]*/, '').trim();

/* Une ligne de client : de quoi le reconnaître sans l'ouvrir — son véhicule,
   sa dernière visite, ce qu'il pèse, et les badges qui changent la façon de
   le servir (remise partenaire, app installée). */
function ligneClientStats(c) {
  const jd = joursDepuis(c.dernier_passage);
  const nom = c.nom || 'Sans nom';
  const ini = nom.trim().split(/\s+/).map(m => m[0]).slice(0, 2).join('').toUpperCase() || '?';
  const coul = COULEURS_AVATAR[nom.length % COULEURS_AVATAR.length];
  // Le véhicule sert à reconnaître la voiture qui arrive : son nom parle plus
  // qu'une plaque, la plaque ne sert de repli que s'il n'y a pas de modèle.
  const veh = c.vehicule_nom || c.vehicule_plaque || '';
  const quand = jd == null ? 'jamais venu'
    : jd === 0 ? 'aujourd’hui' : jd === 1 ? 'hier' : 'il y a ' + jd + ' j';
  return `
    <button class="fiche ligne-cli" data-cli="${c.client_id || c.id}">
      <span class="av" style="background:${coul}">${esc(ini)}</span>
      <span class="mid">
        <span class="nom">${esc(nom)}${c.espace_actif
          ? ' <span class="sig" title="Espace client actif">✦</span>' : ''}${
          c.entreprise_remise_pct > 0 ? ' <span class="sig" title="' + esc(c.entreprise_nom || '') + ' −' +
            c.entreprise_remise_pct + ' %">◆</span>' : ''}${
          c.archive_le ? ' <span class="sig" title="Fiche archivée">⊘</span>' : ''}</span>
        <span class="ocr-mini det">${esc(telCourt(c.telephone) || 'pas de numéro')}${veh ? ' · ' + esc(veh) : ''}${
          c.nb_vehicules > 1 ? ' +' + (c.nb_vehicules - 1) : ''}</span>
      </span>
      <span class="dr">
        <span class="mt">${c.passages ? OCR.fcfa(c.depense) : '—'}</span>
        <span class="ocr-mini">${c.passages ? c.passages + ' × · ' + quand : quand}</span>
      </span>
      <span class="ch">›</span>
    </button>`;
}

async function vueClients() {
  // vueClients() est parfois appelée seule (sans passer par rendre()) : on
  // resynchronise l'historique ici aussi, pour que le geste retour reste juste.
  setTimeout(majHistoriqueSousEcran, 0);
  if (rech.veh) return vueFicheVehicule();
  if (rech.fiche) return vueFicheClient();

  $('#vue').innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:var(--ocr-e4)">
      <button class="ocr-chip" data-cvue="part" aria-pressed="${rech.vue === 'part'}">Particuliers</button>
      <button class="ocr-chip" data-cvue="pro" aria-pressed="${rech.vue === 'pro'}">Entreprises</button>
    </div>
    <div id="zoneCli"></div>`;

  /* BASCULER Particuliers ↔ Entreprises NE DOIT RIEN RECHARGER (13/08) :
     « cliquer sur Entreprise prend encore beaucoup de temps ». Ça passait par
     rendre(), qui rejoue tout le préambule de l'écran et remplace la page par
     un sablier. Or c'est un simple changement d'onglet interne : on repeint
     la zone, rien d'autre. */
  $('#vue').querySelectorAll('[data-cvue]').forEach(b => b.addEventListener('click', () => {
    if (rech.vue === b.dataset.cvue) return;
    rech.vue = b.dataset.cvue;
    $('#vue').querySelectorAll('[data-cvue]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.cvue === rech.vue));
    vueClients();
  }));

  if (rech.vue === 'pro') return vueEntreprises($('#zoneCli'));

  const fActif = FILTRES_CLI.find(f => f[0] === rech.rapide);
  $('#zoneCli').innerHTML = `
    <div class="ocr-carte">
      <div style="position:relative">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ocr-argent-2);pointer-events:none">⌕</span>
        <input class="ocr-saisie" id="qCli" value="${esc(rech.q)}" placeholder="Nom, numéro ou plaque…"
               autocomplete="off" enterkeyhint="search" style="padding-left:42px">
      </div>
      <div class="rangee-filtres">
        ${FILTRES_CLI.map(([id, lab]) => `<button class="ocr-chip" data-rapide="${id}"
          aria-pressed="${rech.rapide === id}">${lab}</button>`).join('')}
      </div>
    </div>
    ${cliNouveau ? formNouveauClient() : `
    <button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" id="cliOuvrir" style="margin-top:var(--ocr-e4)">＋ Nouveau client</button>`}
    <div id="enteteRes" class="ocr-mini" style="margin:var(--ocr-e4) 0 8px">${
      rech.q.trim() ? 'Résultats pour « ' + esc(rech.q.trim()) + ' »'
                    : fActif ? esc(fActif[2]) : ''}</div>
    <div id="resCli"></div>`;

  const bo = $('#cliOuvrir');
  if (bo) bo.addEventListener('click', () => { cliNouveau = { gabarit: 'berline' }; rendre(); });
  brancherNouveauClient();

  const zone = $('#resCli');
  const brancherFiches = () => {
    zone.querySelectorAll('[data-vfiche2]').forEach(b => b.addEventListener('click', () => ouvrirVehicule(b.dataset.vfiche2)));
    zone.querySelectorAll('[data-cli]').forEach(b => b.addEventListener('click', async () => {
      zone.innerHTML = '<div class="vide"><span class="tourne"></span></div>';
      try { rech.fiche = await API.ficheClient(b.dataset.cli); vueClients(); }
      catch (ex) { toast(ex.message, true); peindre(); }
    }));
  };
  const VIDES = {
    recents: 'Aucun client encore. Le premier se créera tout seul à la première saisie.',
    acompleter: 'Rien à compléter — chaque véhicule lavé a bien un client. Beau travail.',
    relance: 'Personne à relancer — tout le monde est venu dans les 30 derniers jours.',
    meilleurs: 'Aucun passage encore enregistré.',
    espace: 'Personne n’a encore activé son espace client. Invite-les à installer l’app.',
    partenaires: 'Aucun employé rattaché à une entreprise. Onglet Entreprises pour en ajouter.',
    sansvisite: 'Toutes les fiches ont au moins un passage.',
  };
  const peindre = () => {
    if (rech.cherche) { zone.innerHTML = '<div class="vide"><span class="tourne"></span></div>'; return; }
    if (!rech.liste || !rech.liste.length) {
      zone.innerHTML = '<div class="ocr-carte vide">' + (rech.q.trim()
        ? 'Aucun client ne correspond à « ' + esc(rech.q.trim()) + ' ».<br>Il sera créé automatiquement à la première saisie.'
        : (VIDES[rech.rapide] || 'Rien à afficher.')) + '</div>';
      return;
    }
    const vehs = (rech.q.trim() && rech.vehTrouve || []);
    zone.innerHTML = (vehs.length ? `<div class="ocr-carte" style="margin-bottom:var(--ocr-e4);border-color:rgba(214,32,30,.3)">
        <div class="ocr-surtitre">Véhicule${vehs.length > 1 ? 's' : ''} trouvé${vehs.length > 1 ? 's' : ''}</div>
        <p class="ocr-mini" style="margin:8px 0 var(--ocr-e3)">Touche pour voir tout l’historique de ce véhicule.</p>
        ${vehs.map(v => `<button class="fiche ligne-cli" data-vfiche2="${v.id}" style="padding:8px 0">
          <span class="av" style="background:var(--ocr-trace);color:var(--ocr-blanc);font-size:11px;letter-spacing:.04em">${
            esc((v.immatriculation || '??').slice(0, 4))}</span>
          <span class="mid">
            <span class="nom">${esc(v.immatriculation || 'sans plaque')}</span>
            <span class="ocr-mini det">${esc([v.marque, v.modele].filter(Boolean).join(' ') || 'marque inconnue')} · ${
              esc(((v.clients || {}).nom) || 'à rattacher')}</span>
          </span>
          <span class="ch">›</span></button>`).join('')}
      </div>` : '') +
      rech.liste.map(ligneClientStats).join('') +
      (rech.liste.length >= 60 ? '<p class="ocr-mini" style="margin:10px 0 0;text-align:center">' +
        '60 premiers affichés — affine avec la recherche.</p>' : '');
    brancherFiches();
  };
  peindre();

  const charger = async () => {
    rech.cherche = true; peindre();
    try { rech.liste = await API.listeClients(rech.rapide); }
    catch (ex) { toast(ex.message, true); rech.liste = []; }
    if (!document.body.contains(zone)) return;   // l'écran a changé entre-temps
    rech.cherche = false; peindre();
  };
  // Un filtre déjà actif se garde : le désélectionner laisserait un écran vide.
  $('#zoneCli').querySelectorAll('[data-rapide]').forEach(b =>
    b.addEventListener('click', () => {
      if (rech.rapide === b.dataset.rapide && !rech.q.trim()) return;
      rech.rapide = b.dataset.rapide; rech.q = ''; rech.liste = null; vueClients();
    }));

  let minuteur;
  $('#qCli').addEventListener('input', e => {
    rech.q = e.target.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(async () => {
      // Le minuteur peut se déclencher après un changement d'écran : la zone
      // n'existe alors plus et écrire dedans lèverait une erreur. On abandonne.
      if (!document.body.contains(zone)) return;
      const t = rech.q.trim();
      const eR = $('#enteteRes');
      if (eR) eR.textContent = t ? 'Résultats pour « ' + t + ' »' : (fActif ? fActif[2] : '');
      if (t.length < 2) { rech.liste = null; rech.vehTrouve = null; return charger(); }   // champ vidé → on revient au filtre
      rech.cherche = true; peindre();
      try { rech.liste = await API.chercherClients(t); }
      catch (ex) { toast(ex.message, true); rech.liste = []; }
      if (!document.body.contains(zone)) return;
      rech.cherche = false; peindre();
    }, 320);
  });

  // Rien en mémoire (arrivée sur l'onglet) : on remplit tout seul.
  if (rech.liste === null && !rech.q.trim()) charger();
}

/* ---------- nouveau client : la fiche se crée en 30 secondes ----------
   Même un client de passage mérite son numéro et sa voiture en base :
   s'il revient dans six mois, tout se relie tout seul par le téléphone. */

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">

    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px">
      ${OCR.GABARITS.map(g => `<button class="ocr-chip" data-ncgab="${g.id}" aria-pressed="${d.gabarit === g.id}">${esc(g.court)}</button>`).join('')}
    </div>
    ${d.gabaritDeduit ? `<p class="ocr-mini" style="margin:0 0 var(--ocr-e4);color:var(--ocr-vert)">
      ✓ Taille déduite de « ${esc(d.gabaritDeduit)} »</p>` : '<div style="height:var(--ocr-e3)"></div>'}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Marque</span>
        <input class="ocr-saisie" id="ncMarque" value="${esc(d.marque || '')}"></label>

      <label class="ocr-champ"><span class="ocr-label">Immatriculation</span>

      <label class="ocr-champ"><span class="ocr-label">Note</span>
        <input class="ocr-saisie" id="ncNote" value="${esc(d.note || '')}" placeholder="De passage, en vacances…"></label>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" id="ncFermer">Annuler</button>
      <button class="ocr-btn ocr-btn--primaire" id="ncCreer">Créer la fiche</button>
    </div>
  </div>`;
}

function brancherNouveauClient() {
  if (!cliNouveau) return;
  const lire = () => Object.assign(cliNouveau, {
    nom: $('#ncNom').value, tel: telPropre($('#ncTel').value), email: $('#ncMail').value,
    marque: $('#ncMarque').value, modele: $('#ncModele').value,
    immat: $('#ncImmat').value, note: $('#ncNote').value,
  });
  $('#zoneCli').querySelectorAll('[data-ncgab]').forEach(b => b.addEventListener('click', () => {
    lire(); cliNouveau.gabarit = b.dataset.ncgab;
    cliNouveau.gabaritManuel = true; cliNouveau.gabaritDeduit = null;
    rendre();
  }));
  brancherTel($('#ncTel'));
  brancherMarqueModele($('#ncMarque'), $('#ncModele'), () => cliNouveau.gabarit, () => {
    cliNouveau.marque = $('#ncMarque').value; cliNouveau.modele = $('#ncModele').value;
  }, (g, quoi) => {
    if (cliNouveau.gabaritManuel) return;
    lire(); cliNouveau.gabarit = g; cliNouveau.gabaritDeduit = quoi;
    rendre();
    toast('Taille : ' + (OCR.gabarit(g) || {}).nom + ' (d’après ' + quoi + ')');
  });
  brancherPlaque($('#ncImmat'), propre => { cliNouveau.immat = propre; });
  /* « Quand on va dans plaque, si elle a déjà été lavée, on doit pouvoir la
     chercher et la lier directement » (Edwin) : dès que la plaque est tapée, on
     dit ce qu'on sait d'elle et ce qui va se passer à la création. */
  const elNcI = $('#ncImmat');
  if (elNcI) elNcI.addEventListener('change', async () => {
    const aide = $('#ncAideImmat');
    const pl = OCR.plaque(elNcI.value);
    cliNouveau.immat = pl;
    if (!aide) return;
    if (!pl) { aide.innerHTML = 'Si elle a déjà été lavée, son historique sera rattaché à cette fiche.'; return; }
    aide.innerHTML = 'Recherche…';
    let v = null;
    try { v = await API.vehiculeParPlaque(pl); } catch (ex) {}
    if (!v) { aide.innerHTML = '<span style="color:var(--ocr-vert)">Plaque nouvelle — le véhicule sera créé avec la fiche.</span>'; return; }
    const nomV = [v.marque, v.modele].filter(Boolean).join(' ');
    const prop = v.clients || {};
    if (prop.a_completer || !prop.nom)
      aide.innerHTML = '<span style="color:var(--ocr-vert)">✓ ' + esc(pl) + (nomV ? ' · ' + esc(nomV) : '') +
        ' déjà connue — son véhicule et tout son historique seront rattachés à cette fiche.</span>';
    else
      aide.innerHTML = '<span style="color:var(--ocr-ambre)">⚠ ' + esc(pl) + ' est déjà sur la fiche de ' +
        esc(prop.nom) + '. Ouvre sa fiche plutôt que d\'en créer une deuxième.</span>';
  });
  $('#ncFermer').addEventListener('click', () => { cliNouveau = null; rendre(); });
  $('#ncCreer').addEventListener('click', async e => {
    lire();
    // Une seule règle : au moins une information. Certains clients ne donnent
    // pas leur numéro — ce n'est pas une raison pour ne pas les enregistrer.
    if (!String(cliNouveau.nom || '').trim() && !String(cliNouveau.tel || '').trim()
        && !OCR.plaque(cliNouveau.immat))
      return toast('Donne au moins un nom, un numéro ou une plaque.', true);
    e.target.disabled = true;
    try {
      const r = await API.creerClient(cliNouveau);
      // Le serveur a tranché : fiche créée, fiche retrouvée par le numéro, ou
      // fiche provisoire de la plaque complétée avec son historique.
      toast(r.rattache ? 'Véhicule et historique rattachés ✓'
          : r.existant ? 'Cette fiche existait déjà — la voici'
          : 'Fiche créée ✓');
      rech.fiche = await API.ficheClient(r.id);
      rech.liste = null;
      cliNouveau = null;
      rendre();
    } catch (ex) { toast(ex.message, true); e.target.disabled = false; }
  });
}

/* Le client a oublié le code de son espace : on le remet à zéro, il en
   choisit un nouveau depuis son téléphone (avec sa plaque comme preuve).
   À ne faire qu'en le voyant — c'est l'accès à son historique. */
function boiteResetCodeClient(client) {
  const v = modale(`
    <h3 class="ocr-h2">Code oublié — ${esc(client.nom || 'ce client')}</h3>
    <p class="ocr-petit" style="margin:10px 0 var(--ocr-e4)">Son code sera effacé et il pourra en choisir
      un nouveau depuis son téléphone, en donnant sa plaque. Ses véhicules, son historique
      et sa fidélité ne bougent pas.</p>
    <div class="ocr-message ocr-message--alerte" style="margin-bottom:var(--ocr-e4)"><span>⚠</span><div>
      <strong>Vérifie que c'est bien lui.</strong><br>Ce code protège son historique et ses reçus.
      À faire seulement en face à face. L'action est tracée à ton nom.</div></div>
    <div style="display:flex;gap:9px">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Remettre son code à zéro</button></div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    e.target.disabled = true;
    const { error } = await API.reinitialiserCodeClient(client.id);
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    fermerModale();
    toast('Code effacé — il peut en choisir un nouveau depuis son téléphone');
    rech.fiche = await API.ficheClient(client.id);
    rendre();
  });
}

/* Lier un client à une entreprise partenaire (Ehu Motors…) : ses lavages
   auront la remise automatiquement, quel que soit le véhicule.
   Réservé à la direction et au comptable — c'est de l'argent. */
async function boiteLierEntreprise(client) {
  let liste = [];
  try { liste = await API.entreprises(); } catch (ex) { return toast(ex.message, true); }
  const partenaires = liste.filter(e => e.remise_pct > 0 || e.id === client.entreprise_id);
  const v = modale(`
    <h3 class="ocr-h2">◆ ${esc(client.nom || 'Ce client')}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Employé d'une entreprise partenaire ?
      La remise s'appliquera automatiquement à chaque passage — moto du showroom, moto d'un client,
      sa propre voiture, peu importe. Tout est tracé au journal.</p>
    ${partenaires.length ? partenaires.map(e => `
      <button class="presta" data-lier="${e.id}" aria-pressed="${client.entreprise_id === e.id}">
        <span class="coche">${client.entreprise_id === e.id ? '✓' : ''}</span>
        <span style="min-width:0"><span class="nm">${esc(e.nom)}</span>
          <span class="du">remise employés ${e.remise_pct} %</span></span>
      </button>`).join('')
    : '<p class="ocr-mini">Aucune entreprise avec remise employés pour l’instant — fixe d’abord un pourcentage sur la fiche entreprise (onglet Entreprises).</p>'}
    ${client.entreprise_id ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-delier
        style="margin-top:var(--ocr-e3);color:var(--ocr-argent-2)">Délier — plus aucune remise automatique</button>` : ''}
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:var(--ocr-e4)">Fermer</button>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  const appliquer = async entrepriseId => {
    const { error } = await API.lierEmploye(client.id, entrepriseId);
    if (error) return toast(error.message, true);
    toast(entrepriseId ? 'Lié ✓ — remise automatique à chaque passage' : 'Délié — plus de remise automatique');
    fermerModale();
    rech.fiche = await API.ficheClient(client.id);
    rendre();
  };
  v.querySelectorAll('[data-lier]').forEach(b => b.addEventListener('click', () => appliquer(b.dataset.lier)));
  const bd = v.querySelector('[data-delier]');
  if (bd) bd.addEventListener('click', () => appliquer(null));
}

/* Ajouter un deuxième (ou troisième) véhicule à un client existant :
   jamais de nouvelle fiche, tout reste sous le même téléphone. */
function boiteAjoutVehicule(client) {
  let gab = 'berline';
  const v = modale(`
    <h3 class="ocr-h2">Véhicule de ${esc(client.nom || 'ce client')}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Il rejoint sa fiche : historique et dépenses seront suivis véhicule par véhicule.</p>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px" id="avGabs">
      ${OCR.GABARITS.map(g => `<button class="ocr-chip" data-avgab="${g.id}" aria-pressed="${gab === g.id}">${esc(g.court)}</button>`).join('')}
    </div>
    <p class="ocr-mini" id="avDeduit" style="margin:0 0 var(--ocr-e4)"></p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Marque</span>
        <input class="ocr-saisie" id="avMarque"></label>
      <label class="ocr-champ"><span class="ocr-label">Modèle</span>

    <label class="ocr-champ"><span class="ocr-label">Immatriculation

      <input class="ocr-saisie" id="avImmat" placeholder="${OCR.PLAQUE_EXEMPLES.voiture}">
      <span class="ocr-aide">Voiture : ${OCR.PLAQUE_EXEMPLES.voiture} · Moto : ${OCR.PLAQUE_EXEMPLES.moto}</span></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Ajouter</button></div>`);
  v.querySelectorAll('[data-avgab]').forEach(b => b.addEventListener('click', () => {
    v.__gabManuel = true;             // le choix de l'humain gagne
    majPucesAv(b.dataset.avgab);
    const n = v.querySelector('#avDeduit'); if (n) n.innerHTML = '';
    if (repeindreAv) repeindreAv();   // moto ou voiture : les suggestions changent
  }));
  const majPucesAv = (g) => {
    gab = g;
    v.querySelectorAll('[data-avgab]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.avgab === gab)));
  };
  const repeindreAv = brancherMarqueModele(v.querySelector('#avMarque'), v.querySelector('#avModele'), () => gab,
    null, (g, quoi) => {
      if (v.__gabManuel) return;
      majPucesAv(g);
      const n = v.querySelector('#avDeduit');
      if (n) n.innerHTML = '<span style="color:var(--ocr-vert)">✓ Taille déduite de « ' + esc(quoi) + ' » — ' +
        esc((OCR.gabarit(g) || {}).nom) + '</span>';
    });
  brancherPlaque(v.querySelector('#avImmat'));
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    e.target.disabled = true;
    const { error } = await API.ajouterVehicule({
      client_id: client.id, gabarit: gab,
      marque: v.querySelector('#avMarque').value.trim() || null,
      modele: v.querySelector('#avModele').value.trim() || null,
      immatriculation: OCR.plaque(v.querySelector('#avImmat').value) || null,
    });
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    fermerModale(); toast('Véhicule ajouté à la fiche ✓');
    rech.fiche = await API.ficheClient(client.id);
    rendre();
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   LA FICHE DU VÉHICULE (13/08)

   « La plaque, la marque et le modèle sont vraiment les vraies identifications
     du véhicule. J'aimerais que juste avec la plaque on puisse voir
     l'historique du véhicule. » (Edwin)

   L'historique d'un véhicule lui appartient : on voit TOUS ses lavages, même
   ceux payés par quelqu'un d'autre (voiture d'un proche, flotte d'entreprise).
   C'est la vue qui répond à « cette voiture, on l'a déjà lavée ? ».
   ══════════════════════════════════════════════════════════════════════════ */
async function ouvrirVehicule(id) {
  try { rech.veh = await API.ficheVehicule(id); vueClients(); }
  catch (ex) { toast(ex.message, true); }
}

function vueFicheVehicule() {
  const { vehicule: v, passages: tous } = rech.veh;
  const ps = tous.filter(p => !p.annule);
  const total = ps.reduce((s, p) => s + (p.montant_total || 0), 0);
  const proprio = v.clients || {};
  const gab = OCR.gabarit(v.gabarit) || {};
  const nomVeh = [v.marque, v.modele].filter(Boolean).join(' ');
  const dernier = ps.length ? ps[0].journee : null;
  const premier = ps.length ? ps[ps.length - 1].journee : null;
  const nomPresta = p => (p.passage_lignes || []).filter(l => l.type === 'prestation').map(l => l.libelle).join(' + ') || '—';
  // qui a payé : intéressant seulement si ce n'est pas toujours le propriétaire
  const payeurs = [...new Set(ps.map(p => (p.clients || {}).nom).filter(Boolean))];

  $('#vue').innerHTML = `
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" id="btnRetourVeh" style="margin-bottom:var(--ocr-e4)">‹ Retour</button>

    <div class="ocr-carte">
      <div class="ocr-surtitre">Véhicule</div>
      <div style="font:700 26px/1.1 var(--ocr-titre);letter-spacing:.08em;margin:10px 0 4px">${
        esc(v.immatriculation || 'Sans plaque')}</div>
      <div style="font-weight:600">${esc(nomVeh || 'Marque et modèle inconnus')}</div>
      <div class="ocr-mini" style="margin-top:3px">${esc(gab.nom || v.gabarit)}${
        gab.exemple ? ' · ' + esc(gab.exemple) : ''}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:var(--ocr-e4);
                  padding-top:var(--ocr-e4);border-top:1px solid var(--ocr-sep);flex-wrap:wrap">
        <span style="min-width:0;flex:1">
          <span class="ocr-mini" style="display:block">Rattaché à</span>
          <span style="font-weight:600">${esc(proprio.nom || 'personne')}</span>
          ${proprio.a_completer ? ' <span class="ocr-pastille ocr-pastille--alerte">à compléter</span>' : ''}
          <span class="ocr-mini" style="display:block">${esc(telAffiche(proprio.telephone) || 'sans numéro')}</span>
        </span>
        ${proprio.id ? '<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" id="btnVersClient">Sa fiche ›</button>' : ''}
        ${peutCorrigerFiche() ? '<button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" id="btnRattacherVeh">Rattacher à un client…</button>' : ''}
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:var(--ocr-e4)">
        ${peutCorrigerFiche() ? '<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" id="btnCorrVeh">✎ Corriger</button>' : ''}
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire ocr-btn--petit" id="btnPassageVeh">Nouveau passage</button>
      </div>
    </div>

    <div class="tuiles" style="margin-top:var(--ocr-e4)">
      <div class="tuile"><div class="lab">Lavages</div><div class="val">${ps.length}</div>
        <div class="sub">${premier ? 'depuis le ' + dateFr(premier) : 'aucun encore'}</div></div>
      <div class="tuile"><div class="lab">Total dépensé</div><div class="val">${OCR.fcfa(total)}</div>
        <div class="sub">Ticket moyen ${OCR.fcfa(ps.length ? Math.round(total / ps.length) : 0)}</div></div>
      <div class="tuile"><div class="lab">Dernier passage</div><div class="val" style="font-size:18px">${dernier ? dateFr(dernier) : '—'}</div>
        <div class="sub">${dernier ? joursDepuis(dernier) + ' jour(s)' : ''}</div></div>
      <div class="tuile"><div class="lab">Payé par</div><div class="val" style="font-size:18px">${payeurs.length || 0}</div>
        <div class="sub">${esc(payeurs.slice(0, 2).join(', ') || '—')}</div></div>
    </div>

    <div class="ocr-carte">
      <div class="ocr-surtitre">Historique de ce véhicule</div>
      <p class="ocr-mini" style="margin:8px 0 var(--ocr-e4)">Tous ses lavages, même ceux payés par quelqu'un d'autre.</p>
      ${tous.length ? tous.map(p => {
        const par = (p.clients || {}).nom;
        return `
        <div style="display:flex;gap:10px;align-items:center;padding:10px 0;
                    border-bottom:1px solid var(--ocr-sep)${p.annule ? ';opacity:.5' : ''}">
          <span class="ocr-mini" style="width:46px;flex:none">${dateFr(p.journee)}</span>
          <span style="min-width:0;flex:1">
            <span style="font:600 13.5px/1.3 var(--ocr-texte);display:block${p.annule ? ';text-decoration:line-through' : ''}">${esc(nomPresta(p))}</span>
            <span class="ocr-mini">${esc(p.reference)}${par ? ' · ' + esc(par) : ''}${p.annule ? ' · annulé' : ''}</span>
          </span>
          <span style="font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap${
            p.annule ? ';text-decoration:line-through' : ''}">${OCR.fcfa(p.montant_total)}</span>
        </div>`;
      }).join('')
      : '<div class="vide">Ce véhicule n’a pas encore de lavage enregistré.</div>'}
    </div>`;

  $('#btnRetourVeh').addEventListener('click', () => { rech.veh = null; vueClients(); });
  const bvc = $('#btnVersClient');
  if (bvc) bvc.addEventListener('click', async () => {
    rech.veh = null;
    try { rech.fiche = await API.ficheClient(proprio.id); vueClients(); }
    catch (ex) { toast(ex.message, true); }
  });
  const bcv = $('#btnCorrVeh');
  if (bcv) bcv.addEventListener('click', () => boiteModifierVehicule(v, { id: proprio.id, __veh: v.id }));
  const brv = $('#btnRattacherVeh');
  if (brv) brv.addEventListener('click', () => boiteRattacherVehicule(v, proprio));
  $('#btnPassageVeh').addEventListener('click', () => {
    Object.assign(form, {
      tel: proprio.telephone || '', nom: proprio.a_completer ? '' : (proprio.nom || ''),
      clientTrouve: proprio.id && !proprio.a_completer ? { id: proprio.id, nom: proprio.nom, telephone: proprio.telephone } : null,
      parPlaque: true,
      gabarit: v.gabarit || 'berline', marque: v.marque || '', modele: v.modele || '',
      immat: OCR.plaque(v.immatriculation), vehTrouve: null,
      prestation: null, options: [], remise: 0, motifRemise: '', manuel: 0, note: '',
    });
    rech.veh = null; rech.fiche = null;
    allerOnglet('saisie');
  });
}

/* Rattacher un véhicule à un client : on cherche le client par son nom ou son
   numéro, et l'historique du véhicule le suit. C'est le geste « le client a
   créé son compte mais n'avait pas mis sa plaque ». */
function boiteRattacherVehicule(veh, proprio) {
  const v = modale(`
    <h3 class="ocr-h2">Rattacher ${esc(veh.immatriculation || 'ce véhicule')}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
      Actuellement sur la fiche de <strong>${esc((proprio || {}).nom || 'personne')}</strong>.
      ${(proprio || {}).a_completer
        ? 'C\'est une fiche provisoire : l\'historique du véhicule suivra et la fiche disparaîtra.'
        : 'C\'est une fiche réelle : seule la direction peut déplacer le véhicule (voiture vendue, erreur d\'attribution).'}</p>
    <label class="ocr-champ"><span class="ocr-label">Chercher le client</span>
      <input class="ocr-saisie" id="rvQ" placeholder="Nom ou numéro…" autocomplete="off"></label>
    <div id="rvRes" style="max-height:40vh;overflow:auto"></div>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer style="margin-top:var(--ocr-e3)">Annuler</button>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  const zone = v.querySelector('#rvRes');
  let minuteur;
  v.querySelector('#rvQ').addEventListener('input', e => {
    const q = e.target.value.trim();
    clearTimeout(minuteur);
    if (q.length < 2) { zone.innerHTML = ''; return; }
    zone.innerHTML = '<div class="vide"><span class="tourne"></span></div>';
    minuteur = setTimeout(async () => {
      let liste = [];
      try { liste = await API.chercherClients(q); } catch (ex) { toast(ex.message, true); }
      liste = liste.filter(c => c.id !== (proprio || {}).id);
      zone.innerHTML = liste.length
        ? liste.map(c => `<button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" data-rvcli="${c.id}"
            style="margin-bottom:7px;justify-content:flex-start;text-align:left">
            ${esc(c.nom)}<span class="ocr-mini" style="margin-left:8px">${esc(telCourt(c.telephone) || 'sans numéro')}</span></button>`).join('')
        : '<div class="vide">Aucun client trouvé. Crée sa fiche depuis Clients.</div>';
      zone.querySelectorAll('[data-rvcli]').forEach(b => b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          await API.rattacherVehicule(veh.id, b.dataset.rvcli, true);
          fermerModale(); toast('Véhicule et historique rattachés ✓');
          rech.liste = null;
          await ouvrirVehicule(veh.id);
        } catch (ex) { toast(ex.message, true); b.disabled = false; }
      }));
    }, 320);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   CORRIGER UNE ERREUR DE COMPTOIR (13/08)
   Un numéro mal tapé, une plaque fausse, une fiche créée deux fois : ça arrive
   dans un atelier, et il faut pouvoir réparer sans appeler quelqu'un. Ce qui
   ne s'efface jamais, en revanche, c'est l'argent : la base refuse de
   supprimer une fiche qui a un passage non soldé ou un rendez-vous à venir,
   et garde les passages même quand la fiche part.
   ══════════════════════════════════════════════════════════════════════════ */
async function rafraichirFiche(id) {
  rech.fiche = await API.ficheClient(id);
  rendre();
}

/* Compléter une fiche née d'une plaque. Le serveur décide tout seul entre
   « je remplis cette fiche » et « ce numéro est déjà celui de quelqu'un, je
   transfère le véhicule et son historique chez lui ». L'écran ne fait que
   raconter ce qui s'est passé. */
function boiteCompleterFiche(c, vs) {
  const plaque = (vs || []).map(v => v.immatriculation).filter(Boolean)[0] || '';
  const v = modale(`
    <h3 class="ocr-h2">Compléter la fiche</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
      ${plaque ? 'Plaque <strong>' + esc(plaque) + '</strong>. ' : ''}Donne le nom, le numéro, ou les deux.
      Si le numéro est déjà connu, tout ira sur la fiche existante.</p>
    <label class="ocr-champ"><span class="ocr-label">Nom</span>

function boiteModifierVehicule(veh, c) {
  if (!veh) return;
  let gab = veh.gabarit;
  const v = modale(`
    <h3 class="ocr-h2">Corriger le véhicule</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">La plaque est rangée en majuscules sans espace :

      ${OCR.GABARITS.map(g => `<button class="ocr-chip" data-mvgab="${g.id}" aria-pressed="${gab === g.id}">${esc(g.court)}</button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <label class="ocr-champ"><span class="ocr-label">Marque</span>
        <input class="ocr-saisie" id="mvMarque" value="${esc(veh.marque || '')}"></label>
      <label class="ocr-champ"><span class="ocr-label">Modèle</span>

    <label class="ocr-champ"><span class="ocr-label">Immatriculation</span>

    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3)">

      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Enregistrer</button></div>`);
  // Même esprit que sous le champ de la Saisie : ça guide, ça ne bloque pas.
  const aide = () => {
    const el = v.querySelector('#mvAide');
    const et = OCR.plaqueEtat(v.querySelector('#mvImmat').value, gab);
    el.innerHTML = et.vide
      ? 'Voiture : ' + OCR.PLAQUE_EXEMPLES.voiture + ' · Moto : ' + OCR.PLAQUE_EXEMPLES.moto
      // et.aide porte déjà son ✓ quand tout va bien : ne pas en ajouter un second
      : '<span style="color:var(--ocr-' + (et.ok && et.accord ? 'vert' : 'ambre') + ')">' +
        esc(et.aide) + '</span>';
  };
  v.querySelectorAll('[data-mvgab]').forEach(b => b.addEventListener('click', () => {
    v.__gabManuel = true;
    gab = b.dataset.mvgab;
    v.querySelectorAll('[data-mvgab]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.mvgab === gab)));
    if (repeindreMv) repeindreMv();
    aide();
  }));
  const repeindreMv = brancherMarqueModele(v.querySelector('#mvMarque'), v.querySelector('#mvModele'), () => gab,
    null, (g, quoi) => {
      if (v.__gabManuel) return;
      gab = g;
      v.querySelectorAll('[data-mvgab]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.mvgab === gab)));
      aide();
      toast('Taille : ' + (OCR.gabarit(g) || {}).nom + ' (d’après ' + quoi + ')');
    });
  brancherPlaque(v.querySelector('#mvImmat'), aide);
  aide();
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    e.target.disabled = true;
    try {
      await API.modifierVehicule(veh.id, {
        gabarit: gab,
        marque: v.querySelector('#mvMarque').value.trim(),
        modele: v.querySelector('#mvModele').value.trim(),
        immat: OCR.plaque(v.querySelector('#mvImmat').value),
      });
      fermerModale(); toast('Véhicule corrigé ✓');
      if (rech.veh) await ouvrirVehicule(veh.id); else await rafraichirFiche(c.id);
    } catch (ex) { toast(ex.message, true); e.target.disabled = false; }
  });
}
