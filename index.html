/* ── LE BROUILLON (14/08) ──────────────────────────────────────────────────
   « En aucun cas les mises à jour ne doivent écraser ce qu'on est en train de
   faire » (Edwin). La saisie est recopiée dans le téléphone à chaque frappe :
   rechargement, fermeture, batterie à plat — à la réouverture, la fiche
   revient telle quelle. Jamais en démonstration : les tests repartent de zéro. */
const CLE_BROUILLON = 'ocr-brouillon-saisie';
function sauverBrouillon() {
  if (MODE_DEMO) return;
  try {
    if (form.tel || form.nom || form.immat || form.prestation || form.note || form.jour)
      localStorage.setItem(CLE_BROUILLON, JSON.stringify({ t: Date.now(), f: form }));
    else localStorage.removeItem(CLE_BROUILLON);
  } catch (e) {}
}
function effacerBrouillon() { try { localStorage.removeItem(CLE_BROUILLON); } catch (e) {} }
function restaurerBrouillon() {
  if (MODE_DEMO) return false;
  try {
    const b = JSON.parse(localStorage.getItem(CLE_BROUILLON) || 'null');
    if (!b || Date.now() - b.t > 12 * 3600 * 1000) { effacerBrouillon(); return false; }
    Object.assign(form, b.f);
    return true;
  } catch (e) { return false; }
}

async function demarrer() {
  moi = await API.monEmploye();
  if (!moi) {
    await sb.auth.signOut();
    toast('Ce compte n’est rattaché à aucun employé.', true);
    return;
  }
  /* Trois requêtes qui n'ont aucune raison de s'attendre : en série, elles
     coûtaient trois allers-retours avant le premier écran. */
  const [eq, rg, pt] = await Promise.all([
    API.equipe(),
    API.reglages().catch(() => null),
    API.partenaires().catch(() => []),
  ]);
  equipe = eq; REGLAGES = rg; PARTENAIRES = pt;
  $('#connexion').classList.add('masque');
  $('#appli').classList.remove('masque');
  $('#quiNom').textContent = moi.nom;
  $('#quiRole').textContent = enInterim() ? 'remplace le manager aujourd’hui' : metier(moi);
  // Edwin et Guénolé atterrissent sur le pilotage : ouvrir l'app = savoir où on en est.
  onglet = peutCloturer() ? 'direction' : 'saisie';
  /* Une fiche laissée en plan revient d'elle-même, et on l'ouvre devant soi. */
  if (restaurerBrouillon()) {
    onglet = 'saisie';
    setTimeout(() => toast('Ta saisie en cours a été retrouvée — rien n’est perdu.'), 600);
  }
  marquerActivite();
  majBoucler();
  await rendre();
  // Des pointages attendaient le réseau depuis la dernière session : on les
  // envoie dès qu'on sait qui est connecté.
  viderFile();
  // Le catalogue des marques et modèles, versé dans le socle (sans bloquer).
  chargerCatalogue();
}

/* Le nom du rôle en base ne change pas — tous les contrôles s'appuient dessus,
   ici comme dans la base. Mais « comptable » décrit mal ce que Guénolé fait :
   il tient les finances ET les ressources humaines (Edwin, 14/08). On affiche
   donc le métier, on garde la clé technique. */
const ROLE_LIBELLE = {
  direction:  'direction',
  comptable:  'direction financière & RH',
  manager:    'manager d’atelier',
  technicien: 'technicien',
};
const libelleRole = r => ROLE_LIBELLE[r] || r || '';
/* Le rôle dit ce qu'on a le DROIT de faire ; le poste dit le TRAVAIL qu'on
   fait. Agathe est « technicien » au sens des droits (Pointage, Mon compte) et
   « agent d'entretien » au sens du métier (Edwin, 14/08). Inventer un rôle
   pour elle aurait obligé à retoucher tous les contrôles, en base comme ici,
   pour un mot d'affichage. Partout où l'on présente quelqu'un, c'est son
   métier qu'on montre. */
const metier = e => (e && e.poste) || libelleRole(e && e.role);

const peutCloturer = () => moi && (moi.role === 'comptable' || moi.role === 'direction');
/* L'onglet « maison » de chacun : celui où le geste retour ramène, et celui
   d'où l'on part. Un technicien n'a que Pointage — c'est donc SA maison, sinon
   le geste retour l'envoyait sur un onglet qu'il n'a même pas. */
const ongletParDefaut = () => peutCloturer() ? 'direction'
  : roleEffectif() === 'technicien' ? 'pointage' : 'saisie';

/* Rôle effectif : Abel (remplaçant) agit comme manager le jour de repos de
   Samuel — même règle que côté base (ocr_role_effectif). */
let ABSENCES = [];   // absences actives aujourd'hui, rechargées à chaque rendu

function roleEffectif() {
  if (!moi) return null;
  if (moi.role === 'technicien' && moi.remplacant) {
    const js = jourSemaineDe(auj());
    const managerAbsent = equipe.some(e => e.role === 'manager' &&
      (e.repos_jour === js || ABSENCES.some(a => a.employe_id === e.id)));
    if (managerAbsent) return 'manager';
  }
  return moi.role;
}
const MOTIFS_ABSENCE = { maladie: ['Malade', 'erreur'], conge: ['Congé', 'neutre'], autre: ['Absent', 'marque'] };
const absenceDe = empId => ABSENCES.find(a => a.employe_id === empId);
const enInterim = () => moi && moi.role === 'technicien' && roleEffectif() === 'manager';

/* ==========================================================================
   DOUBLE AUTHENTIFICATION (TOTP — Google Authenticator ou équivalent)
   Si un facteur est activé sur le compte, le code est exigé à chaque
   connexion. L'activation se fait depuis le bouclier 🛡 en haut.
   En cas d'indisponibilité du service MFA, la connexion simple passe :
   on ne bloque jamais la caisse un samedi à 18 h pour un service tiers.
   ========================================================================== */
async function exigerMFA() {
  try {
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (!aal || aal.currentLevel === aal.nextLevel) return true;   // pas de facteur actif
    const { data: fl } = await sb.auth.mfa.listFactors();
    const f = fl && fl.totp && fl.totp.find(x => x.status === 'verified');
    if (!f) return true;
    return await demanderCodeMFA(f.id);
  } catch (e) { return true; }
}

function demanderCodeMFA(factorId) {
  return new Promise(resoudre => {
    const v = modale(`
      <h3 class="ocr-h2">Code de sécurité</h3>
      <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Ouvre ton application d'authentification
        et saisis le code à 6 chiffres.</p>
      <input class="ocr-saisie" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
             style="text-align:center;font:700 24px/1.2 var(--ocr-texte);letter-spacing:.35em">
      <div style="display:flex;gap:9px;margin-top:var(--ocr-e4)">
        <button class="ocr-btn ocr-btn--fantome" data-non>Annuler</button>
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire" data-oui>Vérifier</button></div>`);
    const champ = v.querySelector('#mfaCode'); champ.focus();
    const valider = async () => {
      const code = champ.value.trim();
      if (code.length !== 6) return toast('Le code fait 6 chiffres.', true);
      try {
        const ch = await sb.auth.mfa.challenge({ factorId });
        if (ch.error) throw ch.error;
        const ve = await sb.auth.mfa.verify({ factorId, challengeId: ch.data.id, code });
        if (ve.error) throw ve.error;
        fermerModale(); resoudre(true);
      } catch (ex) { toast('Code incorrect — réessaie.', true); champ.value = ''; champ.focus(); }
    };
    v.querySelector('[data-oui]').addEventListener('click', valider);
    champ.addEventListener('keydown', e => { if (e.key === 'Enter') valider(); });
    v.querySelector('[data-non]').addEventListener('click', async () => {
      await sb.auth.signOut(); fermerModale(); resoudre(false);
    });
  });
}

/* Le QR de Supabase peut arriver sous trois formes ; on le convertit en SVG
   propre, injecté à part — jamais collé dans un attribut (les guillemets du
   SVG cassaient l'affichage). */
function qrEnHtml(qr) {
  if (!qr) return '';
  if (qr.startsWith('<svg')) return qr;
  const i = qr.indexOf(',');
  if (qr.startsWith('data:image/svg+xml') && !/;base64/.test(qr) && i !== -1) {
    const brut = qr.slice(i + 1);
    try { return decodeURIComponent(brut); } catch (e) { return brut; }
  }
  if (/^data:[^,]*;base64,/.test(qr)) {
    const img = document.createElement('img');
    img.src = qr; img.alt = 'Code à scanner';
    img.style.cssText = 'width:190px;height:190px;display:block';
    return img.outerHTML;
  }
  return '';
}

/* ---------- réglages d'affichage : propres à CET appareil ---------- */
const PREFS_CLE = MODE_DEMO ? 'ocr-prefs-demo' : 'ocr-prefs';
/* Vue de l'agenda, retenue par appareil : l'iPad de l'atelier reste sur la
   frise, un téléphone peut préférer la liste. Déclarée AVANT chargerPrefs(),
   qui la lit dès le démarrage. */
let agendaVue = 'frise';
const prefs = { theme: 'sombre', taille: 'normal', agenda: 'frise' };   // 'sombre'|'clair'|'auto' · 'normal'|'grand'|'tresgrand' · 'frise'|'liste'
function appliquerPrefs() {
  const clair = prefs.theme === 'clair' ||
    (prefs.theme === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
  document.body.classList.toggle('theme-clair', clair);
  document.body.classList.toggle('texte-grand', prefs.taille === 'grand');
  document.body.classList.toggle('texte-tresgrand', prefs.taille === 'tresgrand');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = clair ? '#F5F5F6' : '#0A0A0B';
}
function chargerPrefs() {
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_CLE) || '{}')); } catch (e) {}
  if (prefs.agenda === 'frise' || prefs.agenda === 'liste') agendaVue = prefs.agenda;
  appliquerPrefs();
}
function sauverPrefs() {
  try { localStorage.setItem(PREFS_CLE, JSON.stringify(prefs)); } catch (e) {}
  appliquerPrefs();
}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (prefs.theme === 'auto') appliquerPrefs();
});

/* « Mon compte » : mot de passe pour tout le monde, double sécurité pour
   les rôles concernés, et la règle de reconnexion — écrite noir sur blanc,
   parce qu'une app qui redemande un code sans prévenir passe pour cassée. */
async function boiteCompte() {
  const avecMFA = !MODE_DEMO && ROLES_2FA.includes(moi.role);
  let actif = null;
  if (avecMFA) {
    try {
      const { data: fl } = await sb.auth.mfa.listFactors();
      actif = (fl && fl.totp && fl.totp.find(x => x.status === 'verified')) || null;
    } catch (e) {}
  }
  // Passkeys : réservées au pilotage (Edwin, Guénolé) pour l'instant.
  const avecPasskey = PASSKEY_DISPO && ['direction', 'comptable'].includes(moi.role);
  let mesPasskeys = [];
  if (avecPasskey) {
    try { const { data: pk } = await sb.auth.passkey.list(); mesPasskeys = pk || []; } catch (e) {}
  }

  const v = modale(`
    <h3 class="ocr-h2">Mon compte</h3>
    <div style="display:flex;align-items:center;gap:12px;margin:10px 0 var(--ocr-e4)">

/* ---------- fraîcheur : l'écran se met à jour tout seul ----------
   Toutes les 5 min (et au retour sur l'app, avec un léger garde-fou pour ne
   pas doubler un rafraîchissement tout juste fait), la vue se recharge
   depuis la base — sauf si quelqu'un est en train de taper ou qu'une fenêtre
   est ouverte : on ne coupe jamais une saisie en cours. Avant c'était toutes
   les 60 s avec un plein remplacement de l'écran (spinner + saut de défilement) —
   trop fréquent et « désagréable » (retour du 12/08). Le rafraîchissement
   automatique est maintenant discret (pas de spinner, position de défilement
   conservée) ; le bouton ↻ reste là pour un besoin immédiat. */
let dernierRafraichissement = 0;
function rafraichirSansDeranger() {
  if (!moi || document.hidden || enCours) return;
  const a = document.activeElement;
  if (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return;
  if ($('#modales').children.length) return;
  if (rdvOuvert || proEdite || cliNouveau) return;
  if (Date.now() - dernierRafraichissement < 20000) return;   // pas deux fois de suite
  dernierRafraichissement = Date.now();
  memoVider();
  rendre(true);
}
window.__ocrRafraichir = rafraichirSansDeranger;   // testable
setInterval(rafraichirSansDeranger, 300000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { marquerActivite(); return; }   // on note l'heure en partant
  /* Au retour : si l'app est restée fermée plus longtemps que la limite du
     rôle, on redemande tout. Sinon on rafraîchit simplement les données. */
  if (moi && sessionPerimee()) return verrouiller();
  marquerActivite();
  rafraichirSansDeranger();
});

async function verrouiller() {
  await sb.auth.signOut();
  moi = null;
  try { localStorage.removeItem(CLE_ACTIVITE); } catch (ex) { /* rien à nettoyer */ }
  $('#modales').innerHTML = '';
  $('#appli').classList.add('masque');
  $('#connexion').classList.remove('masque');
  toast('Reconnecte-toi : l’application est restée fermée un moment.');
}

/* ---------- écrans secondaires : fiche client, formulaires ----------
   Ils vivent DANS un onglet (ils remplacent son contenu) mais se comportent
   comme une fenêtre pour le geste retour : on empile un cran d'historique
   quand l'un s'ouvre, on le dépile quand il se referme. Un seul point de
   synchronisation (appelé à la fin de chaque rendu) : impossible d'oublier
   un cas parmi les quinze endroits qui ouvrent ou ferment ces écrans. */
const sousEcranOuvert = () => !!(rech.fiche || rech.veh || cliNouveau || proEdite || rdvOuvert);
let sousEcranEmpile = false;
function majHistoriqueSousEcran() {
  const ouvert = sousEcranOuvert();
  if (ouvert && !sousEcranEmpile) { sousEcranEmpile = true; history.pushState({ ocrSous: true }, ''); }
  else if (!ouvert && sousEcranEmpile) {
    sousEcranEmpile = false;
    if (history.state && history.state.ocrSous) { retourInterne = true; history.back(); }
  }
}
function fermerSousEcrans() {   // le cran d'historique est dépilé au rendu suivant
  rech.fiche = null; rech.veh = null; cliNouveau = null; proEdite = null; rdvOuvert = false;
}

/* Changer d'onglet en laissant UNE miette d'historique : le geste retour
   ramène à l'onglet maison plutôt que de fermer l'app. Utilisé par la barre
   du bas ET par les tuiles du panneau Direction (avant, partir de Direction
   vers Bilan ou Pointage ne laissait aucune miette : le geste retour fermait
   l'app — retour du 12/08 « on ne peut pas être bloqué à des endroits »). */
function allerOnglet(id) {
  if (id === onglet) return;
  const maison = ongletParDefaut();
  if (id === maison && history.state && history.state.ocrOnglet) { retourInterne = true; history.back(); }
  else if (onglet === maison) history.pushState({ ocrOnglet: true }, '');
  onglet = id; rendre(); window.scrollTo(0, 0);
}

/* ---------- geste retour (Android) : ne ferme jamais l'app par surprise ----------
   Priorité 1 : une fenêtre ouverte (modale) — le retour la referme.
   Priorité 2 : un écran secondaire (fiche client, formulaire) — le retour le referme.
   Priorité 3 : un onglet secondaire — le retour ramène à l'onglet maison.
   Sinon, le geste agit normalement (l'app passe en arrière-plan). */
window.addEventListener('popstate', () => {
  if (retourInterne) { retourInterne = false; return; }   // c'était nous, pas un vrai geste retour
  // la dernière fenêtre empilée (jamais « :last-child » : d'autres nœuds
  // peuvent se glisser en fin de conteneur — voir le geste retour du 13/08)
  const ms = document.querySelectorAll('#modales .voile');
  const m = ms.length ? ms[ms.length - 1] : null;
  if (m) { m.remove(); return; }
  // le cran vient d'être dépilé par le navigateur : on ne le redépile pas
  if (moi && sousEcranOuvert()) { sousEcranEmpile = false; fermerSousEcrans(); rendre(); return; }
  if (moi && onglet !== ongletParDefaut()) { onglet = ongletParDefaut(); rendre(); }
});

/* ---------- navigation ----------

   Ordre des opérations (13/08, « je veux que l'app soit plus fluide ») :
   la barre du bas est repeinte AVANT le moindre appel réseau, pour que
   l'onglet touché s'allume sous le doigt. Ensuite seulement on va chercher
   les données — toutes en parallèle, plus en file indienne. Et le sablier
   n'apparaît qu'au-delà de 180 ms : quand la réponse est en mémoire, l'écran
   change sans clignoter. */

// Les onglets ne dépendent que du rôle : calcul immédiat, sans réseau.
const SOUS_DIRECTION = ['direction', 'bilan', 'cloture', 'journal', 'pointage', 'catalogue',
                        'temps', 'cahier'];
let badgeRdv = 0;   // dernier compte connu de rendez-vous en attente d'acompte
function ongletsDuRole() {
  // Un technicien n'a que son pointage — sauf le remplaçant, le jour de
  // repos du manager : il voit alors les écrans du manager.
  const items = roleEffectif() === 'technicien'
    ? [{ id: 'pointage', ic: '◉', l: 'Pointage' }]
    : [
        { id: 'saisie',  ic: '＋', l: 'Saisie' },
        { id: 'journee', ic: '▤',  l: 'Journée' },
        { id: 'agenda',  ic: '◷',  l: 'Agenda' },
        { id: 'clients', ic: '☰',  l: 'Clients' },
      ];
  // Le manager pointe pour lui ET pour ceux qui ont oublié : son onglet
  // Pointage est le même que celui des techniciens, avec l'équipe en dessous.
  if (roleEffectif() === 'manager') items.push({ id: 'pointage', ic: '◉', l: 'Pointage' });
  // Toi et Guénolé : un seul onglet Direction qui regroupe tout
  // (Bilan, Clôture, objectifs, baies, absences, journal, pointage…).
  if (peutCloturer()) items.push({ id: 'direction', ic: '◆', l: 'Direction' });
  return items;
}

function peindreOnglets() {
  const items = ongletsDuRole();
  if (!items.some(i => i.id === onglet) && !(peutCloturer() && SOUS_DIRECTION.includes(onglet)))
    onglet = items[0].id;
  $('#onglets').innerHTML = items.map(i => {
    // Un écran ouvert depuis le panneau Direction (Bilan, Clôture, Journal,
    // Pointage…) garde l'onglet Direction allumé : on sait toujours où on est.
    // (Avant, Pointage était exclu : plus aucun onglet n'était allumé.)
    const actif = i.id === onglet ||
      (i.id === 'direction' && SOUS_DIRECTION.includes(onglet) && !items.some(x => x.id === onglet));
    // Les pointages qui attendent le réseau : un chiffre sur l'onglet, pour
    // qu'on n'ait jamais à se demander si c'est bien parti.
    const enAttente = i.id === 'pointage' ? filePointage.length : 0;
    return '<button class="onglet" ' + (actif ? 'aria-current="page"' : '') +
    ' data-onglet="' + i.id + '"><span class="ic">' + i.ic +
    (i.id === 'agenda' && badgeRdv ? '<span class="pastille-nb">' + badgeRdv + '</span>' : '') +
    (enAttente ? '<span class="pastille-nb">' + enAttente + '</span>' : '') +
    '</span>' + i.l + '</button>';
  }).join('');
  $('#onglets').querySelectorAll('[data-onglet]').forEach(b =>
    b.addEventListener('click', () => {
      const dest = b.dataset.onglet;
      // Toucher un onglet referme d'abord l'écran secondaire éventuel : son
      // cran d'historique est dépilé par le rendu, on n'en empile pas d'autre.
      if (sousEcranOuvert()) {
        fermerSousEcrans();
        onglet = dest; peindreOnglets(); rendre(); window.scrollTo(0, 0); return;
      }
      if (dest === onglet) { rendre(); return; }
      allerOnglet(dest);
    }));
}

let tourRendu = 0;   // numéro du rendu en cours : un rendu plus vieux n'écrase plus le neuf
async function rendre(discret) {
  // discret = rafraîchissement automatique en arrière-plan : pas de spinner
  // plein-écran, position de défilement conservée — pour ne plus « sauter »
  // sous les yeux de quelqu'un en train de lire l'écran (retour du 12/08).
  const tour = ++tourRendu;
  const yAvant = discret ? window.scrollY : 0;
  marquerActivite();   // chaque écran affiché repousse le verrouillage
  /* L'écran entre par le bas, très légèrement. JAMAIS sur un rafraîchissement
     automatique : faire clignoter la page de quelqu'un qui lit est la pire
     chose qu'une animation puisse faire (retour du 12/08 sur les sauts
     d'écran). On relance l'animation en retirant puis remettant la classe. */
  const vueEl = $('#vue');
  if (!discret && anime() && vueEl) {
    vueEl.classList.remove('entre');
    void vueEl.offsetWidth;          // force la reprise de l'animation
    vueEl.classList.add('entre');
  }

  // 1 · réponse immédiate au doigt, sans attendre le réseau
  peindreOnglets();
  let sablier = null;
  if (!discret) sablier = setTimeout(() => {
    if (tour === tourRendu) $('#vue').innerHTML =
      squelette(3, ['journee', 'direction', 'bilan', 'cloture'].includes(onglet));
  }, 180);

  // 2 · tout ce dont l'en-tête a besoin, en un seul aller-retour parallèle
  const veutBadge = ongletsDuRole().some(i => i.id === 'agenda');
  const [abs, jAuj, jVuBrut, badge] = await Promise.all([
    API.absencesJour(auj()).catch(() => []),
    API.journee(auj()),
    jourVu === auj() ? Promise.resolve(null) : API.journee(jourVu),
    veutBadge ? API.rdvEnAttente().catch(() => 0) : Promise.resolve(0),
  ]);
  if (tour !== tourRendu) return;   // un appui plus récent a pris la main
  ABSENCES = abs;
  const jVu = jVuBrut || jAuj;
  if (badge !== badgeRdv) { badgeRdv = badge; peindreOnglets(); }

  // La pastille du haut suit le jour affiché sur Journée et Clôture,
  // et reste sur aujourd'hui partout ailleurs.
  const jPast = (onglet === 'journee' || onglet === 'cloture') ? jVu : jAuj;
  const verrou = jPast.statut !== 'ouverte';
  $('#etatJour').textContent = verrou ? 'Journée clôturée' : 'Journée ouverte';
  $('#etatJour').className = 'ocr-pastille ' + (verrou ? 'ocr-pastille--succes' : 'ocr-pastille--marque');

  try {
    if (onglet === 'saisie')    await vueSaisie(jAuj);
    if (onglet === 'journee')   await vueJournee(jVu);
    if (onglet === 'agenda')    await vueAgenda();
    if (onglet === 'clients')   await vueClients();
    if (onglet === 'direction') await vueDirection();
    if (onglet === 'bilan')     await vueBilan();
    if (onglet === 'cahier')    await vueCahier();
    else if (onglet === 'cloture') await vueCloture(jVu);
    if (onglet === 'journal')   await vueJournal();
    if (onglet === 'pointage')  await vuePointage();
    if (onglet === 'catalogue')  await vueCatalogue();
    if (onglet === 'temps')      await vueControleTemps();
  } catch (ex) {
    // Jamais d'écran mort : même quand le chargement échoue, il y a un bouton
    // pour réessayer (et les onglets du bas restent utilisables).
    $('#vue').innerHTML = '<div class="ocr-message ocr-message--erreur"><span>⛔</span><div>' +
      '<strong>Impossible de charger</strong><br>' + esc(ex.message) +
      '<br><button class="ocr-btn ocr-btn--secondaire ocr-btn--petit" id="btnReessayer" style="margin-top:9px">↻ Réessayer</button>' +
      '</div></div>';
    const br = $('#btnReessayer');
    if (br) br.addEventListener('click', () => rendre());
  }
  clearTimeout(sablier);
  majHistoriqueSousEcran();
  if (discret) window.scrollTo(0, yAvant);
}

/* ==========================================================================
   SAISIE
   ========================================================================== */
const form = { tel: '', nom: '', clientTrouve: null, gabarit: 'berline', marque: '', modele: '', immat: '',
               vehTrouve: null,   // véhicule retrouvé par sa plaque, pour rattacher le client
               parPlaque: false,  // le client a été reconnu par la plaque, pas par le téléphone
               gabaritManuel: false, gabaritDeduit: null, gabaritDesaccord: null,   // taille : choisie, déduite, ou en désaccord
               prestation: null, options: [], equipe: [], remise: 0, motifRemise: '', manuel: 0,
               quantite: 1,       // plusieurs véhicules identiques (parc Ehu Motors)
               sansChrono: false, motifSansChrono: '',   // lavage déjà fait, saisi après coup
               jour: null, motifRetard: '',   // rattrapage : lavage d'un jour passé
               demarrer: false,   // la voiture entre en baie tout de suite
               note: '', reservation: null };

/* « 1 lavage », « 3 lavages » — jamais « 1 lavage(s) ». Une parenthèse de
   politesse grammaticale sur chaque écran finit par donner l'air d'un
   formulaire administratif ; l'app parle comme on parle. */
function pluriel(n, singulier, plurielMot) {
  return n + ' ' + (n > 1 ? (plurielMot || singulier + 's') : singulier);
}

/* « 3 motos », « 3 véhicules » — le mot juste, au pluriel quand il le faut. */
function lotTexte(q, gabarit) {
  if (!q || q <= 1) return '';
  return q + (gabarit === 'moto' ? ' motos' : ' véhicules');
}

/* L'entreprise partenaire du client reconnu — vraie dès qu'on sait QUI est là,
   sans attendre qu'une prestation soit choisie (T.partenaire, lui, dépend du
   montant : il sert à afficher la remise, pas à reconnaître la personne). */
function partenaireDe(c) {
  const e = c && c.entreprises;
  return e && e.remise_pct > 0 ? e : null;
}

/* Combien de véhicules identiques dans ce passage. Une plaque = un véhicule :
   dès qu'une plaque est saisie, la quantité retombe à 1. */
function quantiteForm() {
  if (OCR.plaque(form.immat)) return 1;
  return Math.max(1, Math.min(50, Number(form.quantite) || 1));
}
function totalForm() {
  let cat = 0, devis = 0;
  if (form.prestation) {
    const p = OCR.prix(form.prestation, form.gabarit);
    if (p == null) devis++; else cat += p;
    form.options.forEach(o => { const op = OCR.option(o); if (op) cat += op.prix; });
  }
  const unite = cat + Math.max(0, Number(form.manuel) || 0);   // le prix d'UN véhicule
  const q = quantiteForm();
  const brut = unite * q;
  // Employé d'une entreprise partenaire (Ehu Motors…) : la remise suit la
  // PERSONNE, quel que soit le véhicule. Le champ Remise peut la remplacer.
  const ent = form.clientTrouve && form.clientTrouve.entreprises;
  const auto = ent && ent.remise_pct > 0 ? Math.round(brut * ent.remise_pct / 100) : 0;
  const remise = Math.min(Number(form.remise) > 0 ? Number(form.remise) : auto, brut);
  return { unite, q, brut, remise, total: brut - remise, devis,
           partenaire: auto > 0 && !(Number(form.remise) > 0) ? ent : null };
}

/* Les lavages déjà enregistrés pour la journée saisie — juste ce qu'il faut
   pour dire « cette plaque est déjà passée ». Rempli à chaque rendu de la
   Saisie, à partir du cache : aucun aller-retour supplémentaire. */
let LAVAGES_DU_JOUR = [];

/* L'aide sous le champ Immatriculation — jamais bloquante, toujours parlante.
   Elle dit, selon le cas : le format attendu, la plaque reconnue, ou le
   véhicule déjà connu et à qui il appartient. */
function aideImmat() {
  const et = OCR.plaqueEtat(form.immat, form.gabarit);
  if (et.vide)
    return 'La plaque suffit à démarrer : elle reconnaît le client toute seule. ' +
           'Voiture : ' + OCR.PLAQUE_EXEMPLES.voiture + ' · Moto : ' + OCR.PLAQUE_EXEMPLES.moto;
  const v = form.vehTrouve;

  /* ── DEUX GARDE-FOUS, AUCUN NE BLOQUE (14/08) ──────────────────────────
     Le 14/08, un grand SUV a été annulé puis re-saisi en BERLINE pour que le
     prix tombe de 3 500 à 3 000. Ces deux phrases-là auraient arrêté le geste
     au moment exact où il se faisait. Elles ne refusent rien : elles disent
     tout haut ce que l'application savait déjà. */
  const alertes = [];
  if (v && v.gabarit && form.gabarit && v.gabarit !== form.gabarit) {
    const gF = (OCR.gabarit(v.gabarit) || {}).court || v.gabarit;
    const gS = (OCR.gabarit(form.gabarit) || {}).court || form.gabarit;
    const pF = OCR.prix(form.prestation, v.gabarit), pS = OCR.prix(form.prestation, form.gabarit);
    alertes.push('<span style="color:var(--ocr-ambre)">⚠ ' + esc(et.cle) + ' est enregistrée en <strong>' +
      esc(gF) + '</strong> — tu saisis une <strong>' + esc(gS) + '</strong>.' +
      (pF != null && pS != null && pF !== pS
        ? ' Le tarif change : ' + OCR.fcfa(pS) + ' au lieu de ' + OCR.fcfa(pF) + '.' : '') + '</span>');
  }
  const dejaVu = (LAVAGES_DU_JOUR || []).filter(x => OCR.plaque(x.immat) === et.cle);
  if (dejaVu.length) {
    alertes.push('<span style="color:var(--ocr-ambre)">⚠ ' + esc(et.cle) + ' a déjà ' +
      (dejaVu.length > 1 ? dejaVu.length + ' lavages' : 'un lavage') + ' ' +
      (form.jour ? 'ce jour-là' : 'aujourd’hui') + ' : ' +
      esc(dejaVu.map(x => x.reference + (x.heure ? ' à ' + x.heure : '') +
        ' · ' + OCR.fcfa(x.montant)).join(', ')) + '.</span>');
  }
  const avec = txt => (alertes.length ? alertes.join('<br>') + '<br>' : '') + txt;

  if (v && v.immatriculation === et.cle && v.clients) {
    // La plaque appartient à quelqu'un d'autre que le client saisi : on le dit,
    // on ne corrige rien tout seul (il arrive qu'on lave la voiture d'un proche).
    if (form.clientTrouve && form.clientTrouve.id !== v.clients.id)
      return avec('<span style="color:var(--ocr-ambre)">⚠ Cette plaque est au nom de ' + esc(v.clients.nom) +
             ', pas de ' + esc(form.clientTrouve.nom) + ' — à vérifier.</span>');
    return avec('<span style="color:var(--ocr-vert)">✓ Véhicule connu — ' + esc(v.clients.nom) + '</span>');
  }
  if (!et.ok || !et.accord)
    return avec('<span style="color:var(--ocr-ambre)">' + esc(et.aide) + '</span>');
  return avec('<span style="color:var(--ocr-vert)">' + esc(et.aide) + '</span>');
}

        return `<button class="presta" data-presta="${p.id}" aria-pressed="${form.prestation === p.id}">
          <span class="coche">${form.prestation === p.id ? '✓' : ''}</span>
          <span style="min-width:0"><span class="nm">${esc(p.nom)}</span>
            <span class="du">${esc(OCR.dureeTexte(OCR.duree(p.id, form.gabarit)) || OCR.dureeFourchette(p.id))}</span></span>
          <span class="pr" ${prix == null ? 'style="color:var(--ocr-argent-2);font-weight:500"' : ''}>${OCR.fcfa(prix)}</span>
        </button>`;
      }).join('')}

      ${opts.length ? `<div class="ocr-mini" style="margin:var(--ocr-e5) 0 8px;letter-spacing:.16em;text-transform:uppercase">Options</div>` +
        opts.map(o => `<button class="presta" data-opt="${o.id}" ${o.comprise ? 'disabled' : ''} aria-pressed="${form.options.includes(o.id)}">
            <span class="coche">${form.options.includes(o.id) ? '✓' : ''}</span>
            <span class="nm">${esc(o.nom)}</span>
            <span class="pr">${o.comprise ? 'Comprise' : '+ ' + OCR.fcfa(o.prix)}</span>
          </button>`).join('') : ''}

      ${T.devis ? `<label class="ocr-champ" style="margin-top:var(--ocr-e5)">
        <span class="ocr-label" style="color:var(--ocr-rouge-texte)">Montant sur devis</span>
        <input class="ocr-saisie" id="fManuel" type="number" min="0" step="500" value="${form.manuel || ''}"
               placeholder="Montant convenu après évaluation"></label>` : ''}

      <label class="ocr-champ" style="margin-top:var(--ocr-e4)"><span class="ocr-label">Remise</span>
        <input class="ocr-saisie" id="fRemise" type="number" min="0" step="500" value="${form.remise || ''}"
               placeholder="${T.partenaire ? OCR.fcfa(T.remise) + ' auto (' + esc(T.partenaire.nom) + ')' : '0'}">
        ${T.partenaire ? `<span class="ocr-aide">Remise ${T.partenaire.remise_pct} % ${esc(T.partenaire.nom)} appliquée — remplis ce champ seulement pour la remplacer.</span>` : ''}</label>
      ${Number(form.remise) > 0 ? `
      <label class="ocr-champ"><span class="ocr-label" style="color:var(--ocr-rouge-texte)">Motif de la remise — obligatoire</span>
        <input class="ocr-saisie" id="fMotifRemise" value="${esc(form.motifRemise || '')}"
               placeholder="Geste commercial, reprise d’un défaut…">
        <span class="ocr-aide">Toute remise manuelle est justifiée et inscrite au journal.</span></label>` : ''}
      ${/* DÉJÀ LAVÉ, SANS CHRONO (14/08) — « il doit être capable de saisir des
           véhicules sans passer par commencer et fin, mais il doit aussi
           justifier pourquoi » (Edwin). Le cas courant : l'atelier est débordé,
           la voiture est lavée, et la saisie se fait après coup. Refuser
           reviendrait à faire inventer des heures — donc on accepte, et on
           écrit pourquoi. */''}
      ${/* DÉMARRER TOUT DE SUITE (14/08) — le lavage le plus fréquent, c'est la
           voiture qui entre en baie dans la seconde. Sans ça il faut aller la
           retrouver dans Journée pour appuyer sur ▶ : un geste de plus, et
           surtout LE geste qu'on oublie — c'est de là que viennent tous les
           lavages sans chrono. Ce n'est PAS coché par défaut : quand trois
           voitures attendent, démarrer les trois chronos gonflerait les temps. */''}
      ${form.jour ? '' : `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:var(--ocr-e4)">
        <button class="ocr-chip" data-dem aria-pressed="${form.demarrer}"
          ${form.sansChrono ? 'disabled' : ''}>▶ Démarrer tout de suite</button>
        <button class="ocr-chip" data-sc aria-pressed="${form.sansChrono}"
          ${form.demarrer ? 'disabled' : ''}>⏱ Déjà lavé — sans chrono</button>
      </div>`}
      ${form.sansChrono ? `
      <div class="ocr-carte" style="padding:var(--ocr-e4);margin-top:var(--ocr-e3);border-color:rgba(245,166,35,.38)">
        <p class="ocr-mini" style="margin:0 0 9px">Le véhicule entrera directement en
          <strong style="color:var(--ocr-blanc)">terminé</strong>, sans ▶ ni ✓. Il compte normalement
          dans le chiffre d’affaires, mais il sera absent des moyennes de temps — et la direction
          lira le motif dans Contrôle des temps.</p>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px">
          ${MOTIFS_DEJA_LAVE.map(([court, texte], i) => `<button class="ocr-chip" data-scm="${i}"
            aria-pressed="${form.motifSansChrono === texte}">${esc(court)}</button>`).join('')}
        </div>
        <label class="ocr-champ" style="margin-bottom:0">
          <span class="ocr-label" style="color:var(--ocr-rouge-texte)">Pourquoi le chrono n’a pas tourné — obligatoire</span>
          <input class="ocr-saisie" id="fMotifSansChrono" value="${esc(form.motifSansChrono)}"
                 placeholder="En deux mots"></label>
      </div>` : ''}
      <label class="ocr-champ" style="margin-bottom:0;margin-top:var(--ocr-e4)"><span class="ocr-label">Observation</span>
        <textarea class="ocr-saisie" id="fNote" rows="2" placeholder="Rayure signalée sur l’aile avant droite…">${esc(form.note)}</textarea></label>

      <div class="total-collant">
        <div>
          <div class="ocr-mini">Total à encaisser</div>
          <div style="font:700 22px/1 var(--ocr-texte);font-variant-numeric:tabular-nums">${OCR.fcfa(T.total)}</div>
          ${T.q > 1 ? `<div class="ocr-mini">${T.q} × ${OCR.fcfa(T.unite)} = ${OCR.fcfa(T.brut)}</div>` : ''}
          ${T.remise ? `<div class="ocr-mini">${T.q > 1 ? '' : 'Brut ' + OCR.fcfa(T.brut) + ' '}− remise ${OCR.fcfa(T.remise)}${
            T.partenaire ? ' · ' + esc(T.partenaire.nom) + ' ' + T.partenaire.remise_pct + ' %' : ''}</div>` : ''}
        </div>
        <div style="flex:1"></div>
        <button class="ocr-btn ocr-btn--primaire" id="btnEnregistrer" ${T.total > 0 ? '' : 'disabled'}>Enregistrer</button>
      </div>
    </div>
  </div>`;

  // liaisons
  const maj = (k, v) => { form[k] = v; vueSaisie(j); };
  const elTel = $('#fTel');
  if (elTel) {
    brancherTel(elTel);
    elTel.addEventListener('change', async e => {
      form.tel = telPropre(e.target.value);
      form.clientTrouve = form.tel ? await API.clientParTelephone(form.tel) : null;
      form.parPlaque = false;
      if (form.clientTrouve && !form.nom) form.nom = form.clientTrouve.nom;
      form.vehsClient = form.clientTrouve ? await API.vehiculesDe(form.clientTrouve.id) : [];
      /* Il a commencé par le téléphone (le client parle avant de sortir la voiture).
         Si ce client n'a qu'UN véhicule connu, c'est presque sûrement celui-là :
         on remplit la plaque au lieu de la lui faire retaper. Deux véhicules ou
         plus → on affiche les pastilles « Ses autres véhicules » et il choisit. */
      const seul = form.vehsClient.length === 1 && !partenaireDe(form.clientTrouve)
                 ? form.vehsClient[0] : null;
      if (seul && !form.immat) {
        Object.assign(form, {
          immat: OCR.plaque(seul.immatriculation || ''),
          marque: seul.marque || form.marque, modele: seul.modele || form.modele,
          vehTrouve: { ...seul, clients: { id: form.clientTrouve.id, nom: form.clientTrouve.nom } },
        });
        if (!form.gabaritManuel && seul.gabarit) form.gabarit = seul.gabarit;
      }
      vueSaisie(j);
    });
  }
  const elHv = $('#fHistoVeh');
  if (elHv) elHv.addEventListener('click', () => {
    const id = form.vehTrouve.id;
    onglet = 'clients'; rech.veh = null; rech.fiche = null;
    peindreOnglets(); ouvrirVehicule(id);
  });
  // « Changer » : ce n'est pas ce client-là (on lave la voiture d'un proche,
  // ou la plaque a été retapée) — on repart d'un client vide.
  const elAutre = $('#fAutreClient');
  if (elAutre) elAutre.addEventListener('click', () => {
    Object.assign(form, { tel: '', nom: '', clientTrouve: null, vehsClient: [], parPlaque: false });
    vueSaisie(j);
  });
  $('#vue').querySelectorAll('[data-qte]').forEach(b => b.addEventListener('click', () => {
    form.quantite = Number(b.dataset.qte); vueSaisie(j);
  }));
  const elQ = $('#fQte');
  if (elQ) elQ.addEventListener('change', e => {
    form.quantite = Math.max(1, Math.min(50, Number(e.target.value) || 1));
    vueSaisie(j);
  });
  $('#vue').querySelectorAll('[data-vcli]').forEach(b => b.addEventListener('click', () => {
    const v = form.vehsClient.find(x => x.id === b.dataset.vcli);
    Object.assign(form, { gabarit: v.gabarit, marque: v.marque || '', modele: v.modele || '',
                          immat: OCR.plaque(v.immatriculation),
                          vehTrouve: { ...v, clients: { id: form.clientTrouve.id, nom: form.clientTrouve.nom } },
                          gabaritManuel: false, gabaritDeduit: null, gabaritDesaccord: null });
    vueSaisie(j);
  }));
  // suggestions marque/modèle + taille déduite du modèle
  brancherMarqueModele($('#fMarque'), $('#fModele'), () => form.gabarit, () => {
    form.marque = $('#fMarque').value; form.modele = $('#fModele').value;
  }, (g, quoi) => {
    // Samuel a choisi la taille à la main : on ne la lui reprend pas.
    if (form.gabaritManuel) return;
    form.marque = $('#fMarque').value; form.modele = $('#fModele').value;
    /* Désaccord : la plaque est déjà enregistrée dans une taille, et le modèle
       tapé en dit une autre. On ne tranche PAS en silence — le prix en dépend.
       On garde la taille enregistrée et on demande de vérifier. */
    const v = form.vehTrouve;
    if (v && v.marque && v.gabarit && v.gabarit !== g) {
      form.gabaritDesaccord = { stocke: v.gabarit, deduit: g, quoi };
      form.gabaritDeduit = null;
      vueSaisie(j);
      return;
    }
    form.gabarit = g;
    form.gabaritDeduit = quoi;
    form.gabaritDesaccord = null;
    vueSaisie(j);
    toast('Taille : ' + (OCR.gabarit(g) || {}).nom + ' (d’après ' + quoi + ')');
  });
  ['fNom:nom', 'fMarque:marque', 'fModele:modele', 'fNote:note', 'fMotifRemise:motifRemise',
   'fMotifSansChrono:motifSansChrono', 'fMotifRetard:motifRetard'].forEach(p => {
    const [id, k] = p.split(':');
    const el = $('#' + id); if (el) el.addEventListener('input', e => { form[k] = e.target.value; });
  });
  /* Immatriculation : mise en forme pendant la frappe (majuscules, sans espace
     ni tiret) pour que « cb 5916 » et « CB5916 » soient LE MÊME véhicule — sinon
     on crée des doublons et la fidélité se disperse. On repositionne le curseur
     sur le bon caractère, sinon il saute à la fin dès qu'on corrige au milieu. */
  const elImmat = $('#fImmat');
  if (elImmat) {
    brancherPlaque(elImmat, propre => {
      form.immat = propre;
      if (form.vehTrouve && form.vehTrouve.immatriculation !== propre) form.vehTrouve = null;
      const aide = $('#aideImmat'); if (aide) aide.innerHTML = aideImmat();
    });
    // À la validation du champ : si la plaque est déjà connue, on rattache le
    // client tout seul — le véhicule arrive, on lit la plaque, on sait qui c'est.
    elImmat.addEventListener('change', async () => {
      form.immat = OCR.plaque(form.immat);
      if (!form.immat) { form.vehTrouve = null; return vueSaisie(j); }
      let v = null;
      try { v = await API.vehiculeParPlaque(form.immat); } catch (ex) {}
      form.vehTrouve = v;
      if (v) {
        if (v.gabarit) form.gabarit = v.gabarit;
        if (!form.marque && v.marque) form.marque = v.marque;
        if (!form.modele && v.modele) form.modele = v.modele;
        // On ne remplace jamais un client déjà saisi : on le complète seulement.
        if (v.clients && !form.tel && !form.clientTrouve) {
          form.tel = v.clients.telephone || '';
          form.nom = v.clients.nom || '';
          form.parPlaque = true;
          // La fiche complète (avec la remise partenaire éventuelle) vient du
          // téléphone ; sans téléphone (fiche provisoire), on garde l'essentiel.
          form.clientTrouve = form.tel
            ? await API.clientParTelephone(form.tel).catch(() => null)
            : { id: v.clients.id, nom: v.clients.nom, telephone: null };
          form.vehsClient = form.clientTrouve && form.clientTrouve.id
            ? await API.vehiculesDe(form.clientTrouve.id).catch(() => []) : [];
          toast('Véhicule connu — ' + v.clients.nom);
        }
      }
      vueSaisie(j);
    });
  }
  ['fRemise:remise', 'fManuel:manuel'].forEach(p => {
    const [id, k] = p.split(':');
    const el = $('#' + id); if (el) el.addEventListener('change', e => maj(k, Number(e.target.value) || 0));
  });
  $('#vue').querySelectorAll('[data-gab]').forEach(b => b.addEventListener('click', () => {
    form.gabarit = b.dataset.gab;
    form.gabaritManuel = true; form.gabaritDeduit = null; form.gabaritDesaccord = null;   // le choix de l'humain gagne
    /* Passer d'une voiture à une moto (ou l'inverse) rend la prestation choisie
       impossible : elle disparaît de la liste, mais elle resterait dans le total
       et se vendrait « sur devis ». On l'oublie — un choix qu'on ne voit plus
       ne doit pas continuer à compter. Un lavage voiture reste valable sur une
       camionnette : là, seul le prix se négocie. */
    if (form.prestation && !OCR.prestationsPour(form.gabarit).some(x => x.id === form.prestation)) {
      form.prestation = null; form.options = []; form.manuel = 0;
    }
    vueSaisie(j);
  }));
  $('#vue').querySelectorAll('[data-presta]').forEach(b => b.addEventListener('click', () => {
    form.prestation = form.prestation === b.dataset.presta ? null : b.dataset.presta;
    form.options = []; vueSaisie(j);
  }));
  $('#vue').querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.opt, i = form.options.indexOf(id);
    i === -1 ? form.options.push(id) : form.options.splice(i, 1);
    vueSaisie(j);
  }));
  const bja = $('#vue').querySelector('[data-jourautre]');
  if (bja) bja.addEventListener('click', () => boiteJourPasse(j));
  const bjh = $('#vue').querySelector('[data-jourauj]');
  if (bjh) bjh.addEventListener('click', () => {
    form.jour = null; form.motifRetard = ''; vueSaisie(j);
  });
  $('#vue').querySelectorAll('[data-mr]').forEach(b => b.addEventListener('click', () => {
    form.motifRetard = MOTIFS_RETARD[Number(b.dataset.mr)][1]; vueSaisie(j);
  }));
  const bdem = $('#vue').querySelector('[data-dem]');
  if (bdem) bdem.addEventListener('click', () => {
    form.demarrer = !form.demarrer;
    if (form.demarrer) { form.sansChrono = false; form.motifSansChrono = ''; }
    vueSaisie(j);
  });
  const bsc = $('#vue').querySelector('[data-sc]');
  if (bsc) bsc.addEventListener('click', () => {
    form.sansChrono = !form.sansChrono;
    if (!form.sansChrono) form.motifSansChrono = '';
    vueSaisie(j);
  });
  $('#vue').querySelectorAll('[data-scm]').forEach(b => b.addEventListener('click', () => {
    form.motifSansChrono = MOTIFS_DEJA_LAVE[Number(b.dataset.scm)][1]; vueSaisie(j);
  }));
  $('#vue').querySelectorAll('[data-parc]').forEach(b => b.addEventListener('click', () =>
    boiteParcPartenaire(PARTENAIRES.find(x => x.id === b.dataset.parc), j)));
  $('#btnEnregistrer').addEventListener('click', enregistrer);
  /* Chaque frappe met le brouillon à l'abri — les listeners « input » du dessus
     remplissent form sans repeindre, celui-ci recopie form dans le téléphone. */
  $('#vue').addEventListener('input', sauverBrouillon);
  sauverBrouillon();
}

async function enregistrer() {
  if (enCours) return;
  const T = totalForm();
  if (!form.prestation) return toast('Choisissez une prestation.', true);
  if (T.total <= 0) return toast('Le montant doit être supérieur à zéro.', true);
  // Une remise manuelle sans motif, c'est la porte ouverte aux arrangements :
  // le serveur la refuse aussi, ceci n'est que le message aimable.
  if (Number(form.remise) > 0 && !String(form.motifRemise || '').trim())
    return toast('Indique le motif de la remise — il est inscrit au journal.', true);
  if (form.sansChrono && !String(form.motifSansChrono || '').trim())
    return toast('Dis pourquoi le chrono n’a pas tourné — sinon ce lavage devient illisible dans un mois.', true);
  if (form.jour && !String(form.motifRetard || '').trim())
    return toast('Dis pourquoi ce lavage est saisi en retard — Guénolé le verra à la clôture.', true);
  if (!navigator.onLine) return toast('Hors ligne — impossible d’enregistrer.', true);

  /* PAS DE PLAQUE (13/08) — « ça peut arriver, il faut juste qu'il mette un
     motif » (Edwin). On n'interdit rien : on demande une ligne, en un appui,
     et la direction tranchera à la clôture. Le parc d'un partenaire n'a pas
     de plaque par nature : on ne lui pose pas la question. */
  const parcPart = !!(partenaireDe(form.clientTrouve) && !OCR.plaque(form.immat));
  let motifSP = null;
  if (!OCR.plaque(form.immat) && !parcPart) {
    motifSP = await demanderMotifSansPlaque();
    if (motifSP === null) return;          // il préfère aller chercher la plaque
  }

  const p = OCR.prestation(form.prestation);
  const lignes = [];
  const prixBase = OCR.prix(form.prestation, form.gabarit);
  lignes.push({ type: 'prestation', code: p.id, libelle: p.nom,
                prix: prixBase == null ? Math.max(0, Number(form.manuel) || 0) : prixBase,
                duree_min: OCR.duree(form.prestation, form.gabarit) });
  form.options.forEach(o => {
    const op = OCR.option(o);
    if (op) lignes.push({ type: 'option', code: op.id, libelle: op.nom, prix: op.prix, duree_min: op.duree });
  });

  enCours = true;
  const b = $('#btnEnregistrer'); if (b) { b.disabled = true; b.textContent = 'Enregistrement…'; }
  try {
    const { data, error } = await API.enregistrer({
      p_client_nom: form.nom || null,
      p_telephone: form.tel,
      p_gabarit: form.gabarit,
      p_lignes: lignes,
      p_remise: T.remise,
      p_motif_remise: Number(form.remise) > 0 ? String(form.motifRemise || '').trim() : null,
      p_marque: form.marque, p_modele: form.modele, p_immat: OCR.plaque(form.immat) || null,
      p_equipe: form.equipe, p_note: form.note,
      p_reservation: form.reservation,
      p_quantite: T.q,
      // parc du partenaire : des motos d'Ehu, pas le véhicule de l'employé
      p_parc: parcPart,
      p_motif_sans_plaque: motifSP,
      p_journee: form.jour,
      p_motif_retard: form.jour ? String(form.motifRetard).trim() : null,
    });
    if (error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    /* Lavage déjà fait : on le solde tout de suite, avec son motif. Si ce
       deuxième appel échoue, le passage existe et reste « à démarrer » — la
       fiche du jour propose alors « Terminé sans chrono… ». On le dit.
       (Un rattrapage, lui, arrive déjà terminé : c'est la base qui le fait.) */
    let scRate = null;
    if (form.sansChrono && !form.jour) {
      const { error: e2 } = await API.avancer(r.id, 'pret', String(form.motifSansChrono).trim());
      if (e2) scRate = e2.message;
    }
    /* Le chrono part avec l'enregistrement : l'heure de début reste tamponnée
       par le serveur, comme toujours — on épargne juste un aller-retour par
       l'écran Journée, et surtout l'oubli du ▶. */
    let demRate = null;
    if (form.demarrer && !form.jour) {
      const { error: e3 } = await API.avancer(r.id, 'en_cours', null);
      if (e3) demRate = e3.message;
    }
    const sansClient = !form.tel && !(form.clientTrouve && form.clientTrouve.id);
    toast(r.reference + ' enregistré · ' + (T.q > 1 ? T.q + ' véhicules · ' : '') + OCR.fcfa(r.montant_total) +
      (sansClient && form.immat ? ' — fiche « Véhicule ' + form.immat +' » à compléter' : '') +
      (motifSP ? ' — sans plaque, à valider à la clôture' : '') +
      (form.jour ? ' — écrit sur le ' + jourBref(form.jour) : '') +
      (form.sansChrono && !form.jour && !scRate ? ' — terminé, sans chrono' : '') +
      (form.demarrer && !form.jour && !demRate ? ' — chrono lancé ▶' : ''));
    if (demRate) toast('Enregistré, mais le chrono n’a pas démarré : ' + demRate +
      ' — appuie sur ▶ sur la fiche du jour.', true);
    if (scRate) toast('Enregistré, mais resté « à démarrer » : ' + scRate +
      ' — solde-le avec « Terminé sans chrono… » sur la fiche du jour.', true);
    Object.assign(form, { quantite: 1, tel: '', nom: '', clientTrouve: null, marque: '', modele: '', immat: '',
                          vehTrouve: null,
                          prestation: null, options: [], remise: 0, motifRemise: '', manuel: 0,
                          sansChrono: false, motifSansChrono: '', demarrer: false,
                          note: '', reservation: null });
    effacerBrouillon();
    /* On NE remet PAS form.jour à aujourd'hui : quand on rattrape hier, on a
       presque toujours plusieurs lavages à rattraper d'affilée. La barre orange
       reste bien visible, et « Revenir à aujourd'hui » est à côté. */
    /* On ouvre la Journée DU LAVAGE, pas celle d'aujourd'hui : après un
       rattrapage, Samuel veut vérifier ce qu'il vient d'ajouter à hier. */
    if (form.jour) jourVu = form.jour;
    onglet = 'journee';
    await rendre();
  } catch (ex) {
    const m = ex.message || 'Enregistrement impossible';
    if (/JOURNEE_SIGNEE/.test(m)) boiteDemanderReouverture(form.jour, m);
    else toast(m, true);
  } finally {
    enCours = false;
    const bb = $('#btnEnregistrer'); if (bb) { bb.disabled = false; bb.textContent = 'Enregistrer'; }
  }
}

/* DEUX ÉTAPES, PLUS TROIS (14/08) — « la livraison n'est pas nécessaire »
   (Edwin). ▶ Commencer, ✓ Terminé, c'est fini : le troisième bouton demandait
   un geste de plus pour une information dont personne ne se servait — et il
   laissait des voitures « prêtes » toute la soirée alors qu'elles étaient
   parties. « livre » reste connu de l'app : l'historique le porte encore, et
   il s'affiche « Terminé » comme les autres. */
const ETAT_ATELIER = { attente: ['À démarrer', 'neutre'], en_cours: ['En cours', 'marque'],
                       pret: ['Terminé', 'succes'], livre: ['Terminé', 'succes'] };
const FINI = ['pret', 'livre'];
const estFini = p => FINI.includes(p.statut_atelier);

/* Minutes entre deux heures 'HH:MM:SS' — le chrono des lavages. */
function minutesEntre(a, b) {
  if (!a || !b) return null;
  const m = t => { const [h, mi, s] = String(t).split(':').map(Number); return h * 60 + mi + (s || 0) / 60; };
  const d = m(b) - m(a);
  return d >= 0 ? Math.round(d) : null;
}
const heureMaintenant = () => new Date().toTimeString().slice(0, 8);

/* La ligne chrono d'une fiche : démarré à…, ou temps réel vs référence. */
function ligneChrono(p) {
  const codeP = ((p.passage_lignes || []).find(l => l.type === 'prestation') || {}).code;
  const ref = codeP ? OCR.duree(codeP, p.gabarit) : null;
  // Un véhicule qui traîne « à démarrer » = un chrono qui ne sera jamais bon :
  // on le signale au bout de 15 min pour que le ▶ soit appuyé à temps.
  if (p.statut_atelier === 'attente' && p.heure_arrivee) {
    const attend = minutesEntre(p.heure_arrivee, heureMaintenant());
    if (attend != null && attend > 15)
      return `<span class="ocr-mini" style="color:var(--ocr-ambre)">⚠ à démarrer — arrivé il y a ${attend} min. Appuie sur ▶ dès que le lavage commence.</span>`;
    return '';
  }
  if (p.statut_atelier === 'en_cours' && p.heure_debut) {
    const depuis = minutesEntre(p.heure_debut, heureMaintenant());
    const retard = ref != null && depuis != null && depuis > ref * 1.25;
    return `<span class="ocr-mini" style="${retard ? 'color:var(--ocr-ambre)' : ''}">⏱ démarré à ${heureCourte(p.heure_debut)}${
      depuis != null ? ' · ' + depuis + ' min' : ''}${ref != null ? ' (prévu ' + ref + ')' : ''}${retard ? ' ⚠' : ''}</span>`;
  }
  const reel = minutesEntre(p.heure_debut, p.heure_fin);
  if (reel == null) return '';
  /* Démarré et terminé dans la même minute : ce n'est pas un lavage rapide,
     c'est un chrono qui n'a pas tourné (essai, double appui). L'afficher en
     vert « dans les temps » était un mensonge — vu chez Edwin le 13/08. */
  if (reel <= 0) return '<span class="ocr-mini" style="color:var(--ocr-ambre)">' +
    '⏱ chrono non tenu — ▶ et ✓ appuyés dans la même minute. Ce lavage ne compte pas dans les temps.</span>';
  const ton = ref == null ? '' : reel <= ref ? 'color:var(--ocr-vert)' : reel > ref * 1.25 ? 'color:var(--ocr-ambre)' : '';
  return `<span class="ocr-mini" style="${ton}">⏱ ${reel} min de lavage${ref != null ? ' · prévu ' + ref : ''}${
    ref != null && reel <= ref ? ' ✓' : ref != null && reel > ref * 1.25 ? ' ⚠' : ''}</span>`;
}

/* Barre de navigation par jour, partagée entre Journée et Clôture. */
function barreJour(j) {
  const estAuj = jourVu === auj();
  const etat = estAuj ? 'Aujourd’hui'
             : j.statut === 'ouverte' ? '⚠ jamais clôturée' : 'clôturée et signée';
  return `<div class="barre-jour">
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-jnav="-1" aria-label="Jour précédent">‹</button>
    <div class="bj-centre">
      <div class="bj-date">${jourLong(jourVu)}</div>
      <div class="ocr-mini" style="margin-top:2px">${etat}${estAuj ? '' :
        ' · <button class="bj-lien" data-jnav="0">revenir à aujourd’hui</button>'}</div>
    </div>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-jnav="1"
            aria-label="Jour suivant" ${estAuj ? 'disabled' : ''}>›</button>
  </div>`;
}
function brancherJour() {
  $('#vue').querySelectorAll('[data-jnav]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.jnav);
    jourVu = n === 0 ? auj() : decaleJour(jourVu, n);
    rendre();
  }));
}

async function vueJournee(j) {
  const d = jourVu;
  const estAuj = d === auj();
  const [T, ps, pts, obj, moisRows, sigRows] = await Promise.all([
    API.totaux(d), API.passages(d), API.pointagesJour(d),
    estAuj ? API.objectifs().catch(() => null) : Promise.resolve(null),
    estAuj ? API.totauxDepuis(debutMois()) : Promise.resolve([]),
    estAuj ? API.signaturesDepuis(debutMois()).catch(() => []) : Promise.resolve([]),
  ]);
  const verrou = j.statut !== 'ouverte';

  $('#vue').innerHTML = `
    ${barreJour(j)}
    ${verrou ? `<div class="ocr-message ocr-message--succes" style="margin-bottom:var(--ocr-e4)"><span>🔒</span><div>
      <strong>Journée clôturée et signée</strong><br>Lecture seule.</div></div>` : ''}
    <div class="tuiles">
      <div class="tuile"><div class="lab">Chiffre d’affaires</div><div class="val">${OCR.fcfa(T.ca || 0)}</div>
        <div class="sub">${T.vehicules || 0} véhicule(s)</div></div>
      <div class="tuile"><div class="lab">Encaissé</div><div class="val">${OCR.fcfa(T.encaisse || 0)}</div>
        <div class="sub">${T.impaye ? OCR.fcfa(T.impaye) + ' en attente' : 'tout est encaissé'}</div></div>
      <div class="tuile"><div class="lab">KKiapay</div><div class="val">${OCR.fcfa(T.kkiapay || 0)}</div>
        <div class="sub">mobile money</div></div>
      <div class="tuile"><div class="lab">Espèces</div>
        <div class="val" style="${T.especes ? 'color:var(--ocr-ambre)' : ''}">${OCR.fcfa(T.especes || 0)}</div>
        <div class="sub">${T.especes ? '⚠ à déposer sur le ' + COMPTE_MTN : 'aucune — c’est la règle'}</div></div>
    </div>
    <div class="jour-grille">
      <div class="jg-lateral">
        ${obj ? carteObjectifs(obj, moisRows, sigRows) : ''}
        ${carteEquipe(pts, d)}
        ${carteFinDeJournee(j, pts, d, false)}
      </div>
      <div class="jg-principal">
        ${ps.length ? ps.map(p => ficheePassage(p, verrou)).join('') :
          `<div class="ocr-carte vide">Aucun véhicule enregistré ${estAuj ? 'aujourd’hui' : 'ce jour-là'}.</div>`}
      </div>
    </div>`;

  brancherJour();
  brancherEquipe(pts, d);
  brancherFinDeJournee(d);
  const bo = $('#btnObjectifs');
  if (bo) bo.addEventListener('click', () => boiteObjectifs(obj));
  $('#vue').querySelectorAll('[data-remise]').forEach(b => b.addEventListener('click', () =>
    boiteRemise(b.dataset.remise, b.dataset.ref, Number(b.dataset.brut), Number(b.dataset.deja))));
  $('#vue').querySelectorAll('[data-avance]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const { error } = await API.avancer(b.dataset.avance, b.dataset.vers);
    if (error) toast(error.message, true); else toast('Statut mis à jour');
    rendre();
  }));
  $('#vue').querySelectorAll('[data-sanschrono]').forEach(b =>
    b.addEventListener('click', () => boiteSansChrono(b.dataset.sanschrono, b.dataset.ref)));
  $('#vue').querySelectorAll('[data-horsmesurej]').forEach(b =>
    b.addEventListener('click', () => boiteHorsMesure(b.dataset.horsmesurej, () => rendre())));
  $('#vue').querySelectorAll('[data-remesurej]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    const { error } = await API.mesurePassage(b.dataset.remesurej, false, null);
    if (error) { b.disabled = false; return toast(error.message, true); }
    memoVider(); toast('Remis dans les mesures'); rendre();
  }));
  $('#vue').querySelectorAll('[data-encaisser]').forEach(b =>
    b.addEventListener('click', () => boiteEncaissement(b.dataset.encaisser, Number(b.dataset.montant))));
  $('#vue').querySelectorAll('[data-annuler]').forEach(b =>
    b.addEventListener('click', () => boiteAnnulation(b.dataset.annuler, b.dataset.ref, b.dataset.paye === '1')));
}

function ficheePassage(p, verrou) {
  const c = p.clients || {}, v = p.vehicules || {};
  const et = ETAT_ATELIER[p.statut_atelier] || ['—', 'neutre'];
  const paye = p.statut_paiement !== 'impaye';
  const presta = (p.passage_lignes || []).filter(l => l.type === 'prestation').map(l => l.libelle).join(' + ');
  const opts = (p.passage_lignes || []).filter(l => l.type === 'option').map(l => l.libelle).join(', ');

  if (p.annule) {
    return `<div class="fiche fiche--annule">
      <div class="ligne1">
        <span style="font:600 14.5px/1.2 var(--ocr-texte)">${esc(c.nom || 'Client de passage')}</span>
        <span class="ocr-pastille ocr-pastille--erreur">Annulé</span>
        <span style="margin-left:auto;font:700 16px/1 var(--ocr-texte);text-decoration:line-through;
          font-variant-numeric:tabular-nums">${OCR.fcfa(p.montant_total)}</span>
      </div>
      <div class="ocr-mini" style="margin-top:4px">${heureCourte(p.heure_arrivee)} · ${esc(p.reference)} · ${esc(presta)}</div>
      <div class="ocr-mini" style="margin-top:5px">Motif : « ${esc(p.annule_motif || '')} »</div>
    </div>`;
  }

  return `<div class="fiche">
    <div class="ligne1">
      <span style="font:600 14.5px/1.2 var(--ocr-texte)">${esc(c.nom || 'Client de passage')}</span>
      <span class="ocr-pastille ocr-pastille--${et[1]}">${et[0]}</span>
      ${p.quantite > 1 ? `<span class="ocr-pastille ocr-pastille--marque">${lotTexte(p.quantite, p.gabarit)}</span>` : ''}
      <span class="ocr-pastille ocr-pastille--${paye ? 'succes' : 'erreur'}">${
        p.statut_paiement === 'carnet' ? 'Carnet' : paye ? 'Payé · ' + (p.mode_paiement === 'kkiapay' ? 'KKiapay' : 'Espèces') : 'Non payé'}</span>
      <span style="margin-left:auto;font:700 16px/1 var(--ocr-texte);font-variant-numeric:tabular-nums">${OCR.fcfa(p.montant_total)}</span>
    </div>
    <div class="ocr-mini" style="margin-top:4px">${heureCourte(p.heure_arrivee)} · ${esc(p.reference)}${
      v.marque ? ' · ' + esc(v.marque + ' ' + (v.modele || '')) : ''}${v.immatriculation ? ' · ' + esc(v.immatriculation) : ''}${
      p.parc_partenaire ? ' · parc partenaire' : ''}</div>
    <div class="ocr-petit" style="margin-top:5px">${esc(presta)}${opts ? ' <span class="ocr-mini">+ ' + esc(opts) + '</span>' : ''}</div>
    ${(() => { const lc = ligneChrono(p); return lc ? '<div style="margin-top:5px">' + lc + '</div>' : ''; })()}
    ${p.hors_mesure ? `<div class="ocr-mini" style="margin-top:5px;color:var(--ocr-argent-2)">
      ⊘ Hors mesure de temps${p.mesure_motif ? ' — ' + esc(p.mesure_motif) : ''}</div>` : ''}
    ${!p.hors_mesure && p.sans_chrono_motif ? `<div class="ocr-mini" style="margin-top:5px;color:var(--ocr-ambre)">
      ⏱ Terminé sans chrono — ${esc(p.sans_chrono_motif)}</div>` : ''}
    ${verrou ? '' : `<div class="actions">
      ${p.statut_atelier === 'attente' ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit"
        data-avance="${p.id}" data-vers="en_cours">▶ Commencer</button>` : ''}
      ${/* La voiture est partie sans qu'on ait appuyé sur ▶ : l'app restait
            bloquée sur « à démarrer ». Maintenant on la solde, avec un motif —
            et sans inventer d'heures. */''}
      ${p.statut_atelier === 'attente' ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit"
        data-sanschrono="${p.id}" data-ref="${esc(p.reference)}">Terminé sans chrono…</button>` : ''}
      ${p.statut_atelier === 'en_cours' ? `<button class="ocr-btn ocr-btn--secondaire ocr-btn--petit"
        data-avance="${p.id}" data-vers="pret">✓ Lavage terminé</button>` : ''}
      ${!paye ? `<button class="ocr-btn ocr-btn--primaire ocr-btn--petit"
        data-encaisser="${p.id}" data-montant="${p.montant_total}">Encaisser</button>` : ''}
      ${/* LA REMISE APRÈS COUP (14/08). Avant, elle n'existait qu'à la saisie :
           une fois le lavage enregistré, le seul levier était d'annuler. C'est
           ce qui s'est passé le 14/08 — un grand SUV annulé puis re-saisi en
           berline pour que le prix tombe. Le bouton disparaît dès que le
           lavage est encaissé : après, ce n'est plus une remise. */''}
      ${!paye && !verrou && peutCorriger() ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit"
        data-remise="${p.id}" data-ref="${esc(p.reference)}" data-brut="${p.montant_brut}"
        data-deja="${p.remise || 0}">${p.remise > 0 ? 'Remise · ' + OCR.fcfa(p.remise) : 'Remise…'}</button>` : ''}
      ${peutCloturer() && p.heure_debut && p.heure_fin ? (p.hors_mesure
        ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-remesurej="${p.id}"
             style="color:var(--ocr-argent-2)">Remettre dans les mesures</button>`
        : `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" data-horsmesurej="${p.id}"
             style="color:var(--ocr-argent-2)">⊘ Hors mesure…</button>`) : ''}
      ${(!paye || peutCloturer()) ? `<button class="ocr-btn ocr-btn--fantome ocr-btn--petit"
        data-annuler="${p.id}" data-ref="${esc(p.reference)}" data-paye="${paye ? 1 : 0}"
        style="margin-left:auto;color:var(--ocr-argent-2)">Annuler…</button>` : ''}
    </div>`}
  </div>`;
}

/* ── LA REMISE SUR UN LAVAGE DÉJÀ ENREGISTRÉ (14/08) ───────────────────────
   Edwin : « Pas besoin de seuil, je veux faire confiance à Samuel et l'aider à
   grandir, il est jeune donc il apprend. »
   Donc aucun plafond, aucune autorisation à demander — mais un motif, et le
   journal. La confiance se donne avec une trace, pas à la place d'une trace :
   c'est ce qui permet d'en reparler calmement plus tard. */
function boiteRemise(id, ref, brut, deja) {
  const v = modale(`
    <h3 class="ocr-h2">Remise sur ${esc(ref)}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">Lavage à
      <strong style="color:var(--ocr-blanc)">${OCR.fcfa(brut)}</strong>. La remise se pose
      <strong style="color:var(--ocr-blanc)">avant l’encaissement</strong> — après, il est trop tard.
      Le motif est inscrit au journal à ton nom.</p>
    <label class="ocr-champ"><span class="ocr-label">Montant de la remise</span>
      <input class="ocr-saisie" id="rmMontant" type="number" inputmode="numeric" min="0" step="500"
             max="${brut}" value="${deja || ''}" placeholder="500">
      <span class="ocr-aide" id="rmCalcul">&nbsp;</span></label>
    <label class="ocr-champ"><span class="ocr-label" style="color:var(--ocr-rouge-texte)">Motif — obligatoire</span>
      <input class="ocr-saisie" id="rmMotif" placeholder="Geste commercial exceptionnel, reprise d’un défaut…">
      <span class="ocr-aide">Dis ce qui s’est passé : dans un mois, c’est cette phrase qui expliquera l’écart.</span></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e3);align-items:center">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Annuler</button>
      ${deja > 0 ? '<button class="ocr-btn ocr-btn--fantome ocr-btn--petit" id="rmRetirer" ' +
        'style="color:var(--ocr-argent-2)">Retirer la remise</button>' : ''}
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Appliquer</button>
    </div>`);
  const champ = v.querySelector('#rmMontant');
  const calcul = () => {
    const m = Math.max(0, Math.min(brut, Number(champ.value) || 0));
    v.querySelector('#rmCalcul').innerHTML = m > 0
      ? OCR.fcfa(brut) + ' − ' + OCR.fcfa(m) + ' = <strong style="color:var(--ocr-blanc)">' +
        OCR.fcfa(brut - m) + '</strong> à encaisser'
      : 'Le client paiera le tarif plein.';
  };
  champ.addEventListener('input', calcul); calcul();
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  const poser = async (montant, motif, bouton) => {
    bouton.disabled = true;
    const { error } = await API.remisePassage(id, montant, motif);
    if (error) { toast(error.message, true); bouton.disabled = false; return; }
    fermerModale(); memoVider();
    toast(montant > 0 ? 'Remise de ' + OCR.fcfa(montant) + ' appliquée sur ' + ref
                      : 'Remise retirée — ' + ref + ' revient à ' + OCR.fcfa(brut));
    rendre();
  };
  const bR = v.querySelector('#rmRetirer');
  if (bR) bR.addEventListener('click', e => poser(0, null, e.target));
  v.querySelector('[data-ok]').addEventListener('click', e => {
    const m = Math.max(0, Math.min(brut, Number(champ.value) || 0));
    const motif = v.querySelector('#rmMotif').value.trim();
    if (m <= 0) return toast('Mets un montant, ou « Retirer la remise ».', true);
    if (!motif) return toast('Le motif est obligatoire — il est inscrit au journal.', true);
    poser(m, motif, e.target);
  });
}

function boiteAnnulation(id, ref, paye) {
  const v = modale(`
    <h3 class="ocr-h2">Annuler ${esc(ref)}</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e4)">
      ${paye ? 'Ce véhicule a déjà été encaissé : son paiement sera marqué annulé aussi.<br>' : ''}
      Le véhicule restera visible, barré, avec le motif. Tout est inscrit au journal
      au nom de <strong style="color:var(--ocr-blanc)">${esc(moi.nom)}</strong>.</p>
    <label class="ocr-champ"><span class="ocr-label">Motif (obligatoire)</span>
      <textarea class="ocr-saisie" id="motifAnnul" rows="3"
        placeholder="Erreur de saisie — mauvaise prestation choisie…"></textarea></label>
    <div style="display:flex;gap:9px;margin-top:var(--ocr-e4)">
      <button class="ocr-btn ocr-btn--fantome" data-fermer>Garder</button>
      <div style="flex:1"></div>
      <button class="ocr-btn ocr-btn--primaire" data-ok>Annuler le véhicule</button>
    </div>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('[data-ok]').addEventListener('click', async e => {
    const motif = v.querySelector('#motifAnnul').value.trim();
    if (!motif) return toast('Le motif est obligatoire.', true);
    e.target.disabled = true;
    const { error } = await API.annuler({ p_passage: id, p_motif: motif });
    if (error) { toast(error.message, true); e.target.disabled = false; return; }
    fermerModale(); toast(ref + ' annulé'); rendre();
  });
}

function boiteEncaissement(id, montant) {
  const v = modale(`
    <h3 class="ocr-h2">Encaisser</h3>
    <p class="ocr-petit" style="margin:8px 0 var(--ocr-e5)"><strong style="color:var(--ocr-blanc)">${OCR.fcfa(montant)}</strong></p>
    <label class="ocr-champ"><span class="ocr-label">Référence KKiapay (facultatif)</span>
      <input class="ocr-saisie" id="txId" placeholder="KKP-…"></label>
    <button class="ocr-btn ocr-btn--primaire ocr-btn--bloc" data-mode="kkiapay" style="margin-bottom:9px">KKiapay · Mobile Money</button>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" id="btnEspOuvre"
      style="margin-bottom:9px;color:var(--ocr-argent-2)">Espèces — cas exceptionnel…</button>
    <div id="zoneEsp" class="masque">
      <div class="ocr-message ocr-message--alerte" style="margin-bottom:var(--ocr-e4)"><span>⚠</span><div>
        <strong>Le cash n'est pas un mode de paiement normal chez OCR.</strong><br>
        L'argent devra être déposé sur le compte MTN <strong>${COMPTE_MTN}</strong> (le compte KKiapay).
        Un point de contrôle sera ajouté à la clôture de Guénolé.</div></div>
      <label class="ocr-champ"><span class="ocr-label">Motif (obligatoire)</span>
        <input class="ocr-saisie" id="espMotif" placeholder="Réseau Mobile Money en panne…"></label>
      <button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" data-mode="especes" style="margin-bottom:9px">Encaisser en espèces</button>
    </div>
    <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" data-fermer>Annuler</button>`);
  v.querySelector('[data-fermer]').addEventListener('click', fermerModale);
  v.querySelector('#btnEspOuvre').addEventListener('click', () => {
    v.querySelector('#zoneEsp').classList.toggle('masque');
  });
  v.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', async () => {
    const mode = b.dataset.mode;
    const motif = mode === 'especes' ? (v.querySelector('#espMotif').value || '').trim() : null;
    if (mode === 'especes' && !motif) return toast('Les espèces sont exceptionnelles : le motif est obligatoire.', true);
    b.disabled = true;
    const { error } = await API.encaisser({ p_passage: id, p_mode: mode,
      p_transaction: (v.querySelector('#txId').value || '').trim() || null,
      p_motif: motif });
    if (error) { toast(error.message, true); b.disabled = false; return; }
    fermerModale();
    toast(mode === 'especes' ? 'Encaissé en espèces — dépôt à faire sur le ' + COMPTE_MTN : 'Encaissement enregistré');
    rendre();
  }));
}

function calculerAnomalies(ps) {
  const out = [];
  ps.forEach(p => {
    if (p.annule) return;                    // un véhicule annulé ne compte plus
    const c = p.clients || {};
    if (estFini(p) && p.statut_paiement === 'impaye')
      out.push({ cle: 'impaye-' + p.id, gravite: 'critique', titre: 'Véhicule rendu sans encaissement',
        detail: p.reference + ' · ' + (c.nom || 'client') + ' · ' + OCR.fcfa(p.montant_total) + ' non encaissés.',
        passage_id: p.id });
    if (p.remise > 0 && p.montant_brut > 0 && p.remise / p.montant_brut > OCR.CONFIG.seuilRemiseAlerte
        && !(p.clients && p.clients.entreprise_id))   // remise partenaire = légitime, pas d'alerte
      out.push({ cle: 'remise-' + p.id, gravite: 'alerte',
        titre: 'Remise de ' + Math.round(p.remise / p.montant_brut * 100) + ' %',
        detail: p.reference + ' · ' + OCR.fcfa(p.remise) + ' sur ' + OCR.fcfa(p.montant_brut) +
                '. Seuil interne : ' + Math.round(OCR.CONFIG.seuilRemiseAlerte * 100) + ' %.',
        passage_id: p.id });
    // Depuis le 13/08, un lavage peut démarrer avec la seule plaque : la fiche
    // est alors « à compléter ». Ce n'est pas une faute, c'est une chose à
    // finir — et Guénolé la voit le soir à la clôture (choix d'Edwin).
    const plaque = (p.vehicules || {}).immatriculation;
    if (c.a_completer)
      out.push({ cle: 'acompleter-' + p.id, gravite: 'alerte', titre: 'Véhicule lavé sans client identifié',
        detail: p.reference + (plaque ? ' · plaque ' + plaque : '') +
                ' — fiche « ' + (c.nom || 'provisoire') + ' » à rattacher (Clients → À compléter).',
        passage_id: p.id });
    else if (!c.telephone)
      out.push({ cle: 'tel-' + p.id, gravite: 'alerte', titre: 'Client sans numéro de téléphone',
        detail: p.reference + ' · ' + (c.nom || 'client') + ' — impossible de le fidéliser.', passage_id: p.id });
  });
  return out;
}

async function vueCloture(j) {
  const d = jourVu;
  const [T, ps, sansP, ptsJ] = await Promise.all([
    API.totaux(d), API.passages(d), API.sansPlaque(d).catch(() => []),
    API.pointagesJour(d).catch(() => [])]);
  const aValider = sansP.filter(x => !x.sans_plaque_valide_le);

  if (j.statut === 'ouverte' && ps.length) {
    const calc = calculerAnomalies(ps).map(a => ({ ...a, journee: d }));
    if (calc.length) { const { error } = await API.poserAnomalies(calc); if (error) console.warn(error); }
  }
  const anos = (await API.anomalies(d)).sort((a, b) =>
    (a.traitee - b.traitee) || (a.gravite === 'critique' ? -1 : 1));
  const bloquantes = anos.filter(a => !a.traitee && a.gravite === 'critique').length;

  if (j.statut !== 'ouverte') {
    const t = j.totaux || T;
    const signataire = (equipe.find(e => e.id === j.valide_par) || {}).nom || '—';
    $('#vue').innerHTML = `
      ${retourDirection()}
      ${barreJour(j)}

        <strong>Journée du ${jourLong(d)} validée</strong><br>

      ${carteRecap(t)}
      ${/* RÉOUVRIR (14/08) — un lavage d'hier oublié ne doit pas rester dehors
           parce que la journée est signée. Mais défaire une signature n'est pas
           un geste anodin : c'est réservé à ceux qui signent, motif écrit. */''}
      ${j.statut === 'validee' ? `
      <div class="ocr-carte" style="margin-top:var(--ocr-e4);padding:var(--ocr-e4)">
        <p class="ocr-mini" style="margin:0 0 9px">Un lavage de ce jour-là a été oublié ?
          Réouvre la journée, saisis-le, et resigne. Tout est inscrit au journal.</p>
        <button class="ocr-btn ocr-btn--fantome ocr-btn--bloc" id="btnReouvrir"
          style="color:var(--ocr-argent-2)">Réouvrir cette journée…</button>
      </div>` : ''}`;
    brancherRetourDirection();
    brancherJour();
    const bro = $('#btnReouvrir');
    if (bro) bro.addEventListener('click', () => boiteReouvrir(d));
    return;
  }

  $('#vue').innerHTML = `
    ${retourDirection()}
    ${barreJour(j)}
    ${j.reouverte_le ? `<div class="ocr-message ocr-message--alerte" style="margin-bottom:var(--ocr-e4)"><span>↺</span><div>
      <strong>Journée réouverte</strong> le ${esc((j.reouverte_le || '').replace('T', ' à ').slice(0, 16))}
      par ${esc((equipe.find(e => e.id === j.reouverte_par) || {}).nom || '—')}.<br>
      Motif : « ${esc(j.reouverte_motif || '')} » — contrôle les lavages ajoutés, puis resigne.</div></div>`
    : d !== auj() ? `<div class="ocr-message ocr-message--alerte" style="margin-bottom:var(--ocr-e4)"><span>⚠</span><div>
      <strong>Cette journée n’a jamais été clôturée.</strong><br>
      Tu peux la contrôler et la signer maintenant — elle sera figée à sa date d’origine.</div></div>` : ''}
    <div class="tuiles">
      <div class="tuile"><div class="lab">Chiffre d’affaires</div><div class="val">${OCR.fcfa(T.ca || 0)}</div><div class="sub">${T.vehicules || 0} véhicule(s)</div></div>
      <div class="tuile"><div class="lab">KKiapay</div><div class="val">${OCR.fcfa(T.kkiapay || 0)}</div><div class="sub">mobile money</div></div>
      <div class="tuile"><div class="lab">Espèces</div><div class="val">${OCR.fcfa(T.especes || 0)}</div><div class="sub">à déposer</div></div>
      <div class="tuile"><div class="lab">Reste à encaisser</div>

    </div>

      // Le chrono ne vaut que s'il est appuyé : au moment de la clôture, on

      const nomV = p => [(p.vehicules || {}).marque, (p.vehicules || {}).modele].filter(Boolean).join(' ')

      if (!sansP.length) return '';

        ${aValider.length ? `<button class="ocr-btn ocr-btn--secondaire ocr-btn--bloc" id="btnValiderSP"

    ${carteFinDeJournee(j, ptsJ, d, true)}

      const lignes = ptsJ.map(pt => ({ pt, ecarts: ecartsPointage(pt) }))
