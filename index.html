/* ============================================================================
   OCR BRILLANCE — SOCLE COMMUN · ocr-tokens.css
   ----------------------------------------------------------------------------
   Charte de marque 2026 traduite en variables et composants.
   Le site vitrine, l'application client et l'application interne importent
   CE fichier. Une couleur ne se modifie qu'ici.

   Corrections intégrées d'office (revue du 11 août 2026) :
   · --ocr-rouge-texte pour le petit texte (le rouge de marque plafonne à 3,85:1)
   · surfaces surélevées + filet, pour que les cartes tiennent en plein soleil
   · :focus-visible sur tous les éléments interactifs
   · plancher typographique à 12 px
   · quatre rayons au lieu de cinq

   Version 1.0.0 — 11 août 2026
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Manrope:wght@400;600;800&display=swap');

:root {
  /* ── Couleurs de marque ─────────────────────────────────── */
  --ocr-noir:          #0A0A0B;   /* Noir laqué — fond dominant           */
  --ocr-noir-2:        #101012;   /* Fond de section alterné               */
  --ocr-surface:       #16161A;   /* Cartes                                */
  --ocr-surface-haute: #1E1E22;   /* Élevé : champs, survol, feuilles      */
  --ocr-filet:         #232327;   /* Bordures et séparateurs               */

  --ocr-blanc:         #F4F4F5;   /* Blanc pur — 18,0:1                    */
  --ocr-argent:        #9A9CA0;   /* Argent mat — 7,2:1                    */
  --ocr-argent-2:      #6E7075;   /* Légendes — 4,0:1, jamais sous 12 px   */

  --ocr-rouge:         #D6201E;   /* Rouge OCR — aplats, gros titres, UI   */
  --ocr-rouge-clair:   #E5342F;   /* Survol                                */
  --ocr-rouge-texte:   #E8524E;   /* 5,4:1 — le SEUL rouge pour du texte   */
  --ocr-rouge-profond: #7E1113;   /* Fin de dégradé uniquement             */

  --ocr-vert:          #37C26B;   /* Succès — 8,6:1                        */
  --ocr-ambre:         #F5A623;   /* Avertissement — 9,8:1                 */
  --ocr-erreur:        #E8524E;   /* Erreur = rouge texte + icône + libellé*/

  --ocr-grad-rouge:  linear-gradient(180deg, #E5342F 0%, #D6201E 45%, #7E1113 100%);
  --ocr-grad-chrome: linear-gradient(180deg, #FFFFFF 0%, #E3E4E6 38%, #9FA1A4 64%, #C9CACD 100%);
  --ocr-lueur-rouge: radial-gradient(130% 90% at 80% -10%, rgba(214,32,30,.35), transparent 55%);

  /* ── Typographie ────────────────────────────────────────── */
  --ocr-titre: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ocr-texte: 'Manrope',    system-ui, -apple-system, 'Segoe UI', sans-serif;

  --ocr-t-display: 300 clamp(28px, 6vw, 46px)/1.15 var(--ocr-titre);
  --ocr-t-h1:      300 clamp(24px, 5vw, 34px)/1.2  var(--ocr-titre);
  --ocr-t-h2:      500 clamp(18px, 3vw, 22px)/1.3  var(--ocr-titre);
  --ocr-t-h3:      500 16px/1.35 var(--ocr-titre);
  --ocr-t-corps:   400 15px/1.6  var(--ocr-texte);
  --ocr-t-petit:   400 13px/1.5  var(--ocr-texte);
  --ocr-t-mini:    400 12px/1.45 var(--ocr-texte);   /* plancher absolu */

  --ocr-suivi-titre:  .02em;
  --ocr-suivi-label:  .16em;
  --ocr-suivi-signature: .34em;

  /* ── Espacement ─────────────────────────────────────────── */
  --ocr-e1: 4px;  --ocr-e2: 8px;  --ocr-e3: 12px; --ocr-e4: 16px;
  --ocr-e5: 24px; --ocr-e6: 32px; --ocr-e7: 48px; --ocr-e8: 64px; --ocr-e9: 96px;

  /* ── Rayons — quatre valeurs, pas cinq ──────────────────── */
  --ocr-r-s:  4px;    /* boutons          */
  --ocr-r-m:  8px;    /* toutes les cartes*/
  --ocr-r-l:  16px;   /* grands panneaux  */
  --ocr-r-p:  999px;  /* pilules          */

  /* ── Ombres — une seule, sous le bouton primaire ────────── */
  --ocr-ombre-btn: 0 14px 30px -12px rgba(214,32,30,.55);
  --ocr-ombre-feuille: 0 -30px 60px -20px rgba(0,0,0,.7);

  --ocr-transition: .16s cubic-bezier(.4,0,.2,1);

  /* ── Détails d'interface pilotés par le thème ───────────── */
  --ocr-sep:   rgba(244,244,245,.06);   /* filets internes des cartes     */
  --ocr-trace: rgba(244,244,245,.08);   /* piste des barres de progression*/
  --ocr-jauge: rgba(244,244,245,.28);   /* remplissage neutre d'une barre */
}

/* ─────────────────────────────────────────────────────────────
   BASE
   ───────────────────────────────────────────────────────────── */
.ocr, .ocr *, .ocr *::before, .ocr *::after { box-sizing: border-box; }
.ocr {
  background: var(--ocr-noir);
  color: var(--ocr-blanc);
  font: var(--ocr-t-corps);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Accessibilité : un anneau de focus visible partout. */
.ocr :focus-visible {
  outline: 2px solid var(--ocr-rouge-texte);
  outline-offset: 3px;
  border-radius: inherit;
}

@media (prefers-reduced-motion: reduce) {
  .ocr *, .ocr *::before, .ocr *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}

/* ─────────────────────────────────────────────────────────────
   TYPOGRAPHIE
   ───────────────────────────────────────────────────────────── */
.ocr-display { font: var(--ocr-t-display); letter-spacing: var(--ocr-suivi-titre); text-transform: uppercase; margin: 0; }
.ocr-h1 { font: var(--ocr-t-h1); letter-spacing: var(--ocr-suivi-titre); text-transform: uppercase; margin: 0; }
.ocr-h2 { font: var(--ocr-t-h2); letter-spacing: var(--ocr-suivi-titre); margin: 0; }
.ocr-h3 { font: var(--ocr-t-h3); margin: 0; }
.ocr-corps  { font: var(--ocr-t-corps); color: var(--ocr-argent); }
.ocr-petit  { font: var(--ocr-t-petit); color: var(--ocr-argent); }
.ocr-mini   { font: var(--ocr-t-mini);  color: var(--ocr-argent-2); }
.ocr-chiffre{ font-variant-numeric: tabular-nums; }
.ocr-chrome {
  background: var(--ocr-grad-chrome); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--ocr-blanc); /* repli si non supporté */
}
/* Casse normale pour les noms longs : les capitales sont réservées
   aux titres courts, aux labels et à la signature. */
.ocr-nom { font-family: var(--ocr-texte); font-weight: 600; text-transform: none; letter-spacing: 0; }

/* Sur-titre rouge avec filet — le motif « Eyebrow » de la charte. */
.ocr-surtitre {
  display: inline-flex; align-items: center; gap: var(--ocr-e3);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase;
  color: var(--ocr-rouge-texte);
}
.ocr-surtitre::before { content: ''; width: 22px; height: 1px; background: var(--ocr-rouge); }

.ocr-signature {
  font-family: var(--ocr-titre); font-weight: 300; font-size: 12px;
  letter-spacing: var(--ocr-suivi-signature); text-transform: uppercase; color: var(--ocr-argent-2);
}
.ocr-etincelle { color: var(--ocr-rouge); }

/* ─────────────────────────────────────────────────────────────
   BOUTONS
   ───────────────────────────────────────────────────────────── */
.ocr-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--ocr-e2);
  min-height: 48px;                       /* cible tactile Android */
  padding: 13px 22px; border-radius: var(--ocr-r-s); border: 1px solid transparent;
  font-family: var(--ocr-titre); font-weight: 500; font-size: 14px;
  letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
  cursor: pointer; transition: transform var(--ocr-transition), background var(--ocr-transition), filter var(--ocr-transition);
  touch-action: manipulation;     /* pas d'attente du « double-tap zoom » */
}
.ocr-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.ocr-btn--primaire { background: var(--ocr-grad-rouge); color: #fff; box-shadow: var(--ocr-ombre-btn); }
.ocr-btn--secondaire { background: rgba(244,244,245,.05); color: var(--ocr-blanc); border-color: var(--ocr-filet); }
.ocr-btn--fantome { background: none; color: var(--ocr-argent); }
.ocr-btn--wa { background: #25D366; color: #06351B; }

/* Le survol n'existe QUE là où il y a un pointeur (souris). Sur un téléphone,
   un appui déclenchait le :hover — et le laissait collé après le doigt : le
   bouton restait soulevé, l'écran semblait « ne pas répondre ». C'était le
   principal défaut de fluidité au toucher (constat du 13/08). */
@media (hover: hover) and (pointer: fine) {
  .ocr-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .ocr-btn--primaire:hover:not(:disabled) { filter: brightness(1.08); }
  .ocr-btn--secondaire:hover:not(:disabled) { background: rgba(244,244,245,.09); border-color: rgba(214,32,30,.5); }
  .ocr-btn--fantome:hover:not(:disabled) { color: var(--ocr-blanc); }
  .ocr-btn--wa:hover:not(:disabled) { filter: brightness(1.06); }
}
.ocr-btn--bloc { width: 100%; }
.ocr-btn--petit { min-height: 40px; padding: 9px 15px; font-size: 12.5px; }

/* ─────────────────────────────────────────────────────────────
   SURFACES
   Fond surélevé + filet : ni l'un ni l'autre ne suffit sur du noir
   en plein soleil ; ensemble, la lisière se lit sans effort.
   ───────────────────────────────────────────────────────────── */
.ocr-carte {
  background: var(--ocr-surface); border: 1px solid var(--ocr-filet);
  border-radius: var(--ocr-r-m); padding: var(--ocr-e5);
  transition: border-color var(--ocr-transition), transform var(--ocr-transition);
}
.ocr-carte--cliquable { cursor: pointer; }
@media (hover: hover) and (pointer: fine) {
  .ocr-carte--cliquable:hover { transform: translateY(-3px); border-color: rgba(214,32,30,.5); }
}
.ocr-carte--vedette { border-color: rgba(214,32,30,.55); background:
  linear-gradient(180deg, rgba(214,32,30,.07), transparent 45%), var(--ocr-surface); }
.ocr-carte--panneau { border-radius: var(--ocr-r-l); padding: var(--ocr-e6); }
.ocr-carte--lueur { background: var(--ocr-lueur-rouge), var(--ocr-surface); }

.ocr-separateur { height: 1px; background: var(--ocr-filet); border: 0; margin: var(--ocr-e6) 0; }

/* ─────────────────────────────────────────────────────────────
   CHIPS, PASTILLES, BADGES
   ───────────────────────────────────────────────────────────── */
.ocr-chip {
  display: inline-flex; align-items: center; gap: var(--ocr-e2);
  min-height: 40px; padding: 8px 16px; border-radius: var(--ocr-r-p);
  background: var(--ocr-surface); border: 1px solid var(--ocr-filet);
  color: var(--ocr-argent); font: var(--ocr-t-petit); font-weight: 600;
  cursor: pointer; transition: var(--ocr-transition); touch-action: manipulation;
}
@media (hover: hover) and (pointer: fine) {
  .ocr-chip:hover { color: var(--ocr-blanc); border-color: rgba(214,32,30,.45); }
}
.ocr-chip[aria-pressed="true"], .ocr-chip.est-actif {
  background: var(--ocr-rouge); border-color: var(--ocr-rouge); color: #fff;
}

.ocr-pastille {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 4px 10px; border-radius: var(--ocr-r-p);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase;
}
.ocr-pastille--neutre  { background: var(--ocr-surface-haute); color: var(--ocr-argent); }
.ocr-pastille--marque  { background: rgba(214,32,30,.14); color: var(--ocr-rouge-texte); }
.ocr-pastille--succes  { background: rgba(55,194,107,.14); color: var(--ocr-vert); }
.ocr-pastille--alerte  { background: rgba(245,166,35,.14); color: var(--ocr-ambre); }
.ocr-pastille--erreur  { background: rgba(232,82,78,.14); color: var(--ocr-erreur); }
.ocr-badge-vedette {
  position: absolute; top: 12px; left: 12px;
  background: var(--ocr-rouge); color: #fff; padding: 5px 11px; border-radius: var(--ocr-r-p);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: .1em; text-transform: uppercase;
}

/* ─────────────────────────────────────────────────────────────
   CHAMPS
   ───────────────────────────────────────────────────────────── */
.ocr-champ { display: block; margin-bottom: var(--ocr-e4); }
.ocr-label {
  display: block; margin-bottom: var(--ocr-e2);
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase; color: var(--ocr-argent);
}
.ocr-saisie {
  width: 100%; min-height: 48px; padding: 13px 15px;
  background: var(--ocr-surface-haute); border: 1px solid var(--ocr-filet);
  border-radius: var(--ocr-r-m); color: var(--ocr-blanc);
  font: var(--ocr-t-corps); outline: none; transition: var(--ocr-transition);
}
/* 16 px minimum : en dessous, Safari iOS zoome toute la page dès qu'on touche
   un champ — et il faut pincer pour revenir. Vu sur l'iPhone d'Edwin (14/08). */
.ocr-saisie { font-size: 16px; }
.ocr-saisie::placeholder { color: var(--ocr-argent-2); }
.ocr-saisie:focus { border-color: var(--ocr-rouge); }
.ocr-saisie:disabled { opacity: .45; cursor: not-allowed; }
.ocr-saisie[aria-invalid="true"] { border-color: var(--ocr-erreur); }
.ocr-aide  { margin-top: 6px; font: var(--ocr-t-mini); color: var(--ocr-argent-2); }
.ocr-erreur-champ { margin-top: 6px; font: var(--ocr-t-mini); color: var(--ocr-erreur);
  display: flex; align-items: center; gap: 6px; }

/* ─────────────────────────────────────────────────────────────
   MESSAGES D'ÉTAT — couleur + icône + libellé, jamais la couleur seule
   ───────────────────────────────────────────────────────────── */
.ocr-message {
  display: flex; gap: var(--ocr-e3); align-items: flex-start;
  padding: var(--ocr-e3) var(--ocr-e4); border-radius: var(--ocr-r-m);
  border: 1px solid var(--ocr-filet); background: var(--ocr-surface);
  font: var(--ocr-t-petit); color: var(--ocr-argent);
}
.ocr-message--succes { border-color: rgba(55,194,107,.42); background: rgba(55,194,107,.07); }
.ocr-message--alerte { border-color: rgba(245,166,35,.42); background: rgba(245,166,35,.07); }
.ocr-message--erreur { border-color: rgba(232,82,78,.45);  background: rgba(232,82,78,.07); }
.ocr-message strong  { color: var(--ocr-blanc); font-family: var(--ocr-titre); font-weight: 500; }

/* ─────────────────────────────────────────────────────────────
   TABLEAUX
   ───────────────────────────────────────────────────────────── */
.ocr-tableau { width: 100%; border-collapse: collapse; font: var(--ocr-t-petit); }
.ocr-tableau th {
  text-align: left; padding: 0 var(--ocr-e3) var(--ocr-e3);
  border-bottom: 1px solid var(--ocr-filet); white-space: nowrap;
  font-family: var(--ocr-titre); font-weight: 500; font-size: 12px;
  letter-spacing: var(--ocr-suivi-label); text-transform: uppercase; color: var(--ocr-argent);
}
.ocr-tableau td { padding: var(--ocr-e3); border-bottom: 1px solid rgba(244,244,245,.06); }
.ocr-tableau tr:last-child td { border-bottom: 0; }
.ocr-tableau .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ocr-tableau-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ocr-tableau-defile > .ocr-tableau { min-width: 680px; }
.ocr-tableau .fort { color: var(--ocr-blanc); font-weight: 600; }

/* ─────────────────────────────────────────────────────────────
   MARQUE
   ───────────────────────────────────────────────────────────── */
.ocr-embleme {
  width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(120% 120% at 50% 0%, #1d1d20, #0a0a0b);
  border: 1px solid rgba(244,244,245,.14);
}
.ocr-embleme img { width: 74%; height: auto; display: block; }
.ocr-marque { display: flex; align-items: center; gap: var(--ocr-e3); }
.ocr-marque-nom {
  font-family: var(--ocr-titre); font-weight: 500; font-size: 15px;
  letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--ocr-blanc);
}
.ocr-marque-baseline {
  font-family: var(--ocr-titre); font-weight: 300; font-size: 12px;
  letter-spacing: .22em; text-transform: uppercase; color: var(--ocr-rouge-texte); margin-top: 3px;
}

/* Lignes de vitesse — motif 2 de la charte */
.ocr-vitesse { display: flex; flex-direction: column; gap: 5px; }
.ocr-vitesse span {
  height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--ocr-rouge));
}
.ocr-vitesse span:nth-child(1) { width: 100%; }
.ocr-vitesse span:nth-child(2) { width: 72%; }
.ocr-vitesse span:nth-child(3) { width: 44%; }

/* ─────────────────────────────────────────────────────────────
   MISE EN PAGE
   ───────────────────────────────────────────────────────────── */
.ocr-contenu { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 var(--ocr-e5); }
.ocr-section { padding: var(--ocr-e9) 0; }
.ocr-grille { display: grid; gap: var(--ocr-e4); }
.ocr-grille--2 { grid-template-columns: repeat(2, 1fr); }
.ocr-grille--3 { grid-template-columns: repeat(3, 1fr); }
.ocr-grille--4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .ocr-grille--3, .ocr-grille--4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .ocr-grille--2, .ocr-grille--3, .ocr-grille--4 { grid-template-columns: 1fr; }
  .ocr-section { padding: var(--ocr-e7) 0; }
  .ocr-contenu { padding: 0 var(--ocr-e4); }
}

/* ─────────────────────────────────────────────────────────────
   MOUVEMENT & RELIEF — partagé par toutes les surfaces
   Discret, rapide, et respecte prefers-reduced-motion.
   ───────────────────────────────────────────────────────────── */
.ocr-btn--primaire {
  background: linear-gradient(180deg, #E5342F, #C21A18);
  box-shadow: 0 6px 18px rgba(214,32,30,.26), inset 0 1px 0 rgba(255,255,255,.14);
}
.ocr-btn--primaire:hover { background: linear-gradient(180deg, #EC4540, #D6201E); }
.ocr-btn:active { transform: scale(.97); }
.ocr-chip[aria-pressed="true"] { box-shadow: 0 4px 14px rgba(214,32,30,.3); }
/* L'appui doit se voir AVANT que le code ne réponde : c'est ce qui fait la
   différence entre « ça rame » et « ça répond ». Rendu par le compositeur,
   donc instantané même si le fil principal travaille. */
.ocr-chip:active, .fiche:active, .presta:active, .ocr-carte--cliquable:active { transform: scale(.985); }
.fiche, .presta { touch-action: manipulation; }

.voile { animation: ocrVoile .16s ease-out; }
.boite { animation: ocrBoite .22s cubic-bezier(.2,.9,.3,1.15); }
.toast { animation: ocrToast .28s cubic-bezier(.2,.9,.3,1.3); }
@keyframes ocrVoile { from { opacity: 0; } }
@keyframes ocrBoite { from { opacity: 0; transform: scale(.94) translateY(10px); } }
@keyframes ocrToast { from { opacity: 0; transform: translateY(12px); } }

@media (hover: hover) {
  .ocr-carte { transition: border-color .2s ease, transform .2s ease; }
  .fiche:hover, .presta:hover { transform: translateY(-1px); }
}
* { scrollbar-width: thin; scrollbar-color: #2A2A2F transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: #2A2A2F; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) {
  .voile, .boite, .toast { animation: none; }
  .ocr-btn:active { transform: none; }
  .fiche:hover, .presta:hover { transform: none; }
}

/* ─────────────────────────────────────────────────────────────
   MODE CLAIR — appliqué avec la classe .theme-clair sur .ocr.
   Les noms de variables ne changent pas : --ocr-noir reste
   « le fond » et --ocr-blanc « le texte », quel que soit le thème.
   Contrastes vérifiés : texte principal 16,9:1, secondaire 7,3:1,
   rouge texte 5,9:1 sur fond clair.
   ───────────────────────────────────────────────────────────── */
.ocr.theme-clair {
  --ocr-noir:          #F5F5F6;
  --ocr-noir-2:        #ECECEE;
  --ocr-surface:       #FFFFFF;
  --ocr-surface-haute: #EFEFF1;
  --ocr-filet:         #DCDCE0;

  --ocr-blanc:         #141417;
  --ocr-argent:        #505257;
  --ocr-argent-2:      #6E7075;

  --ocr-rouge-texte:   #BB1F1D;
  --ocr-vert:          #157A40;
  --ocr-ambre:         #9C6200;
  --ocr-erreur:        #BB1F1D;

  --ocr-grad-chrome: linear-gradient(180deg, #3E3F43 0%, #6E7075 42%, #2E2F33 68%, #55575C 100%);
  --ocr-lueur-rouge: radial-gradient(130% 90% at 80% -10%, rgba(214,32,30,.12), transparent 55%);
  --ocr-ombre-feuille: 0 -30px 60px -20px rgba(0,0,0,.16);

  --ocr-sep:   rgba(10,10,11,.08);
  --ocr-trace: rgba(10,10,11,.09);
  --ocr-jauge: rgba(10,10,11,.30);
}


/* ══════════════════════════════════════════════════════════════════════════
   LE MOUVEMENT (14/08, v59)

   Edwin : « Une première impression waouh, mais sans trop alourdir l'appli, car
   les appareils Android de mes employés sont parfois modestes. »

   UNE SEULE RÈGLE TECHNIQUE, ET ELLE EXPLIQUE TOUT LE RESTE : on n'anime que
   « transform » et « opacity ». Ce sont les deux seules propriétés qu'un
   téléphone traite sur sa puce graphique, sans refaire la mise en page ni
   repeindre. Animer une largeur, une ombre ou un flou (backdrop-filter) fait
   travailler le processeur à chaque image — c'est exactement ce qui fait
   saccader une belle idée sur un Android d'entrée de gamme.
   Aucun flou, aucune ombre animée, aucune boucle qui tourne en permanence :
   chaque animation joue UNE fois et s'arrête.

   Trois niveaux, décidés par l'appareil lui-même (voir MOUVEMENT en JS) :
     · complet   — iPhone d'Edwin, Android récents ;
     · sobre     — appareil modeste : on garde les fondus, on retire l'éclat
                   et les décalages ; rien ne « manque », tout est plus court ;
     · aucun     — réglage système « réduire les animations » : on respecte.
   ══════════════════════════════════════════════════════════════════════════ */

/* ---- LE RIDEAU D'OUVERTURE ---- */
#rideau{position:fixed;inset:0;z-index:9999;background:var(--ocr-noir);
  isolation:isolate;   /* le fond du rideau devient la toile du fondu « screen » */
  display:grid;place-items:center;opacity:1;
  transition:opacity .30s cubic-bezier(.4,0,.2,1)}
#rideau.parti{opacity:0;pointer-events:none}
.rid-bloc{display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:0 24px;text-align:center}
.rid-em{position:relative;width:78px;height:78px;overflow:hidden;border-radius:20px;
  animation:ridEm .44s cubic-bezier(.2,.8,.3,1) both}
/* L'emblème est un PNG sur fond noir : posé sur le rideau, son cadre se voyait
   comme une tuile plus claire. « screen » laisse tomber le noir et ne garde que
   la lumière — le trait semble tracé à même l'écran. C'est une opération de
   composition, faite par la puce graphique, sur un seul élément de 78 px. */
.rid-em img{width:100%;height:100%;object-fit:contain;display:block;
  mix-blend-mode:screen}
/* La « brillance » : une lame de lumière qui traverse l'emblème. UNE fois.
   C'est un translateX sur un petit élément — le coût d'une image qui bouge,
   pas celui d'un dégradé recalculé. */
.rid-em i{position:absolute;top:-45%;left:-70%;width:42%;height:190%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation:ridEclat .46s cubic-bezier(.4,0,.2,1) .16s both}
.rid-fil{width:66px;height:1px;
  background:linear-gradient(90deg,transparent,var(--ocr-rouge),transparent);
  animation:ridFil .40s cubic-bezier(.2,.8,.3,1) .08s both}
/* Le nom monte derrière une fenêtre : c'est le geste de marque, et il ne coûte
   qu'un translateY dans un cadre qui déborde. */
.rid-mot{overflow:hidden;height:1.3em}
.rid-mot span{display:block;font:300 18px/1.3 var(--ocr-titre);letter-spacing:.36em;
  color:var(--ocr-blanc);padding-left:.36em;
  animation:ridMonte .42s cubic-bezier(.2,.8,.3,1) .12s both}
.rid-sig{font:500 9px/1.4 var(--ocr-titre);letter-spacing:.40em;color:var(--ocr-argent-2);
  padding-left:.40em;animation:ridDoux .34s ease .24s both}
@keyframes ridEm{from{opacity:0;transform:scale(.84)}}
@keyframes ridEclat{from{transform:translateX(0) rotate(16deg)}
                    to{transform:translateX(420%) rotate(16deg)}}
@keyframes ridFil{from{opacity:0;transform:scaleX(0)}}
@keyframes ridMonte{from{transform:translateY(110%)}}
@keyframes ridDoux{from{opacity:0;transform:translateY(5px)}}

/* Appareil modeste : on garde l'apparition, on retire ce qui se remarque le
   moins et coûte le plus. Le rendu reste soigné, il est simplement plus sec. */
/* LE RIDEAU BREF — la vingtième ouverture de la journée.
   Une cérémonie qu'on subit trente fois par jour n'est plus une cérémonie,
   c'est un péage. Quand l'app a été ouverte il y a moins de trois heures, il
   ne reste que l'emblème et un fondu : on ne perd pas la marque, on perd
   l'attente. */
.rid-bref .rid-fil,.rid-bref .rid-mot,.rid-bref .rid-sig,.rid-bref .rid-em i{display:none}
.rid-bref .rid-em{animation:ridDoux .22s ease both}
/* Le fondu de sortie aussi : c'est lui qui portait tout le coût du rideau bref
   (mesuré — 300 ms de fondu sur 240 ms de geste, l'inverse du bon sens). */
#rideau.rid-bref{transition-duration:.16s}

.mouv-sobre .rid-em i{display:none}
.mouv-sobre .rid-mot span{animation:ridDoux .38s ease .12s both}
.mouv-sobre .rid-em{animation-duration:.38s}

/* ---- L'ÉCRAN QUI ENTRE ---- */
/* 150 ms, 6 px : assez pour que l'œil comprenne qu'on a changé de page, trop
   court pour qu'on l'attende. Jamais sur un rafraîchissement automatique —
   voir rendre(discret) : faire clignoter l'écran de quelqu'un qui lit est la
   pire chose qu'une animation puisse faire. */
#vue.entre{animation:ecranEntre .15s cubic-bezier(.2,.8,.3,1)}
@keyframes ecranEntre{from{opacity:0;transform:translateY(6px)}}
.mouv-sobre #vue.entre{animation:ecranEntreSobre .12s ease}
@keyframes ecranEntreSobre{from{opacity:0}}

/* ---- LA RÉPONSE AU DOIGT ---- */
/* Un bouton qui s'enfonce de 3 % sous le doigt : c'est la micro-animation qui
   change le plus la sensation, et elle ne coûte rien. Uniquement sur appui,
   jamais au survol (un doigt laisse le :hover collé — leçon du 13/08). */
.ocr-btn:active:not(:disabled){transform:scale(.972)}
.ocr-chip:active{transform:scale(.96)}
.fiche:active,.tuile:active{transform:scale(.995)}
.tuile{transition:transform var(--ocr-transition)}

/* ---- L'ATTENTE A UNE FORME ---- */
/* Un rond qui tourne dit « attends ». Un squelette dit « voilà ce qui arrive »
   — et l'écran paraît déjà là. Le reflet est un translateX derrière une
   fenêtre : compositable, donc gratuit. Sur appareil modeste, il devient une
   simple respiration d'opacité. */
.squelette{display:grid;gap:var(--ocr-e3);padding:2px 0}
.sq-tuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--ocr-e3)}
.sq{position:relative;overflow:hidden;background:var(--ocr-surface);
  border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m)}
.sq::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(90deg,transparent,rgba(244,244,245,.055),transparent);
  animation:sqReflet 1.25s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sqReflet{to{transform:translateX(360%)}}
.sq-tuiles .sq{height:74px}
.sq-carte{height:96px}
.sq-carte.grand{height:150px}
.mouv-sobre .sq::after{animation:sqDouce 1.4s ease-in-out infinite;left:0;width:100%;
  background:rgba(244,244,245,.04)}
@keyframes sqDouce{0%,100%{opacity:.25}50%{opacity:.7}}

@media (prefers-reduced-motion:reduce){
  #rideau *{animation:none!important}
  #vue.entre{animation:none}
  .sq::after{animation:none}
  .ocr-btn:active:not(:disabled),.ocr-chip:active,.fiche:active,.tuile:active{transform:none}
}

/* ---- propre à la caisse ---- */
html,body{margin:0;padding:0;min-height:100dvh}
body{padding-bottom:env(safe-area-inset-bottom)}
.masque{display:none!important}

#connexion{min-height:100dvh;display:grid;place-items:center;padding:var(--ocr-e5)}
.conn-carte{width:100%;max-width:380px}
.conn-logo{width:100%;max-width:260px;display:block;margin:0 auto var(--ocr-e5)}

.appli{min-height:100dvh;display:flex;flex-direction:column}
.barre{position:sticky;top:0;z-index:30;background:#0B0B0C;
  border-bottom:1px solid var(--ocr-filet);
  padding:var(--ocr-e3) calc(var(--ocr-e4) + env(safe-area-inset-right)) var(--ocr-e3) calc(var(--ocr-e4) + env(safe-area-inset-left));
  padding-top:calc(var(--ocr-e3) + env(safe-area-inset-top));
  display:flex;align-items:center;gap:var(--ocr-e3)}
/* Épinglée sur l'écran d'accueil, l'app passe SOUS l'heure et la batterie de
   l'iPhone (plein écran). La barre s'écarte de cette zone, sinon les boutons
   du haut sont inatteignables. En plein écran (classe plein-ecran posée par
   JS), on garantit un minimum de 54px même si l'iPhone ne fournit pas la
   taille de son encoche. */
#bandeau .bandeau:first-child{padding-top:calc(10px + env(safe-area-inset-top))}
.plein-ecran .barre{padding-top:max(calc(var(--ocr-e3) + env(safe-area-inset-top)), 54px)}
.plein-ecran #bandeau .bandeau:first-child{padding-top:max(calc(10px + env(safe-area-inset-top)), 54px)}
.plein-ecran #connexion{padding-top:max(env(safe-area-inset-top), 54px)}
.barre{overflow:hidden}
.barre>div:nth-child(2){min-width:0;overflow:hidden}
.barre .qui{font-family:var(--ocr-titre);font-weight:500;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre .role{font:var(--ocr-t-mini);color:var(--ocr-argent-2);text-transform:uppercase;letter-spacing:.12em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Les filtres tiennent sur une ligne qui défile latéralement plutôt que de
   se replier sur trois rangs et repousser la liste hors de l'écran. */
.rangee-filtres{display:flex;gap:8px;margin-top:var(--ocr-e3);overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;
  /* le dernier chip s'estompe au bord : on voit qu'il y en a d'autres à droite */
  mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.rangee-filtres::-webkit-scrollbar{display:none}
.rangee-filtres .ocr-chip{flex:none;white-space:nowrap}

/* ---- Ligne de la liste clients ---- */
.ligne-cli{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer}
.ligne-cli .av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#f4f4f5;font:700 15px/1 var(--ocr-titre)}
.ligne-cli .mid{min-width:0;flex:1}
.ligne-cli .nom{font:600 15px/1.25 var(--ocr-texte);color:var(--ocr-blanc);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne-cli .det{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ligne-cli .dr{text-align:right;flex:none}
.ligne-cli .mt{font:700 14px/1.2 var(--ocr-texte);font-variant-numeric:tabular-nums;display:block;color:var(--ocr-blanc)}
.ligne-cli .ch{color:var(--ocr-argent-2);flex:none}
/* Les signes des lignes clients (espace actif, partenaire, archivé) : discrets,
   couleur de la marque, jamais des émojis (13/08). */
.ligne-cli .sig{color:var(--ocr-rouge-texte);font-size:12px;vertical-align:1px}
/* Corriger / retirer un véhicule : deux carrés tactiles au bout de la ligne,
   assez grands pour le doigt (40 px) mais discrets — on ne les cherche que
   quand on s'est trompé. */
.actions-veh{display:flex;gap:6px;flex:none}
.actions-veh button{width:38px;height:38px;border-radius:10px;cursor:pointer;
  border:1px solid var(--ocr-filet);background:transparent;color:var(--ocr-argent);
  font-size:14px;line-height:1;display:grid;place-items:center}
.actions-veh button:hover{border-color:var(--ocr-argent-2);color:var(--ocr-blanc)}
.actions-veh button.dgr:hover{border-color:var(--ocr-rouge);color:var(--ocr-rouge-texte)}
@media(max-width:379px){.ligne-cli .dr{display:none}}

/* ---- La bande de la semaine ---- */
.bande-sem{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:var(--ocr-e4)}
.bande-sem .js{background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:10px;
  padding:7px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  color:var(--ocr-argent);min-height:56px}
.bande-sem .js-l{font:var(--ocr-t-mini);text-transform:uppercase;letter-spacing:.06em}
.bande-sem .js-n{font:700 16px/1 var(--ocr-titre);color:var(--ocr-blanc);font-variant-numeric:tabular-nums}
.bande-sem .js-p{font:var(--ocr-t-mini);color:var(--ocr-argent-2);min-height:12px}
.bande-sem .js.auj .js-n{color:var(--ocr-rouge-texte)}

.bande-sem .js.sel .js-l,.bande-sem .js.sel .js-n,.bande-sem .js.sel .js-p{color:#fff}

/* ---- La frise de l'agenda ---- */
.legende-lav{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 var(--ocr-e4) var(--ocr-e5);
  font:var(--ocr-t-mini);color:var(--ocr-argent-2)}
.legende-lav span{display:flex;align-items:center;gap:6px}
.legende-lav i{width:10px;height:10px;border-radius:3px;flex:none}
/* La journée fait 12 heures : à l'échelle, c'est plus d'un écran, et l'essentiel
   serait noyé dans le vide. La frise défile donc DANS sa carte, et on l'amène
   d'emblée sur le premier rendez-vous (ou sur l'heure courante). */
.frise-boite{max-height:min(62vh, 560px);overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.frise{position:relative;margin-left:46px}
.fh{position:absolute;left:0;right:0;height:0}
.fh-lab{position:absolute;right:calc(100% + 8px);top:-7px;font:var(--ocr-t-mini);
  color:var(--ocr-argent-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.fh-trait{position:absolute;left:0;right:0;top:0;border-top:1px solid var(--ocr-sep)}
/* L'heure courante : un repère discret, pas un élément de plus à déchiffrer. */
.fh-now{position:absolute;left:0;right:0;height:0;z-index:3}
.fh-now span{position:absolute;left:-4px;right:0;top:-1px;border-top:2px solid var(--ocr-rouge);
  opacity:.75}
.fh-now span::before{content:'';position:absolute;left:-4px;top:-4px;width:7px;height:7px;
  border-radius:50%;background:var(--ocr-rouge)}
.fz{position:absolute;inset:0}
.frise-vide{position:absolute;left:0;right:0;top:38%;text-align:center;
  font:var(--ocr-t-petit);color:var(--ocr-argent-2);padding:0 var(--ocr-e4)}
.bloc{position:absolute;overflow:hidden;text-align:left;cursor:pointer;z-index:2;
  border:0;border-left:4px solid var(--lav);border-radius:8px;
  background:color-mix(in srgb, var(--lav) 20%, var(--ocr-surface));
  padding:6px 8px;display:flex;flex-direction:column;gap:1px;
  transition:filter .15s ease}
.bloc:hover{filter:brightness(1.18)}
.bloc.grp-rapide{--lav:var(--lav-rapide)}
.bloc.grp-signature{--lav:var(--lav-signature)}
.bloc.grp-longue{--lav:var(--lav-longue)}
/* Avance non reçue : trait de gauche interrompu, et la mention est écrite dans
   le bloc. (Des rayures diagonales avaient été essayées : elles passaient
   derrière le texte et le rendaient illisible.) */
.bloc.attente{border-left-style:dashed;
  background:color-mix(in srgb, var(--lav) 11%, var(--ocr-surface))}
.bloc.passe{opacity:.5}
.bl-h{font:700 12px/1.1 var(--ocr-texte);color:var(--ocr-blanc);font-variant-numeric:tabular-nums;
  display:flex;gap:6px;align-items:baseline}
.bloc.plate{justify-content:center;padding:4px 8px}
.bloc.plate .bl-h{min-width:0}
.bloc.plate .bl-n{flex:1;min-width:0}
.bloc.plate .bl-d{margin-left:auto;flex:none}
.bl-d{font:var(--ocr-t-mini);color:var(--ocr-argent-2);font-weight:400}
.bl-n{font:600 12.5px/1.2 var(--ocr-texte);color:var(--ocr-blanc);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-s,.bl-p{font:var(--ocr-t-mini);color:var(--ocr-argent-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:700px){
  .bl-h{font-size:13px}.bl-n{font-size:14px}
}

/* ---- Couleurs des types de lavage (agenda) ----
   Trois teintes, validées ensemble : écart suffisant pour tous les yeux, y
   compris daltoniens, et contraste ≥ 3:1 sur la carte, dans les deux thèmes.
   Les pas sombres et clairs sont CHOISIS, pas calculés depuis l'autre. */
.ocr{--lav-rapide:#3987e5;--lav-signature:#d95926;--lav-longue:#199e70}
.ocr.theme-clair{--lav-rapide:#2a78d6;--lav-signature:#eb6834;--lav-longue:#1baf7a}

  font-variant-numeric:tabular-nums;font-weight:600}

.fiche--annule{opacity:.55}
.fiche--annule .ligne1 > span:first-child{text-decoration:line-through}
.barre-jour{display:flex;align-items:center;gap:10px;background:var(--ocr-surface);
  border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-m);padding:9px 11px;margin-bottom:var(--ocr-e4)}
.barre-jour .bj-centre{flex:1;text-align:center;min-width:0}
.barre-jour .bj-date{font:600 14px/1.2 var(--ocr-titre);text-transform:capitalize}
.barre-jour .bj-lien{all:unset;cursor:pointer;color:var(--ocr-rouge-texte);text-decoration:underline;font:inherit}
.fiche .ligne1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fiche .actions{display:flex;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--ocr-sep);flex-wrap:wrap}

.alerte{display:flex;gap:11px;padding:12px 14px;border-radius:var(--ocr-r-m);margin-bottom:8px;
  border:1px solid var(--ocr-filet);background:var(--ocr-surface);align-items:flex-start}
.alerte--critique{border-color:rgba(232,82,78,.45);background:rgba(232,82,78,.07)}
.alerte--alerte{border-color:rgba(245,166,35,.4);background:rgba(245,166,35,.06)}
.alerte--traitee{opacity:.55}
.alerte .ti{font:600 13.5px/1.3 var(--ocr-texte);color:var(--ocr-blanc)}
.alerte .de{font:var(--ocr-t-mini);color:var(--ocr-argent);margin-top:3px}
.alerte .ac{margin-left:auto;display:flex;gap:6px;flex:none}

.voile{position:fixed;inset:0;background:rgba(5,5,6,.86);z-index:100;
  display:grid;place-items:center;padding:var(--ocr-e4)}
.boite{background:var(--ocr-surface);border:1px solid var(--ocr-filet);border-radius:var(--ocr-r-l);
  width:100%;max-width:430px;max-height:88dvh;overflow:auto;padding:var(--ocr-e5)}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ocr-surface-haute);border:1px solid var(--ocr-filet);border-radius:999px;
  padding:10px 18px;font:600 13px/1.3 var(--ocr-texte);box-shadow:0 10px 34px rgba(0,0,0,.5);max-width:88vw}
.toast--err{border-color:rgba(232,82,78,.5);color:var(--ocr-erreur)}

/* ---- réglages : thème clair, taille, iPad ---- */
/* Le logo complet est blanc : en clair, il vit sur une carte noire. */
.theme-clair .conn-logo{background:#0A0A0B;border-radius:var(--ocr-r-m);padding:20px 24px}
.theme-clair .barre{background:#F5F5F6}
.theme-clair .onglets{background:#FFF}
.theme-clair .voile{background:rgba(20,20,23,.45)}
.theme-clair .toast{box-shadow:0 10px 34px rgba(0,0,0,.18)}
body.texte-grand{zoom:1.09}
body.texte-tresgrand{zoom:1.2}
.ic-barre{min-height:40px;padding:8px 10px;font-size:17px;line-height:1}
.gira{animation:tr .7s linear infinite;display:inline-block}
@media(max-width:479px){#btnRafraichir{display:none}}
.jour-grille{display:grid;grid-template-columns:1fr;align-items:start;column-gap:var(--ocr-e4)}
@media(min-width:920px){
  .jour-grille{grid-template-columns:minmax(0,1fr) minmax(340px,400px)}
  .jour-grille>.jg-principal{order:-1}
}

.bandeau{padding:10px 16px;font:var(--ocr-t-petit);display:flex;gap:10px;align-items:center}
.bandeau--demo{background:rgba(245,166,35,.12);border-bottom:1px solid rgba(245,166,35,.4);color:var(--ocr-ambre)}
.bandeau--hors{background:rgba(232,82,78,.12);border-bottom:1px solid rgba(232,82,78,.4);color:var(--ocr-erreur)}
.bandeau--maj{background:rgba(25,158,112,.13);border-bottom:1px solid rgba(25,158,112,.45);color:#5FD3A6;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tourne{width:16px;height:16px;border:2px solid var(--ocr-filet);border-top-color:var(--ocr-rouge);
  border-radius:50%;display:inline-block;animation:tr .7s linear infinite}
@keyframes tr{to{transform:rotate(360deg)}}
.vide{text-align:center;padding:44px 18px;color:var(--ocr-argent-2);font:var(--ocr-t-petit)}
</style>
</head>

   Le mobile money ne permet pas le prélèvement automatique

   On inverse donc le sens : le client paie d'avance, une seule fois.
   Aucune relance possible — l'argent est déjà encaissé.
   Adossés au Signature, jamais à l'Express.

const CARNETS = [
  { id:'carnet3',  nom:'Carnet 3 lavages',  lavages:3,  validiteMois:2, populaire:false,
    prix:{ petite:16000, berline:21000, grandsuv:26000, camionnette:null, moto:null } },

const CARNET_CONFIG = {
  prestation:'signature',
  accroche:'Payez une fois. Roulez propre toute l’année.',
  graceMois: 1,               // mois de tolérance après expiration — on ne pénalise jamais un client
  alerteSolde: 1,             // relance WhatsApp quand il reste ce nombre de lavages
  remiseGrossesPrestations: 0.10,
  avantages: [
    'Créneau prioritaire — réservé la veille, aucune attente',
    'Carnet d’entretien du véhicule, photos avant/après à chaque passage',
    '−10 % sur le Deep Cleaning, le polissage et la protection céramique',
    'Transmissible — le carnet peut servir à un proche ou être offert',
  ],
};

const carnet = id => CARNETS.find(c => c.id === id) || null;

/** Prix du carnet pour un gabarit. null = non proposé. */
function prixCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId);
  if (!c || !gabaritId) return null;
  const v = c.prix[gabaritId];
  return v == null ? null : v;
}
/** Les mêmes lavages payés à l'unité. */
function prixCarnetUnite(carnetId, gabaritId) {
  const c = carnet(carnetId);
  const p = prix(CARNET_CONFIG.prestation, gabaritId);
  return (!c || p == null) ? null : p * c.lavages;
}
/** Économie en FCFA et en %. */
function economieCarnet(carnetId, gabaritId) {
  const u = prixCarnetUnite(carnetId, gabaritId), c = prixCarnet(carnetId, gabaritId);
  if (u == null || c == null) return null;
  return { montant: u - c, pct: Math.round((1 - c / u) * 100), parLavage: Math.round(c / carnet(carnetId).lavages) };
}
/** Recette mensuelle reconnue par carnet actif (prix étalé sur sa validité). */
function recetteMensuelleCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId), p = prixCarnet(carnetId, gabaritId);
  return p == null ? null : p / c.validiteMois;
}
/** Heures-baie consommées par mois par un porteur de carnet. */
function heuresCarnet(carnetId, gabaritId) {
  const c = carnet(carnetId);
  const d = duree(CARNET_CONFIG.prestation, gabaritId);
  return d == null ? null : (c.lavages / c.validiteMois) * (d + CONFIG.battementMin) / 60;
}
/** Combien de porteurs actifs pour couvrir un montant de charges fixes. */
function porteursPourCouvrir(chargesFixes, carnetId, gabaritId) {
  const r = recetteMensuelleCarnet(carnetId, gabaritId);
  return r ? Math.ceil(chargesFixes / r) : null;
}

/* ─────────────────────────────────────────────────────────────
   5 · EXPLOITATION

const CONFIG = {

  fermetureMin: 19 * 60,   // 19:00 — le dernier lavage doit FINIR à la fermeture
  /* L'atelier ouvre à 9 h et ferme à 19 h (Edwin, 14/08). L'équipe, elle,

  pauseMin:     45,        // une pause par jour, obligatoire — jamais bloquante
  pasCreneau:   30,        // grille de réservation, en minutes

  baies:        2,         // 2 véhicules lavés en simultané

  acompteArrondi: 100,     // arrondi de l'acompte, en FCFA

  fideliteValiditeMois: 12,
  seuilRemiseAlerte: 0.10, // au-delà, la clôture de caisse lève une alerte

/* ─────────────────────────────────────────────────────────────
   6 · OUTILS
   ───────────────────────────────────────────────────────────── */
const gabarit    = id => GABARITS.find(g => g.id === id) || null;
const prestation = id => PRESTATIONS.find(p => p.id === id) || null;

/* ── QUOI PROPOSER POUR CE VÉHICULE (14/08) ────────────────────────────────
   « Lorsqu'on choisit une voiture dans la saisie, je ne comprends pas pourquoi
     on voit encore les lavages motos, sur devis — ce n'est pas bon. » (Edwin)
   Un lavage moto n'a rien à faire devant une berline, et l'inverse non plus.
   Les afficher « Sur devis » laissait croire qu'on pouvait les vendre.
   La CAMIONNETTE, elle, garde les lavages voiture : leur prix se négocie au
   cas par cas, mais le service existe — Samuel doit pouvoir l'enregistrer.
   La famille « devis » (moteur, polissage, céramique) n'est plus proposée nulle
   part : ces services ne sont pas encore vendus, et ils encombraient chaque
   écran. Pour les remettre : leur donner la famille 'lavage' et des prix. */
function prestationsPour(gabaritId) {
  const moto = gabaritId === 'moto';
  return PRESTATIONS.filter(p => p.famille !== 'devis' && (p.famille === 'moto') === moto);
}
/* Celles qui ont un PRIX FERME — pour ce qui se réserve et s'encaisse d'avance
   (agenda, app cliente). On ne fait pas payer un acompte sur un devis. */
function prestationsTarifees(gabaritId) {
  return prestationsPour(gabaritId).filter(p => prix(p.id, gabaritId) != null);
}
const option     = id => OPTIONS.find(o => o.id === id) || null;
const service    = id => SERVICES.find(s => s.id === id) || null;

/** Montant en FCFA, format « 12 500 F ». */
function fcfa(n) {
  if (n == null) return 'Sur devis';
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F';
}

/** Prix exact d'une prestation pour un gabarit. null = sur devis. */
function prix(prestationId, gabaritId) {
  const p = prestation(prestationId);
  if (!p || !gabaritId) return null;
  const v = p.prix[gabaritId];
  return v == null ? null : v;
}
const prixTexte = (pid, gid) => fcfa(prix(pid, gid));

/** Prix d'appel « dès X » — le plus bas publié. null si tout est sur devis. */
function prixDes(prestationId) {
  const p = prestation(prestationId);
  if (!p) return null;
  const vals = Object.values(p.prix).filter(v => v != null);
  return vals.length ? Math.min.apply(null, vals) : null;
}

/** Durée en minutes pour un gabarit. */
function duree(prestationId, gabaritId) {
  const p = prestation(prestationId);
  if (!p) return null;
  const v = p.durees[gabaritId];
  return v == null ? null : v;
}

/** « 1 h 30 », « 45 min ». */
function dureeTexte(min) {
  if (min == null) return '';
  if (min >= 1440) return Math.round(min / 1440) + ' j';
  if (min >= 60) { const h = Math.floor(min / 60), m = min % 60; return m ? h + ' h ' + m : h + ' h'; }
  return min + ' min';
}

/** Fourchette de durée affichée avant le choix du gabarit. */
function dureeFourchette(prestationId) {
  const p = prestation(prestationId);
  if (!p) return '';
  if (p.dureeEstimee) return p.dureeEstimee;
  const d = Object.values(p.durees).filter(v => v != null);
  if (!d.length) return '';
  const lo = Math.min.apply(null, d), hi = Math.max.apply(null, d);
  return lo === hi ? dureeTexte(lo) : dureeTexte(lo) + '–' + dureeTexte(hi);
}

const min2hm = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const hm2min = s => { const a = s.split(':').map(Number); return a[0] * 60 + a[1]; };

/**
 * Heures de DÉBUT possibles : le lavage doit être TERMINÉ à la fermeture.
 * Le battement est appliqué à l'occupation de la baie, pas au dernier créneau
 * (le rangement peut déborder après l'heure de fermeture).
 */
function creneaux(prestationId, gabaritId) {
  const d = duree(prestationId, gabaritId);
  if (d == null) return [];
  const out = [];
  for (let m = CONFIG.ouvertureMin; m + d <= CONFIG.fermetureMin; m += CONFIG.pasCreneau) out.push(min2hm(m));
  return out;
}

/** Occupation réelle d'une baie : fin du lavage + battement. */
function occupation(debutHm, prestationId, gabaritId) {
  const d = duree(prestationId, gabaritId);
  if (d == null) return null;
  const debut = hm2min(debutHm);
  return { debut: debutHm, fin: min2hm(debut + d), baieLibre: min2hm(debut + d + CONFIG.battementMin) };
}

/** Options proposables : ni déjà comprises, ni réservées à une autre prestation. */
function optionsPour(prestationId) {
  const p = prestation(prestationId);
  if (!p) return [];
  return OPTIONS
    .filter(o => !o.reservee || o.reservee.indexOf(prestationId) !== -1)
    .map(o => ({ ...o, comprise: p.inclus.indexOf(o.id) !== -1 }));
}

/** Total d'une commande. devis>0 ⇒ un montant manuel est requis. */
function total(prestationId, gabaritId, optionIds, avecValet, montantManuel) {
  const p = prestation(prestationId);
  const base = prix(prestationId, gabaritId);
  let sousTotal = base == null ? 0 : base;
  let devis = base == null ? 1 : 0;

  (optionIds || []).forEach(id => {
    const o = option(id);
    if (!o) return;
    if (p && p.inclus.indexOf(id) !== -1) return;      // déjà comprise : jamais refacturée
    sousTotal += o.prix;
  });

  if (avecValet) sousTotal += service('valet').prix;
  sousTotal += Math.max(0, Number(montantManuel) || 0);

  return { total: sousTotal, devis: devis, base: base };
}

/** Acompte : 20 % arrondi, ou 100 % si Pickup & Retour. */
function acompte(montantTotal, avecValet) {
  if (montantTotal == null || montantTotal <= 0) return 0;
  if (avecValet) return montantTotal;
  const a = montantTotal * CONFIG.acomptePct;
  return Math.round(a / CONFIG.acompteArrondi) * CONFIG.acompteArrondi;
}

/**
 * Référence unique — OCR-2608-0042.
 * Année/mois + numéro séquentiel du mois, fourni par la base de données.
 * Lisible, triable, dictable au téléphone. C'est ELLE qui relie la
 * réservation, le paiement KKiapay, le véhicule à l'atelier et la clôture.
 */
function reference(annee, mois, sequence) {
  const aa = String(annee).slice(-2);
  const mm = String(mois).padStart(2, '0');
  const nn = String(sequence).padStart(4, '0');
  return 'OCR-' + aa + mm + '-' + nn;
}
function lireReference(ref) {
  const m = /^OCR-(\d{2})(\d{2})-(\d{4})$/.exec(String(ref || '').trim().toUpperCase());
  return m ? { annee: 2000 + +m[1], mois: +m[2], sequence: +m[3] } : null;
}

/* ─────────────────────────────────────────────────────────────
   GROUPES DE LAVAGE — pour la couleur dans l'agenda

   L'agenda doit se lire d'un coup d'œil : on regroupe donc les
   prestations par ENGAGEMENT (le temps et le matériel que ça demande),
   pas une couleur par prestation. Trois groupes, parce que trois teintes
   sont le maximum qui reste distinguable pour tout le monde — y compris
   en cas de daltonisme — quand n'importe quels deux blocs peuvent se
   retrouver côte à côte. Le nom exact du lavage est écrit dans le bloc :
   la couleur situe, le texte identifie.
   ───────────────────────────────────────────────────────────── */
const GROUPES_LAVAGE = {
  rapide:    { nom: 'Rapide',    ex: 'Express' },
  signature: { nom: 'Signature', ex: 'Signature' },
  longue:    { nom: 'Longue',    ex: 'Deep Cleaning, packs, sur devis' },
};
function groupeLavage(prestationId) {
  if (/express/.test(prestationId || '')) return 'rapide';
  if (/signature/.test(prestationId || '')) return 'signature';
  return 'longue';   // deep, packs, moteur, polissage, céramique
}

/* ─────────────────────────────────────────────────────────────
   IMMATRICULATION (Bénin)
   Voiture : 2 lettres + 4 chiffres              — CB5916
   Moto    : 1 chiffre + 2 lettres + 4 chiffres  — 2FB9408

   Le champ n'est JAMAIS obligatoire : on peut compléter à l'atelier,
   véhicule devant nous. Mais dès qu'une plaque est saisie, elle est
   ramenée à sa forme canonique (majuscules, sans espace ni tiret) :
   c'est ce qui permet de rattacher tout seul un véhicule à son client
   au passage suivant. « cb 5916 », « CB-5916 » et « CB5916 » doivent
   désigner le MÊME véhicule, sinon on crée des doublons et la fidélité
   se disperse.

   Les formats sont VÉRIFIÉS mais pas IMPOSÉS : une plaque étrangère,
   diplomatique ou ancienne reste acceptée, simplement signalée. Refuser
   un vrai véhicule coûterait plus cher qu'une saisie inhabituelle.
   ───────────────────────────────────────────────────────────── */
const PLAQUE_VOITURE = /^[A-Z]{2}[0-9]{4}$/;
const PLAQUE_MOTO    = /^[0-9][A-Z]{2}[0-9]{4}$/;
// Des MOTIFS, pas des plaques réelles : CB5916 (l'exemple d'origine) pouvait
// être la plaque d'un vrai véhicule — l'afficher en exemple prêtait à confusion.
const PLAQUE_EXEMPLES = { voiture: 'AB1234', moto: '1AB2345' };

/** Forme canonique d'une plaque : majuscules, sans espace ni ponctuation. */
function plaque(v) {
  return String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, '');
}

/**
 * État d'une plaque saisie : forme propre, type reconnu, format connu ou non.
 * `gabarit` est facultatif — s'il est fourni, on signale une plaque moto sur
 * un gabarit voiture (et l'inverse), qui est presque toujours une erreur.
 */
function plaqueEtat(v, gabarit) {
  const cle = plaque(v);
  if (!cle) return { cle: '', vide: true, type: null, ok: true, accord: true, aide: '' };
  const type = PLAQUE_VOITURE.test(cle) ? 'voiture' : PLAQUE_MOTO.test(cle) ? 'moto' : null;
  if (!type) return { cle, vide: false, type: null, ok: false, accord: true,
    aide: 'Format inhabituel — voiture : ' + PLAQUE_EXEMPLES.voiture + ' · moto : ' + PLAQUE_EXEMPLES.moto };
  // Cohérence avec le gabarit choisi, quand on le connaît.
  const accord = gabarit ? (gabarit === 'moto' ? type === 'moto' : type === 'voiture') : true;
  return { cle, vide: false, type, ok: true, accord,
    aide: accord ? (type === 'moto' ? '✓ Plaque moto' : '✓ Plaque voiture')
                 : (type === 'moto' ? 'Plaque au format moto — vérifie le type de véhicule'
                                    : 'Plaque au format voiture — vérifie le type de véhicule') };
}

/** Lien WhatsApp pré-rempli. */
function lienWhatsApp(message) {
  return 'https://wa.me/' + MARQUE.whatsapp + (message ? '?text=' + encodeURIComponent(message) : '');
}

/* CATALOGUE VIVANT (13/08) — la liste ci-dessus est le point de départ et le
   secours hors ligne ; l'atelier en ajoute et en corrige depuis l'application
   (table modeles_vehicules). Les deux apps appellent OCR.poserCatalogue() au
   démarrage, et tout le reste — suggestions, orthographe, taille déduite —
   consulte l'ensemble fusionné. Une seule règle : ZÉRO DOUBLON, arbitré sur la
   forme normalisée, l'entrée de l'atelier gagnant sur celle du socle. */
let CATALOGUE = MARQUES;          // fusion socle + base, recalculée à l'injection
let CATA_SOURCE = [];             // ce qui vient de la base, tel quel

function poserCatalogue(lignes) {
  CATA_SOURCE = Array.isArray(lignes) ? lignes : [];
  const parMarque = new Map();    // clé marque → { nom, moto, gab }
  const vus = new Set();          // clé marque|modèle → anti-doublon
  const ajouter = (nom, modele, g, prioritaire) => {
    const km = clefTexte(nom), kmo = clefTexte(modele || '');
    if (!km) return;
    // une marque peut exister en voiture ET en moto (Honda, Suzuki, Yamaha) :
    // la clé d'unicité inclut donc le type.
    const type = g === 'moto' ? 'm' : 'v';
    const cleM = km + '|' + type;
    let e = parMarque.get(cleM);
    if (!e) { e = { nom, moto: g === 'moto', gab: {} }; parMarque.set(cleM, e); }
    if (prioritaire) e.nom = nom;                       // l'atelier fixe l'orthographe
    if (!modele) return;
    const cle = km + '|' + kmo;
    if (vus.has(cle) && !prioritaire) return;
    if (vus.has(cle)) {                                  // l'atelier corrige la taille
      Object.keys(e.gab).forEach(gg => { e.gab[gg] = e.gab[gg].filter(x => clefTexte(x) !== kmo); });
    }
    vus.add(cle);
    (e.gab[g] || (e.gab[g] = [])).push(modele);
  };
  // la base d'abord (elle a le dernier mot), le socle ensuite pour compléter
  CATA_SOURCE.forEach(l => ajouter(String(l.marque || '').trim(), String(l.modele || '').trim(),
                                   l.gabarit, true));
  MARQUES.forEach(m => Object.keys(m.gab).forEach(g => m.gab[g].forEach(mo => ajouter(m.nom, mo, g, false))));
  /* L'ORDRE DES MODÈLES PROPOSÉS COMPTE (13/08) : au comptoir on regarde les
     huit premières pastilles, pas les vingt-cinq. La base renvoie ses lignes
     dans un ordre quelconque — on remet donc l'ordre du socle : les tailles
     du plus courant au plus rare, et dans chaque taille l'ordre choisi à la
     main (Corolla avant 4Runner, parce que c'est ce qui arrive à l'atelier).
     Un modèle ajouté par l'atelier passe après, par ordre alphabétique. */
  const RANG_GAB = ['petite', 'berline', 'grandsuv', 'camionnette', 'moto'];
  const rangSocle = new Map();
  let n = 0;
  MARQUES.forEach(m => Object.keys(m.gab).forEach(g => m.gab[g].forEach(mo =>
    rangSocle.set(clefTexte(m.nom) + '|' + clefTexte(mo), n++))));
  const rang = (nom, mo) => {
    const r = rangSocle.get(clefTexte(nom) + '|' + clefTexte(mo));
    return r === undefined ? Infinity : r;
  };
  CATALOGUE = [...parMarque.values()].map(m => {
    const ordre = [...RANG_GAB.filter(g => m.gab[g]), ...Object.keys(m.gab).filter(g => !RANG_GAB.includes(g))];
    const modeles = ordre.flatMap(g => m.gab[g].slice().sort((a, b) => {
      const ra = rang(m.nom, a), rb = rang(m.nom, b);
      return ra === rb ? String(a).localeCompare(String(b), 'fr') : ra - rb;
    }));
    return { ...m, modeles };
  });
  return CATALOGUE;
}
const catalogue = () => CATALOGUE;
const catalogueSource = () => CATA_SOURCE;

// Sans accents ni ponctuation : « mercedes benz », « MERCEDES-BENZ » et
// « Mercédès Benz » doivent tomber sur la même marque.
function clefTexte(t) {
  return String(t == null ? '' : t).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}
// Les marques à proposer selon le gabarit : une moto n'a rien à faire dans la
// liste d'une berline, et inversement.
function marques(gabarit) {
  const moto = gabarit === 'moto';
  // ordre : le socle d'abord (fréquence au Bénin), les ajouts de l'atelier ensuite
  const ordre = new Map(MARQUES.map((m, i) => [clefTexte(m.nom), i]));
  return CATALOGUE.filter(m => !!m.moto === moto)
    .sort((a, b) => (ordre.has(clefTexte(a.nom)) ? ordre.get(clefTexte(a.nom)) : 999) -
                    (ordre.has(clefTexte(b.nom)) ? ordre.get(clefTexte(b.nom)) : 999))
    .map(m => m.nom);
}
// Honda, Suzuki et Yamaha font des voitures ET des motos : on rend l'entrée qui
// correspond au gabarit choisi, sinon la première trouvée.
function trouverMarque(nom, gabarit) {
  const k = clefTexte(nom);
  if (!k) return null;
  const exact = CATALOGUE.filter(m => clefTexte(m.nom) === k);
  if (!exact.length) return null;
  const moto = gabarit === 'moto';
  return exact.find(m => !!m.moto === moto) || exact[0];
}
// L'orthographe officielle si la marque est connue, sinon ce qui a été tapé
// (jamais de blocage) — c'est ce qui évite « toyota », « TOYOTA » et « Toyota »
// comme trois marques différentes.
function marqueCanon(nom, gabarit) {
  const m = trouverMarque(nom, gabarit);
  return m ? m.nom : String(nom == null ? '' : nom).trim();
}
function modeles(marque, gabarit) {
  const m = trouverMarque(marque, gabarit);
  if (m) return m.modeles.slice();
  // marque inconnue ou pas encore tapée : on propose les modèles du bon type
  const moto = gabarit === 'moto';
  return CATALOGUE.filter(x => !!x.moto === moto).flatMap(x => x.modeles).slice(0, 160);
}
/* LA TAILLE DÉDUITE DU MODÈLE (13/08) — « ça éviterait les questions au
   niveau du prix, donc c'est sans surprise ». On rend la taille de
   facturation quand le modèle est reconnu, sinon rien (jamais de devinette
   sur un modèle inconnu : mieux vaut laisser choisir que se tromper de prix). */
function gabaritDe(marque, modele) {
  const km = clefTexte(modele);
  if (!km) return null;
  // Honda fait des voitures ET des motos : on cherche dans TOUTES les entrées
  // qui portent ce nom, c'est le modèle qui tranche (« CG 125 » → moto).
  const k = clefTexte(marque);
  const listes = k ? CATALOGUE.filter(x => clefTexte(x.nom) === k) : [];
  if (!listes.length) listes.push(...CATALOGUE);
  // 1 · le modèle exact, dans la bonne marque d'abord
  for (const mq of listes)
    for (const g of Object.keys(mq.gab))
      if (mq.gab[g].some(x => clefTexte(x) === km)) return g;
  // 2 · une finition (« Corolla LE », « Hilux Double Cabine ») : on retient le
  //     modèle connu le plus long qui commence la saisie.
  let meilleur = null;
  for (const mq of listes)
    for (const g of Object.keys(mq.gab))
      for (const x of mq.gab[g]) {
        const kx = clefTexte(x);
        if (kx.length >= 4 && km.startsWith(kx) && (!meilleur || kx.length > meilleur.k))
          meilleur = { k: kx.length, g };
      }
  return meilleur ? meilleur.g : null;
}

function modeleCanon(marque, modele, gabarit) {
  const k = clefTexte(modele);
  if (!k) return '';
  const m = trouverMarque(marque, gabarit);
  const liste = m ? m.modeles : CATALOGUE.flatMap(x => x.modeles);
  return liste.find(x => clefTexte(x) === k) || String(modele).trim();
}

/* ─────────────────────────────────────────────────────────────
   6 bis · RELIRE CE QUI A ÉTÉ ÉCRIT À LA MAIN (13/08)
   Pour reprendre l'ancien cahier, il faut accepter que « Grand SUV »,
   « grand suv », « 4x4 » et « pick up » désignent la même taille, et que
   « Deep cleaning », « deep », « nettoyage profond » désignent la même
   prestation. On ne demande pas au patron de parler comme la base.
   ───────────────────────────────────────────────────────────── */
const ALIAS_GABARIT = {
  petite:      ['petite', 'petite berline', 'citadine', 'small', 'p'],
  berline:     ['berline', 'berline suv compact', 'suv compact', 'suv', 'compact', 'b'],
  grandsuv:    ['grand suv', 'grandsuv', 'gros suv', '4x4', 'pick up', 'pickup', 'pick-up', 'gs'],
  camionnette: ['camionnette', 'camion', 'fourgon', 'van', 'minibus', 'bus', 'c'],
  moto:        ['moto', 'motos', 'deux roues', '2 roues', 'scooter', 'm'],
};
function trouverGabarit(texte) {
  const k = clefTexte(texte);
  if (!k) return null;
  for (const g of GABARITS) if (clefTexte(g.id) === k || clefTexte(g.court) === k || clefTexte(g.nom) === k) return g.id;
  for (const [id, alias] of Object.entries(ALIAS_GABARIT))
    if (alias.some(a => clefTexte(a) === k)) return id;
  // en dernier ressort : le nom du gabarit contient ce qui est écrit
  for (const g of GABARITS) if (clefTexte(g.nom).includes(k) && k.length >= 4) return g.id;
  return null;
}

const ALIAS_PRESTATION = {
  express:           ['express', 'lavage express', 'simple', 'basique', 'rapide'],
  signature:         ['signature', 'lavage signature', 'complet', 'standard'],
  deep:              ['deep', 'deep cleaning', 'deepcleaning', 'nettoyage profond', 'profond'],
  interieur:         ['interieur', 'pack interieur', 'interieur seul', 'inside'],
  exterieur:         ['exterieur', 'pack exterieur', 'exterieur seul'],
  'moto-express':    ['moto express', 'lavage express moto', 'express moto'],
  'moto-signature':  ['moto signature', 'lavage signature moto', 'signature moto'],
  moteur:            ['moteur', 'lavage moteur'],
  polissage:         ['polish', 'polissage', 'lustrage', 'correction'],
  ceramique:         ['ceramique', 'protection ceramique', 'ceramic'],
};
function trouverPrestation(texte, gabarit) {
  const k = clefTexte(texte);
  if (!k) return null;
  let id = null;
  const p = PRESTATIONS.find(x => clefTexte(x.id) === k || clefTexte(x.nom) === k);
  if (p) id = p.id;
  if (!id) for (const [cle, alias] of Object.entries(ALIAS_PRESTATION))
    if (alias.some(a => clefTexte(a) === k)) { id = cle; break; }
  if (!id) id = PRESTATIONS.map(x => x.id).find(x => k.startsWith(clefTexte(x))) || null;
  if (!id) return null;
  // « Express » sur une moto, c'est le tarif moto — et l'inverse est vrai aussi :
  // c'est la taille qui décide de quelle grille on parle.
  if (gabarit === 'moto' && (id === 'express' || id === 'signature')) return 'moto-' + id;
  if (gabarit && gabarit !== 'moto' && id.startsWith('moto-')) return id.slice(5);
  return id;
}

/* Le mode de paiement tel qu'il est écrit sur la fiche papier :
   « KKIAPAY », « MTN », « momo », « espèces », « cash », « carnet ». */
const ALIAS_PAIEMENT = {
  kkiapay: ['kkiapay', 'kkia', 'momo', 'mtn', 'mtn momo', 'moov', 'moov money', 'celtiis',
            'mobile money', 'mobilemoney', 'mm', 'en ligne'],
  especes: ['especes', 'espece', 'cash', 'liquide', 'main', 'en main', 'comptant'],
  carnet:  ['carnet', 'abonnement', 'privilege'],
};
function trouverPaiement(texte) {
  const k = clefTexte(texte);
  if (!k) return null;
  for (const [id, alias] of Object.entries(ALIAS_PAIEMENT))
    if (alias.some(a => clefTexte(a) === k)) return id;
  for (const [id, alias] of Object.entries(ALIAS_PAIEMENT))
    if (alias.some(a => k.includes(clefTexte(a)) && clefTexte(a).length >= 4)) return id;
  return null;
}

/* Une date écrite à la main : 13/08/2026, 13-08-26, 2026-08-13, 13.08.26 */
function lireDate(texte) {
  const t = String(texte || '').trim();
  if (!t) return null;
  let m = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if (m) {
    const an = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${an}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  }
  return null;
}

/* Un montant écrit à la main : « 8 000 », « 8000 F », « 8.000 », « 8 000 FCFA » */
function lireMontant(texte) {
  const n = String(texte == null ? '' : texte).replace(/[^\d]/g, '');
  return n === '' ? null : parseInt(n, 10);
}

/* ─────────────────────────────────────────────────────────────
   7 · EXPORT
   ───────────────────────────────────────────────────────────── */
const API = {
  VERSION, MAJ,
  MARQUE, GABARITS, PRESTATIONS, OPTIONS, SERVICES, CARNETS, CARNET_CONFIG, CONFIG,
  gabarit, prestation, option, service,
  fcfa, prix, prixTexte, prixDes,
  duree, dureeTexte, dureeFourchette,
  min2hm, hm2min, creneaux, occupation,
  prestationsPour, prestationsTarifees,
  optionsPour, total, acompte,
  carnet, prixCarnet, prixCarnetUnite, economieCarnet,
  recetteMensuelleCarnet, heuresCarnet, porteursPourCouvrir,
  reference, lireReference, lienWhatsApp,
  plaque, plaqueEtat, PLAQUE_EXEMPLES,
  GROUPES_LAVAGE, groupeLavage,
  MARQUES, marques, modeles, marqueCanon, modeleCanon, trouverMarque, gabaritDe,
  poserCatalogue, catalogue, catalogueSource, clefTexte,
  trouverGabarit, trouverPrestation, trouverPaiement, lireDate, lireMontant,
};

if (typeof module !== 'undefined' && module.exports) module.exports = API;
root.OCR = API;

})(typeof window !== 'undefined' ? window : globalThis);

  let graine = 0;   // fait varier les temps de lavage semés, sans hasard

  // Un client parti depuis 40 jours — pour la liste « à relancer ».

  const mixPrestations = () => {

    D.passage_lignes.filter(l => l.type === 'prestation').forEach(l => {
      const p = D.passages.find(x => x.id === l.passage_id);
      if (!p || p.annule) return;
      const k = p.journee + '|' + l.code;
      const o = g[k] || (g[k] = { journee: p.journee, prestation: l.code, nombre: 0, ca: 0, minutes_baie: 0 });
      const q = p.quantite || 1;
      o.nombre += q; o.ca += l.prix * q; o.minutes_baie += ((l.duree_min || 0) + 15) * q;

    return Object.values(g).map(o => ({ ...o,

  const tempsLavage = () => {

    D.passages.filter(p => !p.annule && !p.hors_mesure && p.heure_debut && p.heure_fin).forEach(p => {

      const min = (m(p.heure_fin) - m(p.heure_debut)) / q;

      const o = g[k] || (g[k] = { journee: p.journee, prestation: l.code, gabarit: p.gabarit, nombre: 0, somme: 0, minutes_max: 0 });
      o.nombre += q; o.somme += min * q; o.minutes_max = Math.max(o.minutes_max, Math.round(min));
    });
    return Object.values(g).map(o => ({ journee: o.journee, prestation: o.prestation, gabarit: o.gabarit,

  /* « Fini », c'est terminé — ou livré pour les lavages d'avant le 14/08,
